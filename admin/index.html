/* ---------- traffic (visitor counts from shared/stats.js; days in Maldives time, UTC+5) ---------- */
const TKEYS=['home','digu','dhogu','bondi','ranga','dhashundhama','binveriya','atolls','dhihaeh','thaas','joker','juice','raalhu'];
const TNAME=k=>k==='home'?'Home page':k==='raalhu'?'Raalhu Rumble':(GAMES[k]||{n:k}).n;
const TR={at:0,loading:false,err:'',days:[],pg:{},mon:null,prev:null,sel:0,reads:0,cached:0};
const MVT=5*3600e3;
function trafficDays(n){const out=[];for(let i=0;i<n;i++){const d=new Date(Date.now()+MVT-i*864e5),iso=d.toISOString();
 out.push({k:'day-'+iso.slice(0,10).replace(/-/g,''),label:d.toLocaleDateString('en-GB',{day:'numeric',month:'short',timeZone:'UTC'}),dow:d.toLocaleDateString('en-GB',{weekday:'short',timeZone:'UTC'})});}return out;}
function monthKeys(){const d=new Date(Date.now()+MVT),y=d.getUTCFullYear(),m=d.getUTCMonth();const p=new Date(Date.UTC(y,m-1,1));
 const k=(Y,M)=>'month-'+Y+String(M+1).padStart(2,'0');const nm=D=>D.toLocaleDateString('en-GB',{month:'long',timeZone:'UTC'});
 return{cur:{k:k(y,m),name:nm(new Date(Date.UTC(y,m,1)))},prev:{k:k(p.getUTCFullYear(),p.getUTCMonth()),name:nm(p)}};}
/* past days never change, so their counts are cached on this device (today and the months are always re-read) */
const TC={get(){try{return JSON.parse(localStorage.getItem('dga-traffic')||'{}')||{};}catch(e){return{};}},set(o){try{localStorage.setItem('dga-traffic',JSON.stringify(o));}catch(e){}}};
async function loadTraffic(force){if(TR.loading)return;TR.loading=true;TR.err='';renderTraffic();
 const days=trafficDays(30),today=days[0].k,M=monthKeys(),cache=(MOCK?{}:TC.get());if(force)Object.keys(cache).forEach(k=>{if(k.indexOf(today)===0)delete cache[k];});
 const jobs=[];const want=(key,period,f,cacheable)=>jobs.push({key,period,f,cacheable});
 days.forEach((d,i)=>{want(d.k+'|all',d.k,null,i>0);want(d.k+'|new',d.k,{n:true},i>0);if(i<7)TKEYS.forEach(g=>want(d.k+'|'+g,d.k,{g},i>0));});
 want(M.cur.k+'|all',M.cur.k,null,false);want(M.cur.k+'|new',M.cur.k,{n:true},false);TKEYS.forEach(g=>want(M.cur.k+'|'+g,M.cur.k,{g},false));want(M.prev.k+'|all',M.prev.k,null,false);
 const res={};let reads=0,cached=0,i=0,failed=null;
 const worker=async()=>{while(i<jobs.length&&!failed){const j=jobs[i++];
  if(j.cacheable&&cache[j.key]!=null){res[j.key]=cache[j.key];cached++;continue;}
  try{const n=await DL.count(j.period,j.f);res[j.key]=n;reads+=Math.max(1,Math.ceil(n/1000));if(j.cacheable)cache[j.key]=n;}catch(e){failed=e;}}};
 await Promise.all(Array.from({length:8},worker));
 TR.loading=false;
 if(failed){console.warn(failed);TR.err=failed.code==='permission-denied'?'Visitor counts are private. Publish the admin rules (Overview → Your account & one-time setup) to see them.':'Couldn’t load visitor counts: '+(failed.message||failed.code||failed);renderTraffic();return;}
 if(!MOCK){const keep={};Object.keys(cache).forEach(k=>{if(days.some(d=>k.indexOf(d.k)===0))keep[k]=cache[k];});TC.set(keep);}
 TR.days=days.map(d=>({k:d.k,label:d.label,dow:d.dow,all:res[d.k+'|all']|0,neu:Math.min(res[d.k+'|all']|0,res[d.k+'|new']|0)}));
 TR.pg={};days.slice(0,7).forEach(d=>TKEYS.forEach(g=>{(TR.pg[g]=TR.pg[g]||{})[d.k]=res[d.k+'|'+g]|0;}));
 TR.mon={name:M.cur.name,all:res[M.cur.k+'|all']|0,neu:res[M.cur.k+'|new']|0,g:Object.fromEntries(TKEYS.map(g=>[g,res[M.cur.k+'|'+g]|0]))};
 TR.prev={name:M.prev.name,all:res[M.prev.k+'|all']|0};TR.reads=reads;TR.cached=cached;TR.at=Date.now();TR.sel=0;renderTraffic();}
function renderTraffic(){const el=$('#traffic');if(!el)return;
 if(TR.err){el.innerHTML=`<div class="card"><div class="chead"><h2>Players per day</h2></div><div class="note">${IC.warn}<div>${esc(TR.err)}</div></div><div class="dfoot"><span class="sp"></span><button class="btn sm" data-a="traffic">Try again</button></div></div>`;return;}
 if(!TR.at){el.innerHTML=`<div class="card"><div class="chead"><h2>Players per day</h2><span class="spin"></span></div><div class="empty">Counting visitors…</div></div>`;return;}
 const D=TR.days,t=D[0],y=D[1],ret=x=>x.all-x.neu;const w7=D.slice(1,8),avg7=Math.round(w7.reduce((a,x)=>a+x.all,0)/7);
 const first=D.slice().reverse().find(x=>x.all>0);const pct=(a,b)=>b?Math.round((a-b)/b*100):null;const dp=pct(TR.mon.all,TR.prev.all);
 el.innerHTML=`<div class="stats">
   <div class="stat hero"><div class="k">Today so far</div><div class="v">${fmt(t.all)}</div><div class="s">${fmt(t.neu)} new · ${fmt(ret(t))} returning</div></div>
   <div class="stat"><div class="k">Yesterday</div><div class="v">${fmt(y.all)}</div><div class="s">${fmt(y.neu)} new · ${fmt(ret(y))} returning</div></div>
   <div class="stat"><div class="k">Daily average</div><div class="v">${fmt(avg7)}</div><div class="s">last 7 full days</div></div>
   <div class="stat"><div class="k">This month</div><div class="v">${fmt(TR.mon.all)}</div><div class="s">${esc(TR.mon.name)} · ${fmt(TR.mon.neu)} new${dp!=null?` · ${dp>=0?'+':''}${dp}% vs ${esc(TR.prev.name)} (${fmt(TR.prev.all)})`:TR.prev.all?'':' · no data for '+esc(TR.prev.name)}</div></div>
  </div>
  <div class="card"><div class="chead"><h2>Players per day</h2><span class="small muted">last 30 days · Maldives time</span></div>
   <div class="legend"><span><i style="background:var(--c-ret)"></i>Returning</span><span><i style="background:var(--c-new)"></i>New</span></div>
   ${chartSVG(D.slice().reverse())}
   <div class="readout" id="readout"></div>
   <details style="margin-top:10px"><summary class="small muted" style="cursor:pointer">Show as a table</summary><div class="hscroll"><table class="plain"><thead><tr><th>Day</th><th>Players</th><th>New</th><th>Returning</th></tr></thead>
    <tbody>${D.map(x=>`<tr><td>${esc(x.dow+' '+x.label)}</td><td>${fmt(x.all)}</td><td>${fmt(x.neu)}</td><td>${fmt(ret(x))}</td></tr>`).join('')}</tbody></table></div></details>
  </div>
  <div class="card"><div class="chead"><h2>Players per game</h2><span class="small muted">devices that opened each game</span></div>
   ${perGameTable()}
  </div>
  <p class="small muted" style="margin:0">One count per device per day (a player on two phones counts twice; clearing the browser makes a device “new” again). Nothing personal is stored: no names, no IP, no device details.
   ${first?`Counting started ${esc(first.label)}.`:'No visits counted yet: the counter starts once shared/stats.js is live.'} Last load used about ${fmt(TR.reads)} reads (${fmt(TR.cached)} cached). <button class="btn sm ghost" data-a="traffic">Reload counts</button></p>`;
 setReadout(TR.sel);}
function chartSVG(D){const W=Math.round(Math.max(280,Math.min(1000,(($('#traffic')||{}).clientWidth||600)-34))),Hh=W<500?190:220,L=30,R=4,T=10,B=24,n=D.length,cw=(W-L-R)/n,bw=Math.max(4,cw-4);
 const mx=Math.max(4,...D.map(x=>x.all));const step=Math.pow(10,Math.floor(Math.log10(mx/3)));const nice=[1,2,5,10].map(s=>s*step).find(s=>mx/s<=4)||step*10;const top=Math.ceil(mx/nice)*nice;
 const yy=v=>T+(Hh-T-B)*(1-v/top);const grid=[];for(let v=0;v<=top;v+=nice)grid.push(`<line class="grid" x1="${L}" x2="${W-R}" y1="${yy(v)}" y2="${yy(v)}"/><text x="${L-6}" y="${yy(v)+3}" text-anchor="end">${v}</text>`);
 const bar=(x,y0,y1,cls,rTop)=>{const h=Math.max(0,y0-y1);if(h<.5)return '';const r=Math.min(4,bw/2,h);return rTop?`<path class="${cls}" d="M${x},${y0}V${y1+r}Q${x},${y1} ${x+r},${y1}H${x+bw-r}Q${x+bw},${y1} ${x+bw},${y1+r}V${y0}Z"/>`:`<rect class="${cls}" x="${x}" y="${y1}" width="${bw}" height="${h}"/>`;};
 const bars=D.map((d,i)=>{const x=L+i*cw+(cw-bw)/2,base=yy(0),r=d.all-d.neu,yr=yy(r),ya=yy(d.all);const idx=n-1-i;
  const gap=d.neu&&r?2:0;
  return `<g>${idx===TR.sel?`<rect class="sel" x="${L+i*cw}" y="${T}" width="${cw}" height="${Hh-T-B}" rx="4"/>`:''}${bar(x,base,yr,'ret',!d.neu)}${bar(x,yr-gap,ya,'new',true)}
   ${idx%(W<520?7:5)===0?`<text x="${idx===0?x+bw:x+bw/2}" y="${Hh-8}" text-anchor="${idx===0?'end':'middle'}">${idx===0?'Today':esc(d.label)}</text>`:''}
   <rect class="hit" data-a="daysel" data-i="${idx}" x="${L+i*cw}" y="0" width="${cw}" height="${Hh}"><title>${esc(d.label)}: ${d.all} players, ${d.neu} new</title></rect></g>`;}).join('');
 return `<svg class="chart" viewBox="0 0 ${W} ${Hh}" role="img" aria-label="Players per day, last 30 days">${grid.join('')}${bars}</svg>`;}
function setReadout(i){const r=$('#readout');const d=TR.days[i];if(!r||!d)return;
 const games=TKEYS.filter(g=>g!=='home').map(g=>[g,(TR.pg[g]||{})[d.k]]).filter(x=>x[1]).sort((a,b)=>b[1]-a[1]);
 r.innerHTML=`<b>${esc(d.dow+' '+d.label)}${i===0?' (today so far)':''}</b>: ${fmt(d.all)} players · ${fmt(d.neu)} new · ${fmt(d.all-d.neu)} returning`+
  (i<7&&games.length?`<div class="small muted" style="margin-top:3px">${games.slice(0,6).map(([g,v])=>esc(TNAME(g))+' '+fmt(v)).join(' · ')}</div>`:'');}
function perGameTable(){const days=TR.days.slice(0,7);const rows=TKEYS.filter(g=>g!=='raalhu'||TR.mon.g.raalhu||days.some(d=>(TR.pg.raalhu||{})[d.k]));
 const mx=Math.max(1,...rows.filter(g=>g!=='home').flatMap(g=>days.map(d=>(TR.pg[g]||{})[d.k]||0)));
 const cell=(g,v)=>{const a=g==='home'?0:Math.min(1,v/mx);return `<td style="background:color-mix(in srgb,var(--c-new) ${Math.round(a*55)}%,var(--bg))">${v?fmt(v):'<span class="muted">·</span>'}</td>`;};
 return `<div class="hscroll"><table class="heat"><thead><tr><th>Game</th>${days.map((d,i)=>`<th>${i===0?'Today':esc(d.dow)}<br><span style="font-weight:400">${esc(d.label)}</span></th>`).join('')}<th>${esc(TR.mon.name)}</th></tr></thead>
  <tbody>${rows.map(g=>`<tr><td class="g"><span class="gdot" style="background:${g==='home'?'var(--muted)':(GAMES[g]||{c:'#999'}).c};margin-right:6px"></span>${esc(TNAME(g))}</td>${days.map(d=>cell(g,(TR.pg[g]||{})[d.k]||0)).join('')}<td class="mo">${fmt(TR.mon.g[g]||0)}</td></tr>`).join('')}</tbody></table></div>
  <p class="small muted" style="margin:8px 0 0">Darker = more players. “Home page” counts visits to the front page; a device that opens three games counts once in each.</p>`;}

/* ---------- advertisers: ad counts from shared/adstats.js (days in Maldives time, UTC+5) ----------
   Devices write adstats/day-YYYYMMDD/dev/{id}. Once a day is over, this page reads that day's device docs ONCE,
   adds them up into adstats/sum-YYYYMMDD (plus that day's visitor counts) and from then on reads only the sums
   (about 30 reads for a month). A device doc whose totals don't match its own counts is left out (tampered). */
const ADS_START=MOCK?(Q.get('ads')==='empty'?dayKey(0):dayKey(75)):'20261001';   /* the first counted day */
const AD_PLACES={home_box:['Homepage box','The rotating box on the home page'],game_box:['Game home screens','The sponsor box on each game’s home screen'],
 raalhu:['Raalhu Rumble home','The sponsor card on the Raalhu Rumble home'],plaque:['Table plaque','Printed on the table during play'],credit:['Sponsor line','“Hand sponsored by” / “Presented by” at the end of a hand or game']};
const AD_PLATS=[['ios','iPhone app'],['android','Android app'],['web','Website']];
const AD_SHADE={ios:'var(--a)',android:'var(--g3)',web:'var(--g2)'};
const MN=['January','February','March','April','May','June','July','August','September','October','November','December'];
const RM=matchMedia('(prefers-reduced-motion: reduce)');
function dayKey(off){return new Date(Date.now()+5*3600e3-(off||0)*864e5).toISOString().slice(0,10).replace(/-/g,'');}
const dIso=d=>d.slice(0,4)+'-'+d.slice(4,6)+'-'+d.slice(6,8);
const dNice=d=>(+d.slice(6,8))+' '+MN[+d.slice(4,6)-1].slice(0,3)+' '+d.slice(0,4);
const mName=m=>MN[+m.slice(4,6)-1]+' '+m.slice(0,4);
const mShort=m=>MN[+m.slice(4,6)-1].slice(0,3);
const prevMonth=m=>{const y=+m.slice(0,4),n=+m.slice(4,6);return n===1?(y-1)+'12':y+String(n-1).padStart(2,'0');};
const daysIn=m=>new Date(Date.UTC(+m.slice(0,4),+m.slice(4,6),0)).getUTCDate();
const sMax=(a,b)=>a>b?a:b,sMin=(a,b)=>a<b?a:b;
const pctS=(a,b,d=0)=>b?(a/b*100).toFixed(d)+'%':'–';
const adGame=k=>k==='quiz'?'Dhivehi Quiz':k==='home'?'Homepage':TNAME(k);
const AD={at:0,loading:false,err:'',sums:new Map(),mon:{},reads:0,built:0,unsaved:0,from:'',sp:'',per:'',sel:-1,cat:null};

/* the sponsor list comes from shared/sponsors.js (the same one the site shows) */
function adCatalog(){if(AD.cat)return AD.cat;const L=(window.DGSponsors&&DGSponsors.list?DGSponsors.list:[]).map(s=>Object.assign({},s));
 if(MOCK&&Q.get('ads')!=='empty'){L.push({id:'mock-coffee',title:'Test Coffee (mock)',sub:'Morning brew, every hand',url:'https://example.com/',logo:'TC',colors:['#6B3E26','#A86A45'],label:'Sponsored',felt:true,from:dIso(dayKey(40)),to:dIso(dayKey(-30))},
  {id:'mock-travel',title:'Old Travel (mock)',sub:'Island hops for two',url:'https://example.com/t',logo:'OT',colors:['#0F7BA8','#4FB0D6'],label:'Sponsored',felt:true,from:dIso(dayKey(70)),to:dIso(dayKey(45))});}
 return AD.cat=L;}
function adSponsors(){const L=adCatalog().slice(),have=new Set(L.map(s=>s.id));
 AD.sums.forEach(S=>Object.keys(S.v||{}).forEach(k=>{const id=k.split('~')[0];if(!have.has(id)){have.add(id);L.push({id,title:id+' (no longer listed)',colors:['#8B8480','#B9B2AE'],logo:id.slice(0,2).toUpperCase(),gone:true});}}));
 return L;}
const adOwn=s=>!!(s.house||s.label==='Advertise'||s.id==='advertise');
function adStatus(s){if(s.gone)return['Removed',''];if(s.house)return['House promo','hs'];if(s.id==='advertise')return['Placeholder',''];
 const t=dIso(dayKey(0));if(s.from&&t<s.from)return['Scheduled',''];if(s.to&&t>s.to)return['Ended',''];return['Active','on'];}
const adPill=s=>{const[t,c]=adStatus(s);return `<span class="apill ${c}"><i></i>${esc(t)}</span>`;};
const adDates=s=>s.gone?'Not in shared/sponsors.js any more':(!s.from&&!s.to)?(s.house?'Always on, fills empty slots':'Always on'):((s.from?dNice(s.from.replace(/-/g,'')):'Any time')+' – '+(s.to?dNice(s.to.replace(/-/g,'')):'no end date'));
function adLogo(s){const c=s.colors||['#8B8480','#B9B2AE'],l=String(s.logo||'');
 const img=/^(https?:|data:|\/|\.)/.test(l)||/\.(png|jpe?g|webp|svg|gif)$/i.test(l);
 return `<span class="alogo" style="background:linear-gradient(140deg,${esc(c[0])},${esc(c[1]||c[0])})" aria-hidden="true">${img?`<img src="${esc(/^(https?:|data:|\/)/.test(l)?l:'/'+l)}" alt="">`:esc(l.slice(0,3))}</span>`;}

/* ---- one finished day: add up every device's doc ---- */
const AD_KEY=/^[a-z0-9-]{1,32}~(home_box|game_box|raalhu|plaque|credit)~[a-z]{2,14}$/;
function sumDay(docs){const S={ver:1,n:0,bad:0,md:0,pd:{web:0,ios:0,android:0},v:{},k:{},m:{},r:{},y:{},rd:{},pv:{}};
 const ok=x=>Number.isInteger(x)&&x>=0;
 const tot=m=>{let n=0;for(const k in m||{}){if(!ok(m[k]))return -1;n+=m[k];}return n;};
 for(const d of docs||[]){
  const v=d.v||{},k=d.k||{},m=d.m||{};
  const good=ok(d.sv)&&ok(d.sk)&&ok(d.sm)&&tot(v)===d.sv&&tot(k)===d.sk&&tot(m)===d.sm&&d.sv<=20000&&d.sk<=2000&&d.sm<=86400
   &&Object.keys(v).every(x=>AD_KEY.test(x))&&Object.keys(k).every(x=>AD_KEY.test(x));
  if(!good){S.bad++;continue;}
  const p=['web','ios','android'].includes(d.p)?d.p:'web';S.n++;S.pd[p]++;
  const saw=new Set();
  for(const x in v){const n=v[x],id=x.split('~')[0];S.v[x]=(S.v[x]||0)+n;if(n>0)saw.add(id);const P=S.pv[id]||(S.pv[id]={web:0,ios:0,android:0});P[p]+=n;}
  saw.forEach(id=>S.rd[id]=(S.rd[id]||0)+1);
  for(const x in k)S.k[x]=(S.k[x]||0)+k[x];
  let any=0;for(const g in m){if(m[g]>0){S.m[g]=(S.m[g]||0)+m[g];any=1;}}S.md+=any;
  for(const id in d.r||{})if(/^[a-z0-9-]{1,32}$/.test(id))S.r[id]=(S.r[id]||0)+1;
  for(const id in d.y||{})if(/^[a-z0-9-]{1,32}$/.test(id))S.y[id]=(S.y[id]||0)+1;}
 return S;}

/* ---- one sponsor over a month ('YYYYMM') or this year ('year') ---- */
function adAgg(sid,per){const yr=dayKey(0).slice(0,4),inP=d=>per==='year'?d.slice(0,4)===yr:d.slice(0,6)===per;
 const days=[...AD.sums.keys()].filter(inP).sort(),pre=sid+'~';
 const o={views:0,taps:0,reach:0,n:days.length,daily:new Map(),pl:{},games:{},plat:{web:0,ios:0,android:0}};
 for(const d of days){const S=AD.sums.get(d)||{};let v=0,t=0;
  for(const x in S.v||{})if(x.startsWith(pre)){const n=S.v[x],[,pl,g]=x.split('~');v+=n;(o.pl[pl]=o.pl[pl]||{v:0,t:0}).v+=n;o.games[g]=(o.games[g]||0)+n;}
  for(const x in S.k||{})if(x.startsWith(pre)){const n=S.k[x],pl=x.split('~')[1];t+=n;(o.pl[pl]=o.pl[pl]||{v:0,t:0}).t+=n;}
  const pv=(S.pv||{})[sid]||{};for(const p in o.plat)o.plat[p]+=pv[p]||0;
  o.views+=v;o.taps+=t;o.reach+=per==='year'?((S.y||{})[sid]||0):((S.r||{})[sid]||0);
  o.daily.set(d,{v,t,r:(S.rd||{})[sid]||0,mr:(S.r||{})[sid]||0});}
 return o;}
/* bars: every day of the month (days not finished yet stay empty), or every month of the year */
function adBars(o,per){const out=[],y=dayKey(1);
 if(per==='year'){const yr=dayKey(0).slice(0,4),cm=+dayKey(0).slice(4,6);for(let i=1;i<=cm;i++){const m=yr+String(i).padStart(2,'0');let v=0,t=0,r=0,any=false;
   o.daily.forEach((x,d)=>{if(d.slice(0,6)===m){v+=x.v;t+=x.t;r+=x.mr;any=true;}});out.push({k:m,lbl:mShort(m),v,t,r,done:any});}}
 else{for(let i=1;i<=daysIn(per);i++){const d=per+String(i).padStart(2,'0'),x=o.daily.get(d);out.push({k:d,lbl:String(i),v:x?x.v:0,t:x?x.t:0,r:x?x.r:0,done:!!x&&d<=y});}}
 return out;}
/* site-wide audience for the period (everyone, not just one ad) */
function adAud(per){const yr=dayKey(0).slice(0,4),inP=d=>per==='year'?d.slice(0,4)===yr:d.slice(0,6)===per;
 const days=[...AD.sums.keys()].filter(inP);let dau=0,nd=0,sec=0,md=0;
 days.forEach(d=>{const S=AD.sums.get(d);if(S.aud&&S.aud.dau!=null){dau+=S.aud.dau;nd++;}for(const g in S.m||{})sec+=S.m[g];md+=S.md||0;});
 const o={avg:nd?Math.round(dau/nd):null,min:md?sec/md/60:null,days:days.length};
 if(per==='year'){const ms=Object.keys(AD.mon).filter(m=>m.slice(0,4)===yr&&AD.mon[m]);
  o.players=ms.length?Math.round(ms.reduce((a,m)=>a+AD.mon[m].all,0)/ms.length):null;o.nw=ms.length?ms.reduce((a,m)=>a+AD.mon[m].neu,0):null;o.ret=null;}
 else{const M=AD.mon[per];o.players=M?M.all:null;o.nw=M?Math.min(M.neu,M.all):null;o.ret=M?Math.max(0,M.all-M.neu):null;}
 return o;}

/* ---- loading: sums for this year (+ last month), build the missing finished days, monthly visitor counts ---- */
async function loadAds(){if(AD.loading)return;AD.loading=true;AD.err='';renderAds();
 try{const today=dayKey(0),yest=dayKey(1),cm=today.slice(0,6);
  const from=sMax(ADS_START,sMin(today.slice(0,4)+'0101',prevMonth(cm)+'01'));
  let reads=0,built=0,unsaved=0;const sums=new Map();
  if(from<=yest){const got=await DL.adSums(from,yest);reads+=Math.max(1,got.length);got.forEach(x=>{const d=String(x.id||'').slice(4);if(/^\d{8}$/.test(d))sums.set(d,x);});}
  const lo=sMax(ADS_START,dayKey(62)),need=[];for(let i=1;i<=62;i++){const d=dayKey(i);if(d<lo)break;if(!sums.has(d))need.push(d);}
  for(const d of need.slice(0,40)){
   const docs=await DL.adDay(d);reads+=Math.max(1,docs.length);const S=sumDay(docs);
   try{S.aud={dau:await DL.count('day-'+d),nw:await DL.count('day-'+d,{n:true})};reads+=2;}catch(e){S.aud=null;}
   S.at=Date.now();try{await DL.putSum(d,S);}catch(e){console.warn(e);unsaved++;}
   sums.set(d,S);built++;}
  const mon={};let m=from.slice(0,6);for(let i=0;i<30&&m<=cm;i++){try{mon[m]={all:await DL.count('month-'+m),neu:await DL.count('month-'+m,{n:true})};reads+=2;}catch(e){mon[m]=null;}
   const y=+m.slice(0,4),n=+m.slice(4,6);m=n===12?(y+1)+'01':y+String(n+1).padStart(2,'0');}
  Object.assign(AD,{sums,mon,reads,built,unsaved,from,at:Date.now()});
  if(!AD.per||!adPeriods().some(p=>p[0]===AD.per)){const withData=[...sums.entries()].filter(([,S])=>S.n>0).map(([d])=>d.slice(0,6)).sort();AD.per=withData.length?withData[withData.length-1]:cm;}
  if(!AD.sp||!adSponsors().some(s=>s.id===AD.sp))AD.sp=adDefaultSp();
 }catch(e){console.warn(e);AD.err=e&&e.code==='permission-denied'?'Ad counts are private. Publish the admin rules (Overview → Your account & one-time setup) to see them.':'Couldn’t load the ad counts: '+(e.message||e.code||e);}
 AD.loading=false;renderAds();}
function adPeriods(){const cm=dayKey(0).slice(0,6),out=[];let m=cm;const lo=(AD.from||ADS_START).slice(0,6);
 for(let i=0;i<24&&m>=lo;i++){out.push([m,mName(m)]);m=prevMonth(m);}out.push(['year','This year ('+cm.slice(0,4)+')']);return out;}
function adDefaultSp(){const L=adSponsors(),v=s=>adAgg(s.id,AD.per||dayKey(0).slice(0,6)).views;
 const paid=L.filter(s=>!adOwn(s)&&!s.gone&&adStatus(s)[0]==='Active').sort((a,b)=>v(b)-v(a));if(paid.length)return paid[0].id;
 const any=L.slice().sort((a,b)=>v(b)-v(a));return any.length?any[0].id:'';}
const adHas=()=>[...AD.sums.values()].some(S=>S.n>0);

/* ---- "Today so far": today's device docs, read live while this tab is open and the page is visible ----
   One query a minute, capped at ADT_CAP docs. After the first look it asks only for the docs that changed
   since (t >= the newest change seen), so a quiet minute costs about 1 read. Added up with sumDay() (tampered docs
   left out, the same as a finished day) but NEVER saved: only finished days get a sum, in loadAds(). */
const ADT_CAP=500,ADT_EVERY=60e3;
const ADT={day:'',docs:new Map(),since:null,at:0,busy:false,err:'',capped:false,S:null,reads:0};
async function loadToday(force){if(ADT.busy||!isAdmin||document.hidden)return;if(!force&&ADT.at&&Date.now()-ADT.at<ADT_EVERY)return;
 const d=dayKey(0);
 if(ADT.day!==d){const was=ADT.day;Object.assign(ADT,{day:d,docs:new Map(),since:null,S:null,capped:false});
  /* midnight (Maldives time) passed with the tab open: yesterday is a finished day now, so add it up the usual way */
  if(was&&AD.at&&!AD.loading){AD.at=0;loadAds();}}
 if(force){ADT.docs=new Map();ADT.since=null;}
 ADT.busy=true;
 try{const got=await DL.adToday(d,ADT.since,ADT_CAP);ADT.reads+=Math.max(1,got.length);
  if(ADT.day===d){got.forEach(x=>ADT.docs.set(x.id,x));
   for(const x of got)if(x.t&&typeof x.t.toMillis==='function'&&(!ADT.since||x.t.toMillis()>=ADT.since.toMillis()))ADT.since=x.t;
   ADT.capped=got.length>=ADT_CAP;ADT.S=sumDay([...ADT.docs.values()]);ADT.err='';}}
 catch(e){console.warn(e);ADT.err=e&&e.code==='permission-denied'?'The Firestore rules don’t let this account read today’s ad counts yet. Publish the admin rules (Overview → Your account & one-time setup).':'Couldn’t read today’s counts: '+(e.message||e.code||e);}
 ADT.at=Date.now();ADT.busy=false;paintToday();}
function adTodayOf(sid){const S=ADT.S;if(!S)return null;const pre=sid+'~';let v=0,t=0,sec=0;
 for(const x in S.v)if(x.startsWith(pre))v+=S.v[x];for(const x in S.k)if(x.startsWith(pre))t+=S.k[x];for(const g in S.m)sec+=S.m[g];
 return {v,t,r:(S.rd||{})[sid]||0,sec,n:S.n,md:S.md};}
function durTxt(s){s=Math.round(s);if(s<60)return s+' s';const m=Math.round(s/60);if(m<60)return m+' min';const h=Math.floor(m/60);return h+' h'+(m%60?' '+(m%60)+' min':'');}
const hhmm=ms=>new Date(ms).toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'});
function todayInner(s){const x=s&&s.id?adTodayOf(s.id):null,link=!!(s&&s.url);
 const head=`<div class="chead"><h2 class="tdh"><span class="live" aria-hidden="true"></span>Today so far</h2><span class="small muted">live, updates every minute</span>${ADT.busy&&!ADT.S?'<span class="spin"></span>':''}</div>`;
 const help=`<p class="thelp">Not counted: bots, browsers with Do Not Track or Global Privacy Control on, local test copies and <code>?ns</code> test tables. Finished days are added up after midnight Maldives time.</p>`;
 if(ADT.err)return head+`<div class="note">${IC.warn}<div>${esc(ADT.err)}</div></div>`+help;
 if(!x)return head+`<div class="anone">Reading today’s counts…</div>`+help;
 const fig=(l,v,sub)=>`<div><div class="lbl">${l}</div><div class="v">${v}</div><div class="s">${sub}</div></div>`;
 return head+`<div class="aaud atq">${fig('Views',fmt(x.v),esc(s.title||''))}${fig('Taps',link?fmt(x.t):'–',link?(x.v?pctS(x.t,x.v,1)+' of views':'opened the link'):'this ad has no link')}
   ${fig('Players reached',fmt(x.r),'devices that saw it')}${fig('Time played',durTxt(x.sec),'whole site, '+fmt(x.md)+' player'+(x.md===1?'':'s'))}</div>
  <div class="tmeta">${esc(dNice(ADT.day))}, Maldives time · ${fmt(x.n)} device${x.n===1?'':'s'} counted so far · updated ${esc(hhmm(ADT.at))}${ADT.capped?' · more than '+fmt(ADT_CAP)+' devices changed, the rest arrive next minute':''}</div>`+help;}
const todayRow=id=>{const x=adTodayOf(id);return x?`<b>${fmt(x.v)}</b> today`:ADT.err?'':'… today';};
function paintToday(){const box=$('#adToday');if(box){const s=adSponsors().find(x=>x.id===AD.sp);box.innerHTML=todayInner(s);}
 document.querySelectorAll('[data-today]').forEach(el=>{el.innerHTML=todayRow(el.dataset.today);});}

/* ---- drawing ---- */
function adNum(v,f){return f==='p'?v.toFixed(2)+'%':f==='d'?v.toFixed(1):f==='m'?Math.round(v)+' min':fmt(Math.round(v));}
const cuN=(v,f)=>`<span data-cu="${v}" data-f="${f||''}">${adNum(v,f)}</span>`;
function countUp(root){if(RM.matches||!root)return;root.querySelectorAll('[data-cu]').forEach(el=>{const to=+el.dataset.cu,f=el.dataset.f,fin=el.textContent,t0=performance.now(),D=750;
 if(!isFinite(to)||to<=0)return;let done=false;const end=()=>{if(!done){done=true;el.textContent=fin;}};
 const step=t=>{if(done)return;const k=Math.min(1,(t-t0)/D),e=1-Math.pow(1-k,3);if(k>=1){end();return;}el.textContent=adNum(to*e,f);requestAnimationFrame(step);};
 el.textContent=adNum(0,f);requestAnimationFrame(step);setTimeout(end,D+250);});}
function niceTop(v){if(v<=4)return 4;const e=Math.pow(10,Math.floor(Math.log10(v))),f=v/e;return (f<=1?1:f<=2?2:f<=2.5?2.5:f<=5?5:10)*e;}
const kf=v=>v>=1000?(v/1000).toFixed(v%1000?1:0).replace(/\.0$/,'')+'k':String(v);
function barsSVG(B,W,H,o){o=o||{};const L=30,T=8,Bt=22,pw=W-L-2,ph=H-T-Bt,n=B.length,mx=niceTop(Math.max(1,...B.map(b=>b.v))),slot=pw/n,gap=Math.max(1.5,Math.min(6,slot*.28)),bw=Math.max(1,slot-gap);
 let s=`<svg class="${o.cls||'achart'}" viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" role="img" aria-label="${esc(o.label||'')}">`;
 for(let i=0;i<=2;i++){const y=T+ph-ph*i/2;s+=`<line class="gl" x1="${L}" x2="${W-2}" y1="${y}" y2="${y}"/><text x="${L-6}" y="${y+3.5}" text-anchor="end">${kf(mx*i/2)}</text>`;}
 const every=n>20?5:1;
 B.forEach((b,i)=>{const x=L+i*slot+gap/2,h=b.v?Math.max(2,ph*b.v/mx):(b.done?1.5:0),y=T+ph-h;
  if(o.hit&&i===o.sel)s+=`<rect class="hl" x="${L+i*slot}" y="${T}" width="${slot}" height="${ph}" rx="4"/>`;
  if(h>0)s+=`<rect class="${o.rep?(b.v?'b':'b0'):'b'+(b.v?' has':'')+(i===o.sel?' on':'')}${o.rep?'':' grow'}" x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${bw.toFixed(1)}" height="${h.toFixed(1)}" rx="${Math.min(2.5,bw/2).toFixed(1)}"${o.rep?'':` style="animation-delay:${Math.round(i*14)}ms"`}/>`;
  if(n<=20||i===0||(i+1)%every===0)s+=`<text x="${(x+bw/2).toFixed(1)}" y="${H-7}" text-anchor="middle">${esc(b.lbl)}</text>`;
  if(o.hit)s+=`<rect class="hit" data-a="adday" data-i="${i}" x="${L+i*slot}" y="0" width="${slot}" height="${H}"><title>${esc(b.lbl)}: ${fmt(b.v)} views</title></rect>`;});
 return s+'</svg>';}
function platHTML(p,views,cls){const tot=Math.max(1,p.web+p.ios+p.android);
 return `<div class="${cls||''}"><div class="apbar" role="img" aria-label="${AD_PLATS.map(([k,n])=>n+' '+pctS(p[k],tot)).join(', ')}">${AD_PLATS.map(([k])=>p[k]?`<i class="fill" style="flex:${p[k]};background:${AD_SHADE[k]}"></i>`:'').join('')}</div>
  <div class="apleg">${AD_PLATS.map(([k,n])=>`<div><span class="l"><i style="background:${AD_SHADE[k]}"></i>${n}</span><b>${pctS(p[k],tot)}</b><small>${fmt(p[k])} views</small></div>`).join('')}</div></div>`;}
function delta(c,p,lbl){if(p==null||!lbl)return '';if(!p)return c?` <span class="dl up">new vs ${esc(lbl)}</span>`:'';const d=Math.round((c-p)/p*100);
 return ` <span class="dl ${d>=0?'up':'dn'}">${d>=0?'▲ +':'▼ '}${d}% vs ${esc(lbl)}</span>`;}

function renderAds(){const el=$('#ads');if(!el)return;
 if(AD.err){el.innerHTML=`<div class="adv"><div class="card"><div class="chead"><h2>Advertisers</h2></div><div class="note">${IC.warn}<div>${esc(AD.err)}</div></div><div class="dfoot"><span class="sp"></span><button class="btn sm" data-a="adreload">Try again</button></div></div></div>`;return;}
 if(!AD.at){el.innerHTML=`<div class="adv"><div class="card"><div class="chead"><h2>Advertisers</h2><span class="spin"></span></div><div class="anone">Adding up the ad counts…</div></div></div>`;return;}
 const L=adSponsors(),s=L.find(x=>x.id===AD.sp)||L[0]||{id:'',title:'No sponsors',colors:[]},per=AD.per,yr=per==='year';
 const a=adAgg(s.id,per),has=adHas(),hasA=a.views>0||a.taps>0,link=!!s.url;
 const pm=yr?null:prevMonth(per),pa=pm?adAgg(s.id,pm):null,pl=pa&&pa.n?mShort(pm):'',pv=pa&&pa.n?pa:null;

 function sched(){if(ended)return;clearTimeout(retry);retry=setTimeout(connect,delay);delay=Math.min(15000,delay*1.6);}
 function drop(w){if(ws!==w)return;ws=null;clearInterval(ping);buf=new Uint8Array(0);if(self.up){self.up=false;onState(false);}sched();}
 function connect(){if(ended)return;let w;try{w=new WebSocket(url,['mqtt']);}catch(e){sched();return;}ws=w;w.binaryType='arraybuffer';
  const ct=setTimeout(()=>{if(ws===w&&!self.up){try{w.close();}catch(e){}drop(w);}},9000);
  /* CONNECT: MQTT 3.1.1, clean session, keep-alive 30 s, no Will, no credentials */
  w.onopen=()=>{if(ws===w)send(packet(0x10,[new Uint8Array([0,4,77,81,84,84,4,0x02,0,30]),str('dga_'+rid())]));};
  w.onmessage=e=>{if(ws!==w)return;lastIn=Date.now();const d=new Uint8Array(e.data),nb=new Uint8Array(buf.length+d.length);nb.set(buf);nb.set(d,buf.length);buf=nb;parse();};
  w.onclose=()=>{clearTimeout(ct);drop(w);};w.onerror=()=>{try{w.close();}catch(e){}};}
 function parse(){while(buf.length>=2){let mul=1,len=0,i=1,b;do{if(i>=buf.length)return;b=buf[i++];len+=(b&127)*mul;mul*=128;}while(b&128);
  if(buf.length<i+len)return;const head=buf[0],body=buf.slice(i,i+len);buf=buf.slice(i+len);handle(head>>4,head&15,body);}}
 function handle(type,flags,b){
  if(type===2){if(b[1]!==0){try{ws&&ws.close();}catch(e){}return;}self.up=true;delay=1500;onState(true);
   mid=mid%65535+1;const parts=[new Uint8Array([mid>>8,mid&255])];topics.forEach(t=>{parts.push(str(t));parts.push(new Uint8Array([0]));});send(packet(0x82,parts));
   clearInterval(ping);ping=setInterval(()=>{if(Date.now()-lastIn>50000){const w=ws;try{w&&w.close();}catch(e){}drop(w);return;}send(new Uint8Array([0xC0,0]));},20000);}
  else if(type===3){const qos=(flags>>1)&3,tl=(b[0]<<8)|b[1];const topic=TD.decode(b.subarray(2,2+tl));let off=2+tl;if(qos>0)off+=2;
   const p=b.subarray(off);let m=null;if(p.length){try{m=JSON.parse(TD.decode(p));}catch(e){return;}}onMsg(topic,m);}}
 self.end=()=>{ended=true;clearTimeout(retry);clearInterval(ping);const w=ws;ws=null;if(w){try{w.send(new Uint8Array([0xE0,0]));w.close();}catch(e){}}};
 connect();return self;}

let tRenderT=0;function tablesChanged(){if(tRenderT)return;tRenderT=setTimeout(()=>{tRenderT=0;renderTables();if(tab==='overview')renderStats();},400);}
function onListing(topic,m){const net=NETS.find(n=>topic.indexOf(n.ns+'lobby/')===0);if(!net)return;
 const code=topic.slice((net.ns+'lobby/').length);if(!/^[A-Z]{4}$/.test(code))return;const key=net.ns+code;
 if(!m||typeof m!=='object'||!m.t){if(TB.delete(key))tablesChanged();return;}
 const cur=TB.get(key);if(cur&&+m.t<cur.t)return;
 let g=net.g;const info0=String(m.info||'').slice(0,60);
 if(g==='bondi'&&/^ranga/i.test(info0))g='ranga';if(g==='dhihaeh'&&/^thaas/i.test(info0))g='thaas';
 const status=m.status==='lobby'?'open':'playing';
 let info=info0;if(net.f==='digu'){const r=clampInt(m.r,0,99),h=clampInt(m.h,0,999);info=status==='open'?(r?r+' rounds':''):(h&&r?'Hand '+h+' of '+r:h?'Hand '+h:'');}
 TB.set(key,{key,code,g,name:String(m.name||'').replace(/[\u0000-\u001f<>]/g,'').trim().slice(0,14)||'Player',n:clampInt(m.n,1,12),
  mx:net.f==='dg'?clampInt(m.mx||net.mx,2,12):net.mx,t:+m.t,c:+m.c||+m.t,status,q:!!m.q,vw:clampInt(m.vw,0,999),info});
 tablesChanged();}

/* =====================================================================================
   ACTIONS
   ===================================================================================== */
function needRules(){if(rulesOK===true)return false;toast('Publish the admin rules first (Overview → setup).',4000);return true;}
function errMsg(e){return e&&e.code==='permission-denied'?'Firebase refused: check the admin rules and your UID.':(e&&e.message)||String(e);}
function pLine(p){return `<b>${esc(p.name||'(no name)')}</b> · W ${fmt(p.wins)} · G ${fmt(p.games)} · XP ${fmt(p.xp)} · updated ${ago(p.updatedAt)} ago<br><span class="mono">${esc(p.id)}</span>`;}

async function doMerge(k){if(needRules())return;const g=dupGroups().find(x=>x.k===k);if(!g)return;const {T,src,after}=mergePlan(g);
 if(!src.length){toast('Tick at least one other entry to merge.');return;}
 const F=[['wins','Wins'],['games','Games'],['hands','Hands'],['gins','Gins'],['big','Big wins'],['online','Online games'],['xp','XP'+(ST.xpMode==='sum'?' (added)':' (highest)')],['shells','Shells (highest)'],['best','Best (highest)'],['updatedAt','Last update']];
 const cell=(f,v)=>f==='updatedAt'?esc(when(v)):v==null?'—':fmt(v);
 const html=`<p style="margin:0 0 6px">Keep <b>${esc(T.name)}</b> <span class="mono muted">${esc(T.id)}</span> and add ${src.length} other entr${src.length===1?'y':'ies'} into it. The name stays “${esc(T.name)}”.</p>
  <table class="ctab"><thead><tr><th>Field</th><th>Now</th><th>After</th></tr></thead><tbody>
  ${F.map(([f,l])=>{const b=T[f],a=after[f];return `<tr class="${b!==a?'chg':''}"><td>${l}</td><td>${cell(f,b)}</td><td>${cell(f,a)}</td></tr>`;}).join('')}</tbody></table>
  <p style="margin:12px 0 0"><b>The other ${src.length} entr${src.length===1?'y':'ies'}:</b></p><ul class="dlist">${src.map(p=>`<li>${pLine(p)}</li>`).join('')}</ul>
  <div style="margin:10px 0 0;display:grid;gap:6px">
   <label style="display:flex;gap:8px;align-items:flex-start"><input type="radio" name="mkeep" value="del" checked onchange="window.__mkeep=false"><span><b>Merge &amp; delete</b>: their stats move into “${esc(T.name)}” and these entries are removed.</span></label>
   <label style="display:flex;gap:8px;align-items:flex-start"><input type="radio" name="mkeep" value="keep" onchange="window.__mkeep=true"><span><b>Merge &amp; keep</b>: their stats move into “${esc(T.name)}”, and these entries stay (reset to 0 wins, so nothing is counted twice).</span></label>
  </div>
  <p class="small muted" style="margin:10px 0 0">This can’t be undone.</p>`;
 window.__mkeep=false;
 if(!await ask({title:`Merge ${src.length+1} “${T.name.trim()}” entries?`,html,ok:'Merge',danger:true}))return;
 const keep=!!window.__mkeep;
 try{await DL.merge(T.id,after,src.map(p=>p.id),keep);Object.assign(ST.players.get(T.id),after);src.forEach(p=>{if(keep)Object.assign(ST.players.get(p.id),ZERO());else ST.players.delete(p.id);});delete ST.dupSel[k];
  toast('Merged. '+src.length+' entr'+(src.length===1?'y':'ies')+(keep?' kept with stats reset to 0.':' removed.'));renderPlayers();renderStats();}
 catch(e){console.warn(e);toast('Merge failed: '+errMsg(e),5000);}}
async function doRename(id){if(needRules())return;const p=ST.players.get(id);if(!p)return;
 const v=await ask({title:'Rename player',html:`<p style="margin:0">${pLine(p)}</p><p class="small muted">Up to 20 characters. Heads-up: a registered player’s game writes their own username back the next time they play.</p>`,ok:'Next',input:{label:'New name',value:p.name,max:20}});
 if(v==null)return;const name=cleanName(v);if(!name){toast('The name can’t be empty.');return;}if(name===p.name){toast('Same name, nothing changed.');return;}
 if(!await ask({title:'Rename?',html:`<p style="margin:0">“<b>${esc(p.name)}</b>” → “<b>${esc(name)}</b>”</p><p class="mono muted">${esc(id)}</p>`,ok:'Rename'}))return;
 try{await DL.rename(id,name);p.name=name;toast('Renamed.');renderPlayers();}catch(e){console.warn(e);toast('Rename failed: '+errMsg(e),5000);}}
async function doDelete(id){if(needRules())return;const p=ST.players.get(id);if(!p)return;
 if(!await ask({title:'Delete this player entry?',html:`<ul class="dlist"><li>${pLine(p)}</li></ul><p class="small muted" style="margin:10px 0 0">Removes the leaderboard entry only (their sign-in account stays). This can’t be undone. If they play again, a fresh entry appears.</p>`,ok:'Delete',danger:true}))return;
 try{await DL.delPlayer(id);ST.players.delete(id);if(ST.openRow===id)ST.openRow='';toast('Deleted.');renderPlayers();renderStats();}catch(e){console.warn(e);toast('Delete failed: '+errMsg(e),5000);}}
async function doHandled(id,on){if(needRules())return;const k=ST.inboxKind,nid=noteId(k,id);
 try{if(on){const d={kind:k,ref:id,handled:true,at:Date.now(),by:user.uid};await DL.setNote(nid,d);ST.notes.set(nid,d);}else{await DL.delNote(nid);ST.notes.delete(nid);}renderInbox();toast(on?'Marked handled.':'Reopened.');}
 catch(e){console.warn(e);toast('Failed: '+errMsg(e),5000);}}
async function doDelMsg(id){if(needRules())return;const k=ST.inboxKind,x=(ST[k]||[]).find(m=>m.id===id);if(!x)return;
 const what=k==='reports'?`${esc(x.reason||'Report')} about <b>${esc(x.targetName||'?')}</b> by ${esc(x.byName||'?')}`:`Support message from <b>${esc(x.byName||'Player')}</b>: “${esc(String(x.msg||'').slice(0,120))}”`;
 if(!await ask({title:'Delete this message?',html:`<ul class="dlist"><li>${what}<br><span class="small">${esc(when(x.time))}</span></li></ul><p class="small muted" style="margin:10px 0 0">This can’t be undone. “Mark handled” keeps it instead.</p>`,ok:'Delete',danger:true}))return;
 const nid=noteId(k,id);try{await DL.delInbox(k,id,ST.notes.has(nid)?nid:null);ST[k]=ST[k].filter(m=>m.id!==id);ST.notes.delete(nid);renderInbox();toast('Deleted.');}catch(e){console.warn(e);toast('Delete failed: '+errMsg(e),5000);}}
async function doCleanPresence(){if(needRules())return;let old=[];try{old=await DL.oldPresence(Date.now()-864e5);}catch(e){toast('Couldn’t read check-ins: '+errMsg(e),5000);return;}
 if(!old.length){toast('No check-ins older than 24 h.');return;}
 if(!await ask({title:`Clear ${old.length} old check-in${old.length===1?'':'s'}?`,html:`<p style="margin:0">Deletes presence entries older than 24 hours (left behind when a game closed without saying goodbye). Live counts are not affected; games write a fresh one when they open.</p>`,ok:'Clear',danger:true}))return;
 try{await DL.delPresence(old);toast('Cleared '+old.length+'.');}catch(e){toast('Failed: '+errMsg(e),5000);}}

document.addEventListener('click',async e=>{const b=e.target.closest('[data-a]');if(!b)return;const a=b.dataset.a;
 switch(a){
  case 'tab':setTab(b.dataset.t);break;
  case 'signout':try{await DL.signOut();}catch(x){}break;
  case 'google':authErr='';try{await DL.signInGoogle();}catch(x){const el=$('#lerr');if(el)el.textContent=authMsg(x);}break;
  case 'refresh':toast('Refreshing…',1200);loadPlayers();loadPresence();if(rulesOK!==false)loadInbox();if(tab==='stats'){TR.at=0;loadTraffic(true);}if(tab==='ads'){AD.at=0;loadAds();loadToday(true);}break;
  case 'copy-uid':copy(user.uid);break;
  case 'copy-rules':copy(RULES.split("['OWNER_UID']").join("['"+(user&&!MOCK?user.uid:'OWNER_UID')+"']"));break;
  case 'probe':rulesOK=null;renderSetup();await probe();if(rulesOK){loadInbox();TR.at=0;TR.err='';AD.at=0;AD.err='';}else renderInbox();toast(rulesOK?'Admin rules are active.':'Not active yet. Publish the rules, wait a minute, try again.',3500);break;
  case 'copy':copy(b.dataset.v);break;
  case 'tfilter':ST.tFilter=b.dataset.g;renderTables();break;
  case 'xpmode':ST.xpMode=b.dataset.v;renderDups();break;
  case 'dtarget':{const s=ST.dupSel[b.dataset.k];if(s){s.target=b.dataset.id;s.excl.delete(b.dataset.id);}ST.dupOpen=b.dataset.k;renderDups();break;}
  case 'dinc':{const s=ST.dupSel[b.dataset.k];if(s){if(b.checked)s.excl.delete(b.dataset.id);else s.excl.add(b.dataset.id);}break;}
  case 'merge':ST.dupOpen=b.dataset.k;doMerge(b.dataset.k);break;
  case 'row':ST.openRow=ST.openRow===b.dataset.id?'':b.dataset.id;renderRows();break;
  case 'more':ST.shown+=100;renderRows();break;
  case 'rename':doRename(b.dataset.id);break;
  case 'del':doDelete(b.dataset.id);break;
  case 'ikind':ST.inboxKind=b.dataset.v;renderInbox();break;
  case 'ifilter':ST.inboxFilter=b.dataset.v;renderInbox();break;
  case 'handled':doHandled(b.dataset.id,true);break;
  case 'reopen':doHandled(b.dataset.id,false);break;
  case 'delmsg':doDelMsg(b.dataset.id);break;
  case 'find':ST.q=b.dataset.v;ST.shown=60;setTab('players');{const i=$('#pq');if(i)i.value=ST.q;}renderRows();break;
  case 'clean-presence':doCleanPresence();break;
  case 'daysel':TR.sel=+b.dataset.i;renderTraffic();break;
  case 'traffic':TR.at=0;loadTraffic(true);break;
  case 'adreload':AD.at=0;loadAds();loadToday(true);break;
  case 'adsp':AD.sp=b.dataset.id;AD.sel=-1;renderAds();{const h=document.querySelector('.ahead');if(h)h.scrollIntoView({behavior:RM.matches?'auto':'smooth',block:'center'});}break;
  case 'adday':AD.sel=+b.dataset.i;drawAdChart();{const r=$('#adRead');if(r&&!RM.matches){r.classList.remove('flash');void r.offsetWidth;r.classList.add('flash');}}break;
  case 'adpdf':adPrint();break;
  case 'adcsv':adCSV();break;
  /* merge two players */
  case 'mg-start':ST.mg={a:b.dataset.id,b:'',keep:'a',qa:'',qb:'',typed:''};renderMerge2();
   {const c=$('#mergeCard');if(c)try{c.scrollIntoView({block:'start',behavior:RM.matches?'auto':'smooth'});}catch(x){}const i=$('#mgq-b');if(i)setTimeout(()=>i.focus({preventScroll:true}),50);}break;
  case 'mg-pick':{const s=b.dataset.s;ST.mg[s]=b.dataset.id;ST.mg['q'+s]='';ST.mg.typed='';renderMerge2();const o=s==='a'?'b':'a';const i=$('#mgq-'+o);if(i)i.focus({preventScroll:true});break;}
  case 'mg-clear':{const s=b.dataset.s;ST.mg[s]='';ST.mg.typed='';renderMerge2();const i=$('#mgq-'+s);if(i)i.focus({preventScroll:true});break;}
  case 'mg-keep':ST.mg.keep=b.dataset.v==='b'?'b':'a';ST.mg.typed='';renderMerge2();break;
  case 'mg-reset':ST.mg={a:'',b:'',keep:'a',qa:'',qb:'',typed:''};renderMerge2();break;
  case 'mg-go':doMerge2();break;
  /* password reset */
  case 'reset':doReset(b.dataset.id);break;
  case 'reset-setup':e.preventDefault();gotoResetSetup();break;
  case 'copy-tpw':{const c=$('#tpwv');if(c)copy(c.textContent);break;}
 }});
/* typing in the merge search boxes and the type-to-confirm box updates only what changes (keeps the keyboard open) */
document.addEventListener('input',e=>{const t=e.target;if(!t||!t.id)return;
 if(t.id==='mgq-a'||t.id==='mgq-b'){const s=t.dataset.s;ST.mg['q'+s]=t.value;const r=$('#mgr-'+s);if(r)r.innerHTML=mgResults(s);}
 else if(t.id==='mgType'){ST.mg.typed=t.value;const P=mergePlan2(),g=$('[data-a="mg-go"]');if(g&&P)g.disabled=t.value.trim()!==P.K.name.trim();}});
document.addEventListener('toggle',e=>{const d=e.target;if(d&&d.id==='resetSetup')ST.openReset=d.open;if(d.classList&&d.classList.contains('dgroup')){if(d.open)ST.dupOpen=d.dataset.k;else if(ST.dupOpen===d.dataset.k)ST.dupOpen='';}},true);

let timers=[];
function stopTimers(){timers.forEach(clearInterval);timers=[];}
async function onUser(u){user=u||null;stopTimers();
 if(!user){isAdmin=false;rulesOK=null;viewLogin();if(MOCK&&Q.get('auto')==='1')DL.signInEmail('owner@example.com','x');return;}
 viewLoading('Checking access…');
 const listed=ADMIN_UIDS.includes(user.uid)||(MOCK&&user.uid===MOCK_ADMIN);
 let ok=false;try{ok=await DL.probe();}catch(e){console.warn(e);}
 if(user!==u)return;
 isAdmin=listed||ok;rulesOK=ok;
 if(!isAdmin){viewDenied();return;}
 viewPanel();
 loadPlayers();loadPresence();loadInbox();if(!mq.length&&!startTables.done){startTables.done=true;startTables();}
 timers.push(setInterval(loadPresence,PRES_EVERY));
 timers.push(setInterval(()=>{if(!document.hidden&&tab==='tables')renderTables();},3000));
 timers.push(setInterval(()=>{if(!document.hidden&&Date.now()-ST.playersAt>5*60e3)loadPlayers();},60e3));
 /* Advertisers "Today so far": a free check every 5 s; it reads only when the last read is a minute old,
    the Advertisers tab is open and the page is visible */
 timers.push(setInterval(()=>{if(!document.hidden&&tab==='ads')loadToday();},5e3));}
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&isAdmin){loadPresence();renderTables();if(tab==='ads')loadToday();}});
let rsT=0,lastW=innerWidth;addEventListener('resize',()=>{clearTimeout(rsT);rsT=setTimeout(()=>{if(innerWidth!==lastW){lastW=innerWidth;if(TR.at)renderTraffic();if(AD.at&&tab==='ads'){drawAdChart();fitReport();}}},200);});

(async()=>{
 if(MOCK){const mb=$('#mockbar');mb.hidden=false;mb.textContent=LIVE?'TEST MODE · fake sign-in · real read-only data · all writes disabled':'MOCK MODE · fake data · nothing is sent to Firebase';}
 viewLoading('Loading…');
 try{await DL.init();}catch(e){console.error(e);setView(`<div class="center"><div class="card lcard"><h2>Couldn’t load Firebase</h2><p class="muted">${esc(e.message||e)}</p><button class="btn" onclick="location.reload()">Try again</button></div></div>`);return;}
 DL.onAuth(u=>onUser(u));
 if(MOCK)onUser(null);
})();
