<style>
:root{--ink:#0d1b24;--muted:#56666f;--glass:rgba(255,255,255,.78);--glass2:rgba(255,255,255,.92);--red:#e0352b;--line:rgba(13,27,36,.1);--gold:#f2b21f;
 --sat:env(safe-area-inset-top,0px);--sab:env(safe-area-inset-bottom,0px);--out:cubic-bezier(.16,1,.3,1);--spring:cubic-bezier(.34,1.56,.64,1);--ts:1}
*{box-sizing:border-box}
html{height:100%;overflow:hidden;-webkit-text-size-adjust:100%;background:#06304f}
body{margin:0;height:100%;overflow:hidden;background:#06304f;font:14px/1.45 Inter,system-ui,-apple-system,sans-serif;color:var(--ink);-webkit-font-smoothing:antialiased;overscroll-behavior:none;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent;border:0;background:none;padding:0}
button:disabled{cursor:default}
:focus-visible{outline:3px solid #ffcc00;outline-offset:2px}
[hidden]{display:none!important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
#gl{position:fixed;left:0;top:0;width:100vw;height:100vh;display:block;z-index:0}
#fbsea{position:fixed;inset:0;z-index:0;background:radial-gradient(120% 80% at 50% 40%,#2aa9b8 0%,#0f6e92 38%,#06304f 80%)}
.wg{background:var(--glass);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);box-shadow:0 0 0 .5px rgba(0,0,0,.08),0 10px 30px -10px rgba(0,30,50,.45)}
/* HUD glass sits over the live water canvas: a lighter blur, and none at all (a more opaque glass instead) once the water drops its quality or in smooth mode */
.gl-low .wg,.dg-lite .wg,.gl-low .dgnslot .dgn-dock .dgn-ib,.dg-lite .dgnslot .dgn-dock .dgn-ib{-webkit-backdrop-filter:none;backdrop-filter:none}.gl-low .wg,.dg-lite .wg{background:rgba(255,255,255,.93)}
.scr{position:fixed;inset:0;z-index:2;overflow:hidden}
/* ---------------- drone HUD bits ---------------- */
.brk{position:absolute;left:14px;right:14px;top:calc(var(--sat) + 64px);bottom:calc(var(--sab) + 330px);pointer-events:none;z-index:1}
.brk i{position:absolute;width:24px;height:24px;border:2px solid rgba(255,255,255,.85);filter:drop-shadow(0 1px 2px rgba(0,0,0,.5))}
.brk i:nth-child(1){left:0;top:0;border-right:0;border-bottom:0}.brk i:nth-child(2){right:0;top:0;border-left:0;border-bottom:0}.brk i:nth-child(3){left:0;bottom:0;border-right:0;border-top:0}.brk i:nth-child(4){right:0;bottom:0;border-left:0;border-top:0}
.tele{display:flex;justify-content:space-between;gap:8px;font:600 10px/1.4 Inter;letter-spacing:.14em;color:rgba(255,255,255,.92);text-shadow:0 1px 3px rgba(0,0,0,.6);text-transform:uppercase;pointer-events:none}
.tele b{display:inline-block;width:7px;height:7px;border-radius:50%;background:#ff4d4d;margin-right:6px;box-shadow:0 0 8px #ff4d4d;animation:rec 1.4s steps(2) infinite;vertical-align:1px}
@keyframes rec{50%{opacity:.2}}
/* ---------------- home ---------------- */
#home .top{position:absolute;left:12px;right:12px;top:calc(var(--sat) + 10px);display:flex;justify-content:space-between;align-items:center;z-index:5}
.ib{flex:none;width:44px;height:44px;border-radius:14px;display:grid;place-items:center;color:var(--ink);text-decoration:none;transition:transform .15s}
.ib:active{transform:scale(.94)}
.ib svg{width:22px;height:22px}
/* Dhivehi Games home: back arrow + the small Punch Card tile */
.ib.dgh{width:auto;display:flex;align-items:center;gap:2px;padding:0 9px 0 5px;border-radius:99px}
.ib.dgh svg{width:18px;height:18px}.ib .dgmk{display:block;width:24px;height:24px;flex:none;filter:drop-shadow(0 2px 4px rgba(0,30,50,.25))}
.chip{display:inline-flex;align-items:center;gap:6px;height:36px;padding:0 12px 0 6px;border-radius:18px;font:700 14px/1 Inter;color:var(--ink)}
.chip img{width:26px;height:26px}
#home .tele{position:absolute;left:24px;right:24px;top:calc(var(--sat) + 66px);z-index:3}
.logo{position:absolute;left:0;right:0;top:calc(var(--sat) + 118px);text-align:center;z-index:3;color:#fff;text-shadow:0 2px 20px rgba(0,30,60,.55);pointer-events:none}
.logo .coords{font:500 11px/1 Inter;letter-spacing:.2em;opacity:.88;margin-bottom:16px}
.logo h1{margin:0;font:700 clamp(40px,13.5vw,54px)/1 Unbounded,Inter,sans-serif;letter-spacing:.06em}
.logo p{margin:12px 0 0;font:600 12px/1 Inter;letter-spacing:.34em;text-transform:uppercase}
.logo .dv{display:block;margin-top:8px;font:700 32px/1.3 'Noto Sans Thaana',sans-serif}
.logo .rrow{display:flex;justify-content:center;gap:7px;margin-top:14px;filter:drop-shadow(0 2px 6px rgba(0,30,60,.45))}.logo .rrow svg{width:17px;height:19px;display:block}
/* home: the menu card, and the sponsor card tidily under it (sponsors never appear on the board during play) */
.hstack{position:absolute;left:12px;right:12px;bottom:calc(var(--sab) + 14px);z-index:5;display:grid;gap:10px;max-width:520px;margin:0 auto}
#home .menu{border-radius:28px;padding:12px;display:grid;gap:9px}
#spbox.dgs-box{height:88px;border-radius:22px}
#spbox:empty{display:none}
/* game over: a quiet "presented by" line */
.presby{display:flex;align-items:center;justify-content:center;gap:8px;margin:12px 0 0;min-height:44px;font:600 12px/1.3 Inter;color:var(--muted);text-decoration:none}
.presby .dgs-lg{width:28px;height:28px;border-radius:8px;font-size:11px;box-shadow:0 0 0 1px var(--line)}
.presby b{color:var(--ink)}
.modes{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.mode{grid-column:span 2;min-height:66px;border-radius:16px;background:rgba(13,27,36,.06);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;text-align:center;padding:6px 4px}
.mode:nth-child(4),.mode:nth-child(5){grid-column:span 3;flex-direction:row;gap:9px;min-height:52px}
.mode:nth-child(4) span,.mode:nth-child(5) span{text-align:left}
.mode b{display:block;font:700 12.5px/1.15 Inter;letter-spacing:-.01em}
.mode small{display:block;font:500 11px/1.2 Inter;color:var(--muted)}
.mode svg{width:30px;height:24px;flex:none}
.mode[aria-checked="true"]{background:var(--ink);color:#fff}.mode[aria-checked="true"] small{color:#b8c7d1}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;min-height:52px;border-radius:17px;background:var(--ink);color:#fff;font:700 16px/1.1 Inter;letter-spacing:-.01em;padding:0 16px;width:100%;transition:transform .15s,opacity .2s}
.btn:active{transform:scale(.98)}
.btn svg{width:20px;height:20px;flex:none}
.btn.alt{background:rgba(13,27,36,.08);color:var(--ink)}
.btn.red{background:var(--red)}
.btn.sm{min-height:44px;font-size:14px;border-radius:14px}
.btn:disabled{opacity:.42}
.btn .col{display:flex;flex-direction:column;align-items:center;gap:2px}
.btn small{font:600 11px/1 Inter;opacity:.75}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
/* home menu, same order in every game: Quick Match (big), Play with Friends, vs Computer (small), How to play */
#home .menu .qm,#home .menu .fr{justify-content:flex-start;gap:12px;text-align:left}
#home .menu .qm{min-height:76px;padding:10px 14px 10px 12px;border-radius:20px}
#home .menu .fr{min-height:56px;padding:6px 14px 6px 12px;background:rgba(13,27,36,.1)}
.qm .gi,.fr .gi{flex:none;display:grid;place-items:center}
.qm .gi{width:42px;height:42px;border-radius:13px;background:rgba(255,255,255,.12)}
.fr .gi{width:34px;height:34px;border-radius:11px;background:rgba(13,27,36,.08)}
.qm .gi svg{width:21px;height:21px}.fr .gi svg{width:19px;height:19px}
.qm .qt,.fr .qt{display:flex;flex-direction:column;align-items:flex-start;gap:3px;min-width:0}
.qm b{font:700 17px/1.1 Unbounded,Inter,sans-serif;letter-spacing:.01em}
.qm small,.fr small{font:500 12px/1.2 Inter;opacity:.78}
.fr b{font:700 15px/1.15 Inter;letter-spacing:-.01em}
.qm .lv{display:inline-flex;align-items:center;gap:6px;margin-top:2px;font:700 11px/1.2 Inter;color:#fff}
.qm .lv i{width:7px;height:7px;border-radius:50%;background:#ff4b4b;box-shadow:0 0 0 3px rgba(255,75,75,.25);flex:none}
.qm .lv .first{font-weight:600;opacity:.82}
.vc{display:flex;gap:8px}.vc .btn{flex:1;min-width:0}#playBtn{white-space:nowrap}.vc.two .btn{padding:0 8px}.vc.two #playBtn svg{display:none}
.btn.ghost{background:transparent;color:#3a4852;box-shadow:inset 0 0 0 1px rgba(13,27,36,.16);min-height:46px;font-size:14.5px;border-radius:15px}
.btn.ghost svg{width:18px;height:18px}
.lnk{display:block;justify-self:center;min-height:40px;padding:0 16px;font:600 13px/40px Inter;color:var(--muted);text-decoration:underline;text-decoration-color:rgba(13,27,36,.25);text-underline-offset:3px}
@media (max-height:620px){#home .menu .qm{min-height:66px}#home .menu .fr{min-height:50px}.btn.ghost{min-height:42px}.lnk{min-height:34px;line-height:34px}}
/* the game-mode picker lives in the vs Computer sheet */
#sheet .modes{margin-top:4px}
/* ---------------- game HUD ---------------- */
#ov{position:absolute;inset:0;width:100%;height:100%;z-index:1;touch-action:none;display:block;overflow:visible}
#ov text{font-family:Inter,system-ui,sans-serif}
.tok,.pc3,.hbl{transform:scale(var(--ts));transform-box:fill-box;transform-origin:center}
.htop{position:absolute;left:10px;right:10px;top:calc(var(--sat) + 8px);display:flex;gap:8px;align-items:center;z-index:6}
.turn{flex:1;min-width:0;min-height:44px;border-radius:14px;display:flex;align-items:center;gap:8px;padding:5px 12px 5px 8px;font:600 13px/1.25 Inter;position:relative;overflow:hidden}
.turn .dot{flex:none;width:28px;height:28px;border-radius:50%;overflow:hidden;box-shadow:0 0 0 2px var(--c,#fff)}
.turn .dot svg{width:28px;height:28px;display:block}
.turn .tx{min-width:0}
.turn .tx b{font-weight:800}
.turn .tmr{position:absolute;left:0;bottom:0;height:3px;background:var(--red);transform-origin:left;width:100%}
#pls{position:absolute;left:10px;right:10px;top:calc(var(--sat) + 60px);display:grid;gap:6px;z-index:5}
.pc{position:relative;height:58px;border-radius:14px;padding:6px 7px 0 10px;overflow:hidden;text-align:left;display:block;width:100%}
.pc:before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--c)}
.pc .av{position:relative;width:26px;height:26px;display:block}
.pc .av svg{width:26px;height:26px;display:block}
.pc .nc{position:absolute;left:25px;top:17px;min-width:17px;height:15px;padding:0 4px;border-radius:8px;background:var(--ink);color:#fff;font:700 9.5px/15px Inter;text-align:center;box-shadow:0 0 0 1.5px #fff}
.pc b{display:block;font:700 12px/1 Inter;white-space:nowrap;overflow:hidden;letter-spacing:-.01em;margin-top:5px}
.pc b.wrap{white-space:normal;overflow-wrap:anywhere;line-height:1;margin-top:1px}
.pc i{position:absolute;right:7px;top:6px;font:800 19px/1 Inter;font-style:normal;letter-spacing:-.03em}
.pc .awd{position:absolute;right:6px;top:29px;display:flex;gap:2px}
.pc .awd svg{width:13px;height:13px}
.pc.on{box-shadow:0 0 0 2px var(--ink),0 10px 30px -10px rgba(0,30,50,.45)}
.pc.on:after{content:"";position:absolute;right:0;bottom:0;left:4px;height:3px;background:var(--c)}
#pls.cmp{display:flex;justify-content:space-between;gap:4px;padding:5px 6px;border-radius:16px}
.seat{position:relative;flex:1;min-width:0;height:50px;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding-top:3px}
.seat .av{width:34px;height:34px;border-radius:50%;box-shadow:0 0 0 2px var(--c);display:block;overflow:hidden}
.seat .av svg{width:34px;height:34px;display:block}
.seat i{margin-top:2px;font:800 12px/1 Inter;font-style:normal}
.seat .nc{position:absolute;right:calc(50% - 24px);top:0;min-width:15px;height:14px;padding:0 3px;border-radius:7px;background:var(--ink);color:#fff;font:700 9px/14px Inter;text-align:center;box-shadow:0 0 0 1.5px #fff}
.seat.on .av{box-shadow:0 0 0 2px var(--c),0 0 0 4px var(--ink)}
#tele{position:absolute;left:14px;right:14px;z-index:4}
#mm{position:absolute;right:10px;z-index:5;width:96px;height:96px;border-radius:16px;padding:4px;touch-action:none}
#mm canvas{width:88px;height:88px;display:block;border-radius:12px}
#mm small{position:absolute;left:0;right:0;bottom:-16px;text-align:center;font:600 9.5px/1 Inter;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.7);white-space:nowrap}
#keyBtn{position:absolute;left:6px;z-index:5;width:44px;height:44px;display:grid;place-items:center}
#keyBtn span{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font:800 15px/1 Inter;color:var(--ink)}
#keyBtn[aria-expanded="true"] span{background:var(--ink);color:#fff}
#keyBtn.nudge span{animation:nudge 2.4s ease-in-out infinite}
@keyframes nudge{50%{box-shadow:0 0 0 .5px rgba(0,0,0,.08),0 0 0 6px rgba(255,255,255,.4)}}
#bot{position:absolute;left:10px;right:10px;bottom:calc(var(--sab) + 12px);z-index:6;display:grid;gap:10px;max-width:560px;margin:0 auto}
#acts{display:flex;gap:8px}
#acts.solo .ab.dice:disabled{opacity:.9}
#acts.solo .ab.dice small{font-size:11px;font-weight:600;opacity:.75;margin-bottom:2px}
#acts.solo .ab.dice.go small{font-size:15px;font-weight:800;opacity:1;margin:0 0 0 4px}
.ab{flex:1;min-width:0;height:52px;border-radius:16px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font:700 11px/1 Inter;color:var(--ink);transition:transform .15s,opacity .2s}
.ab svg{width:22px;height:22px}
.ab:active{transform:scale(.96)}
.ab:disabled{opacity:.45}
.ab.go{background:var(--ink);color:#fff;box-shadow:0 10px 24px -8px rgba(0,0,0,.6)}
.ab.dice{flex:1.25;flex-direction:row;gap:5px;font:800 20px/1 Inter}
.ab.dice .dd{display:flex;gap:4px}
.ab.dice .dd svg{width:24px;height:24px}
.ab.dice small{display:block;font:700 10px/1 Inter;letter-spacing:.02em}
.ab.dice.go .dd svg rect{stroke:rgba(255,255,255,.3)}
.ab.tumble .dd svg{animation:tumble .7s var(--out)}
@keyframes tumble{0%{transform:translateY(-26px) rotate(-240deg) scale(.6)}60%{transform:translateY(3px) rotate(20deg) scale(1.08)}100%{transform:none}}
#hand{height:78px;border-radius:22px;display:grid;grid-template-columns:repeat(5,1fr) 54px;gap:2px;padding:5px}
.rs{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;min-width:0}
.rs .sw{position:relative;width:40px;height:40px;border-radius:50%;background-size:cover;background-position:center;box-shadow:0 0 0 2px #fff,0 3px 8px -3px rgba(0,30,50,.45);transition:opacity .25s}
.rs .sw svg{position:absolute;inset:0;width:40px;height:40px}
.rs small{font:600 10px/1 Inter;color:var(--muted);margin-top:6px;white-space:nowrap}
.rs em{position:absolute;right:calc(50% - 27px);top:3px;min-width:19px;height:19px;padding:0 5px;border-radius:10px;background:var(--ink);color:#fff;font:700 11px/19px Inter;font-style:normal;text-align:center;box-shadow:0 0 0 1.5px #fff;transition:transform .3s var(--spring)}
.rs.z em{display:none}
.rs.z .sw{opacity:.5}
.rs.bump em{transform:scale(1.35)}
.rj{border-radius:15px;display:flex;flex-direction:column;align-items:center;justify-content:center;background:var(--ink);color:#fff;font:800 19px/1 Inter;min-height:44px}
.rj small{font:600 8.5px/1.15 Inter;margin-top:4px;text-align:center;opacity:.8}
.rj.new{box-shadow:0 0 0 3px var(--gold)}
#prompt{border-radius:20px;padding:10px 10px 10px 14px;display:flex;align-items:center;gap:10px;min-height:64px}
#prompt .pt{flex:1;min-width:0;font:600 13px/1.3 Inter}
#prompt .pt b{display:block;font:800 15px/1.2 Inter;letter-spacing:-.01em}
#prompt .pb{display:flex;gap:6px;flex:none}
#prompt .btn{width:auto;min-height:44px;font-size:14px;padding:0 14px;border-radius:14px}
/* toasts + banner */
#toasts{position:fixed;left:50%;transform:translateX(-50%);top:calc(var(--sat) + 128px);z-index:40;display:flex;flex-direction:column;align-items:center;gap:6px;pointer-events:none;width:calc(100% - 24px);max-width:420px}
.toast{padding:9px 14px;border-radius:14px;font:600 13px/1.35 Inter;text-align:center;animation:tin .35s var(--out);max-width:100%}
.toast.dark{background:rgba(13,27,36,.9);color:#fff}
@keyframes tin{from{opacity:0;transform:translateY(-8px) scale(.96)}}
#banner{position:fixed;left:10px;right:10px;top:calc(var(--sat) + 126px);z-index:45;max-width:460px;margin:0 auto}
.ban{border-radius:20px;padding:10px;display:grid;gap:8px;animation:tin .35s var(--out);position:relative;overflow:hidden}
.ban .bt{display:flex;align-items:center;gap:10px;font:600 13px/1.35 Inter}
.ban .bt .av svg{width:38px;height:38px;display:block}
.ban .bb{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.ban .tmr{position:absolute;left:0;top:0;height:3px;background:var(--red);transform-origin:left;width:100%}
.rr{display:inline-flex;align-items:center;gap:2px;vertical-align:middle;white-space:nowrap}
.rr i{display:inline-block;width:18px;height:18px;border-radius:50%;background-size:cover;box-shadow:0 0 0 1.5px #fff,0 1px 3px rgba(0,0,0,.35);vertical-align:-4px}
.rr b{font-weight:800;margin-right:3px}
/* sheets */
#dim{position:fixed;inset:0;z-index:30;background:rgba(3,18,30,.42);animation:fd .25s}
@keyframes fd{from{opacity:0}}
#sheet{position:fixed;left:0;right:0;bottom:0;z-index:31;max-height:88vh;max-height:88dvh;overflow:auto;overscroll-behavior:contain;border-radius:26px 26px 0 0;background:var(--glass2);-webkit-backdrop-filter:blur(20px) saturate(1.5);backdrop-filter:blur(20px) saturate(1.5);box-shadow:0 -10px 40px -10px rgba(0,20,40,.5);padding:8px 16px calc(var(--sab) + 18px);animation:sup .35s var(--out);max-width:560px;margin:0 auto;-webkit-user-select:none;user-select:none}
@keyframes sup{from{transform:translateY(40px);opacity:0}}
.grab{width:40px;height:5px;border-radius:3px;background:rgba(13,27,36,.18);margin:2px auto 8px}
.sh{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:2px 0 10px}
.sh h2{margin:0;font:800 20px/1.2 Inter;letter-spacing:-.02em}
.sh .x{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;background:rgba(13,27,36,.06);flex:none}
.sh .x svg{width:18px;height:18px}
#sheet h3{margin:14px 0 8px;font:800 12px/1.2 Inter;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
#sheet p{margin:6px 0;color:#2c3c46}
.seg{display:flex;gap:5px;background:rgba(13,27,36,.06);padding:4px;border-radius:15px}
.seg button{flex:1;min-height:44px;border-radius:11px;font:700 14px/1.1 Inter;color:var(--ink);padding:0 6px}
.seg button[aria-checked="true"]{background:var(--ink);color:#fff;box-shadow:0 4px 10px -4px rgba(0,0,0,.4)}
.tg{display:flex;align-items:center;gap:12px;min-height:56px;padding:8px 0;border-bottom:1px solid var(--line);width:100%;text-align:left}
.tg:last-child{border-bottom:0}
.tg .tt{flex:1;min-width:0}

.deal .arr{color:var(--muted)}.deal .arr svg{width:22px;height:22px;display:block}
.deal .open{font:700 13px/1.3 Inter;color:var(--muted);padding:12px 4px;border:2px dashed #cfd8de;border-radius:12px}
.btn.grn{background:#1f9d57}.btn.warn{background:#fff3dc;color:#7a4a00}
.ban2{position:relative;overflow:hidden;border-radius:20px;padding:12px;background:rgba(255,255,255,.96);box-shadow:0 0 0 .5px rgba(0,0,0,.08),0 18px 40px -12px rgba(0,30,50,.55)}
.ban2.enter{animation:tin .35s var(--out)}
.ban2 .tmr{position:absolute;left:0;top:0;height:4px;width:100%;background:var(--red);transform-origin:left}
.ban2 .bh{display:flex;align-items:center;gap:10px}
.ban2 .bh .av svg{width:40px;height:40px;display:block;border-radius:50%}
.ban2 .bh .t{flex:1;min-width:0;font:600 14px/1.3 Inter}.ban2 .bh .t b{font-weight:800}.ban2 .muted{color:var(--muted)}
.ban2 .secs{flex:none;font:800 12px/1 Inter;color:var(--muted);background:rgba(13,27,36,.06);border-radius:99px;padding:6px 8px}
.ban2 .deal{margin:8px 0}
.ban2 .bb3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px}
.ban2 .btn{min-height:48px;font-size:14.5px;border-radius:14px;padding:0 6px;font-weight:800}
.ban2 .btn small{display:block;margin-top:2px}
.others{display:flex;flex-wrap:wrap;gap:5px;margin-top:9px;font:600 11.5px/1 Inter;color:var(--muted);align-items:center}
.omini{display:inline-flex;align-items:center;gap:5px;padding:3px 8px 3px 3px;border-radius:99px;background:rgba(13,27,36,.06);white-space:nowrap}
.omini .av svg{width:18px;height:18px;display:block;border-radius:50%}
.bnote{margin-top:8px;font:700 13px/1.4 Inter;text-align:center;color:var(--ink)}
.bnote .muted{font-weight:600}
.quick{display:flex;flex-wrap:wrap;gap:6px}
.qk{display:inline-flex;align-items:center;gap:6px;padding:5px 10px 5px 5px;border-radius:99px;background:rgba(13,27,36,.05);font:700 13px/1 Inter;border:2px solid transparent;min-height:44px}
.qk.on{border-color:#1f9d57;background:#e6f5ec}
#mdim{position:fixed;inset:0;z-index:32;background:rgba(3,18,30,.3);animation:fd .2s}
#modal{position:fixed;left:12px;right:12px;top:50%;z-index:33;max-width:420px;margin:0 auto;background:#fff;border-radius:24px;padding:16px;box-shadow:0 30px 60px -20px rgba(0,0,0,.6);transform:translateY(-50%);animation:mup .3s var(--spring)}
@keyframes mup{from{transform:translateY(-44%) scale(.94);opacity:0}}
#modal h3{font:800 19px/1.25 Inter;text-align:center;margin:0 0 4px;display:flex;align-items:center;justify-content:center;gap:8px}
#modal h3 .av svg{width:30px;height:30px;display:block;border-radius:50%}
.tlog{list-style:none;margin:0;padding:0}
.tlog li{display:flex;gap:9px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--line);font:600 13.5px/1.6 Inter}
.tlog li:last-child{border-bottom:0}
.tlog .av svg{width:28px;height:28px;display:block;border-radius:50%;margin-top:1px}
.tlog small{display:block;color:var(--muted);font:600 11.5px/1.2 Inter;margin-top:2px}
.tbk{flex:none;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:var(--ink);color:#fff}.tbk svg{width:16px;height:16px}
.askh .tbk{width:40px;height:40px}.askh .tbk svg{width:22px;height:22px}
#logBtn{position:absolute;left:6px;z-index:5;width:44px;height:44px;display:grid;place-items:center}
#logBtn span{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;color:var(--ink)}#logBtn svg{width:16px;height:16px}
/* thrown dice (shared/dice.js): over the visible board (layoutView sets top / height), under the bars */
#dtray{position:absolute;left:0;right:0;top:0;height:0;z-index:5;pointer-events:none}   /* the dice tray lies over the board: it must never take a tap or a pinch (shared/dice.js only adds its own pointer-events:none on the first roll, and setup placement comes before any roll) */

.dgnslot .dgn-dock{gap:6px}

.dgnslot .dgn-vw{background:var(--glass);color:var(--ink);box-shadow:0 0 0 .5px rgba(0,0,0,.08)}
@media (max-width:360px){.dgnslot .dgn-vw{display:none!important}}
/* Quick Match computer seats: a small robot tag on the avatar's top-left corner */
.cpt{position:absolute;z-index:2;width:15px;height:15px;border-radius:50%;background:#fff;color:var(--ink);display:grid;place-items:center;box-shadow:0 1px 3px rgba(0,30,50,.35);pointer-events:none}
.cpt svg{width:10px;height:10px}
.pc .cpt{left:3px;top:2px}

<script>
'use strict';
/* =====================================================================
   ATOLLS CORE: board generation, rules engine and computer players.
   Pure JS, no DOM. The whole game state G is plain JSON (save / network).
     E.create(opts)        -> G           (new game, seeded)
     E.act(G, pid, action) -> null | error (host-authoritative; mutates G)
     E.drain()             -> events for the UI to animate
     E.actors()            -> player ids expected to act now
   Deterministic: every random draw uses the seeded generator in G.rs.
   AI.next(pid) -> the next action for a computer player (reads G only).
   ===================================================================== */
const S3=Math.sqrt(3);
const RES=['wood','brick','sheep','wheat','ore'];
const RNAME={wood:'Wood',brick:'Brick',sheep:'Sheep',wheat:'Wheat',ore:'Ore',sand:'Sandbank',sea:'Open sea'};
const TCODE={wood:0,brick:1,sheep:2,wheat:3,ore:4,sand:5,sea:6};
const pips=n=>n?6-Math.abs(7-n):0;

/* Beginner map: our own fixed 19-tile layout (fair numbers, no 6/8 or 2/12 neighbours) */
const BEGIN={t:['wheat','sheep','wood','brick','ore','wheat','sheep','wood','sheep','sand','brick','wheat','ore','wood','wheat','ore','sheep','brick','wood'],
 n:[9,6,4,10,5,10,9,8,11,0,3,4,3,5,11,8,12,6,2],harb:['any','sheep','any','ore','wheat','any','brick','wood','any']};

function mulberry(seed){let a=seed|0;return function(){a=(a+0x6D2B79F5)|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function shuffleWith(a,rnd){for(let i=a.length-1;i>0;i--){const j=(rnd()*(i+1))|0;const x=a[i];a[i]=a[j];a[j]=x;}return a;}
const hkey=(q,r)=>q+','+r;
const bag=o=>{const a=[];Object.keys(o).forEach(k=>{for(let i=0;i<o[k];i++)a.push(k);});return a;};
const isRes=t=>TCODE[t]!=null&&TCODE[t]<5;
const hexDist=(q,r)=>Math.max(Math.abs(q),Math.abs(r),Math.abs(q+r));

/* ---------------------------------------------------------------- map generation */
function rowsCells(rows){const mid=(rows.length-1)/2,maxN=Math.max(...rows),x0=((maxN-1)%2)*0.5,out=[];
 rows.forEach((n,i)=>{const r=i-mid,qs=Math.round(x0-(n-1)/2-r/2);for(let j=0;j<n;j++)out.push({q:qs+j,r,t:'sand',n:0,isl:0,fog:false});});return out;}
function ringCells(R){const out=[];let q=DIRS[4][0]*R,r=DIRS[4][1]*R;for(let i=0;i<6;i++)for(let j=0;j<R;j++){out.push([q,r]);q+=DIRS[i][0];r+=DIRS[i][1];}return out;}
function nbList(cells){const idx={};cells.forEach((c,i)=>idx[hkey(c.q,c.r)]=i);return cells.map(c=>DIRS.map(d=>idx[hkey(c.q+d[0],c.r+d[1])]).filter(j=>j!=null));}
const isRed=n=>n===6||n===8,isExt=n=>n===2||n===12;
function numClash(a,b){return !!(a&&b&&(a===b||(isRed(a)&&isRed(b))||(isExt(a)&&isExt(b))));}
/* place number tokens: reds first, each on a random tile that does not clash with its neighbours */
function placeNums(cells,idxs,nums,nb,rnd){idxs.forEach(i=>cells[i].n=0);const free=idxs.slice();
 const order=shuffleWith(nums.slice(),rnd).sort((a,b)=>pips(b)-pips(a));
 for(const n of order){const ok=free.filter(i=>nb[i].every(j=>!numClash(n,cells[j].n)));if(!ok.length)return false;const i=ok[(rnd()*ok.length)|0];cells[i].n=n;free.splice(free.indexOf(i),1);}return true;}
function fairShare(cells){const tot={},cnt={},red={},good={};let T=0,C=0,R=0;
 cells.forEach(c=>{if(!c.n||!isRes(c.t))return;const p=pips(c.n);tot[c.t]=(tot[c.t]||0)+p;cnt[c.t]=(cnt[c.t]||0)+1;T+=p;C++;if(p===5){red[c.t]=(red[c.t]||0)+1;R++;}if(p>=4)good[c.t]=1;});
 const mean=T/C,maxRed=Math.ceil(R/5);
 for(const r of RES){if(!cnt[r])continue;if(Math.abs(tot[r]/cnt[r]-mean)>0.72)return false;if((red[r]||0)>maxRed)return false;if(cnt[r]>=3&&!good[r])return false;}return true;}
/* groups: [{idx:[cell indices], tiles:[types], nums:[numbers]}] */
function fillGroups(cells,groups,rnd,fair){const nb=nbList(cells);
 for(let at=0;at<4000;at++){
  groups.forEach(g=>{const t=shuffleWith(g.tiles.slice(),rnd);g.idx.forEach((ci,k)=>{cells[ci].t=t[k];cells[ci].n=0;});});
  if(!fair){groups.forEach(g=>{const ns=shuffleWith(g.nums.slice(),rnd);let q=0;g.idx.forEach(ci=>{if(isRes(cells[ci].t))cells[ci].n=ns[q++];});});return;}
  let ok=true;for(const g of groups){if(!placeNums(cells,g.idx.filter(ci=>isRes(cells[ci].t)),g.nums,nb,rnd)){ok=false;break;}}
  if(!ok)continue;if(at<3500&&!fairShare(cells))continue;return;}
 groups.forEach(g=>{const ns=g.nums.slice();let q=0;g.idx.forEach(ci=>{if(isRes(cells[ci].t))cells[ci].n=ns[q++];});});}
function cornerKey(c,k){return (2*c.q+c.r+CX[k])+','+(3*c.r+CY[k]);}
/* candidate harbour edges: land cell edge whose neighbour is sea / off board. Sorted around the centre. */
function coastEdges(cells,isLand){const idx={};cells.forEach((c,i)=>idx[hkey(c.q,c.r)]=i);const out=[];let cx=0,cy=0,n=0;
 cells.forEach(c=>{if(isLand(c)){cx+=S3*(c.q+c.r/2);cy+=1.5*c.r;n++;}});cx/=n;cy/=n;
 cells.forEach((c,i)=>{if(!isLand(c))return;for(let k=0;k<6;k++){const j=idx[hkey(c.q+DIRS[k][0],c.r+DIRS[k][1])];if(j!=null&&isLand(cells[j]))continue;
  const a=k*Math.PI/3,mx=S3*(c.q+c.r/2)+Math.cos(a)*S3/2,my=1.5*c.r+Math.sin(a)*S3/2;out.push({h:i,e:k,ang:Math.atan2(my-cy,mx-cx),v:[cornerKey(c,k),cornerKey(c,(k+1)%6)]});}});
 out.sort((a,b)=>a.ang-b.ang);return out;}
function pickHarbours(cand,types,off,used){const n=types.length,P=cand.length,step=P/n,out=[];used=used||new Set();
 for(let i=0;i<n;i++){const base=Math.floor(off*step+i*step);for(const d of [0,1,-1,2,-2]){const c=cand[((base+d)%P+P)%P];if(c.v.some(v=>used.has(v)))continue;
   c.v.forEach(v=>used.add(v));out.push({h:c.h,e:c.e,type:types[i]});break;}}
 return out;}
function genMap(mode,opt,seed){const M=MODES[mode],rnd=mulberry((seed^0x9E3779B9)|0);
 if(M.hop)return genHop(M,opt,rnd);
 const cells=rowsCells(M.rows);let harb;
 if(opt.beginner&&cells.length===19){cells.forEach((c,i)=>{c.t=BEGIN.t[i];c.n=BEGIN.n[i];});harb=pickHarbours(coastEdges(cells,()=>true),BEGIN.harb,0.5);}
 else{fillGroups(cells,[{idx:cells.map((_,i)=>i),tiles:bag(M.tiles),nums:M.nums}],rnd,opt.fair);harb=pickHarbours(coastEdges(cells,()=>true),shuffleWith(M.harb.slice(),rnd),rnd());}
 return {hexes:cells,harb,home:0,kind:'rows'};}
function genHop(M,opt,rnd){const R=4,cells=[];
 for(let q=-R;q<=R;q++)for(let r=-R;r<=R;r++)if(Math.abs(q+r)<=R)cells.push({q,r,t:'sea',n:0,isl:-1,fog:false});
 const idx={};cells.forEach((c,i)=>idx[hkey(c.q,c.r)]=i);const at=(q,r)=>cells[idx[hkey(q,r)]];
 // home island: radius 2 with two bays cut out of the rim
 const home=cells.filter(c=>hexDist(c.q,c.r)<=2);home.forEach(c=>{c.t='land';c.isl=0;});
 const rim=shuffleWith(home.filter(c=>hexDist(c.q,c.r)===2),rnd);const cut=[];
 for(const c of rim){if(cut.length>=2)break;if(cut.some(d=>hexDist(c.q-d.q,c.r-d.r)<=2))continue;cut.push(c);}

 // outer islands on ring 4, separated by open sea
 const ring=ringCells(4),sizes=shuffleWith([3,3,2,2,2],rnd),gaps=[2,2,2,2,2];for(let k=0;k<2;k++)gaps[(rnd()*5)|0]++;
 let pos=(rnd()*24)|0;const islands=[];
 sizes.forEach((sz,i)=>{const mem=[];for(let j=0;j<sz;j++){const p=ring[(pos+j)%24];const c=at(p[0],p[1]);c.t='land';c.isl=i+1;mem.push(c);}islands.push(mem);pos+=sz+gaps[i];});
 const hidden=shuffleWith([0,1,2,3,4],rnd).slice(0,2);hidden.forEach(i=>islands[i].forEach(c=>c.fog=true));
 const homeIdx=cells.map((c,i)=>c.isl===0?i:-1).filter(i=>i>=0),outIdx=cells.map((c,i)=>c.isl>0?i:-1).filter(i=>i>=0);
 fillGroups(cells,[{idx:homeIdx,tiles:bag({wood:4,brick:3,sheep:3,wheat:4,ore:2,sand:1}),nums:[2,3,4,4,5,5,6,6,8,8,9,9,10,10,11,12]},
  {idx:outIdx,tiles:bag({wood:2,brick:2,sheep:3,wheat:2,ore:3}),nums:[3,4,5,6,8,9,10,11,3,5,9,11]}],rnd,opt.fair);
 // harbours: six on the home coast, two on visible outer islands
 const used=new Set();
 const hr=shuffleWith(['wood','brick','sheep','wheat','ore'],rnd).slice(0,3);
 const harb=pickHarbours(coastEdges(cells,c=>c.isl===0),shuffleWith(['any','any','any'].concat(hr),rnd),rnd(),used);
 const vis=shuffleWith(islands.map((m,i)=>i).filter(i=>!hidden.includes(i)),rnd).slice(0,2);
 vis.forEach(i=>{const cand=shuffleWith(coastEdges(cells,c=>c.isl===i+1),rnd);for(const c of cand){if(c.v.some(v=>used.has(v)))continue;c.v.forEach(v=>used.add(v));harb.push({h:c.h,e:c.e,type:RES[(rnd()*5)|0]});break;}});
 return {hexes:cells,harb,home:0,kind:'hop'};}

/* ---------------------------------------------------------------- graph (derived from map, never stored) */
function buildGraph(map){const H=map.hexes,V=[],Ed=[],vmap={},emap={},hidx={};
 H.forEach((h,i)=>hidx[hkey(h.q,h.r)]=i);const hv=H.map(()=>[]),he=H.map(()=>[]),hn=H.map(()=>[]);
 H.forEach((h,i)=>{for(let k=0;k<6;k++){const X=2*h.q+h.r+CX[k],Y=3*h.r+CY[k],key=X+','+Y;let v=vmap[key];
   if(v==null){v=vmap[key]=V.length;V.push({x:X*S3/2,y:Y/2,hexes:[],adj:[],edges:[]});}V[v].hexes.push(i);hv[i].push(v);}
  for(let k=0;k<6;k++){const a=hv[i][k],b=hv[i][(k+1)%6],lo=Math.min(a,b),hi=Math.max(a,b),key=lo+'_'+hi;let e=emap[key];
   if(e==null){e=emap[key]=Ed.length;Ed.push({a:lo,b:hi,hexes:[],x:(V[a].x+V[b].x)/2,y:(V[a].y+V[b].y)/2});V[a].edges.push(e);V[b].edges.push(e);V[a].adj.push(b);V[b].adj.push(a);}
   Ed[e].hexes.push(i);he[i].push(e);const j=hidx[hkey(h.q+DIRS[k][0],h.r+DIRS[k][1])];hn[i].push(j==null?-1:j);}});
 const land=i=>H[i].t!=='sea';
 V.forEach(v=>{v.land=v.hexes.some(land);const l=v.hexes.find(land);v.isl=l==null?-1:H[l].isl;});
 Ed.forEach(e=>{e.land=e.hexes.some(land);e.sea=map.kind==='hop'&&(e.hexes.some(i=>!land(i))||e.hexes.length<2);});
 const vh=V.map(()=>null);map.harb.forEach((hb,k)=>{const e=Ed[he[hb.h][hb.e]];vh[e.a]=k;vh[e.b]=k;});
 const hc=H.map(h=>({x:S3*(h.q+h.r/2),y:1.5*h.r}));
 return {V,E:Ed,hv,he,hn,vh,hidx,hc};}

/* ================================================================ ENGINE */
const E=(()=>{
 let G=null,GR=null,GRmap=null,EV=[];
 /* every event is also kept in a short numbered log, so online guests can replay what they missed */
 let LOG=[],LID=0;
 const emit=e=>{EV.push(e);LOG.push([++LID,e]);if(LOG.length>150)LOG.shift();};
 const Mo=()=>MODES[G.mode];
 const HOP=()=>!!MODES[G.mode].hop;
 function rnd(){let a=G.rs=(G.rs+0x6D2B79F5)|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;}
 function gr(){if(GRmap!==G.map){GR=buildGraph(G.map);GRmap=G.map;}return GR;}
 function use(g){if(g&&g!==G)G=g;if(G)gr();return G;}
 const P=p=>G.players[p];
 const hand=p=>G.players[p].hand;
 const cnt=h=>RES.reduce((s,r)=>s+(h[r]|0),0);
 const has=(p,c)=>RES.every(r=>(hand(p)[r]|0)>=(c[r]|0));
 function pay(p,c){RES.forEach(r=>{const n=c[r]|0;if(n){hand(p)[r]-=n;G.bank[r]+=n;}});}
 function gain(p,r,n){n=Math.max(0,Math.min(n,G.bank[r]));hand(p)[r]+=n;G.bank[r]-=n;return n;}
 const nm=p=>G.players[p].name;
 function log(s){G.log.push(s);if(G.log.length>80)G.log.shift();emit({t:'log',s});}
 function cur(){return G.phase==='setup'?G.setup.order[G.setup.i]:G.turn;}
 const sbpP=()=>G.sbp?G.sbp.q[G.sbp.i]:-1;
 /* ---------- points ---------- */
 function bldPts(p){let s=0;for(const b of G.vb)if(b&&b.p===p)s+=b.c?2:1;return s;}
 const discPts=()=>G.opts.duo?2:1;   // a Discovery is worth 2 in 2-player Island Hopping (older saves have no duo flag: 1)
 function pubPts(p){let s=bldPts(p);if(G.longest.p===p)s+=2;if(G.army.p===p)s+=2;if(G.hm.p===p)s+=2;s+=P(p).disc.length*discPts();return s;}
 function vpCards(p){return P(p).cards.filter(c=>c.k==='vp').length;}
 function pts(p){return pubPts(p)+vpCards(p);}
 /* ---------- legality ---------- */
 const fogAt=v=>GR.V[v].hexes.some(h=>G.map.hexes[h].fog);
 function canVillage(p,v,setup){const V=GR.V[v];if(!V||!V.land||G.vb[v])return false;if(fogAt(v))return false;
  for(const u of V.adj)if(G.vb[u])return false;
  if(setup)return !HOP()||V.isl===G.map.home;
  for(const e of V.edges){const x=G.eb[e];if(x&&x.p===p)return true;}return false;}
 function pirateSea(){return G.pirate>=0&&G.map.hexes[G.pirate].t==='sea';}
 function canRoute(p,e,kind){const ed=GR.E[e];if(!ed||G.eb[e])return false;
  if(kind==='l'){if(!ed.land)return false;}else{if(!HOP()||!ed.sea)return false;if(pirateSea()&&ed.hexes.includes(G.pirate))return false;}
  for(const v of [ed.a,ed.b]){const b=G.vb[v];if(b){if(b.p===p)return true;continue;}
   for(const x of GR.V[v].edges){if(x===e)continue;const o=G.eb[x];if(o&&o.p===p&&o.k===kind)return true;}}
  return false;}
 function routeSpots(p,kind){const out=[];for(let e=0;e<GR.E.length;e++)if(canRoute(p,e,kind))out.push(e);return out;}
 function anyRouteSpot(p){const L=P(p).left;return (L.route>0&&routeSpots(p,'l').length>0)||(HOP()&&L.sea>0&&routeSpots(p,'s').length>0);}
 function villageSpots(p){const out=[];for(let v=0;v<GR.V.length;v++)if(canVillage(p,v,false))out.push(v);return out;}
 function setupSpots(p){const s=G.setup;if(s.need==='v'){const o=[];for(let v=0;v<GR.V.length;v++)if(canVillage(p,v,true))o.push(v);return o;}
  return GR.V[s.lastV].edges.filter(e=>!G.eb[e]&&GR.E[e].land);}
 function capitalSpots(p){const o=[];G.vb.forEach((b,v)=>{if(b&&b.p===p&&!b.c)o.push(v);});return o;}
 function protectedP(o){return G.opts.friendly&&pubPts(o)<=2;}
 function touching(h){const H=G.map.hexes[h],s=new Set();
  if(H.t==='sea'){for(const e of GR.he[h]){const x=G.eb[e];if(x&&x.k==='s')s.add(x.p);}}
  else for(const v of GR.hv[h]){const b=G.vb[v];if(b)s.add(b.p);}return s;}
 function pirateSpots(p){const out=[];G.map.hexes.forEach((H,h)=>{if(h===G.pirate||H.fog)return;
   if(G.opts.friendly&&H.t!=='sand'){for(const o of touching(h))if(o!==p&&protectedP(o))return;}out.push(h);});
  if(!out.length)G.map.hexes.forEach((H,h)=>{if(h!==G.pirate&&!H.fog)out.push(h);});return out;}
 function victimsAt(p,h){return [...touching(h)].filter(o=>o!==p&&cnt(hand(o))>0&&!protectedP(o)).sort((a,b)=>a-b);}
 function rates(p){const r={wood:4,brick:4,sheep:4,wheat:4,ore:4};
  G.map.harb.forEach(hb=>{const ed=GR.E[GR.he[hb.h][hb.e]];if([ed.a,ed.b].some(v=>G.vb[v]&&G.vb[v].p===p)){if(hb.type==='any')RES.forEach(x=>r[x]=Math.min(r[x],3));else r[hb.type]=2;}});return r;}
 function harbPts(p){let s=0;G.map.harb.forEach(hb=>{const ed=GR.E[GR.he[hb.h][hb.e]];[ed.a,ed.b].forEach(v=>{const b=G.vb[v];if(b&&b.p===p)s+=b.c?2:1;});});return s;}
 /* ---------- longest route (land and sea routes join only at your own village/capital) ---------- */
 function routeLen(p,wantPath){let best=0,bp=[];const used=new Uint8Array(GR.E.length),st=[];let any=false;
  function dfs(v,len,kind){if(len>best){best=len;if(wantPath)bp=st.slice();}const b=G.vb[v];if(len>0&&b&&b.p!==p)return;
   for(const e of GR.V[v].edges){if(used[e])continue;const x=G.eb[e];if(!x||x.p!==p)continue;if(kind&&x.k!==kind&&!(b&&b.p===p))continue;
    used[e]=1;st.push(e);const ed=GR.E[e];dfs(ed.a===v?ed.b:ed.a,len+1,x.k);st.pop();used[e]=0;}}
  const starts=new Set();G.eb.forEach((x,e)=>{if(x&&x.p===p){any=true;starts.add(GR.E[e].a);starts.add(GR.E[e].b);}});
  if(!any)return wantPath?[]:0;for(const v of starts)dfs(v,0,null);return wantPath?bp:best;}
 /* the edges of one longest route of player p, in order (for the board highlight) */
 function routePath(p){use();return p>=0&&G.players[p]?routeLen(p,true):[];}

/* ================================================================ COMPUTER PLAYERS */
const AI=(()=>{
 const W0={wood:1.05,brick:1.05,sheep:.9,wheat:1,ore:.97};
 let SC=null,SCmap=null;const MEM={};
 const G=()=>E.G,GR=()=>E.GR;
 const R=()=>Math.random();
 function mem(p){const g=G();const m=MEM[p];if(!m||m.id!==g.id||m.turn!==g.turnNo)MEM[p]={id:g.id,turn:g.turnNo,offers:0,tried:{},banks:0,cnt:0};return MEM[p];}
 function scarcity(){const g=G();if(SCmap===g.map)return SC;const tot={wood:0,brick:0,sheep:0,wheat:0,ore:0};let T=0;
  g.map.hexes.forEach(h=>{if(isRes(h.t)){tot[h.t]+=pips(h.n)||3;T+=pips(h.n)||3;}});SC={};RES.forEach(r=>SC[r]=Math.max(.8,Math.min(1.45,Math.sqrt((T/5)/Math.max(1,tot[r])))));SCmap=g.map;return SC;}
 function prodPips(p){const g=G(),gr=GR(),o={wood:0,brick:0,sheep:0,wheat:0,ore:0};
  g.vb.forEach((b,v)=>{if(!b||b.p!==p)return;for(const h of gr.V[v].hexes){const H=g.map.hexes[h];if(isRes(H.t)&&!H.fog&&h!==g.pirate)o[H.t]+=pips(H.n)*(b.c?2:1);}});return o;}
 function vval(p,v,pp){const g=G(),gr=GR(),V=gr.V[v],sc=scarcity();let s=0;const seen={};
  for(const h of V.hexes){const H=g.map.hexes[h];if(H.fog){s+=2.4;continue;}if(!isRes(H.t))continue;let x=pips(H.n)*W0[H.t]*sc[H.t];if(h===g.pirate)x*=.45;if(!pp[H.t]&&!seen[H.t])x+=1.1;seen[H.t]=1;s+=x;}
  const hb=gr.vh[v];if(hb!=null){const t=g.map.harb[hb].type;s+=t==='any'?0.9:(0.6+Math.min(2.2,(pp[t]||0)*0.22)+(seen[t]?0.9:0));}
  if(E.HOP()&&V.isl>=0&&V.isl!==g.map.home&&!g.players[p].disc.includes(V.isl))s+=1+2*E.discPts();
  if(g.opts.hm&&hb!=null)s+=0.6;return s;}
 /* ---------- setup ---------- */
 function setupMove(p){const g=G(),gr=GR(),s=g.setup,pp=prodPips(p);
  if(s.need==='v'){let best=-1,bv=-1e9;for(let v=0;v<gr.V.length;v++){if(!E.canVillage(p,v,true))continue;const x=vval(p,v,pp)+R()*0.35;if(x>bv){bv=x;best=v;}}return {t:'place',v:best};}
  const v0=s.lastV;let best=-1,bs=-1e9;for(const e of gr.V[v0].edges){if(g.eb[e]||!gr.E[e].land)continue;const ed=gr.E[e],u=ed.a===v0?ed.b:ed.a;let sc=0;
   for(const e2 of gr.V[u].edges){if(e2===e)continue;const ed2=gr.E[e2],w=ed2.a===u?ed2.b:ed2.a;if(E.canVillage(p,w,true))sc=Math.max(sc,vval(p,w,pp));}
   if(gr.vh[u]!=null)sc+=.3;sc+=R()*0.25;if(sc>bs){bs=sc;best=e;}}
  return {t:'build',k:'route',at:best};}
 /* ---------- route targets: BFS over free edges from our network ---------- */
 function netVerts(p){const g=G(),gr=GR(),s=new Set();g.vb.forEach((b,v)=>{if(b&&b.p===p)s.add(v);});
  g.eb.forEach((x,e)=>{if(x&&x.p===p){const ed=gr.E[e];[ed.a,ed.b].forEach(v=>{const b=g.vb[v];if(!b||b.p===p)s.add(v);});}});return s;}
 function edgeOK(p,e){const g=G(),gr=GR(),ed=gr.E[e];if(g.eb[e])return false;const L=g.players[p].left;
  if(ed.land&&L.route>0)return true;if(E.HOP()&&ed.sea&&L.sea>0&&!(g.pirate>=0&&g.map.hexes[g.pirate].t==='sea'&&ed.hexes.includes(g.pirate)))return true;return false;}
 function spotFree(v){const g=G(),gr=GR(),V=gr.V[v];if(!V.land||g.vb[v])return false;for(const u of V.adj)if(g.vb[u])return false;return true;}
 function bestTarget(p,islandOnly){const g=G(),gr=GR(),pp=prodPips(p),start=netVerts(p),dist={},par={},q=[];
  start.forEach(v=>{dist[v]=0;q.push(v);});let best=null;const maxD=E.HOP()?5:4;
  while(q.length){const v=q.shift(),d=dist[v];if(d>=1&&spotFree(v)&&(!islandOnly||(gr.V[v].isl!==g.map.home&&!g.players[p].disc.includes(gr.V[v].isl)))){const fogOnly=gr.V[v].hexes.every(h=>g.map.hexes[h].fog||g.map.hexes[h].t==='sea');
    const sc=(fogOnly?2.6:vval(p,v,pp))/(1+0.6*d);if(!best||sc>best.sc)best={v,d,sc};}
   if(d>=maxD)continue;const b=g.vb[v];if(d>0&&b&&b.p!==p)continue;
   for(const e of gr.V[v].edges){if(!edgeOK(p,e))continue;const ed=gr.E[e],u=ed.a===v?ed.b:ed.a;if(dist[u]!=null)continue;const bu=g.vb[u];if(bu&&bu.p!==p)continue;dist[u]=d+1;par[u]=e;q.push(u);}}
  return best;}
 function distFrom(v0){const g=G(),gr=GR(),d={};d[v0]=0;const q=[v0];while(q.length){const v=q.shift();for(const e of gr.V[v].edges){if(g.eb[e])continue;const ed=gr.E[e],u=ed.a===v?ed.b:ed.a;if(d[u]!=null)continue;d[u]=d[v]+1;q.push(u);}}return d;}
 /* island hopping: nearest worthwhile undiscovered island reachable by sea routes only */
 function seaBlocked(e){const g=G(),gr=GR();return g.pirate>=0&&g.map.hexes[g.pirate].t==='sea'&&gr.E[e].hexes.includes(g.pirate);}
 function seaTarget(p){const g=G(),gr=GR();if(!E.HOP())return null;const pl=g.players[p];if(pl.left.sea<=0)return null;
  const start=new Set();g.vb.forEach((b,v)=>{if(b&&b.p===p&&gr.V[v].edges.some(e=>gr.E[e].sea))start.add(v);});
  g.eb.forEach((x,e)=>{if(x&&x.p===p&&x.k==='s'){[gr.E[e].a,gr.E[e].b].forEach(v=>{const b=g.vb[v];if(!b||b.p===p)start.add(v);});}});
  const dist={},q=[];start.forEach(v=>{dist[v]=0;q.push(v);});let best=null;const pp=prodPips(p);
  while(q.length){const v=q.shift(),d=dist[v],V=gr.V[v];
   if(d>=1&&spotFree(v)&&V.isl>=0&&V.isl!==g.map.home&&!pl.disc.includes(V.isl)){const sc=(vval(p,v,pp)+1)/(1+.3*d);if(!best||sc>best.sc)best={v,d,sc,sea:true};}
   if(d>=7)continue;const b=g.vb[v];if(d>0&&b&&b.p!==p)continue;
   for(const e of V.edges){if(g.eb[e]||!gr.E[e].sea||seaBlocked(e))continue;const ed=gr.E[e],u=ed.a===v?ed.b:ed.a;if(dist[u]!=null)continue;dist[u]=d+1;q.push(u);}}
  return best;}
 function distFromSea(v0){const g=G(),gr=GR(),d={};d[v0]=0;const q=[v0];while(q.length){const v=q.shift();for(const e of gr.V[v].edges){if(g.eb[e]||!gr.E[e].sea)continue;const ed=gr.E[e],u=ed.a===v?ed.b:ed.a;if(d[u]!=null)continue;d[u]=d[v]+1;q.push(u);}}return d;}
 function routeChoice(p,free,tg){
const g=G(),gr=GR(),L=g.players[p].left,h=g.players[p].hand;
  if(tg&&tg.sea){if(L.sea<=0||(!free&&!E.has(p,COST.sea)))return null;const dd=distFromSea(tg.v);let best=null,bs=1e9;for(const e of E.routeSpots(p,'s')){const ed=gr.E[e];const x=Math.min(dd[ed.a]??99,dd[ed.b]??99)+R()*0.1;if(x<bs){bs=x;best={e,k:'sea'};}}return best&&bs<tg.d?best:null;}
  const t=tg||bestTarget(p);
  const opts=[];if(L.route>0)E.routeSpots(p,'l').forEach(e=>opts.push({e,k:'route'}));if(E.HOP()&&L.sea>0)E.routeSpots(p,'s').forEach(e=>opts.push({e,k:'sea'}));
  if(!opts.length)return null;const aff=k=>free||E.has(p,COST[k]);const use=opts.filter(o=>aff(o.k));if(!use.length)return null;
  if(t){const d=distFrom(t.v);let best=null,bs=1e9;for(const o of use){const ed=gr.E[o.e];const x=Math.min(d[ed.a]??99,d[ed.b]??99)+(o.k==='sea'&&gr.E[o.e].land?0.3:0)+R()*0.1;if(x<bs){bs=x;best=o;}}
   if(best&&bs<t.d)return best;}
  // otherwise extend our longest route a little (towards open space)
  let best=null,bs=-1e9;for(const o of use){const ed=gr.E[o.e];let s=0;[ed.a,ed.b].forEach(v=>{if(spotFree(v))s+=1;s+=gr.V[v].edges.filter(e=>!g.eb[e]).length*0.2;});s+=R()*0.3;if(s>bs){bs=s;best=o;}}
  return best;}
 /* ---------- goals and resource values ---------- */
 function bestCapital(p){const g=G(),gr=GR();let best=-1,bv=-1;E.capitalSpots(p).forEach(v=>{let s=0;for(const h of gr.V[v].hexes){const H=g.map.hexes[h];if(isRes(H.t)&&!H.fog)s+=pips(H.n)*(h===g.pirate?.4:1)*(H.t==='ore'||H.t==='wheat'?1.15:1);}if(s>bv){bv=s;best=v;}});return best;}
 function bestVillage(p,spots){const pp=prodPips(p);let best=-1,bv=-1e9;spots.forEach(v=>{const x=vval(p,v,pp);if(x>bv){bv=x;best=v;}});return best;}
 function missing(p,c){const h=G().players[p].hand;let m=0;RES.forEach(r=>m+=Math.max(0,(c[r]|0)-h[r]));return m;}
 function goal(p){const g=G(),P=g.players[p],pp=prodPips(p);const opts=[];
  const vs=P.left.village>0?E.villageSpots(p):[];
  if(P.left.capital>0&&E.capitalSpots(p).length)opts.push({k:'capital',c:COST.capital,v:2.3+(pp.ore+pp.wheat>6?0.4:0)});
  if(vs.length)opts.push({k:'village',c:COST.village,v:2.6});
  if(E.HOP()&&P.left.sea>0){const t=seaTarget(p);if(t)opts.push({k:'route',c:COST.sea,v:2.5+(vs.length?0:.5)+(t.d<=2?.4:0),t});}
  if(vs.length){}else if(P.left.village>0||P.left.capital===0){const t=bestTarget(p);if(t&&(P.left.route>0||P.left.sea>0)){const sea=E.HOP()&&!GR().V[t.v].hexes.some(h=>g.map.hexes[h].isl===g.map.home);opts.push({k:'route',c:sea?COST.sea:COST.route,v:1.7+(E.HOP()&&sea?0.5:0)});}}
  if(g.deck.length)opts.push({k:'card',c:COST.card,v:1.0+(g.army.p!==p&&P.knights>=1?0.3:0)});
  if(!opts.length)return {k:'none',c:{},v:0};
  let best=null,bs=-1;for(const o of opts){const s=o.v/(1+missing(p,o.c)*0.85);if(s>bs){bs=s;best=o;}}return best;}
 function val(p,gl){const h=G().players[p].hand,pp=prodPips(p),o={};RES.forEach(r=>{const need=Math.max(0,((gl.c||{})[r]|0)-h[r]);let v=1+need*1.3-(h[r]>=3?0.35*(h[r]-2):0)+(pp[r]<3?0.25:0);o[r]=Math.max(0.2,v);});return o;}
 /* ---------- main-phase decisions ---------- */
 function devMove(p,before){const g=G(),P=g.players[p];if(g.devPlayed)return null;const ok=k=>P.cards.some(c=>c.k===k&&c.t<g.turnNo);
  if(ok('knight')){const blocked=g.pirate>=0&&GR().hv[g.pirate].some(v=>g.vb[v]&&g.vb[v].p===p)&&pips(g.map.hexes[g.pirate].n)>=2;
   const army=P.knights+1>=3&&g.army.p!==p&&P.knights+1>(g.army.p>=0?g.army.n:2);if(blocked||army||(before&&P.cards.filter(c=>c.k==='knight').length>=3))return {t:'play',k:'knight'};}
  if(before)return null;const gl=goal(p);
  if(ok('road')&&(P.left.route+P.left.sea)>=1&&E.anyRouteSpot(p)&&(bestTarget(p)||R()<.3))return {t:'play',k:'road'};
  if(ok('plenty')){const h=P.hand,m=[];RES.forEach(r=>{for(let i=h[r];i<((gl.c||{})[r]|0);i++)m.push(r);});if(m.length&&m.length<=2){while(m.length<2)m.push(RES.slice().sort((a,b)=>h[a]-h[b])[0]);if(m.every(r=>g.bank[r]>=m.filter(x=>x===r).length))return {t:'play',k:'plenty',res:m};}}
  if(ok('mono')){const others=g.players.reduce((s,pl,i)=>i===p?s:s+E.cnt(pl.hand),0);if(others>=7&&missing(p,gl.c||{})>=1){const v=val(p,gl);const r=RES.slice().sort((a,b)=>v[b]-v[a])[0];return {t:'play',k:'mono',res:r};}}
  return null;}
 function tradeMove(p,gl){const g=G(),P=g.players[p],h=P.hand,m=mem(p),c=gl.c||{};const miss=RES.filter(r=>h[r]<(c[r]|0));if(!miss.length)return null;
  const extra=r=>h[r]-(c[r]|0);
  const others=g.players.some((pl,i)=>i!==p&&E.cnt(pl.hand)>0);
  if(others&&m.offers<2){const r=miss[(R()*miss.length)|0];const s=RES.filter(x=>extra(x)>0&&x!==r).sort((a,b)=>extra(b)-extra(a))[0];
   if(s){const key=s+'>'+r;if(!m.tried[key]){m.tried[key]=1;m.offers++;const two=extra(s)>=3&&R()<.5;return {t:'offer',give:{[s]:two?2:1},get:{[r]:1}};}}}
  const rt=E.rates(p);let possible=0;RES.forEach(s=>{const x=extra(s);if(x>0)possible+=Math.floor(x/rt[s]);});const needU=miss.reduce((a,r)=>a+((c[r]|0)-h[r]),0);
  if(possible>=needU&&m.banks<4){const s=RES.filter(x=>extra(x)>=rt[x]).sort((a,b)=>rt[a]-rt[b]||extra(b)-extra(a))[0];const r=miss.find(x=>g.bank[x]>0);if(s&&r){m.banks++;return {t:'bank',give:s,get:r};}}
  return null;}
 /* trade values: 1 each, +0.7 if short of it for the next build, -0.3 per spare card (up to 3), times how rare it is on this map */
 function tvals(p){const gl=goal(p),n=gl.c||{},h=G().players[p].hand,sc=scarcity(),v={};
  RES.forEach(r=>{const short=(n[r]|0)-h[r];v[r]=(1+(short>0?.7:0)-(short<0?Math.min(3,-short)*.3:0))*sc[r];});return v;}
 const worthOf=(o,v)=>RES.reduce((s,r)=>s+((o&&o[r])|0)*v[r],0);
 /* the asker (a computer) picks when everyone has answered or the time is up: an accept counts a little more than a counter,
    never a player close to winning, and it never gives more than it gains + 0.6 */
 function resolveOffer(p){const g=G(),o=g.offer,v=tvals(p);let best=null,bs=-1e9;
  for(const i of Object.keys(o.rep).map(Number)){const r=o.rep[i];if(r==null||r==='no')continue;const give=r==='yes'?o.give:r.give,get=r==='yes'?o.get:r.get;
   if(!E.cnt(give)||!E.has(p,give))continue;if(E.pubPts(i)>=g.opts.target-2)continue;
   const s=worthOf(get,v)-worthOf(give,v)+(r==='yes'?.4:0);if(s>=-.6&&s>bs){bs=s;best=i;}}
  return best!=null?{t:'accept',with:best,id:o.id}:{t:'cancel',id:o.id};}
 /* a computer answers an ask. o.get = what the asker wants (p would give it), o.give = what p would get (may be empty).
    No if it hasn't got it, needs it for its next build, or the asker is 2 points or less from winning (unless the deal is
    about twice as good); yes if what it gets is worth a bit more; a counter if it is close; an open ask always gets a counter
    for the resource it needs most (1 card, or 2 if what is asked is worth more to it). Counters are sent as the ASKER sees them. */
 function reply(p){const g=G(),o=g.offer,gl=goal(p),n=gl.c||{},h=g.players[p].hand,v=tvals(p),id=o.id,no=why=>({t:'reply',id,ans:'no',why});
  const lacks=RES.find(r=>(o.get[r]|0)>h[r]);if(lacks)return no('lack:'+lacks);
  const needs=RES.find(r=>o.get[r]&&h[r]-(o.get[r]|0)<(n[r]|0)&&h[r]<=1);if(needs)return no('need:'+needs);
  const loss=worthOf(o.get,v);
  if(E.pubPts(o.from)>=g.opts.target-2&&worthOf(o.give,v)<loss*2.2)return no('lead');
  const ah=g.players[o.from].hand,want=RES.filter(r=>!o.get[r]&&(ah[r]|0)>0).sort((a,b)=>v[b]-v[a])[0];   /* only counter with what the asker can pay (QA m4) */
  if(E.cnt(o.give)){const gain=worthOf(o.give,v);if(gain>=loss+.15)return {t:'reply',id,ans:'yes'};
   if(gain>=loss-.9){if(want&&!o.give[want]&&v[want]>Math.max(...RES.filter(r=>o.give[r]).map(r=>v[r])))return {t:'reply',id,ans:'counter',give:{[want]:1},get:Object.assign({},o.get)};
    const top=RES.filter(r=>o.give[r])[0],g2=Object.assign({},o.give);g2[top]++;if((ah[top]|0)>=g2[top])return {t:'reply',id,ans:'counter',give:g2,get:Object.assign({},o.get)};}
   return no('worth');}
  if(!want)return no('worth');
  const q=loss>v[want]*1.25?2:1;if((ah[want]|0)<q)return no('worth');
  return {t:'reply',id,ans:'counter',give:{[want]:q},get:Object.assign({},o.get)};}
 function choosePirate(p){const g=G(),gr=GR(),spots=E.pirateSpots(p);let lead=-1,lp=-1;g.players.forEach((_,i)=>{if(i===p)return;const x=E.pubPts(i)+E.cnt(g.players[i].hand)*0.05;if(x>lp){lp=x;lead=i;}});
  let best=spots[0],bs=-1e9;for(const h of spots){const H=g.map.hexes[h];let s=0;
   if(H.t==='sea'){for(const e of gr.he[h]){const x=g.eb[e];if(x&&x.k==='s')s+=x.p===p?-3:(x.p===lead?1.2:.5);}}
   else for(const v of gr.hv[h]){const b=g.vb[v];if(!b)continue;const w=(b.c?2:1)*pips(H.n);s+=b.p===p?-w*3:w*(b.p===lead?1.8:1);}
   const vs=E.victimsAt(p,h);if(vs.includes(lead))s+=3;else if(vs.length)s+=1.2;s+=R()*0.2;if(s>bs){bs=s;best=h;}}
  return best;}
 function chooseVictim(p){const g=G();const vs=E.victimsAt(p,g.pirate);return vs.sort((a,b)=>E.pubPts(b)-E.pubPts(a)||E.cnt(g.players[b].hand)-E.cnt(g.players[a].hand))[0];}
 function chooseDiscard(p,n){const g=G(),h=Object.assign({},g.players[p].hand),gl=goal(p),v=val(p,gl),out={};
  for(let i=0;i<n;i++){let best=null,bs=1e9;RES.forEach(r=>{if(h[r]<=0)return;const s=v[r]-(h[r]-((gl.c||{})[r]|0))*0.4;if(s<bs){bs=s;best=r;}});h[best]--;out[best]=(out[best]|0)+1;}return out;}
 function sbpMove(p){const g=G(),P=g.players[p];
  if(P.left.capital>0&&E.has(p,COST.capital)){const v=bestCapital(p);if(v>=0)return {t:'build',k:'capital',at:v};}
  if(P.left.village>0&&E.has(p,COST.village)){const vs=E.villageSpots(p);if(vs.length)return {t:'build',k:'village',at:bestVillage(p,vs)};}
  if(g.deck.length&&E.has(p,COST.card)&&E.cnt(P.hand)>=6)return {t:'buy'};
  if(E.cnt(P.hand)>7){const rc=routeChoice(p,false);if(rc)return {t:'build',k:rc.k,at:rc.e};}
  return {t:'done'};}
 function mainMove(p){const g=G(),P=g.players[p],m=mem(p);m.cnt++;if(m.cnt>60)return {t:'end'};
  if(g.offer&&g.offer.from===p)return resolveOffer(p);
  const dv=devMove(p,false);if(dv)return dv;
  if(P.left.capital>0&&E.has(p,COST.capital)){const v=bestCapital(p);if(v>=0)return {t:'build',k:'capital',at:v};}
  const vs=P.left.village>0?E.villageSpots(p):[];
  if(vs.length&&E.has(p,COST.village))return {t:'build',k:'village',at:bestVillage(p,vs)};
  const gl=goal(p);
  if(gl.k==='route'){const rc=routeChoice(p,false,gl.t);if(rc)return {t:'build',k:rc.k,at:rc.e};}
  if(gl.k==='card'&&E.has(p,COST.card)&&g.deck.length)return {t:'buy'};
  const tr=tradeMove(p,gl);if(tr)return tr;
  // spare cards: an extra route toward a target, or a Raajje card, before a 7 can hurt
  const n=E.cnt(P.hand);
  if(!vs.length&&(P.left.route>0||P.left.sea>0)&&(E.has(p,COST.route)||E.has(p,COST.sea))&&(n>=6||gl.k!=='capital')){const rc=routeChoice(p,false);if(rc&&(bestTarget(p)||n>7||R()<.25))return {t:'build',k:rc.k,at:rc.e};}
  if(g.deck.length&&E.has(p,COST.card)&&(gl.k==='card'||gl.k==='none'||n>=7||(gl.k!=='capital'&&R()<.5)))return {t:'buy'};
  return {t:'end'};}
 function next(p){const g=G();if(!g||g.phase==='over')return null;
  if(g.phase==='setup')return setupMove(p);
  if(g.step==='discard'&&g.discard[p])return {t:'discard',res:chooseDiscard(p,g.discard[p])};
  if(g.offer){if(g.offer.to.includes(p)&&g.offer.rep[p]==null)return reply(p);if(g.offer.from===p)return resolveOffer(p);}
  if(g.step==='sbp')return E.sbpP()===p?sbpMove(p):null;
  if(p!==g.turn)return null;
  switch(g.step){

/* the dice are thrown onto the visible board (shared/dice.js): the result shows only once they land. Computer players
   throw a little faster; a tap on the board plays the rest fast; reduced motion: the result at once, with one knock. */
let ROLLING=false,PREVD=null;
/* where the dice roll: like a dice cup at the side of a Monopoly board, they tumble in the biggest free strip of sea next to
 the island (below it on a phone, beside it on a wide screen), never across the hexes. No strip at least two dice wide -> the
 whole board area, as before. Measured at each roll from the island's screen box, so it follows pan and zoom. */
function diceZone(){const tray=$('#dtray');if(!tray||!BB||!G)return null;const tr=tray.getBoundingClientRect(),pad=12;
 const [x0,y0]=w2s(BB.x0,BB.y0),[x1,y1]=w2s(BB.x1,BB.y1);const L=VIEW.l+pad,T=VIEW.t+pad,R=VIEW.r-pad,Bm=VIEW.b-pad;
 const bands=[{k:'below',box:[L,Math.max(T,y1+pad),R,Bm]},{k:'above',box:[L,T,R,Math.min(Bm,y0-pad)]},{k:'right',box:[Math.max(L,x1+pad),T,R,Bm]},{k:'left',box:[L,T,Math.min(R,x0-pad),Bm]}];
 /* a strip must be at least ~2 dice thick (64 px); the one by the action bar (below) is preferred, like dice rolled next to your hand */
 let best=null,bs=0;for(const b of bands){const w=b.box[2]-b.box[0],h=b.box[3]-b.box[1];if(w<64||h<64)continue;const a=w*h*(b.k==='below'?1.6:b.k==='above'?.8:1);if(a>bs){bs=a;best=b;}}
 if(!best)return null;return {box:best.box.map((v,i)=>v-(i%2?tr.top:tr.left)),along:best.k==='below'||best.k==='above'?'x':'y'};}
function diceOpt(p){const z=diceZone();const o={size:z?[26,48]:[28,54],k:z?.42:.12,lite:isSmooth(),speed:p===ME&&!AUTO?1:1.25,tapHosts:[ov,$('#acts'),$('#hand')]};
 if(z){o.box=z.box;o.free=true;const d=Math.random()<.5?1:-1;o.vec=z.along==='x'?{vx:d*920,vy:-140}:{vx:d*140,vy:-920};}return o;}
async function throwDice(ev){if(FAST)return;const tray=$('#dtray');
 if(!window.DGDice||!tray){SND.dice();await wait(RM.matches?0:600);return;}
 try{await DGDice.roll(tray,ev.d,diceOpt(ev.p));}catch(e){console.error(e);}}
function drawPirateAt(p){const g=$('#pirG');if(g)g.setAttribute('transform',`translate(${f1(p[0])} ${f1(p[1])})`);}
function focusPlayer(p){let x=0,y=0,n=0;G.vb.forEach((b,v)=>{if(b&&b.p===p){const q=vxy(v);x+=q[0];y+=q[1];n++;}});if(n)follow(x/n,y/n);}
async function flights(gains){if(FAST||RM.matches){return;}const fx=$('#fx');let delay=0;const ps=[];
 for(const g of gains){const [hx,hy]=hxy(g.h),[sx,sy]=w2s(hx,hy);let tgt=null;if(g.p===ME&&!AUTO)tgt=$(`#hand .rs[data-r="${g.r}"] .sw`);if(!tgt)tgt=$(`#pls [data-pl="${g.p}"] .av`);if(!tgt)continue;
  const r=tgt.getBoundingClientRect(),tx=r.left+r.width/2,ty=r.top+r.height/2;
  for(let k=0;k<g.n;k++){const d=document.createElement('div');d.className='fly';d.style.backgroundImage=SW[g.r];fx.appendChild(d);
   const an=d.animate([{transform:`translate(${sx}px,${sy}px) scale(.5)`,opacity:0},{transform:`translate(${sx}px,${sy-22}px) scale(1.15)`,opacity:1,offset:.25},{transform:`translate(${tx}px,${ty}px) scale(.7)`,opacity:.95}],{duration:780,delay,easing:'cubic-bezier(.5,0,.3,1)',fill:'both'});
   ps.push(an.finished.then(()=>d.remove()).catch(()=>d.remove()));delay+=70;}}
 await Promise.all(ps);}

/* ---------- someone asks the table: the banner on every other phone ----------
   "X wants 1 Wood → offers 1 Sheep" with the 20 s bar; Accept (only with the cards: "No Wood"), Counter, No; an open ask gets
   "Make an offer" / No. Below: what the others said. After answering: "Waiting for X…", then "X picked you." or
   "X traded with Y instead." Running out of time counts as No (never as a missed turn). */
let MYANS=null,BRES=null,LASTOFF=null,BANKEY='',BANID=0;
function myAnswer(o){const r=o.rep[ME];if(r!=null)return r==='yes'?{ans:'yes'}:r==='no'?{ans:'no',why:o.why&&o.why[ME]}:{ans:'counter',give:r.give,get:r.get};return MYANS&&MYANS.id===o.id?MYANS:null;}
function renderBanner(){const el=$('#banner');if(!G||AUTO||ME<0||!G.players[ME]||SCREEN!=='game'||SHEET==='counter'){BANKEY='';el.innerHTML='';return;}
 const o=G.offer;let q=null,res=null;
 if(o&&o.from!==ME&&o.to.includes(ME)){q=o;LASTOFF=JSON.parse(JSON.stringify(o));}
 else if(BRES&&Date.now()<BRES.until&&LASTOFF&&LASTOFF.id===BRES.id){q=LASTOFF;res=BRES.html;}
 if(!q){BANKEY='';el.innerHTML='';return;}
 const mine=myAnswer(q),key=JSON.stringify([q.id,q.rep,q.why,mine,res,G.players[ME].hand]);if(key===BANKEY&&el.firstChild)return;BANKEY=key;
 const who=esc(nameOf(q.from)),open=!cnt(q.give),left=res?0:offerLeft(q),f=Math.max(0,Math.min(1,left/(q.dur||E.OFFER_MS))),sec=Math.ceil(left/1000);
 let body;
 if(mine||res){const m=mine||{ans:'no'};
  const said=m.ans==='yes'?'You accepted.':m.ans==='counter'?`You offered ${rc(m.get)} for ${rc(m.give)}.`:m.why==='expired'?'Time ran out, so it counts as No. (Not a missed turn.)':'You said no.';
  body=`<div class="bnote">${said}${res?'':` <span class="muted">Waiting for ${who}…</span>`}</div>${res?`<div class="bnote" style="margin-top:4px">${res}</div>`:''}`;}
 else{const can=E.has(ME,q.get),lack=RES.find(r=>(q.get[r]|0)>(G.players[ME].hand[r]|0));
  body=`<div class="bb3">${open?'':`<button class="btn grn" type="button" data-o="yes" ${can?'':'disabled'}><span class="col">Accept${can?'':`<small>No ${RNAME[lack]}</small>`}</span></button>`}<button class="btn warn" type="button" data-o="counter"${open?' style="grid-column:span 2"':''}>${open?'Make an offer':'Counter'}</button><button class="btn alt" type="button" data-o="no">No</button></div>`;}
 const others=q.to.filter(p=>p!==ME).map(p=>{const r=q.rep[p],ex=q.why&&q.why[p]==='expired';const t=r==null?(res?'no answer':'thinking…'):r==='yes'?'accepts':r==='no'?(ex?'no answer':'says no'):'counters';return `<span class="omini"><span class="av">${avHTML(p,18)}</span>${esc(nameOf(p))} ${t}</span>`;}).join('');
 const enter=BANID!==q.id;BANID=q.id;
 el.innerHTML=`<div class="ban2${enter?' enter':''}" role="alertdialog" aria-label="Trade request from ${who}"><i class="tmr" style="transform:scaleX(${f.toFixed(3)})"></i>
 <div class="bh"><span class="av">${avHTML(q.from,40)}</span><div class="t"><b>${who}</b> wants ${esc(rcTxt(q.get))} <span class="muted">→ ${open?'open to offers':'offers '+esc(rcTxt(q.give))}</span></div>${res?'':`<span class="secs" aria-label="${sec} seconds left">${sec} s</span>`}</div>
 <div class="deal"><div class="side"><small>${who} wants</small><div class="it">${items(q.get,40)}</div><span class="lab">${rcTxt(q.get)}</span></div><span class="arr">${IC.arrow}</span><div class="side"><small>${who} offers</small>${open?'<div class="open">Open to offers</div>':`<div class="it">${items(q.give,40)}</div><span class="lab">${rcTxt(q.give)}</span>`}</div></div>${body}${others?`<div class="others"><span>Others:</span>${others}</div>`:''}</div>`;}

function tradeResult(ev){const q=LASTOFF;if(!G||!q||q.id!==ev.id||ME<0||q.from===ME||!q.to.includes(ME))return;const mine=myAnswer(q);if(!mine)return;const who=esc(nameOf(q.from));let html;
 if(ev.t==='trade')html=ev.b===ME?`<b>${who} picked you.</b>`:`${who} traded with ${esc(nameOf(ev.b))}${mine.ans!=='no'?' instead':''}.`;else html=`${who} cancelled the ask.`;
 BRES={id:q.id,html,until:Date.now()+3200};BANKEY='';renderBanner();setTimeout(()=>{BANKEY='';renderBanner();},3300);}

 const bn=$('#banner .ban2');if(bn){if(o&&o.from!==ME&&o.to.includes(ME)){const left=offerLeft(o),t=bn.querySelector('.tmr'),s2=bn.querySelector('.secs');if(t)t.style.transform=`scaleX(${Math.max(0,Math.min(1,left/(o.dur||E.OFFER_MS))).toFixed(3)})`;if(s2)s2.textContent=Math.ceil(left/1000)+' s';}

async function tradeClick(t,e){const a=t.dataset.tr,r=t.dataset.r;if(!G||ME<0)return;const h=G.players[ME].hand;
 if(/-$/.test(a)){e.stopPropagation();const tg=a==='get-'||a==='give-'?TR[a.slice(0,-1)]:CP&&(a==='cg-'?CP.give:CP.get);if(!tg)return;tg[r]=Math.max(0,(tg[r]|0)-1);if(!tg[r])delete tg[r];if(a[0]==='c')renderCounter();else renderTradeSheet();return;}
 SND.tick();
 if(a==='get'||a==='give'){const c=TR[a],oth=a==='get'?'give':'get';if(a==='give'&&(c[r]|0)>=h[r])return;if(cnt(c)>=4)return;c[r]=(c[r]|0)+1;delete TR[oth][r];renderTradeSheet();return;}
 if(a==='tab'){TR.tab=t.dataset.v==='bank'?'bank':'ask';renderTradeSheet();return;}
 if(a==='log'){openLog();return;}
 if(a==='send'){if(!cnt(TR.get))return;TR.sent=Date.now();TR.gone=0;renderTradeSheet();const err=await run(ME,{t:'offer',get:normRes(TR.get),give:normRes(TR.give)});if(err)TR.sent=0;if(G)renderTradeSheet();return;}

 if(a==='pick'){openConfirm(+t.dataset.p);return;}
 if(a==='bg'){TR.bg=r;if(TR.bw===r)TR.bw=null;renderTradeSheet();return;}
 if(a==='bw'){TR.bw=r;renderTradeSheet();return;}
 if(a==='bank'){const g=TR.bg,w=TR.bw;if(!g||!w)return;await run(ME,{t:'bank',give:g,get:w});if(G&&G.players[ME].hand[g]<E.rates(ME)[g])TR.bg=null;if(G)renderTradeSheet();return;}
 if(!CP)return;
 if(a==='cg'||a==='cw'){const side=a==='cg'?'give':'get',oth=a==='cg'?'get':'give',c=CP[side];if(side==='give'&&(c[r]|0)>=h[r])return;if(cnt(c)>=4)return;c[r]=(c[r]|0)+1;delete CP[oth][r];renderCounter();return;}
 if(a==='qk'){const x=CP.qs[+t.dataset.i];if(x)CP.get=Object.assign({},x);renderCounter();return;}
 if(a==='sendCtr'){const o=G.offer;if(!o||o.id!==CP.id)return;const id=CP.id,give=normRes(CP.get),get=normRes(CP.give);   /* sent as the asker sees it: they give what I want */
  CP=null;closeSheet(true);MYANS={id,ans:'counter',give,get};BANKEY='';renderBanner();const err=await run(ME,{t:'reply',id,ans:'counter',give,get});if(err)MYANS=null;BANKEY='';renderBanner();return;}}

function netSeatSwap(cpuId,who){if(!G||G.phase==='over'||!who||!who.id)return false;const i=G.players.findIndex(p=>p.id===cpuId);if(i<0)return false;
 const p=G.players[i];p.id=who.id;p.name=String(who.name||'Player').slice(0,14);p.av=lookOf(who.look);p.human=true;delete p.cpu;p.afk=false;p.strikes=0;
 for(const k in RT)delete RT[k];if(SCREEN==='game'){renderAll();kick();}NET.sync();return true;}
/* names and looks for Quick Match computer seats: the game's own computer players */
function netCpuSeat(i,taken){const t=new Set((taken||[]).map(x=>String(x).toLowerCase()));const b=roster().find(b=>!t.has(b[0].toLowerCase()));return b?{name:b[0],look:botAv(b)}:null;}
function netLobby(){ONLINE=true;for(const k in RT)delete RT[k];closeSheet(true);clearBanner();G=null;showHome();}
function netEnd(){ONLINE=false;for(const k in RT)delete RT[k];closeSheet(true);clearBanner();G=null;ME=0;showHome();}
function initNet(){if(!window.DGNet)return;NET=DGNet.create({game:'atolls',title:'Atolls',min:2,max:8,id:MYID,
 cpu:true,quickSize:4,cpuSeat:netCpuSeat,onSeatSwap:netSeatSwap,
 me:()=>({name:netName(),look:myAvatar()}),setName:v=>{ls.set('lg-name',v);},
 avatar:seat=>{const l=lookOf(seat.look);try{if(window.DGAvatar&&l)return DGAvatar.render(l,{size:38});}catch(e){}return '';},
 options:[{k:'board',label:'Board',def:'classic',choices:[['classic','Classic'],['hop','Island Hopping']],hint:o=>o.board==='hop'?'Home atoll plus islands to discover by sea (2 to 4 players; more players get the classic board).':'The board size follows the players: Duel for 2, Standard 3 to 4, Big Atoll 5 to 6, Grand Atoll 7 to 8.'},
  {k:'target',label:'Points to win',def:10,choices:[[8,'8'],[10,'10'],[12,'12']],hint:o=>o.board==='hop'?'Island Hopping adds 2 with 3 or 4 players. With 2, Discoveries are worth 2 instead.':''},
  {k:'map',label:'Map',def:'fair',choices:[['fair','Fair'],['random','Random']]},
  {k:'hm',label:'Harbour Master',def:'off',choices:[['off','Off'],['on','On (+2)']]}],
 rulesNote:'2 to 8 players. 20 seconds per decision, then the computer moves for you. Miss 2 in a row, or leave, and the computer plays your seat to the end of the game. A trade ask waits 20 seconds for answers; no answer counts as No, never as a missed turn.',
 listInfo:m=>{if(m.status!=='lobby'&&G)return MODES[G.mode].name+' · round '+Math.max(1,G.round);return (m.opts&&m.opts.board)==='hop'?'Island Hopping':'Classic board';},
 dropText:(nm,why)=>nm+(why==='afk'?' is away':why==='left'?' left':' lost connection')+'. The computer plays their seat to the end.',
 afkText:'You missed 2 decisions in a row, so the computer plays your seat to the end of this game. You can’t rejoin it.',
 hostAfkText:'You missed 2 decisions in a row, so the computer plays your seat to the end of this game.',
 onStart:netStart,view:pid=>netView(pid),backup:netBackup,onAction:(pid,a)=>{netAction(pid,a);},onDrop:netDrop,onState:netState,onLobby:netLobby,onMigrate:netMigrate,onEnd:netEnd,
 onTell:d=>{if(d&&d.err){SND.err();toast(esc(String(d.err)),true);if(TR.sent){TR.sent=0;if(SHEET==='trade')renderTradeSheet();}if(MYANS){MYANS=null;BANKEY='';renderBanner();}}},
 toast:(t,ms)=>toast(esc(t),true),
 dockHost:()=>SCREEN==='game'?$('#dgnSlot'):null,
 avatarEl:pid=>{if(!G||SCREEN!=='game')return null;const i=G.players.findIndex(p=>p.id===pid);return i<0?null:document.querySelector(`#pls [data-pl="${i}"] .av`);}});}
$('#quickBtn').addEventListener('click',()=>{SND.unlock();if(NET)NET.quick();else toast('Online play needs a newer browser',true);});
$('#onlineBtn').addEventListener('click',()=>{SND.unlock();if(NET)(NET.friends||NET.open)();else toast('Online play needs a newer browser',true);});

/* ================================================================ BOOT + TEST HOOKS (localhost only) */
initSwatches();showHome();
initNet();if(NET){NET.boot();if(SCREEN==='home')NET.playing(paintLive);}   /* invite links: ?t=CODE */
if(LOCAL&&Q.has('autostart')){const m=Q.get('mode');if(MODES[m])HMODE=m;SETUP.n=+(Q.get('n')||SETUP.n);newGame({mode:HMODE,n:Math.max(MODES[HMODE].min,Math.min(MODES[HMODE].max,SETUP.n)),opts:{target:MODES[HMODE].target,fair:true,hm:Q.has('hm'),fairDice:Q.has('fairdice'),friendly:Q.has('friendly'),timer:Q.has('timer'),beginner:Q.has('beginner')},seed:+(Q.get('seed')||0)||undefined});}
if(LOCAL)window.ATOLLS={E,AI,MODES,simGame,checkInv,get G(){return G;},get ME(){return ME;},get ONLINE(){return ONLINE;},get NET(){return NET;},run,pump,newGame,CAM,camTo,diceOpt,offerLeft,openTrade,openLog,get SHEET(){return SHEET;},get BUSY(){return BUSY;},get ROLLING(){return ROLLING;},
 sim(o){o=o||{};const cfg=o.cfg||[['duel',2],['standard',3],['standard',4],['big',5],['big',6],['grand',7],['grand',8],['hop',2],['hop',3],['hop',4]];const optsets=[{},{fair:false},{hm:true},{friendly:true},{fairDice:true},{target:8},{target:12},{beginner:true,hm:true,fairDice:true}];
  const saveG=G;const out={};let seed=o.seed||1;for(const [m,n] of cfg){const k=m+n;out[k]={games:0,done:0,errs:[],rounds:0};for(let i=0;i<(o.games||10);i++){const op=optsets[(seed+i)%optsets.length];const r=simGame({mode:m,n,seed:seed++,opts:op,every:o.every||1});const s=out[k];s.games++;if(r.done)s.done++;if(r.errs.length)s.errs.push(r.errs[0]);s.rounds+=r.rounds;}out[k].rounds=f1(out[k].rounds/out[k].games);}
  if(saveG)E.use(saveG);return out;}};
/* localhost test pilot: plays the human seat THROUGH the UI (taps, sheets, buttons) and stops at chosen moments */
if(LOCAL){const wt=ms=>new Promise(r=>setTimeout(r,ms));window.__errs=[];addEventListener('error',e=>window.__errs.push(e.message+' @'+e.lineno));addEventListener('unhandledrejection',e=>window.__errs.push('rej '+(e.reason&&e.reason.message||e.reason)));
 ATOLLS.pilot=async function(stopAt,maxMs){stopAt=stopAt||[];const t0=Date.now(),seen=ATOLLS.seen=ATOLLS.seen||{};const stop=k=>{if(stopAt.includes(k)&&!seen[k]){seen[k]=1;return true;}return false;};
  while(Date.now()-t0<(maxMs||25000)){await wt(200);if(!G)return 'no game';if(SHEET==='over'||G.phase==='over'){if(stop('over'))return 'over';if(SHEET==='over')return 'over';continue;}if(BUSY)continue;
   const rv=document.querySelector('.reveal');if(rv){if(stop('reveal'))return 'reveal';rv.querySelector('button').click();continue;}
   const bn=$('#banner [data-o]');if(bn){if(stop('offer'))return 'offer';const y=$('#banner [data-o="yes"]');(y&&!y.disabled?y:$('#banner [data-o="no"]')).click();continue;}
   if(SHEET==='discard'){if(stop('discard'))return 'discard';const need=G.discard[ME];for(let i=0;i<need;i++){const b=$$('#sheet .fan button')[i];b&&b.click();}await wt(80);$('#sheet [data-d="go"]').click();continue;}
   if(SHEET==='steal'){if(stop('steal'))return 'steal';$('#sheet .vic').click();continue;}
   if(G.offer&&G.offer.from===ME){if(G.offer.to.every(i=>G.offer.rep[i]!=null)){if(stop('replies'))return 'replies';closeSheet();await run(ME,AI.next(ME));}continue;}
   if(!SEL&&(G.phase==='setup'&&E.cur()===ME||G.turn===ME&&(G.step==='pirate'||G.step==='roads')))humanTurn();
   if(SEL&&(G.phase==='setup'||G.step==='pirate'||G.step==='roads')){if(G.step==='pirate'&&stop('pirate'))return 'pirate';const a=AI.next(ME);let sp=null;
    if(a){if(a.t==='place')sp=SEL.spots.find(s=>s.v===a.v);else if(a.t==='build')sp=SEL.spots.find(s=>s.e===a.at);else if(a.t==='pirate')sp=SEL.spots.find(s=>s.h===a.h);}sp=sp||SEL.spots[0];
    if(sp){const [x,y]=spotXY(sp);onTap(x,y);await wt(100);if(SEL&&SEL.pick)await confirmSel(SEL.pick.dual?'route':undefined);}continue;}
   if(G.phase==='play'&&G.turn===ME&&G.step==='roll'){if(stop('roll'))return 'roll';$('#rollBtn').click();continue;}
   if(G.phase==='play'&&G.turn===ME&&G.step==='main'){const a=AI.next(ME);if(!a)continue;
    if(a.t==='build'){if(stop('build'))return 'build';startBuild(a.k);await wt(80);const sp=SEL&&SEL.spots.find(s=>s.v===a.at||s.e===a.at);if(sp){const [x,y]=spotXY(sp);onTap(x,y);await wt(80);await confirmSel();}else endSel();continue;}
    if(a.t==='buy'){if(stop('buy'))return 'buy';openBuild();await wt(80);$('#sheet [data-b="card"]').click();continue;}
    if(a.t==='play'){if(stop('play'))return 'play';openCards();await wt(80);const b=$(`#sheet [data-c="${a.k}"]`);if(b&&!b.disabled){b.click();await wt(80);if(SHEET==='respick'){[].concat(a.res||[]).forEach(r=>{const x=$(`#sheet [data-rp="${r}"]`);x&&x.click();});await wt(60);$('#sheet [data-rp="go"]').click();}}else{closeSheet();await run(ME,a);}continue;}
    if(a.t==='offer'){if(stop('trade'))return 'trade';openTrade();await wt(80);for(const r of RES){for(let i=0;i<(a.give[r]|0);i++)$(`#sheet [data-tr="give"][data-r="${r}"]`).click();for(let i=0;i<(a.get[r]|0);i++)$(`#sheet [data-tr="get"][data-r="${r}"]`).click();}await wt(60);$('#sheet [data-tr="send"]').click();await wt(300);continue;}
    if(a.t==='bank'){if(stop('bank'))return 'bank';openTrade('bank');await wt(60);$(`#sheet [data-tr="bg"][data-r="${a.give}"]`).click();await wt(40);$(`#sheet [data-tr="bw"][data-r="${a.get}"]`).click();await wt(40);$('#sheet [data-tr="bank"]').click();await wt(200);closeSheet();continue;}
    closeSheet();$('#endBtn').click();continue;}
   if(G.step==='sbp'&&E.sbpP()===ME){const a=AI.next(ME);if(a&&a.t!=='done')await run(ME,a);else $('#doneBtn').click();continue;}}
  return 'timeout';};
 ATOLLS.give=(o)=>{for(const r in o){const n=Math.min(o[r],G.bank[r]);G.players[ME].hand[r]+=n;G.bank[r]-=n;}renderAll();};}
</script>
