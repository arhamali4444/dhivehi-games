<style>
/* ================= Dhihaeh & Thaas · a jetty at sunset: golden light on the lagoon, lanterns, a Bodu Beru drum set into the table ================= */
:root{--ink:#FFF4E6;--muted:#D9BBA2;--panel2:#2B1B18;--line:rgba(255,220,180,.1);--edge:rgba(255,214,170,.18);
 --acc:#FFC56E;--accGlow:rgba(255,168,70,.55);--accInk:#2B1305;--accBtn:linear-gradient(180deg,#FFDB92,#EE9A3C);--accEdge:#8B4712;
 --us:#5EE0D0;--them:#FF9573;--gold:linear-gradient(180deg,#FFF1CF 0%,#FFD27E 45%,#E48F3A 100%);
 --spring:linear(0,.009,.035 2.1%,.141 4.4%,.723 12.9%,.938 16.7%,1.017 19.4%,1.067,1.089 25.4%,1.084 28.1%,1.029 35.3%,1.003 41.2%,.994 47.9%,1 60.1%,1);
 --out:cubic-bezier(.16,1,.3,1);--shadow:0 18px 40px -18px rgba(0,0,0,.9);--cw:clamp(52px,17vw,88px);--pw:60px;
 --serif:'Fraunces','DM Serif Display',Georgia,serif;--cond:'Oswald','Arial Narrow',sans-serif;--dv:'Noto Sans Thaana','MV Boli','Faruma',sans-serif}
@supports not (transition-timing-function:linear(0,1)){:root{--spring:cubic-bezier(.34,1.4,.5,1)}}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
html{background:#140c14;-webkit-text-size-adjust:100%;touch-action:manipulation;overflow-x:hidden;overflow-x:clip}
body{font-family:'Sora',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:14px;line-height:1.45;color:var(--ink);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;overscroll-behavior:none;background:transparent;overflow-x:hidden;overflow-x:clip}
/* home backdrop: the jetty running out into the sunset (baked), darker towards the buttons */
body:before{content:"";position:fixed;inset:0;z-index:-3;pointer-events:none;transform:translateZ(0);
 background:linear-gradient(180deg,rgba(20,10,20,.25),rgba(20,10,20,0) 22%,rgba(22,10,12,.35) 52%,rgba(16,8,10,.92) 78%,#120a0c),url(home.webp?v=1) center top/cover no-repeat,#1d1330}
html[data-mode="thaas"] body:before{filter:hue-rotate(-14deg) saturate(1.08) brightness(.82)}
html[data-scr="table"] body:before{display:none}
.embers{position:fixed;inset:0;z-index:-1;pointer-events:none;overflow:hidden}
.embers i{position:absolute;bottom:-10px;width:3px;height:3px;border-radius:50%;background:#FFD08A;box-shadow:0 0 6px 2px rgba(255,170,80,.6);opacity:0;animation:ember 11s linear infinite}
@keyframes ember{0%{transform:translate(0,0);opacity:0}15%{opacity:.8}100%{transform:translate(var(--dx),-70vh);opacity:0}}
html[data-scr="table"] .embers{display:none}
button{font:inherit;touch-action:manipulation}
[hidden]{display:none!important}
.muted{color:var(--muted)}
h1,h2{margin:0;letter-spacing:-.01em}
.row{display:flex;gap:8px;align-items:center}
.btn{font-weight:700;border:0;border-radius:14px;padding:13px 18px;min-height:48px;cursor:pointer;background:var(--panel2);color:var(--ink);box-shadow:inset 0 0 0 1px var(--edge);text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn:disabled{opacity:.5;cursor:default}
.btn.primary{background:var(--accBtn);color:var(--accInk);box-shadow:0 3px 0 var(--accEdge),0 12px 24px -12px var(--accGlow)}
.btn.soft{background:var(--panel2)}
.btn.ghost{background:transparent;box-shadow:inset 0 0 0 1px var(--edge)}
.btn.wide{width:100%;display:flex}
.btn.sm{padding:9px 14px;min-height:44px;font-size:13px;border-radius:12px}
.btn:active:not(:disabled){transform:translateY(1px)}
button:focus-visible,input:focus-visible,a:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.in{font:inherit;font-size:16px;width:100%;min-height:48px;padding:12px 14px;border-radius:14px;border:1px solid var(--edge);background:#170e0d;color:var(--ink)}
.in:focus{outline:none;border-color:var(--acc)}
label.f{display:block;font:600 11px/1 var(--cond);letter-spacing:.18em;text-transform:uppercase;color:var(--muted);margin-bottom:8px}
.icon-btn{width:44px;height:44px;border-radius:13px;border:0;background:rgba(30,16,20,.66);box-shadow:inset 0 0 0 1px rgba(255,214,170,.22);color:#fff;display:grid;place-items:center;cursor:pointer;flex:none;padding:0;text-decoration:none;position:relative;-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
.icon-btn svg{width:20px;height:20px}
.icon-btn .mute{display:none}.icon-btn[aria-pressed="false"] .mute{display:block}.icon-btn[aria-pressed="false"] .snd{opacity:.55}
.page{position:relative;z-index:1;max-width:540px;margin:0 auto;padding:calc(12px + env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) calc(32px + env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left));color:#fff}
.subtop{display:flex;align-items:center;gap:12px;margin:4px 0 8px;min-height:48px}
/* avatars */
.mini{width:34px;height:34px;flex:none;display:block;position:relative;isolation:isolate}
.pz{display:grid;place-items:center;width:100%;height:100%;border-radius:50%;background:var(--c,#2D86C9);box-shadow:0 0 0 2px var(--ring,#FFE2B0),0 3px 10px rgba(0,0,0,.6);color:#fff;overflow:hidden;font:800 15px/1 Sora,sans-serif;position:relative;z-index:1}
.pz.chr{background:#3a2622}
.pz.chr svg{width:100%;height:100%;display:block}
.mini .dgc-ring{z-index:2}
.t0{--ring:var(--us)}.t1{--ring:var(--them)}
/* ---------- playing cards (the faces shared with Digu and Bondi) ---------- */
.card{--w:var(--cw);position:absolute;left:0;top:0;width:var(--w);height:calc(var(--w)*1.4);border-radius:calc(var(--w)*.1);user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
.face,.back{position:absolute;inset:0;border-radius:inherit;overflow:hidden}
.face{--sc:#141414;background:linear-gradient(168deg,#FFFEFA 0%,#FBF4E6 60%,#F4EAD6 100%);color:var(--sc);
 box-shadow:inset 0 0 0 1px rgba(40,30,10,.1),inset 0 1px 0 #fff,0 1px 1px rgba(0,0,0,.4),0 12px 18px -5px rgba(20,6,0,.8)}
.face.H,.face.D{--sc:#C4262E}
.ix{position:absolute;left:calc(var(--w)*.04);top:calc(var(--w)*.05);width:calc(var(--w)*.34);display:flex;flex-direction:column;align-items:center;z-index:1}
.ix b{font-family:'DM Serif Display',Georgia,'Times New Roman',serif;font-weight:400;font-size:calc(var(--w)*.42);line-height:.92;letter-spacing:-.07em;margin-left:-.07em}
.ix svg{width:calc(var(--w)*.2);height:calc(var(--w)*.2);margin-top:calc(var(--w)*.02)}
.face .big{position:absolute;left:50%;top:56%;width:calc(var(--w)*.5);height:calc(var(--w)*.5);transform:translate(-40%,-50%)}
.face .ace{position:absolute;left:50%;top:55%;width:calc(var(--w)*.62);height:calc(var(--w)*.62);transform:translate(-44%,-50%);filter:drop-shadow(0 2px 3px rgba(0,0,0,.14))}
.face .court{position:absolute;left:30%;right:5%;top:17%;bottom:5%}
.face .court svg,.face .ace svg{width:100%;height:100%;display:block}
/* a ten gets a thin gold frame: the prize in Dhihaeh */
html[data-mode="dhihaeh"] .face.ten:before{content:"";position:absolute;inset:calc(var(--w)*.035);border-radius:calc(var(--w)*.07);box-shadow:inset 0 0 0 1px rgba(214,160,60,.75);pointer-events:none}
/* the trump suit glows faintly in your hand */
.card.trumpc .face{background:linear-gradient(168deg,#FFFDF4 0%,#FFF1D2 60%,#FBE2B2 100%)}
/* back: dusk lacquer, gold frame, the drum medallion */
.back{background:#1a1030;box-shadow:0 1px 1px rgba(0,0,0,.4),0 8px 18px -6px rgba(0,0,0,.8)}
.back.bdef{background:radial-gradient(120% 90% at 50% 15%,#6b2f55,#2a1738 55%,#140b22);box-shadow:inset 0 0 0 calc(var(--w)*.035) #140b22,inset 0 0 0 calc(var(--w)*.055) #E9B864,0 1px 1px rgba(0,0,0,.4),0 8px 18px -6px rgba(0,0,0,.8)}
.back.bdef:before{content:"";position:absolute;inset:calc(var(--w)*.1);border-radius:calc(var(--w)*.05);background:repeating-linear-gradient(90deg,rgba(255,200,120,.1) 0 1px,transparent 1px 5px);box-shadow:inset 0 0 0 1px rgba(233,184,100,.45)}
.back.bdef:after{content:"";position:absolute;left:50%;top:50%;width:calc(var(--w)*.46);height:calc(var(--w)*.46);margin:calc(var(--w)*-.23);border-radius:50%;
 background:radial-gradient(circle,#F3DDB0 0 50%,#6b3b1c 52% 58%,transparent 60%),repeating-conic-gradient(#E9B864 0 6deg,transparent 6deg 20deg);box-shadow:0 0 0 1px rgba(233,184,100,.6)}
.back.imgback>i{position:absolute;inset:0;background-size:cover;background-position:center;border-radius:inherit}
.back.imgback:after{content:"";position:absolute;inset:0;border-radius:inherit;box-shadow:inset 0 0 0 calc(var(--w)*.03) rgba(255,255,255,.55)}
/* ================= home ================= */
.hometop{display:flex;align-items:center;gap:8px;min-height:48px}
.profbtn{display:flex;align-items:center;gap:9px;height:48px;padding:0 14px 0 5px;border:0;border-radius:99px;background:rgba(30,16,20,.62);box-shadow:inset 0 0 0 1px rgba(255,214,170,.22);color:#fff;cursor:pointer;margin-right:auto;min-width:0;flex:0 1 auto;-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
.profbtn .mini{width:38px;height:38px}
.profbtn .pwrap{display:flex;flex-direction:column;min-width:0;line-height:1.15;text-align:left}
.profbtn .pn{font-weight:700;font-size:13.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.profbtn .ps{font-size:10.5px;font-weight:700;color:var(--muted);white-space:nowrap}
.shellpill{display:inline-flex;align-items:center;gap:6px;height:44px;padding:0 14px 0 10px;border:0;border-radius:99px;background:rgba(30,16,20,.62);box-shadow:inset 0 0 0 1px rgba(255,214,170,.22);color:#fff;font:inherit;font-weight:800;font-size:14px;cursor:pointer;flex:none;text-decoration:none;-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
img.boli{display:inline-block;width:18px;height:18px;object-fit:contain;vertical-align:-3px;filter:drop-shadow(0 1px 1.5px rgba(0,0,0,.4))}
.shellpill img.boli{width:24px;height:24px;vertical-align:middle}
.dhero{position:relative;height:clamp(176px,50vw,224px);margin-top:4px;pointer-events:none}
.dhero .card{--w:clamp(64px,19vw,84px);left:50%;top:34px;margin-left:calc(var(--w)/-2);transform-origin:50% 135%;animation:heroIn 1s var(--spring) both,breathe 6s ease-in-out 1.2s infinite}
.dhero .card:nth-child(1){--r:-24deg;animation-delay:.05s,1.2s}
.dhero .card:nth-child(2){--r:-8deg;animation-delay:.12s,1.4s}
.dhero .card:nth-child(3){--r:8deg;animation-delay:.19s,1.6s}
.dhero .card:nth-child(4){--r:24deg;animation-delay:.26s,1.8s}
.dhero .card .face{box-shadow:inset 0 0 0 1px rgba(40,30,10,.1),0 0 0 1px rgba(255,210,140,.3),0 16px 30px -8px rgba(40,8,0,.8),0 0 40px -10px rgba(255,170,80,.6)}
@keyframes breathe{0%,100%{transform:rotate(var(--r)) translateY(0)}50%{transform:rotate(calc(var(--r) * 1.1)) translateY(-5px)}}
@keyframes heroIn{from{transform:rotate(0) translateY(60px) scale(.8);opacity:0}to{transform:rotate(var(--r)) translateY(0);opacity:1}}
.dtitle{position:relative;text-align:center;margin-top:-14px}
.dtitle .kick{display:inline-flex;align-items:center;gap:8px;font:600 11px/1 var(--cond);letter-spacing:.34em;text-transform:uppercase;color:#FFE2B0;background:rgba(30,12,18,.7);padding:7px 12px 7px 15px;border-radius:99px;margin-bottom:10px;box-shadow:inset 0 0 0 1px rgba(255,200,120,.35);animation:ytin .5s var(--spring) both}
.dtitle h1{font:800 clamp(50px,16vw,68px)/.92 var(--serif);letter-spacing:.03em;background:var(--gold);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 4px 14px rgba(60,10,0,.7))}
.dtitle .dv{display:block;font:600 26px/1.4 var(--dv);color:#FFE7C2;margin-top:2px;text-shadow:0 2px 8px rgba(0,0,0,.6)}
.dtitle p{margin:4px 0 0;font:italic 500 16px/1.25 var(--serif);color:#FFE2C4;text-shadow:0 2px 8px rgba(0,0,0,.6)}
.mseg{display:flex;gap:5px;padding:5px;margin:18px 0 0;border-radius:17px;background:rgba(26,12,16,.72);box-shadow:inset 0 0 0 1px rgba(255,214,170,.18);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
.mseg button{flex:1;border:0;min-height:52px;border-radius:13px;background:transparent;color:rgba(255,255,255,.82);font-weight:800;font-size:14.5px;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.15;padding:6px}
.mseg button small{font:500 10px/1.3 var(--cond);letter-spacing:.16em;text-transform:uppercase;opacity:.75}
.mseg button[aria-pressed="true"]{background:var(--accBtn);color:var(--accInk);box-shadow:0 3px 0 var(--accEdge),0 0 20px -4px var(--accGlow)}
.mhint{font-size:12.5px;color:rgba(255,240,225,.86);margin:10px 4px 0;text-align:center;min-height:36px}
.mhint b{color:#FFD88E}
.modes{position:relative;display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:14px 0 0}
.mode{position:relative;border:0;text-align:left;font:inherit;color:#fff;cursor:pointer;border-radius:20px;padding:14px;min-height:108px;display:flex;flex-direction:column;justify-content:flex-end;gap:2px;background:linear-gradient(180deg,rgba(48,26,28,.86),rgba(26,14,16,.9));box-shadow:inset 0 0 0 1px rgba(255,214,170,.14),inset 0 1px 0 rgba(255,255,255,.06);overflow:hidden;-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
.mode .mi{position:absolute;top:12px;left:12px;width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:rgba(255,200,120,.1);box-shadow:inset 0 0 0 1px rgba(255,200,120,.16)}
.mode .mi svg{width:21px;height:21px}
.mode b{font-size:15.5px;font-weight:800}.mode small{font-size:11.5px;opacity:.75;line-height:1.3}
.mode .tag{position:absolute;top:12px;right:12px;font:600 9.5px/1 var(--cond);letter-spacing:.18em;text-transform:uppercase;background:rgba(255,255,255,.08);color:#FFD9A8;padding:5px 8px;border-radius:99px}
.mode:disabled,.mode[aria-disabled="true"]{cursor:default;opacity:.62}
.mode.quick{grid-column:1/-1;min-height:88px;flex-direction:row;align-items:center;gap:14px;background:var(--accBtn);color:var(--accInk);box-shadow:0 5px 0 var(--accEdge),0 18px 34px -14px var(--accGlow);margin-bottom:6px}
.mode.quick:after{content:"";position:absolute;top:-60%;left:-40%;width:30%;height:220%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.55),transparent);transform:rotate(14deg);animation:sheen 5.5s ease-in-out infinite}
@keyframes sheen{0%,62%{translate:0 0}100%{translate:520% 0}}
.mode.quick .mi{position:static;background:rgba(80,30,0,.12);width:52px;height:52px;border-radius:15px;flex:none;box-shadow:none}
.mode.quick .mi svg{width:28px;height:28px}
.mode.quick .mt{display:flex;flex-direction:column;min-width:0;flex:1}
.mode.quick b{font:700 21px/1.1 var(--serif)}.mode.quick small{opacity:.8}
.resume{position:relative;display:flex;align-items:center;gap:10px;width:100%;margin:12px 0 0;padding:10px 10px 10px 14px;border:0;border-radius:16px;background:rgba(30,14,18,.86);box-shadow:inset 0 0 0 1px rgba(255,200,120,.3);font:inherit;font-size:12.5px;color:#fff;text-align:left;cursor:pointer;min-height:54px}
.resume b{color:var(--acc)}.resume .go{margin-left:auto;flex:none;font-weight:800;color:var(--accInk);background:var(--accBtn);padding:8px 14px;border-radius:99px;font-size:12px}
.homebelow{margin-top:18px}
.spbox{margin:0 0 12px}
.snote{color:rgba(255,240,225,.66);font-size:12px;text-align:center;margin:16px 8px 0}
.snote a{color:#fff}
/* ================= rules card ================= */
.rcard{text-align:left}
.rcard .rtop{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.rcard .rbadge{flex:none;width:52px;height:52px;border-radius:15px;display:grid;place-items:center;background:linear-gradient(160deg,#5a2a2a,#1e0f12);color:#FFD27E;box-shadow:inset 0 0 0 1.5px rgba(255,200,120,.5)}
.rcard .rbadge svg{width:30px;height:30px}
.rcard h2{font:700 28px/1 var(--serif);margin:0}
.rcard .rsub{font-size:12.5px;color:var(--muted);margin-top:4px}
.rlist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.rlist li{display:flex;gap:10px;align-items:flex-start;font-size:13.5px;line-height:1.4;padding:10px 12px;border-radius:13px;background:#2a1a18;box-shadow:inset 0 0 0 1px rgba(255,255,255,.05)}
.rlist li i{flex:none;font-style:normal;min-width:26px;height:24px;padding:0 4px;border-radius:7px;display:grid;place-items:center;background:#170d0c;box-shadow:inset 0 0 0 1px var(--edge);font-size:12px;font-weight:800;color:#FFE2B0}
.rlist li i svg{width:14px;height:14px}
.rlist li.hl{background:linear-gradient(90deg,#3a2420,#2a1a18);box-shadow:inset 0 0 0 1.5px var(--acc)}
.rlist li.hl i{background:var(--accBtn);color:var(--accInk);box-shadow:none}
.rlist b{font-weight:800;color:#fff}
.rfoot{margin-top:14px}
.sH,.sD{color:#FF6B7F}
/* ================= table: the jetty ================= */
main.table{position:fixed;inset:0;display:flex;flex-direction:column;overflow:hidden;color:#fff;background:#1a0f1c;padding:env(safe-area-inset-top) env(safe-area-inset-right) 0 env(safe-area-inset-left)}
main.table>*{width:100%;max-width:640px;margin-left:auto;margin-right:auto}
.tlayer{position:absolute;inset:0;overflow:hidden;pointer-events:none;z-index:0;max-width:none!important;margin:0!important}
.tsc{position:absolute;left:0;top:0;width:375px;height:812px;transform-origin:0 0}
.tsc .lay{position:absolute;left:0;top:0;width:375px;height:812px;display:block;pointer-events:none;user-select:none;-webkit-user-select:none}
.tsc>img.lay:first-child{-webkit-mask-image:linear-gradient(90deg,transparent,#000 4%,#000 96%,transparent);mask-image:linear-gradient(90deg,transparent,#000 4%,#000 96%,transparent)}
/* live layers (transform/opacity only): lantern flicker, sun shimmer, the drum's pulse */
.tsc .lg{position:absolute;width:120px;height:120px;margin:-60px 0 0 -60px;border-radius:50%;background:radial-gradient(closest-side,rgba(255,196,110,.55),rgba(255,150,60,.14) 55%,transparent);mix-blend-mode:screen;animation:flick 3.2s ease-in-out infinite}
.tsc .lg.b{animation-duration:2.6s;animation-delay:-1.1s}
@keyframes flick{0%,100%{opacity:.75;transform:scale(1)}23%{opacity:.95}41%{opacity:.7;transform:scale(.97)}58%{opacity:1;transform:scale(1.03)}77%{opacity:.82}}
.tsc .shim i{position:absolute;height:1.2px;border-radius:2px;background:#FFE6B0;opacity:0;animation:shim 3.4s ease-in-out infinite}
@keyframes shim{0%,100%{opacity:0}50%{opacity:.9}}
.tsc.still *{animation:none!important}.tsc.still .shim{display:none}
.tadw{position:absolute;left:0;top:0;width:375px;height:812px;pointer-events:none}
.tad{position:absolute;transform:translate(-50%,-50%);display:flex;align-items:center;white-space:nowrap;pointer-events:none}
/* sponsor spot: a small brass plate screwed into the teak rim */
.tad.plate{min-width:88px;max-width:150px;height:14px;padding:0 10px;justify-content:center;border-radius:2px;
 background:linear-gradient(180deg,rgba(255,255,255,.45),rgba(255,255,255,0) 50%,rgba(0,0,0,.2)),linear-gradient(100deg,#8a5a1c 0%,#e6b766 25%,#fbe3a4 42%,#c48a3c 64%,#efc97c 82%,#7c4f18 100%);
 box-shadow:inset 0 1px 0 rgba(255,245,210,.8),inset 0 -1px 0 rgba(60,30,0,.4),inset 0 0 0 1px rgba(90,50,10,.5),0 1px 0 rgba(0,0,0,.6),0 2px 5px rgba(0,0,0,.7)}
.tad.plate:before,.tad.plate:after{content:"";position:absolute;top:50%;width:2.6px;height:2.6px;margin-top:-1.3px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#fff3cf,#6d4513 75%)}
.tad.plate:before{left:3.5px}.tad.plate:after{right:3.5px}
.tad.plate b{font:600 7.4px/1 var(--serif);font-variant:small-caps;text-transform:lowercase;letter-spacing:1.4px;color:#3a1f06;text-shadow:0 .5px 0 rgba(255,240,200,.7);overflow:hidden;text-overflow:ellipsis}
.topbar{position:relative;z-index:6;display:flex;align-items:center;gap:8px;padding:8px 10px 0}
.match{flex:1;min-width:0;display:flex;justify-content:center}
.match>span{display:inline-flex;align-items:center;gap:8px;max-width:100%;font-size:12px;font-weight:700;background:rgba(28,14,22,.74);padding:6px 12px;border-radius:99px;box-shadow:inset 0 0 0 1px rgba(255,214,170,.22);white-space:nowrap;-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
.match .tm{display:inline-flex;align-items:center;gap:6px}
.match .tm b{font:800 18px/1 var(--serif);min-width:12px;text-align:center}
.match .us b{color:var(--us)}.match .them b{color:var(--them)}
.match .to{font:600 9.5px/1.1 var(--cond);letter-spacing:.14em;text-transform:uppercase;color:var(--muted);text-align:center}
.match .pop{animation:pop2 .7s var(--spring)}
@keyframes pop2{40%{transform:scale(1.5)}}
.tools{display:flex;gap:6px;flex:none}
.hud{position:relative;z-index:6;display:flex;justify-content:center;gap:6px;padding:6px 10px 0}
.chip{display:flex;align-items:center;gap:7px;min-height:38px;padding:4px 11px 4px 6px;border-radius:12px;background:rgba(28,14,22,.74);box-shadow:inset 0 0 0 1px rgba(255,214,170,.2);white-space:nowrap;-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);min-width:0}
.chip small{display:block;font:600 9px/1.1 var(--cond);letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
.chip b{display:block;font-size:12.5px;font-weight:800;line-height:1.2}
.chip.tr .big{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;background:#FFF8EA;color:#141414;box-shadow:0 0 0 1.5px var(--acc),0 0 14px -2px var(--accGlow)}
.chip.tr .big svg{width:19px;height:19px}.chip.tr.H .big,.chip.tr.D .big{color:#C4262E}
.chip.tr .big.q{background:rgba(255,255,255,.08);color:var(--muted);font-weight:800;box-shadow:inset 0 0 0 1px var(--edge)}
.chip.tk{padding-left:11px}
.chip.tk b{font:800 15px/1.1 var(--serif);font-variant-numeric:tabular-nums}.chip i{font-style:normal}
.chip .us{color:var(--us)}.chip .them{color:var(--them)}
.chip .dash{color:var(--muted);margin:0 3px}
.chip.tn{padding-left:11px}
.tens{display:flex;gap:3px;margin-top:2px}
.tens span{width:17px;height:17px;border-radius:5px;display:grid;place-items:center;background:rgba(255,255,255,.06);box-shadow:inset 0 0 0 1px rgba(255,255,255,.12);color:rgba(255,255,255,.35)}
.tens span svg{width:11px;height:11px}
.tens span.u{background:var(--us);color:#10302c;box-shadow:none}.tens span.t{background:var(--them);color:#3a1208;box-shadow:none}
.tens span.new{animation:pop2 .8s var(--spring)}
.pips{display:flex;gap:2px;margin-top:3px}.pips i{width:6px;height:6px;border-radius:2px;background:rgba(255,255,255,.12)}
.pips.us i.on{background:var(--us)}.pips.them i.on{background:var(--them)}
.arena{position:relative;flex:1;min-height:0;z-index:2}
.beat{position:absolute;left:0;top:0;width:10px;height:10px;pointer-events:none;z-index:1}
.beat i{position:absolute;left:-60px;top:-60px;width:120px;height:120px;border-radius:50%;box-shadow:0 0 0 2px rgba(255,214,150,.7),0 0 22px rgba(255,190,110,.5);opacity:0}
.beat i.go{animation:beat 1s var(--out)}
@keyframes beat{0%{transform:scale(.5);opacity:.9}100%{transform:scale(1.9);opacity:0}}
.seats{position:absolute;inset:0;z-index:3;pointer-events:none}
.seat{--av:clamp(42px,12.4vw,50px);position:absolute;left:0;top:0;width:74px;display:flex;flex-direction:column;align-items:center;gap:2px;pointer-events:auto;transition:transform .6s var(--spring)}
.seat .av,.meav{position:relative;width:var(--av);height:var(--av);isolation:isolate;border-radius:50%}
.seat .av .mini,.meav .mini{width:100%;height:100%}
.seat .nm{font-size:11px;font-weight:700;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding:1px 7px;border-radius:99px;background:rgba(24,12,18,.72);box-shadow:inset 0 0 0 1px rgba(255,255,255,.08);margin-top:2px}
.seat .nm.t0{box-shadow:inset 0 0 0 1px rgba(94,224,208,.5)}.seat .nm.t1{box-shadow:inset 0 0 0 1px rgba(255,149,115,.5)}
.tkb{position:absolute;right:-6px;bottom:-4px;z-index:4;min-width:20px;height:20px;padding:0 5px;border-radius:99px;font:800 11px/20px Sora,sans-serif;text-align:center;background:#1c0f14;color:#fff;box-shadow:0 0 0 1.5px var(--ring,#fff)}
.tkb:empty{display:none}
.dlr{position:absolute;left:-7px;top:-5px;z-index:4;width:20px;height:20px;border-radius:50%;display:grid;place-items:center;font:800 10px/1 Sora,sans-serif;background:var(--accBtn);color:var(--accInk);box-shadow:0 1px 3px rgba(0,0,0,.6)}
.hfan{--fw:15px;position:absolute;left:calc(var(--fw)*-.9);bottom:0;width:calc(var(--fw)*1.6);height:calc(var(--fw)*1.55);z-index:0;pointer-events:none}
.hfan i{position:absolute;left:calc(var(--fw)*.3);top:0;width:var(--fw);height:calc(var(--fw)*1.4);border-radius:3px;overflow:hidden;transform-origin:50% 120%;background:#1a1030 center/cover;box-shadow:0 0 0 1px rgba(233,184,100,.7),0 2px 4px rgba(0,0,0,.6)}
.hfan i.bdef{background:radial-gradient(120% 90% at 50% 20%,#6b2f55,#140b22 70%)}
.hfan i:nth-child(1){transform:rotate(-16deg)}.hfan i:nth-child(3){transform:rotate(16deg)}
.av.on:before,.meav.on:before{content:"";position:absolute;inset:-7px;border-radius:50%;box-shadow:0 0 16px 4px var(--accGlow);animation:tglow 1.6s ease-in-out infinite;pointer-events:none;z-index:-1}
@keyframes tglow{0%,100%{opacity:.45}50%{opacity:1}}
.trick{position:absolute;inset:0;z-index:4;pointer-events:none}
.tc{position:absolute;left:0;top:0;width:var(--pw);height:calc(var(--pw)*1.4);transition:transform .45s var(--spring)}
.tc .card{--w:var(--pw)}
.tc.hi .face{box-shadow:inset 0 0 0 2px var(--acc),0 0 0 2px var(--accGlow),0 0 22px var(--accGlow),0 12px 16px -5px rgba(0,0,0,.85)}
.tcard{position:absolute;left:0;top:0;z-index:3;width:calc(var(--pw)*.58);height:calc(var(--pw)*.812);pointer-events:none;transition:transform .5s var(--spring),opacity .3s}
.tcard .card{--w:calc(var(--pw)*.58)}
.tcard .card .face{box-shadow:0 0 0 1.5px var(--acc),0 0 16px var(--accGlow),0 6px 10px rgba(0,0,0,.6)}
.tcard small{position:absolute;left:50%;top:100%;transform:translateX(-50%);margin-top:3px;font:600 8.5px/1 var(--cond);letter-spacing:.16em;text-transform:uppercase;white-space:nowrap;color:#FFE2B0;background:rgba(24,12,18,.8);padding:2px 5px;border-radius:99px}
.status{position:absolute;left:50%;bottom:6px;transform:translateX(-50%);z-index:5;max-width:min(94%,360px);text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
 font-size:12.5px;font-weight:700;padding:8px 16px;border-radius:99px;background:rgba(26,12,18,.84);box-shadow:inset 0 0 0 1px rgba(255,214,170,.22);transition:box-shadow .3s}
.status b{color:#FFE0A8;font-weight:800}
.status.mine{box-shadow:inset 0 0 0 1.5px var(--acc),0 0 18px -2px var(--accGlow)}
.status svg{width:13px;height:13px;vertical-align:-2px}
.banner{position:absolute;left:50%;top:50%;z-index:8;transform:translate(-50%,-50%);font:700 24px/1 var(--serif);padding:12px 20px;border-radius:16px;background:rgba(30,14,20,.93);box-shadow:inset 0 0 0 1.5px rgba(255,200,120,.6),0 18px 40px -10px rgba(0,0,0,.9);white-space:nowrap;pointer-events:none;animation:bannerin 1.8s ease both;text-align:center}
.banner small{display:block;font:600 11px/1.2 var(--cond);letter-spacing:.14em;text-transform:uppercase;margin-top:6px;color:#FFD9A8}
.banner svg{width:22px;height:22px;vertical-align:-3px}
@keyframes bannerin{0%{opacity:0;scale:.7}12%{opacity:1;scale:1.06}20%{scale:1}80%{opacity:1}100%{opacity:0}}
/* trump picker (Thaas) */
.pick{position:absolute;left:50%;top:50%;z-index:7;transform:translate(-50%,-50%);width:min(92%,300px);padding:14px 14px 12px;border-radius:20px;text-align:center;background:rgba(30,14,20,.94);box-shadow:inset 0 0 0 1.5px rgba(255,200,120,.55),0 20px 40px -10px rgba(0,0,0,.9);animation:rise .5s var(--spring) both}
.pick h3{margin:0;font:700 21px/1.1 var(--serif)}
.pick p{margin:4px 0 10px;font-size:12px;color:var(--muted)}
.pick .sg{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.pick .sg button{border:0;border-radius:13px;min-height:62px;background:#FFF8EA;color:#141414;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font:800 12px/1 Sora,sans-serif;box-shadow:0 3px 0 #b88a4a}
.pick .sg button svg{width:24px;height:24px}
.pick .sg button.H,.pick .sg button.D{color:#C4262E}
.pick .sg button span{color:#5a4030;font-size:11px}
/* you */
.me{position:relative;z-index:5;padding:0 0 calc(6px + env(safe-area-inset-bottom));background:linear-gradient(180deg,transparent,rgba(16,7,8,.85) 30%,#100708)}
.mebar{display:flex;align-items:center;gap:10px;padding:4px 12px 0;min-height:58px}
.meinfo{display:flex;align-items:center;gap:10px;min-width:0;flex:1}
.meav{--av:44px;flex:none}
.meinfo b{font-size:14px;display:block;line-height:1.15;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.meinfo .s{display:block;font-size:11px;opacity:.8;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.meinfo>div{min-width:0}
.acts{display:flex;gap:8px;flex:none;align-items:center}
.acts .btn{min-width:88px}
.yt{font:600 13px/1 var(--cond);letter-spacing:.22em;text-transform:uppercase;color:var(--accInk);background:var(--accBtn);padding:11px 15px 11px 18px;border-radius:99px;box-shadow:0 4px 0 var(--accEdge),0 0 22px var(--accGlow);animation:ytp 2.2s ease-in-out infinite,ytin .6s var(--spring) both;white-space:nowrap}
@keyframes ytp{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}
@keyframes ytin{from{opacity:0;translate:0 10px}}
.hand{position:relative;height:calc(var(--cw)*1.4 + 30px);margin:0 4px;touch-action:none;contain:layout}
.hand .card{transition:transform .5s var(--spring),filter .25s;will-change:transform;cursor:pointer;touch-action:none}
.hand .card.nt{transition:none}
.hand .card.off{filter:brightness(.42) saturate(.45);cursor:default}
.hand .card.sel .face{box-shadow:inset 0 0 0 2.5px var(--acc),0 0 0 2px var(--accGlow),0 0 24px var(--accGlow),0 8px 16px -6px rgba(0,0,0,.7)}
.hand .card.dragging{transition:none;z-index:200!important}
.hand .card .rib{position:absolute;left:50%;bottom:calc(var(--w)*.06);transform:translateX(-50%);z-index:2;font:600 7.5px/1 var(--cond);letter-spacing:.14em;text-transform:uppercase;background:var(--accBtn);color:var(--accInk);padding:2px 4px;border-radius:99px;white-space:nowrap}
.hand .empty{position:absolute;inset:0;display:grid;place-items:center;font:italic 500 16px/1.3 var(--serif);color:#FFE2C4;text-align:center;padding:0 20px}
.fx{position:fixed;inset:0;pointer-events:none;z-index:60}
.fly{position:fixed;left:0;top:0;will-change:transform}
.fly .card{position:absolute;inset:0;width:100%;height:100%}
/* ================= overlays, sheets, toasts ================= */
.ov{position:fixed;inset:0;z-index:40;display:none;align-items:center;justify-content:center;padding:16px;background:rgba(14,6,10,.7)}
.ov.show{display:flex;animation:fade .35s ease .35s both}
#rov.show{z-index:45;animation-delay:0s}
@keyframes fade{from{opacity:0}}
.ovc{background:linear-gradient(180deg,#2c1b1b,#1a0f10);color:var(--ink);border-radius:26px;padding:22px 18px 18px;width:100%;max-width:440px;max-height:92dvh;overflow:auto;-webkit-overflow-scrolling:touch;text-align:center;box-shadow:0 30px 70px -20px rgba(0,0,0,.95),inset 0 0 0 1px rgba(255,200,120,.2);animation:rise .7s var(--spring) .4s both}
#rov .ovc{animation-delay:.05s}
@keyframes rise{from{transform:translateY(40px) scale(.94);opacity:0}}
.ovc h2{font:700 27px/1.1 var(--serif)}
.pairav{display:flex;justify-content:center;margin:0 auto 12px}
.pairav .mini{width:62px;height:62px}.pairav .mini+.mini{margin-left:-14px}
.why{margin-top:6px;font-size:13px;color:var(--muted)}
.why b{color:#fff}
.tags{display:flex;justify-content:center;gap:6px;flex-wrap:wrap;margin-top:10px}
.tag2{font:600 12px/1 var(--cond);letter-spacing:.14em;text-transform:uppercase;padding:7px 11px;border-radius:99px;background:var(--accBtn);color:var(--accInk);box-shadow:0 2px 0 var(--accEdge);animation:pop .6s var(--spring) .8s both}
.tag2.plain{background:rgba(255,255,255,.08);color:#FFE2B0;box-shadow:inset 0 0 0 1px var(--edge)}
.earn{margin-top:10px;font-weight:700;font-size:13px}
.tenrow{display:flex;justify-content:center;gap:8px;margin:14px 0 2px}
.tenrow>span{position:relative;width:44px;height:62px}
.tenrow .card{--w:44px;animation:pop .6s var(--spring) both;animation-delay:calc(.6s + var(--i)*.08s)}
.tenrow em{position:absolute;left:50%;top:100%;transform:translateX(-50%);margin-top:4px;font:600 9px/1 var(--cond);letter-spacing:.12em;text-transform:uppercase;font-style:normal;padding:3px 6px;border-radius:99px;white-space:nowrap}
.tenrow em.u{background:var(--us);color:#10302c}.tenrow em.t{background:var(--them);color:#3a1208}
@keyframes pop{from{transform:translateY(22px) rotate(-10deg) scale(.8);opacity:0}}
.tscore{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:22px 0 14px}
.tbox{border-radius:16px;padding:10px;background:#231514;box-shadow:inset 0 0 0 1px rgba(255,255,255,.06);display:flex;flex-direction:column;align-items:center;gap:6px}
.tbox.w{box-shadow:inset 0 0 0 1.5px var(--tc)}
.tbox .pr{display:flex}.tbox .pr .mini{width:30px;height:30px}.tbox .pr .mini+.mini{margin-left:-8px}
.tbox b{font:800 30px/1 var(--serif);color:var(--tc)}
.tbox small{font:600 9.5px/1 var(--cond);letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.tbox .bar{width:100%;height:6px;border-radius:6px;background:rgba(255,255,255,.08);overflow:hidden}
.tbox .bar i{display:block;height:100%;background:var(--tc);border-radius:6px;transition:width .8s var(--out)}
.tbox.us{--tc:var(--us)}.tbox.them{--tc:var(--them)}
.sheet{position:fixed;inset:0;background:rgba(10,4,8,.6);display:none;align-items:flex-end;justify-content:center;z-index:70}
.sheet.open{display:flex}
.sheet-b{background:linear-gradient(180deg,#2c1b1b,#1a0f10);color:var(--ink);width:100%;max-width:540px;border-radius:24px 24px 0 0;padding:14px 18px calc(22px + env(safe-area-inset-bottom));max-height:88dvh;overflow:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;animation:up .5s var(--spring);box-shadow:inset 0 1px 0 rgba(255,255,255,.1)}
.sheet-b h2{font:700 26px/1.15 var(--serif)}
@keyframes up{from{transform:translateY(100%)}}
.grab{width:40px;height:4px;border-radius:4px;background:rgba(255,255,255,.2);margin:0 auto 14px}
.rules p{color:#E6CDB8;font-size:13.5px;margin:8px 0}
.rules p b{color:#fff}
.rules h3{font:600 12px/1 var(--cond);letter-spacing:.18em;text-transform:uppercase;margin:18px 0 4px;color:#FFD9A8}
.tabs2{display:flex;gap:5px;padding:4px;border-radius:14px;background:#170d0c;box-shadow:inset 0 0 0 1px var(--edge);margin:12px 0 4px}
.tabs2 button{flex:1;border:0;min-height:44px;border-radius:11px;background:transparent;color:var(--muted);font-weight:800;cursor:pointer}
.tabs2 button[aria-pressed="true"]{background:var(--accBtn);color:var(--accInk)}
/* pictures in How to play */
.fig{margin:10px 0 4px;padding:12px 10px 10px;border-radius:16px;background:radial-gradient(120% 100% at 50% 0%,#4a2a22,#221412);box-shadow:inset 0 0 0 1px rgba(255,200,120,.16);display:flex;flex-direction:column;align-items:center;gap:8px}
.fig .cr{display:flex;align-items:flex-end;justify-content:center;gap:6px;flex-wrap:wrap;padding-bottom:14px}
.fig .mc{position:relative;width:38px;height:53px;flex:none}
.fig .mc .card{--w:38px}
.fig .mc.dim .card{filter:brightness(.45) saturate(.4)}
.fig .mc.glow .face{box-shadow:0 0 0 2px var(--acc),0 0 16px var(--accGlow)}
.fig .mc.up{transform:translateY(-8px)}
.fig .mc em{position:absolute;left:50%;top:100%;transform:translateX(-50%);margin-top:3px;font:600 8.5px/1 var(--cond);letter-spacing:.1em;text-transform:uppercase;font-style:normal;white-space:nowrap;padding:2px 5px;border-radius:99px;background:rgba(0,0,0,.4);color:#FFE2B0}
.fig .mc em.u{background:var(--us);color:#10302c}.fig .mc em.t{background:var(--them);color:#3a1208}
.fig .arrow{align-self:center;font-size:18px;color:var(--acc);padding:0 2px}
.fig figcaption{font-size:12px;color:#F2DCC8;text-align:center;line-height:1.4}
.fig figcaption b{color:#FFD88E}
.fig .koat{display:flex;gap:4px}.fig .koat i{width:14px;height:20px;border-radius:3px;background:var(--us);box-shadow:0 1px 0 rgba(0,0,0,.4)}.fig .koat i.o{background:rgba(255,255,255,.12)}
.fig .sgf{display:flex;gap:5px}.fig .sgf span{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:#FFF8EA;color:#141414}.fig .sgf span svg{width:18px;height:18px}.fig .sgf span.H,.fig .sgf span.D{color:#C4262E}.fig .sgf span.on{box-shadow:0 0 0 2px var(--acc),0 0 14px var(--accGlow)}
.sheet .row{margin-top:12px}
.sheet .row .btn{flex:1}
.mlist{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.hist{margin:12px 0 0;display:flex;flex-direction:column;gap:6px}
.hist div{display:flex;justify-content:space-between;gap:10px;font-size:12.5px;padding:8px 12px;border-radius:12px;background:#231514}
.hist .u{color:var(--us);font-weight:800}.hist .t{color:var(--them);font-weight:800}
.toast{position:fixed;left:50%;top:calc(14px + env(safe-area-inset-top));transform:translateX(-50%);background:#FFF1DC;color:#2B1305;padding:10px 16px;border-radius:13px;font-size:13px;font-weight:600;z-index:80;max-width:90vw;box-shadow:0 12px 30px -10px rgba(0,0,0,.8);display:none}
.toast.show{display:block;animation:drop .5s var(--spring)}
@keyframes drop{from{transform:translate(-50%,-20px);opacity:0}}
@media (max-height:640px){.mebar{min-height:50px}.meav{--av:38px}.status{font-size:12px;padding:7px 13px}.chip{min-height:34px}.hud{padding-top:4px}}
@media (max-width:350px){.chip{padding-right:8px;gap:5px}.chip.tr .big{width:26px;height:26px}.chip b{font-size:11.5px}.match>span{gap:6px;padding:6px 10px}}
@media (prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}.embers{display:none}}
/* ================= online (shared/net.js): the sunset jetty, lantern gold on dusk ================= */

<script>
/* =====================================================================
   ENGINE: Dhihaeh + Thaas (Dhivehi Games). Pure: no DOM, no clock, no Math.random.
   One plain state object N changes only through E.step(N, type, arg, who) -> true/false.
   Randomness comes from a seeded RNG whose whole state is the integer N.rs, so a state can be
   saved, sent over the network and replayed exactly. Online (phase 2): the host runs step() for
   everyone and sends E.view(N, seat) to each player (other hands hidden).
   ===================================================================== */
const E=(function(){
'use strict';
const SUITS=['S','H','C','D'];
const P=c=>{const i=c.indexOf('-');return{r:+c.slice(0,i),s:c.slice(i+1)};};
const rs=c=>P(c).s,rr=c=>P(c).r;
function rnd(N){let a=N.rs=(N.rs+0x6D2B79F5)|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;}
function deck(){const d=[];SUITS.forEach(s=>{for(let r=2;r<=14;r++)d.push(r+'-'+s);});return d;}
function shuffle(N,a){for(let i=a.length-1;i>0;i--){const j=Math.floor(rnd(N)*(i+1));const x=a[i];a[i]=a[j];a[j]=x;}return a;}
const team=k=>k&1;
function create(o){const seed=(o.seed>>>0)||1;
 return{v:1,game:'dhihaeh',mode:o.mode==='thaas'?'thaas':'dhihaeh',target:o.target||5,seed:seed,rs:seed|0,gid:o.gid||('g'+seed.toString(36)),
  players:o.players.map(p=>Object.assign({},p)),score:[0,0],handNo:0,dealer:-1,status:'lobby',phase:'',
  hands:[[],[],[],[]],stock:[],trump:null,tcard:null,tshown:false,chooser:-1,trick:[],led:null,turn:-1,leader:-1,
  tricks:[0,0],taken:[0,0,0,0],tens:[0,0],tenBy:{},gone:[],voids:['','','',''],res:null,last:null,result:null,decided:-1,history:[],seq:0,move:null};}
function mv(N,t,p,c,x){N.seq=(N.seq|0)+1;N.move=Object.assign({seq:N.seq,t:t,p:p,c:c||[]},x||{});}
function deal(N){N.handNo++;N.dealer=N.handNo===1?Math.floor(rnd(N)*4):(N.dealer+1)%4;
 const d=shuffle(N,deck()),first=(N.dealer+1)%4;
 N.hands=[[],[],[],[]];N.stock=[];N.trick=[];N.led=null;N.tricks=[0,0];N.taken=[0,0,0,0];N.tens=[0,0];N.tenBy={};N.gone=[];N.voids=['','','',''];N.res=null;N.last=null;N.result=null;N.decided=-1;
 N.trump=null;N.tcard=null;N.tshown=false;N.chooser=-1;
 if(N.mode==='dhihaeh'){
  /* one card at a time from the dealer's left; the 52nd card is the dealer's own and is turned up for trumps */
  for(let i=0;i<52;i++)N.hands[(first+i)%4].push(d[i]);
  N.tcard=d[51];N.trump=rs(d[51]);N.tshown=true;N.status='playing';N.phase='play';N.turn=first;N.leader=first;
  mv(N,'deal',N.dealer,[d[51]],{s:N.trump});}
 else{
  /* Thaas: five each, the player left of the dealer names trumps, then the rest */
  for(let i=0;i<20;i++)N.hands[(first+i)%4].push(d[i]);
  N.stock=d.slice(20);N.chooser=first;N.status='trump';N.phase='trump';N.turn=first;N.leader=first;mv(N,'deal5',N.dealer,[]);}}
/* legal cards for seat k right now */
function legal(N,k){const h=N.hands[k]||[];if(N.status!=='playing'||N.phase!=='play'||N.turn!==k)return [];if(!N.trick.length)return h.slice();
 const f=h.filter(c=>rs(c)===N.led);if(f.length)return f;
 if(N.mode==='dhihaeh'){const t=h.filter(c=>rs(c)===N.trump);if(t.length)return t;}
 return h.slice();}
const SN={S:'spades',H:'hearts',C:'clubs',D:'diamonds'};
function whyNot(N,k,c){if(N.status!=='playing'||N.phase!=='play')return 'Wait a moment.';if(N.turn!==k)return 'It is not your turn.';
 const h=N.hands[k];if(!h.includes(c))return 'Choose a card from your hand.';if(legal(N,k).includes(c))return '';
 if(h.some(x=>rs(x)===N.led))return 'You must follow suit: play a '+SN[N.led].slice(0,-1)+'.';
 return 'No '+SN[N.led]+'? You must play a trump ('+SN[N.trump]+').';}
/* does card a beat the card b that is currently winning? */
function beats(a,b,tr){const x=P(a),y=P(b);if(x.s===y.s)return x.r>y.r;return x.s===tr;}
function winnerOf(trick,tr){let w=trick[0];for(let i=1;i<trick.length;i++)if(beats(trick[i].c,w.c,tr))w=trick[i];return w;}
function endHand(N){let w,by;
 if(N.mode==='dhihaeh'){if(N.tens[0]>=3){w=0;by='tens';}else if(N.tens[1]>=3){w=1;by='tens';}else{w=N.tricks[0]>=7?0:1;by='tricks';}}
 else{w=N.tricks[0]>=7?0:1;by='koatey';}
 const baga=N.mode==='dhihaeh'&&N.tens[w]===4,huk=N.mode==='dhihaeh'&&N.tricks[w]===13,pts=1+(baga?1:0)+(huk?1:0);
 N.score[w]+=pts;N.result={w:w,by:by,pts:pts,baga:baga,huk:huk,tens:N.tens.slice(),tricks:N.tricks.slice(),tenBy:Object.assign({},N.tenBy),trump:N.trump,dealer:N.dealer};
 N.history.push({h:N.handNo,w:w,pts:pts,by:by,baga:baga,huk:huk,tricks:N.tricks.slice(),tens:N.tens.slice(),trump:N.trump});
 N.turn=-1;N.phase='';N.trick=[];N.led=null;
 if(N.score[w]>=N.target){N.status='over';N.result.champ=w;}else N.status='handover';
 mv(N,'end',w,[],{pts:pts});}
function step(N,type,arg,who){
 if(type==='start'){if(N.status!=='lobby')return false;deal(N);return true;}
 if(type==='next'){if(N.status!=='handover')return false;deal(N);return true;}
 if(type==='trump'){if(N.mode!=='thaas'||N.status!=='trump'||who!==N.chooser||SUITS.indexOf(arg)<0)return false;
  N.trump=arg;for(let i=0;i<N.stock.length;i++)N.hands[(N.chooser+i)%4].push(N.stock[i]);N.stock=[];
  N.status='playing';N.phase='play';N.turn=N.chooser;N.leader=N.chooser;mv(N,'trump',who,[],{s:arg});return true;}
 if(type==='play'){const c=Array.isArray(arg)?arg[0]:arg;if(typeof c!=='string'||whyNot(N,who,c))return false;
  const h=N.hands[who];h.splice(h.indexOf(c),1);
  if(!N.trick.length)N.led=rs(c);
  else if(rs(c)!==N.led){if(N.voids[who].indexOf(N.led)<0)N.voids[who]+=N.led;
   /* in Dhihaeh a player who neither follows nor trumps has shown they hold no trumps either */
   if(N.mode==='dhihaeh'&&rs(c)!==N.trump&&N.voids[who].indexOf(N.trump)<0)N.voids[who]+=N.trump;}
  if(c===N.tcard)N.tshown=false;
  N.trick.push({p:who,c:c});
  if(N.trick.length===4){const w=winnerOf(N.trick,N.trump).p;N.phase='resolve';N.res={w:w};N.turn=w;}
  else N.turn=(who+1)%4;
  mv(N,'play',who,[c]);return true;}
 if(type==='resolve'){if(N.status!=='playing'||N.phase!=='resolve'||!N.res)return false;
  const w=N.res.w,t=team(w),cards=N.trick.map(e=>e.c);const tens=[];
  N.tricks[t]++;N.taken[w]++;cards.forEach(c=>{N.gone.push(c);if(rr(c)===10){N.tens[t]++;N.tenBy[c]=t;tens.push(c);}});
  N.last={trick:N.trick,w:w};N.trick=[];N.led=null;N.res=null;
  let dec=false;if(N.mode==='dhihaeh'&&N.decided<0){if(N.tens[0]>=3)N.decided=0;else if(N.tens[1]>=3)N.decided=1;else if(N.tens[0]===2&&N.tens[1]===2&&(N.tricks[0]>=7||N.tricks[1]>=7))N.decided=N.tricks[0]>=7?0:1;dec=N.decided>=0;}
  mv(N,'take',w,cards,{tens:tens,from:N.last.trick,decided:dec?N.decided:-1});
  const done=N.mode==='thaas'?N.tricks[t]>=7:N.gone.length===52;
  if(done){const m=N.move;endHand(N);N.move.take=m;}
  else{N.phase='play';N.turn=w;N.leader=w;}
  return true;}
 return false;}
/* what seat k is allowed to see (for online play: other hands become counts) */
function view(N,k){const V=JSON.parse(JSON.stringify(N));V.hands=N.hands.map((h,i)=>i===k?h.slice():h.length);V.stock=N.stock.length;delete V.rs;delete V.seed;return V;}

/* =====================================================================
   COMPUTER PLAYERS. They only use what a real player at the table knows: their own hand, the cards
   already played, who has shown out of which suit, and the dealer's face-up trump card.
   They count trumps, feed tens to a partner who is sure to win, protect their own tens, win cheaply,
   never overtake a partner who is already safe, and in Thaas name the suit they are strongest in.
   ===================================================================== */
function know(N,k){const mine=new Set(N.hands[k]),seen=new Set(N.gone);N.trick.forEach(e=>seen.add(e.c));
 const U=deck().filter(c=>!mine.has(c)&&!seen.has(c));const at={};if(N.mode==='dhihaeh'&&N.tshown&&N.dealer!==k)at[N.tcard]=N.dealer;return{U:U,at:at};}
/* could seat o play card c on the current trick (led suit L)? */
function couldPlay(N,K,o,c,L){if(K.at[c]!=null&&K.at[c]!==o)return false;const s=rs(c);if(N.voids[o].indexOf(s)>=0)return false;
 if(s===L)return true;if(N.voids[o].indexOf(L)>=0)return true;
 /* not known to be void in the led suit: a trump is only a real threat when few of that suit are left */
 return K.U.filter(x=>rs(x)===L).length<=1;}
function threatened(N,K,ops,best,L){for(const c of K.U){if(!beats(c,best,N.trump))continue;for(const o of ops)if(couldPlay(N,K,o,c,L))return true;}return false;}
function botCard(N,k){const L=legal(N,k);if(L.length<=1)return L[0];const K=know(N,k),tr=N.trump,D=N.mode==='dhihaeh',part=(k+2)%4;
 const ten=c=>D&&rr(c)===10;
 const cost=c=>rr(c)+(ten(c)?30:0)+(rs(c)===tr?16:0);
 const byCost=a=>a.slice().sort((x,y)=>cost(x)-cost(y));
 const pos=N.trick.length;if(!pos)return lead(N,k,K,L);
 const after=[];for(let i=1;i<4-pos;i++)after.push((k+i)%4);const oppAfter=after.filter(o=>team(o)!==team(k));
 const best=winnerOf(N.trick,tr),led=N.led;
 const tensIn=N.trick.filter(e=>rr(e.c)===10).length;
 if(best.p===part&&!threatened(N,K,oppAfter,best.c,led)){
  /* partner is sure to win: give them a ten if we can, otherwise our cheapest card */
  if(D){const t=L.filter(c=>ten(c)&&(!beats(c,best.c,tr)||!threatened(N,K,oppAfter,c,led)));if(t.length)return t[0];}
  return discard(N,k,L,cost);}
 const win=L.filter(c=>beats(c,best.c,tr));
 const safe=win.filter(c=>!threatened(N,K,oppAfter,c,led));
 if(safe.length){if(D){const t=safe.filter(ten);if(t.length)return t[0];}return byCost(safe)[0];}
 if(win.length&&best.p!==part){
  const worth=!D||tensIn>0||L.some(ten)||N.mode==='thaas';
  if(worth){const nt=win.filter(c=>!ten(c)),pool=nt.length?nt:(tensIn?win:[]);
   if(pool.length){/* following suit: go high to shut the later players out; trumping: the lowest trump that wins */
    const fol=pool.filter(c=>rs(c)===led);if(fol.length)return fol.sort((a,b)=>rr(b)-rr(a))[0];return byCost(pool)[0];}}}
 return discard(N,k,L,cost);}
/* throw the least useful card: low, never a ten if avoidable, keep trumps, empty short suits */
function discard(N,k,L,cost){const h=N.hands[k],cnt={};h.forEach(c=>{cnt[rs(c)]=(cnt[rs(c)]||0)+1;});
 let best=L[0],bs=1e9;L.forEach(c=>{const v=cost(c)+(rs(c)!==N.led&&rs(c)!==N.trump?cnt[rs(c)]*.6:0)+(rr(c)>=13&&cnt[rs(c)]<=2?4:0);if(v<bs){bs=v;best=c;}});return best;}
function lead(N,k,K,L){const tr=N.trump,D=N.mode==='dhihaeh',part=(k+2)%4,opps=[(k+1)%4,(k+3)%4],h=N.hands[k];
 const uOf=s=>K.U.filter(c=>rs(c)===s);const trU=uOf(tr).length,myTr=h.filter(c=>rs(c)===tr).length;
 const oppTr=trU>0&&opps.some(o=>N.voids[o].indexOf(tr)<0);
 let best=L[0],bs=-1e9;
 L.forEach(c=>{const p=P(c),s=p.s,mineS=h.filter(x=>rs(x)===s),uS=uOf(s),boss=!uS.some(x=>rr(x)>p.r);let sc=0;
  if(s===tr){
   if(!oppTr)sc-=18+p.r*.3;
   else if(boss&&myTr>=Math.ceil(trU/2))sc+=28+(D&&p.r===10?18:0);  /* draw their trumps with the top one */
   else if(myTr>=4)sc+=4-p.r*.4;                                      /* long in trumps: lead a small one */
   else sc-=12+p.r*.5;}
  else{
   const oppRuff=oppTr&&opps.some(o=>N.voids[o].indexOf(s)>=0&&N.voids[o].indexOf(tr)<0);
   const partRuff=N.voids[part].indexOf(s)>=0&&N.voids[part].indexOf(tr)<0&&trU>0;
   if(boss&&uS.length){sc+=20+(D&&p.r===10?26:0)+(uS.length>=3?6:0);if(oppRuff)sc-=45;else if(uS.length<=2&&oppTr)sc-=14;}
   else if(boss){sc+=D&&p.r===10?30:6;}
   else{sc+=4-p.r*.55+mineS.length*1.4;
    if(D&&p.r===10)sc-=40;                                             /* never lead an unguarded ten */
    if(D&&mineS.some(x=>rr(x)===10)&&mineS.length<=3)sc-=10;          /* keep the suit that guards our ten */
    if(D&&uS.some(x=>rr(x)===10)&&mineS.length>=2&&p.r<10)sc+=3;      /* smoke out a ten */
    if(partRuff&&!oppRuff)sc+=18;if(oppRuff)sc-=25;}}
  if(sc>bs){bs=sc;best=c;}});
 return best;}
function botTrump(N,k){const h=N.hands[k];let best='S',bs=-1;SUITS.forEach(s=>{const cs=h.filter(c=>rs(c)===s);let v=cs.length*3;cs.forEach(c=>{const r=rr(c);v+=r===14?4:r===13?3:r===12?2:r===11?1:0;});if(v>bs){bs=v;best=s;}});return best;}
/* the next action for a computer seat, or null when it has nothing to do */
function bot(N,k){if(N.status==='trump'&&N.chooser===k)return{type:'trump',arg:botTrump(N,k)};
 if(N.status==='playing'&&N.phase==='play'&&N.turn===k){const c=botCard(N,k);return c?{type:'play',arg:c}:null;}return null;}
return{SUITS:SUITS,P:P,create:create,step:step,legal:legal,whyNot:whyNot,beats:beats,winnerOf:winnerOf,view:view,bot:bot,botCard:botCard,botTrump:botTrump,team:team,deck:deck};
})();
</script>
<script>
(function(){
'use strict';
/* =====================================================================
   UI + HOST LOOP (solo vs computer). act() -> E.step on a clone -> commit() -> render + events.
   ===================================================================== */
const $=s=>document.querySelector(s);
const app=$('#app');
const Q=new URLSearchParams(location.search);
const LOCAL=/^(localhost|127\.0\.0\.1|\[::1\])$/.test(location.hostname)||/\.(localhost|test)$/.test(location.hostname);
const FAST=LOCAL&&Q.has('fast'),AUTO=LOCAL&&Q.has('auto'),TEST=FAST||AUTO;
const reduce=!!(window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches);
const ls={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}},del(k){try{localStorage.removeItem(k)}catch(e){}}};

/* ---------- audio: soft WebAudio, Bodu Beru drum on the big moments. Off until you switch it on (shared key dd-sfx) ---------- */
const AU=(()=>{let ctx=null,out=null;
function get(){if(!ctx){const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return null;try{ctx=new AC({latencyHint:'interactive'});}catch(e){try{ctx=new AC();}catch(x){return null;}}out=ctx.createGain();out.gain.value=.8;out.connect(ctx.destination);}return ctx;}
function unlock(){if(document.hidden||!sfxOn())return;const c=get();if(!c)return;try{if(navigator.audioSession)navigator.audioSession.type='ambient';}catch(e){}if(c.state!=='running'){try{const p=c.resume();p&&p.catch&&p.catch(()=>{});}catch(e){}}}
function sleep(){if(ctx&&ctx.state==='running'){try{const p=ctx.suspend();p&&p.catch&&p.catch(()=>{});}catch(e){}}}
return{get:get,unlock:unlock,sleep:sleep,get out(){get();return out;}};})();
function sfxOn(){return ls.get('dd-sfx')==='1';}
const SFX=(()=>{let noise=null;
function nb(c){if(!noise){noise=c.createBuffer(1,c.sampleRate,c.sampleRate);const d=noise.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;}return noise;}
function burst(t,o){const c=AU.get();const f=o.f||2500,dur=o.dur||.09;const s=c.createBufferSource();s.buffer=nb(c);const fl=c.createBiquadFilter();fl.type=o.type||'bandpass';fl.frequency.setValueAtTime(f,t);if(o.sweep)fl.frequency.exponentialRampToValueAtTime(f*o.sweep,t+dur);fl.Q.value=o.q||.8;
const g=c.createGain();g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(o.vol||.3,t+.005);g.gain.exponentialRampToValueAtTime(.0001,t+dur);s.connect(fl);fl.connect(g);g.connect(AU.out);s.start(t,Math.random()*.5);s.stop(t+dur+.03);}
function tone(t,freq,dur,vol,type){const c=AU.get();const o=c.createOscillator(),g=c.createGain();o.type=type||'sine';o.frequency.value=freq;g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+.006);g.gain.exponentialRampToValueAtTime(.0001,t+dur);o.connect(g);g.connect(AU.out);o.start(t);o.stop(t+dur+.05);}
const hz=m=>440*Math.pow(2,(m-69)/12);
function bell(t,m,vol){const fr=hz(m);tone(t,fr,1,vol);tone(t,fr*2.76,.4,vol*.22);}
/* the big drum: a goatskin "dum" (pitch falls as the skin relaxes) and a sharp open-hand "ta" */
function dum(t,vol,p){const c=AU.get();p=p||96;const o=c.createOscillator(),g=c.createGain();o.frequency.setValueAtTime(p*1.6,t);o.frequency.exponentialRampToValueAtTime(p,t+.03);o.frequency.exponentialRampToValueAtTime(p*.62,t+.5);
 g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+.005);g.gain.exponentialRampToValueAtTime(.0001,t+.62);o.connect(g);g.connect(AU.out);o.start(t);o.stop(t+.7);
 burst(t,{f:180,type:'lowpass',dur:.14,vol:vol*.9});tone(t,p*2.3,.12,vol*.12);}
function ta(t,vol){burst(t,{f:1500,q:1.1,dur:.08,vol:vol});burst(t,{f:420,q:.9,dur:.12,vol:vol*.7});tone(t,210,.1,vol*.25);}
const ready=()=>{if(!sfxOn()||document.hidden)return null;const c=AU.get();if(!c||c.state!=='running')return null;return c.currentTime+.01;};
const rhythm=(t,pat,step,vol)=>pat.split('').forEach((x,i)=>{if(x==='D')dum(t+i*step,vol);else if(x==='d')dum(t+i*step,vol*.6,110);else if(x==='t')ta(t+i*step,vol*.5);});
return{
play(mine){const t=ready();if(t==null)return;burst(t,{f:2600,sweep:.5,dur:.12,vol:mine?.22:.12});burst(t+.1,{f:1100,type:'lowpass',dur:.09,vol:mine?.34:.18});},
deal(){const t=ready();if(t==null)return;for(let i=0;i<12;i++)burst(t+i*.05,{f:2800+Math.random()*700,sweep:.5,dur:.07,vol:.13});},
take(ours,ten){const t=ready();if(t==null)return;dum(t,ours?.42:.24,ours?104:88);if(ten)ta(t+.16,ours?.3:.18);},
reveal(){const t=ready();if(t==null)return;rhythm(t,'Dt.D',.14,.36);},
tick(){const t=ready();if(t==null)return;burst(t,{f:4200,dur:.03,vol:.12,q:2});},
turn(){const t=ready();if(t==null)return;bell(t,79,.06);bell(t+.1,84,.045);},
hand(won){const t=ready();if(t==null)return;if(won){rhythm(t,'D.tD.tDtD',.13,.44);[69,74,78].forEach((m,i)=>bell(t+1.1+i*.09,m,.08));}else rhythm(t,'D..d',.2,.3);},
match(won){const t=ready();if(t==null)return;/* a Bodu Beru roll that speeds up, then the big hit */
 let x=0;for(let i=0;i<14;i++){const g=.2*Math.pow(.86,i);x+=g;(i%3===2?ta:dum)(t+x,.2+i*.02,100);}dum(t+x+.18,.6,80);if(won)[62,66,69,74,78,81,86].forEach((m,i)=>bell(t+x+.3+i*.08,m,.12));}
};})();

 /* the turn clock (online): restarts whenever someone new has to act */
 if(!(mode==='online'&&!isHostOn())&&(!prev||N.turn!==prev.turn||N.status!==prev.status||N.phase!==prev.phase||N.seq!==prev.seq))N.turnAt=Date.now();

function schedule(){clearTimeout(botT);botT=null;clearTimeout(turnT);clearTimeout(warnT);turnT=warnT=null;if(!S||(document.hidden&&mode!=='online'))return;
 /* online guest: only the countdown (the host plays a timed-out card); ?auto test mode plays for us */
 if(mode==='online'&&!isHostOn()){const k=meIdx();if(k<0||actor()!==k)return;

 /* online host: 15 s for you (then a card is played for you), 15 s plus a moment for the network for the others */
 if(k===meIdx()){const left=Math.max(0,TURN_MS-(Date.now()-S.turnAt));turnT=setTimeout(()=>{if(S&&actor()===meIdx()){toast(S.status==='trump'?'Time up: trumps were named for you.':'Time up: a card was played for you.');autoPlay(meIdx());if(NET.strike(myId))seatToAI(myId,'afk');}},left);
  warnT=setTimeout(tickDown,Math.max(0,left-5000));}
 else{const left=Math.max(0,TURN_MS+GRACE-(Date.now()-S.turnAt));turnT=setTimeout(()=>autoRemote(k),left);}}
function tickDown(){if(!S||actor()!==meIdx()||meIdx()<0)return;const left=TURN_MS-(Date.now()-S.turnAt);const av=$('#meav');
 if(av){av.classList.toggle('warn',left<=5000&&left>2500);av.classList.toggle('hot',left<=2500);}
 if(left<=5000&&left>0){SFX.tick();warnT=setTimeout(tickDown,Math.min(1000,left));}}
function botMove(){botT=null;if(!S)return;const k=S.status==='trump'?S.chooser:S.turn;if(!isBot(k))return;const a=E.bot(S,k);if(!a||!act(a.type,a.arg,k)){const L=E.legal(S,k);if(L.length)act('play',L[0],k);}}
/* a timed-out turn: name the strongest suit, or play the lifted card if it is legal, else the computer's choice */
function autoPlay(k){if(!S||actor()!==k)return;if(S.status==='trump'){act('trump',E.botTrump(S,k),k);return;}
 if(k===meIdx()&&sel&&E.legal(S,k).includes(sel)){const c=sel;sel=null;act('play',c,k);return;}sel=null;
 const c=E.botCard(S,k);if(!c||!act('play',c,k)){const L=E.legal(S,k);if(L.length)act('play',L[0],k);}}

/* =====================================================================
   ONLINE (shared/net.js). 2 v 2 with 2 to 4 people: players pick seats in the waiting room (partners sit
   opposite; the host can move anyone) and every empty seat is played by the computer. The host runs
   E.step for everyone and sends each player E.view (only their own hand; the Dhihaeh trump card is face up
   for all). A player who leaves, loses connection or times out twice in a row is replaced by the computer
   FOR THE REST OF THE MATCH, so the teams stay 2 v 2 (they can't rejoin). If the host leaves mid-hand the
   next player takes over and that hand is dealt again (hand wins stay). Public joiners watch and play from
   the next match; private tables stay locked.
   ===================================================================== */
let NET=null,nextT=0,hostSel=null;
const isHostOn=()=>mode==='online'&&!!NET&&NET.isHost();
function lookOf(l){const o={ch:null,ring:''};if(!l||typeof l!=='object')return o;const A=DGA();try{if(A&&l.ch)o.ch=A.normalize(l.ch);}catch(e){}
 if(typeof l.ring==='string'&&/^f-[a-z0-9-]{1,24}$/.test(l.ring))o.ring=l.ring;return o;}
function autoRemote(k){if(!isHostOn()||!S||actor()!==k)return;const p=S.players[k];if(!p||p.bot)return;const tr=S.status==='trump';autoPlay(k);
 if(NET.strike(p.id))seatToAI(p.id,'afk');else NET.tell(p.id,{t:'timeout',tr:tr?1:0});}
/* the computer takes the seat until the match ends (teams stay 2 v 2) */
function seatToAI(pid,why){if(!isHostOn()||!S)return;const k=S.players.findIndex(p=>p.id===pid);if(k<0)return;const N=clone(S),p=N.players[k];if(p.gone)return;
 p.gone=1;p.bot=true;if(why==='afk')p.afk=1;commit(N);}
function hostAfter(){clearTimeout(nextT);if(!S)return;
 if(S.status==='over'){NET.matchOver();if(NET.hostAway())setTimeout(()=>{if(isHostOn())NET.retire();},3000);return;}
 if(S.status==='handover'){if(NET.hostAway()){setTimeout(()=>{if(isHostOn())NET.retire();},3000);return;}const h=S.handNo;nextT=setTimeout(()=>{if(isHostOn()&&S&&S.status==='handover'&&S.handNo===h){closeOv();hostNext();}},NEXT_MS);}}
function hostNext(){if(!isHostOn()||!S||S.status!=='handover')return;clearTimeout(nextT);act('next',null,0);}
function rid(){try{const a=new Uint32Array(2);crypto.getRandomValues(a);return a[0].toString(36)+a[1].toString(36);}catch(e){return Math.random().toString(36).slice(2);}}
function netStart(seats,opts,info){mode='online';clearTimeout(nextT);const m=opts.mode==='thaas'?'thaas':'dhihaeh',target=[3,5,7].includes(+opts.target)?+opts.target:TARGET;
 const byId={};seats.forEach(s=>{byId[s.id]=s;});const want=(info&&info.x&&Array.isArray(info.x.seats))?info.x.seats:[];
 const order=[null,null,null,null];want.slice(0,4).forEach((id,i)=>{if(id&&byId[id]&&!order.includes(id))order[i]=id;});
 seats.forEach(s=>{if(!order.includes(s.id)){const i=[0,2,1,3].find(j=>!order[j]);if(i!=null)order[i]=s.id;}});
 const taken=seats.map(s=>String(s.name||'').toLowerCase());const pool=BOTS.filter(b=>!taken.includes(b[0].toLowerCase()));let bi=0;
 const players=order.map((id,i)=>{if(id){const s=byId[id],l=id===myId?{ch:myChar(),ring:myRing()}:lookOf(s.look);return{id:id,name:s.name,ch:l.ch,ring:l.ring,col:i&1?'#FF9573':'#5EE0D0'};}
  const b=pool[bi++%pool.length];let ch=null;const A=DGA();if(A){try{ch=A.presets[b[1]]||A.random(b[0]);}catch(e){}}return{id:'bot'+i,name:b[0],bot:true,cpu:1,ch:ch,col:b[2]};});
 game=m;document.documentElement.dataset.mode=m;S=E.create({mode:m,players:players,seed:newSeed(),target:target,gid:'g'+rid()});S.online=1;
 closeSheet();buildTable();draw();openRules();
 nextT=setTimeout(()=>{if(isHostOn()&&S&&S.status==='lobby'){closeRules();act('start');}},5000);NET.sync();}
function netAction(pid,a){if(!S||!a||typeof a!=='object')return;const k=S.players.findIndex(p=>p.id===pid);if(k<0||S.players[k].bot)return;
 if(a.t==='play'&&typeof a.c==='string'){if(!act('play',a.c.slice(0,6),k))NET.sync();}
 else if(a.t==='trump'&&typeof a.s==='string'){if(!act('trump',a.s.slice(0,1),k))NET.sync();}}
function netDrop(pid,why){if(!isHostOn()||!S)return;seatToAI(pid,why);}
/* each player sees only their own hand (a watcher sees none); the seed and the RNG state never leave the host */
function viewFor(pid){if(!S)return null;return E.view(S,S.players.findIndex(p=>p.id===pid));}
function netState(v){if(!v||!Array.isArray(v.players))return;mode='online';const N=clone(v);if(N.turnAt)N.turnAt-=NET.skew();
 if(screen!=='table'||!S||S.gid!==N.gid){S=N;game=N.mode;document.documentElement.dataset.mode=N.mode;closeSheet();closeOv();buildTable();draw();schedule();
  if(N.status==='lobby')openRules();return;}
 if(N.status!=='lobby')closeRules();commit(N);}
/* I became the host: carry on from the last state; a hand in progress is dealt again (only the old host knew every hand) */
function netMigrate(o){mode='online';const v=o.view;if(!v){NET.again();return;}const N=clone(v);if(N.turnAt)N.turnAt-=o.skew||0;
 const goneIds=new Set((o.meta.players||[]).filter(p=>p.gone).map(p=>p.id));N.players.forEach(p=>{if(goneIds.has(p.id)){p.gone=1;p.bot=true;}});
 N.rs=newSeed()|0;S=N;if(screen!=='table')buildTable();
 if(N.status==='lobby'){draw();nextT=setTimeout(()=>{if(isHostOn()&&S&&S.status==='lobby'){closeRules();act('start');}},2500);NET.sync();return;}
 if(N.status==='playing'||N.status==='trump'){const M=clone(N);M.status='handover';M.handNo=Math.max(0,(M.handNo|0)-1);M.dealer=((M.dealer|0)+3)%4;S=M;hostNext();toast('The host left, so this hand was dealt again. Hand wins stay the same.',4500);return;}
 draw();hostAfter();NET.sync();}
function netLobby(){clearTimeout(nextT);clearTimeout(botT);clearTimeout(turnT);clearTimeout(warnT);closeOv();closeRules();closeSheet();S=null;if(screen==='table')renderHome();}
function netEnd(){clearTimeout(nextT);clearTimeout(botT);clearTimeout(turnT);clearTimeout(warnT);mode=null;closeOv();closeRules();closeSheet();S=null;document.documentElement.dataset.net='0';renderHome();}
/* ---------- waiting room: seats. T.x.seats = [pid|null] x4; seats 0+2 and 1+3 are partners ---------- */
const SEAT_ORDER=[0,2,1,3];
function seatsOf(T){const s=T.x&&Array.isArray(T.x.seats)?T.x.seats.slice(0,4):[];while(s.length<4)s.push(null);return s;}
function lobbyFix(T){const ids=T.players.filter(p=>!p.gone).map(p=>p.id);const s=seatsOf(T).map(id=>id&&ids.includes(id)?id:null);
 s.forEach((id,i)=>{if(id&&s.indexOf(id)!==i)s[i]=null;});
 ids.forEach(id=>{if(!s.includes(id)){const i=SEAT_ORDER.find(j=>!s[j]);if(i!=null)s[i]=id;}});T.x=Object.assign({},T.x||{},{seats:s});
 if(hostSel&&!ids.includes(hostSel))hostSel=null;}
function onLobbyMsg(pid,o){const T=NET.meta();if(!T)return;lobbyFix(T);const s=T.x.seats,i=+o.s;if(!(i>=0&&i<4))return;
 if(o.t==='sit'){if(s[i])return;const j=s.indexOf(pid);if(j>=0)s[j]=null;s[i]=pid;}
 else if(o.t==='put'&&pid===T.hostId){const id=String(o.id||'');const j=s.indexOf(id);if(j<0||j===i)return;const q=s[i];s[i]=id;s[j]=q||null;}}
function roomClick(d){const T=NET.meta();if(!T)return;
 if(d.a==='sit')NET.lobby({t:'sit',s:+d.s});
 else if(d.a==='pick'&&NET.isHost()){hostSel=hostSel===d.id?null:d.id;NET.sync();}
 else if(d.a==='put'&&NET.isHost()&&hostSel){NET.lobby({t:'put',id:hostSel,s:+d.s});hostSel=null;NET.sync();}}
const BOT_IC='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="7" width="16" height="12" rx="3.5"/><path d="M12 7V4"/><circle cx="9.3" cy="12.6" r="1.2" fill="currentColor" stroke="none"/><circle cx="14.7" cy="12.6" r="1.2" fill="currentColor" stroke="none"/><path d="M9.5 16h5"/></svg>';
function roomList(T,c){const s=seatsOf(T),P={};T.players.forEach(p=>{P[p.id]=p;});const mine=s.indexOf(c.me),host=c.host,sel=host?hostSel:null;
 const nm=i=>s[i]&&P[s[i]]?(s[i]===c.me?'You':P[s[i]].name):null;
 const team=t=>{const a=nm(t),b=nm(t+2);if(!a&&!b)return '2 computer players';if(a&&b)return esc(a)+' & '+esc(b);return esc(a||b)+' + computer';};

 let h=`<li class="dhs-sum">${team(0)} <span style="color:var(--dgn-muted)">vs</span> ${team(1)}<small>${humans<4?'Empty seats are played by the computer. ':''}${host?'Tap Move, then a seat, to arrange the players.':'Tap an empty seat to sit there.'}</small></li>`;

  [t,t+2].forEach(i=>{const id=s[i],p=id&&P[id];

   let btn='';if(host){if(sel&&sel!==id)btn=`<button class="sb pri" data-dgn="x" data-a="put" data-s="${i}">Swap here</button>`;else btn=`<button class="sb" data-dgn="x" data-a="pick" data-id="${esc(id)}" aria-pressed="${sel===id}">${sel===id?'Cancel':'Move'}</button>`;

   h+=`<li class="dhs t${t}x${sel===id?' sel':''}" data-pid="${esc(id)}"><span class="av">${c.avatar(p,38)}</span><span class="nm">${esc(p.name)}<small>Seat ${i+1}${tags}</small></span>${btn}</li>`;});});
