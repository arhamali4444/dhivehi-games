/* ---------- your hand ---------- */
const canAct=()=>S&&S.status==='playing'&&S.phase==='play'&&S.turn===meIdx()&&meIdx()>=0&&!AUTO;
function playable(c){return canAct()&&E.legal(S,meIdx()).includes(c);}
function renderHand(){const box=$('#hand');if(!box)return;const me=meIdx();const hand=me>=0?S.hands[me]:[];
 const hk=S.gid+':'+S.handNo;let dealt=false;if(handKey!==hk){handKey=hk;for(const id in cardEls)cardEls[id].remove();cardEls={};dealt=true;}
 order=sortHand(hand,S.trump);if(sel&&!(hand.includes(sel)&&playable(sel)))sel=null;
 for(const id in cardEls)if(!hand.includes(id)){cardEls[id].remove();delete cardEls[id];}
 let em=box.querySelector('.empty');const et=me<0&&mode==='online'&&S.status!=='lobby'?(NET&&NET.isWaiting()?'You play from the next match':'Watching live · the hands stay hidden'):'';
 if(et){if(!em){box.insertAdjacentHTML('beforeend','<div class="empty"></div>');em=box.querySelector('.empty');}if(em.textContent!==et)em.textContent=et;}else if(em)em.remove();
 const fresh=[];order.forEach(id=>{let el=cardEls[id];if(!el){el=document.createElement('div');el.className='card nt';el.dataset.id=id;el.innerHTML=faceHTML(id);el.setAttribute('role','button');el.tabIndex=0;box.appendChild(el);cardEls[id]=el;fresh.push(el);}
  const ok=playable(id),isT=S.trump&&P(id).s===S.trump;el.classList.toggle('off',canAct()&&!ok);el.classList.toggle('sel',sel===id);el.classList.toggle('trumpc',!!isT);
  const rib=S.mode==='dhihaeh'&&S.tshown&&id===S.tcard;let rb=el.querySelector('.rib');if(rib&&!rb)el.insertAdjacentHTML('beforeend','<span class="rib">Trump card</span>');else if(!rib&&rb)rb.remove();
  el.setAttribute('aria-label',cname(id)+(isT?', trump':'')+(canAct()?(ok?(sel===id?', selected':''):', can’t play now'):''));el.setAttribute('aria-disabled',String(canAct()&&!ok));});
 layoutHand();
 if(fresh.length&&!reduce&&!document.hidden&&(dealt||(S.move&&S.move.t==='trump')))dealIn(fresh);
 requestAnimationFrame(()=>{for(const id in cardEls)cardEls[id].classList.remove('nt');});}
function handCw(){const vw=Math.min(window.innerWidth,640),vh=window.innerHeight;let cw=Math.max(50,Math.min(88,vw*.17));if(vh<700)cw=Math.min(cw,60);if(vh<600)cw=Math.min(cw,54);return Math.round(cw);}
function layoutHand(){const box=$('#hand');if(!box||!S)return;const W=box.clientWidth||340,n=order.length;const cw=handCw();box.style.setProperty('--cw',cw+'px');
 const minStep=cw*.34;let rows=1;while(rows<2&&n>1&&(W-cw-8)/Math.max(1,Math.ceil(n/rows)-1)<minStep)rows++;
 const per=Math.ceil(n/Math.max(1,rows))||1,rowH=cw*.56;
 const hh=Math.round(cw*1.4+(rows-1)*rowH+(rows>1?26:32));if(box._h!==hh){box._h=hh;box.style.height=hh+'px';requestAnimationFrame(layoutArena);}
 order.forEach((id,i)=>{const el=cardEls[id];if(!el)return;const r=Math.floor(i/per),j=i%per,m=Math.min(per,n-r*per);
  const step=m>1?Math.min(cw*.6,(W-cw-8)/(m-1)):0,tot=cw+(m-1)*step,x0=(W-tot)/2,x=x0+j*step;
  const d=m>1?(j/(m-1)-.5)*2:0,rot=rows>1?d*2:d*7,y=12+r*rowH+(rows>1?d*d*3:d*d*11)+(sel===id?-20:0);
  el.style.zIndex=i+2;el.style.transform=`translate(${x.toFixed(1)}px,${y.toFixed(1)}px) rotate(${rot.toFixed(2)}deg)`;});}
function dealIn(els){if(!AR)return;const a=$('#arena').getBoundingClientRect(),cx=a.left+AR.cx,cy=a.top+AR.cy;SFX.deal();
 els.forEach((el,i)=>{if(!el.animate)return;const r=el.getBoundingClientRect();const dx=cx-(r.left+r.width/2),dy=cy-(r.top+r.height/2);
  el.animate([{translate:`${dx}px ${dy}px`,scale:'.5',opacity:0},{opacity:1,offset:.15},{translate:'0 0',scale:'1',opacity:1}],{duration:620,delay:100+i*Math.max(26,420/els.length),easing:SPRING,fill:'backwards'});});}
function bindHand(){const box=$('#hand');let drag=null;
 box.addEventListener('pointerdown',e=>{const el=e.target.closest('.card');if(!el||!cardEls[el.dataset.id])return;drag={id:el.dataset.id,el:el,sx:e.clientX,sy:e.clientY,moved:false,pid:e.pointerId};try{el.setPointerCapture(e.pointerId);}catch(x){}});
 box.addEventListener('pointermove',e=>{if(!drag||e.pointerId!==drag.pid)return;const dx=e.clientX-drag.sx,dy=e.clientY-drag.sy;
  if(!drag.moved){if(Math.hypot(dx,dy)<10||!playable(drag.id))return;drag.moved=true;drag.el.classList.add('dragging');drag.base=drag.el.style.transform;}
  drag.el.style.transform=drag.base+` translate(${dx}px,${dy}px) scale(1.06)`;});
 const end=(e,cancel)=>{if(!drag||e.pointerId!==drag.pid)return;const d=drag;drag=null;
  if(d.moved){d.el.classList.remove('dragging');const up=d.sy-e.clientY;if(!cancel&&up>70&&playable(d.id)){sel=null;playCard(d.id);return;}layoutHand();return;}
  if(!cancel)tapCard(d.id);};
 box.addEventListener('pointerup',e=>end(e,false));box.addEventListener('pointercancel',e=>end(e,true));
 box.addEventListener('keydown',e=>{const el=e.target.closest('.card');if(!el)return;if(e.key==='Enter'||e.key===' '){e.preventDefault();tapCard(el.dataset.id);}});}
function tapCard(id){if(!canAct()){if(S&&(S.status==='playing'||S.status==='trump')&&meIdx()>=0)toast(S.status==='trump'?(S.chooser===meIdx()?'Name trumps first.':'Trumps are being named.'):'Wait for your turn.');return;}
 if(!playable(id)){SFX.tick();toast(E.whyNot(S,meIdx(),id)||'You can’t play that card now.');buzz(20);return;}
 if(sel===id){playCard(id);return;}sel=id;buzz(4);SFX.tick();renderHand();renderActs();}
function playCard(c){const w=E.whyNot(S,meIdx(),c);if(w){toast(w);return;}sel=null;buzz(10);
 if(mode==='online'&&!isHostOn()){if(S._sent===S.seq)return;S._sent=S.seq;NET.send({t:'play',c:c});renderHand();renderActs();return;}
 if(mode==='online')NET.clear(myId);act('play',c);}
function nameTrump(s){if(!S||S.status!=='trump'||S.chooser!==meIdx())return;buzz(8);
 if(mode==='online'&&!isHostOn()){if(S._sent===S.seq)return;S._sent=S.seq;NET.send({t:'trump',s:s});return;}
 if(mode==='online')NET.clear(myId);act('trump',s);}
function renderActs(){const a=$('#acts');if(!a||!S)return;let h='';
 if(canAct())h=sel?'<button class="btn primary sm" data-a="playSel">Play</button>':'<span class="yt">Your turn</span>';
 if(a._h!==h){a.innerHTML=h;a._h=h;}}

/* ---------- motion: transform/opacity only, springs, skipped for reduced motion ---------- */
function rectOf(el){if(!el)return null;const r=el.getBoundingClientRect();if(!r.width)return null;return{x:r.left,y:r.top,w:r.width,h:r.height};}
function snap(){const o={hand:{},trick:{},av:{},tcard:rectOf($('#tcard'))};for(const id in cardEls)o.hand[id]=rectOf(cardEls[id]);document.querySelectorAll('#trick .tc').forEach(e=>o.trick[e.dataset.c]=rectOf(e));
 if(S)S.players.forEach((p,k)=>{o.av[k]=rectOf(avEl(k));});return o;}
function fly(from,to,inner,o){o=o||{};if(reduce||!from||!to||document.hidden)return;
 const W=from.w||60,H=W*1.4;const el=document.createElement('div');el.className='fly';el.style.width=W+'px';el.style.height=H+'px';el.innerHTML=`<div class="card" style="--w:${W}px">${inner}</div>`;$('#fx').appendChild(el);
 if(!el.animate){el.remove();return;}
 const sT=o.toAv?.35:(to.w/W),tx=to.x+to.w/2-W/2,ty=to.y+to.h/2-H/2;
 const an=el.animate([{transform:`translate(${from.x}px,${from.y}px) scale(1) rotate(${o.r0||0}deg)`,opacity:1},{transform:`translate(${tx}px,${ty}px) scale(${sT}) rotate(${o.r1||0}deg)`,opacity:o.toAv?0:1}],{duration:o.dur||600,delay:o.delay||0,easing:o.toAv?'cubic-bezier(.5,0,.3,1)':SPRING,fill:'both'});
 const fin=()=>el.remove();an.onfinish=fin;an.oncancel=fin;}
function flipIn(el,from,delay){if(reduce||!from||!el||!el.animate||document.hidden)return;const r=el.getBoundingClientRect();if(!r.width)return;
 const dx=from.x+from.w/2-(r.left+r.width/2),dy=from.y+from.h/2-(r.top+r.height/2),s=Math.max(.3,Math.min(1.6,from.w/r.width));
 el.animate([{translate:`${dx}px ${dy}px`,scale:String(s)},{translate:'0 0',scale:'1'}],{duration:540,delay:delay||0,easing:SPRING,fill:'backwards'});}
function beat(){const b=$('#beat i');if(!b||reduce)return;b.classList.remove('go');void b.offsetWidth;b.classList.add('go');}
function animate(prev,N,b){if(!prev||!N.move||(prev.move&&N.move.seq===prev.move.seq)||screen!=='table')return;const m=N.move,me=meIdx();
 if(m.t==='play'){const mine=m.p===me,c=m.c[0];SFX.play(mine);const el=document.querySelector(`#trick .tc[data-c="${c}"]`);if(!el)return;
  let from=mine?b.hand[c]:null;if(!from&&c===prev.tcard&&prev.tshown)from=b.tcard;if(!from&&b.av[m.p]){const a=b.av[m.p];from={x:a.x+a.w/2-10,y:a.y+a.h/2-14,w:20,h:28};}flipIn(el,from);}
 const T=m.t==='take'?m:(m.t==='end'&&m.take?m.take:null);
 if(T){const ours=(T.p&1)===myT();SFX.take(ours,(T.tens||[]).length>0);beat();const to=b.av[T.p]||rectOf(avEl(T.p));T.c.forEach((c,i)=>fly(b.trick[c],to,faceHTML(c),{toAv:true,delay:120+i*50,dur:560}));}}
/* ---------- game events: banners, reactions, drum ---------- */
function banner(t,sub,ms){const a=$('#arena');if(!a||document.hidden)return;const e=document.createElement('div');e.className='banner';e.innerHTML=t+(sub?`<small>${sub}</small>`:'');a.appendChild(e);setTimeout(()=>e.remove(),ms||1900);}
function popScore(t){const b=document.querySelector(`#match b[data-t="${t}"]`);if(b&&!reduce){b.classList.remove('pop');void b.offsetWidth;b.classList.add('pop');}}
function events(prev,N){if(!prev||!N.move||(prev.move&&prev.move.seq===N.move.seq))return;const m=N.move,me=meIdx(),part=(me+2)%4,nm=k=>esc(N.players[k].name);
 if(m.t==='deal'){SFX.reveal();setTimeout(()=>{if(S===N||S&&S.handNo===N.handNo)banner(`Trumps ${sv(N.trump).replace('<svg','<svg class="s'+N.trump+'" style="color:'+(N.trump==='H'||N.trump==='D'?'#FF6B7F':'#fff')+'"')}`,N.dealer===me?'Your last card is turned up':`${nm(N.dealer)}’s last card: the ${cname(N.tcard)}`,2200);},reduce?0:700);}
 if(m.t==='deal5'){SFX.deal();}
 if(m.t==='trump'){SFX.reveal();react(m.p,'smug');banner(`Trumps ${sv(m.s).replace('<svg','<svg style="color:'+(m.s==='H'||m.s==='D'?'#FF6B7F':'#fff')+'"')}`,m.p===me?'You named them':`Named by ${nm(m.p)}`);}
 const T=m.t==='take'?m:(m.t==='end'&&m.take?m.take:null);
 if(T){
  if(T.tens&&T.tens.length&&N.mode==='dhihaeh'){react(T.p,'happy');[(T.p+1)%4,(T.p+3)%4].forEach(k=>react(k,T.tens.length>1?'shocked':'sad',1400));}
  else if(N.mode==='thaas'&&N.tricks[T.p&1]===6&&m.t==='take')react(T.p,'smug');
  if(T.decided>=0&&m.t==='take')setTimeout(()=>banner(me<0&&mode==='online'?esc(teamNames(T.decided))+' have the hand':T.decided===myT()?'The hand is yours':'They have the hand',N.tens[T.decided]>=3?'3 tens · play on for baga':'7 tricks · play on',2200),650);}
 if(m.t==='end'){const r=N.result,won=r.w===myT();popScore(r.w);
  setTimeout(()=>{if(r.huk)banner('Hukunbunye!','All 13 tricks',2000);else if(r.baga)banner('Baga!','All four tens',2000);else if(N.mode==='thaas')banner('Koatey!',won?'Your team takes 7':'They take 7',1800);},300);
  N.players.forEach((p,k)=>{if(k===me&&!AUTO)return;setTimeout(()=>react(k,(k&1)===r.w?'laugh':'sad',2200),500);});}
 if(N.status==='playing'&&N.phase==='play'&&N.turn===me&&me>=0&&!(prev.status==='playing'&&prev.phase==='play'&&prev.turn===me))setTimeout(()=>{if(S&&S.turn===meIdx()&&S.phase==='play')SFX.turn();},150);
 if(N.status==='trump'&&N.chooser===me&&prev.status!=='trump')setTimeout(()=>SFX.turn(),300);}
function handAward(){if(!S||!S.result||meIdx()<0||(mode==='online'&&S.players[meIdx()].gone))return null;const r=S.result,won=r.w===(meIdx()&1);let tot=null;
 const add=a=>{if(!a)return;tot=tot||{sh:0,capped:false};tot.sh+=a.sh;tot.capped=tot.capped||a.capped;};
 if(won)add(award('dhihaeh:'+S.gid+':'+S.handNo,4+r.pts*3));
 if(S.status==='over')add(award('dhihaeh:'+S.gid+':m',won?35:10));return tot;}
/* ---------- hand and match results ---------- */
function closeOv(){const o=$('#ov');o.classList.remove('show');o.innerHTML='';o._k=null;}
const pairAv=t=>S.players.map((p,k)=>({p,k})).filter(x=>(x.k&1)===t).map(x=>avatarHTML(x.p,x.k,62)).join('');
function teamBoxes(w){const mt=myT(),watch=mode==='online'&&meIdx()<0;const tn=t=>watch?esc(teamNames(t)):t===mt?'Your team':'Them';
 return `<div class="tscore">${[mt,1-mt].map(t=>`<div class="tbox ${t!==mt?'them':'us'}${w===t?' w':''}"><div class="pr">${S.players.map((p,k)=>(k&1)===t?avatarHTML(p,k,30):'').join('')}</div><b>${S.score[t]}</b><small>${tn(t)}</small><div class="bar"><i style="width:${Math.min(100,S.score[t]/S.target*100)}%"></i></div></div>`).join('')}</div>`;}
function renderOv(){const o=$('#ov');if(S.status!=='handover'&&S.status!=='over'){if(o._k)closeOv();return;}
 const k=S.status+S.handNo+S.gid;if(o._k===k)return;o._k=k;const aw=handAward();const r=S.result,me=meIdx(),vm=vIdx(),mt=myT(),won=r.w===mt,over=S.status==='over',D=S.mode==='dhihaeh',watch=mode==='online'&&me<0;
 const pn=esc(S.players[(vm+2)%4].name);
 let head=over?(won?'You win the match!':'They win the match'):(won?'Your team wins the hand':'They win the hand');
 if(watch)head=esc(teamNames(r.w))+(over?' win the match':' win the hand');
 let why='';if(D){why=r.by==='tens'?`<b>${r.tens[r.w]} tens</b> to ${r.tens[1-r.w]} · tricks ${r.tricks[mt]}–${r.tricks[1-mt]}`:`Tens split 2–2 · <b>${r.tricks[r.w]} tricks</b> to ${r.tricks[1-r.w]}`;}
 else why=`<b>Koatey</b>: ${r.w===mt?'your team':'they'} took 7 tricks · ${r.tricks[mt]}–${r.tricks[1-mt]}`;
 if(over)why=`${watch?esc(teamNames(r.w)):won?`You and ${pn}`:'They'} reached <b>${S.target} hand wins</b> · `+why;
 const tags=[];if(r.baga)tags.push('<span class="tag2">Baga +1</span>');if(r.huk)tags.push('<span class="tag2">Hukunbunye +1</span>');tags.push(`<span class="tag2 plain">${r.w===mt||watch?'+':''}${r.pts} hand win${r.pts>1?'s':''}${r.w===mt||watch?'':' to them'}</span>`);
 const tens=D?`<div class="tenrow" aria-label="Where the tens went">${['S','H','C','D'].map((s,i)=>{const t=r.tenBy['10-'+s];return `<span><span class="card" style="--i:${i}">${faceHTML('10-'+s)}</span><em class="${t===mt?'u':'t'}">${t===mt?'Us':'Them'}</em></span>`;}).join('')}</div>`:'';
 o.innerHTML=`<div class="ovc"><div class="pairav">${pairAv(r.w)}</div><h2>${head}</h2><div class="why">${why}</div><div class="tags">${tags.join('')}</div>${tens}
${aw&&aw.sh>0?`<div class="earn">+${aw.sh} ${HI.shell} Boli${aw.capped?' (daily limit reached)':''}</div>`:aw&&aw.capped?'<div class="earn muted">Daily Boli limit reached</div>':''}
${teamBoxes(over?r.w:-1)}
${mode!=='online'?`<button class="btn primary wide" data-a="${over?'again':'next'}">${over?'Play again':'Deal hand '+(S.handNo+1)}</button>
<button class="btn ghost wide" style="margin-top:8px" data-a="leave">${over?'Back to home':'Save and exit'}</button>`
 :(isHostOn()?`<button class="btn primary wide" data-a="${over?'netAgain':'next'}">${over?'Play again':'Deal hand '+(S.handNo+1)}</button>`
  :`<p class="muted" style="font-size:13px;margin:10px 0 0">${over?(me<0?'The next match starts soon.':'Waiting for the host to start the next match…'):'The next hand starts in a moment…'}</p>`)
 +`<button class="btn ghost wide" style="margin-top:8px" data-a="netLeave">Leave table</button>`}</div>`;
 o.classList.add('show');setTimeout(()=>{if(over)SFX.match(won);else SFX.hand(won);},500);
 if(AUTO&&!over&&mode!=='online')setTimeout(()=>{if(S&&S.status==='handover'){closeOv();act('next');}},FAST?150:1400);}

/* ---------- sheets, toasts, menu ---------- */
function sheet(h){$('#sheetB').innerHTML=h;$('#sheet').classList.add('open');}
function closeSheet(){$('#sheet').classList.remove('open');}
let toastT=0;function toast(t,ms){const e=$('#toast');e.textContent=t;e.classList.remove('show');void e.offsetWidth;e.classList.add('show');clearTimeout(toastT);toastT=setTimeout(()=>e.classList.remove('show'),ms||2600);}
function openMenu(){if(!S)return;const me=myT();
 const hist=S.history.slice(-6).reverse().map(h=>`<div><span>Hand ${h.h} · ${suitI(h.trump)}</span><span>${h.w===me?'<span class="u">Us</span>':'<span class="t">Them</span>'} +${h.pts}${h.huk?' · hukunbunye':h.baga?' · baga':''} · ${h.tricks[me]}–${h.tricks[1-me]} tricks</span></div>`).join('');
 sheet(`<div class="grab"></div><h2>${MODEN[S.mode]}</h2><p class="muted" style="margin:4px 0 0">${S.status==='lobby'?'Not started':'Hand '+S.handNo} · first team to ${S.target} hand wins</p>
${S.handNo?teamBoxes(-1):''}${hist?`<div class="hist">${hist}</div>`:''}
<div class="mlist"><button class="btn soft wide" data-a="menuRules">Rules</button><button class="btn soft wide" data-a="howto">How to play</button><button class="btn soft wide" data-a="sfx" aria-pressed="${sfxOn()}">Sound: ${sfxOn()?'On':'Off'}</button>${mode==='online'?`<button class="btn ghost wide" data-a="netLeave">Leave table</button>${meIdx()>=0&&(S.status==='playing'||S.status==='trump')?'<p class="muted" style="font-size:12px;margin:2px 2px 0">If you leave, the computer plays your seat for the rest of this match and you can’t rejoin it.</p>':''}`
 :`<button class="btn ghost wide" data-a="leave">${S.status==='playing'||S.status==='trump'?'Leave (your game is saved)':'Back to home'}</button>`}</div>`);}
function toggleSfx(){ls.set('dd-sfx',sfxOn()?'0':'1');document.querySelectorAll('[data-a="sfx"]').forEach(b=>{b.setAttribute('aria-pressed',String(sfxOn()));if(b.classList.contains('btn'))b.textContent='Sound: '+(sfxOn()?'On':'Off');});if(sfxOn()){AU.unlock();setTimeout(()=>SFX.reveal(),80);}else AU.sleep();}
function leave(){clearTimeout(botT);clearTimeout(turnT);clearTimeout(warnT);if(mode==='online'&&NET&&NET.isOnline()){closeSheet();closeOv();NET.leave();return;}if(mode==='solo'&&S&&S.status!=='over'&&S.status!=='lobby')ls.set(saveKey(S.mode),JSON.stringify(S));closeSheet();closeRules();closeOv();if(S)setMode(S.mode);S=null;mode=null;renderHome();}

/* ---------- one click handler ---------- */
document.addEventListener('click',e=>{AU.unlock();const b=e.target.closest('[data-a]');if(!b)return;const a=b.dataset.a;
switch(a){
case 'mode':setMode(b.dataset.v);renderHome();break;
case 'online':if(NET)NET.open();else toast('Online play needs a newer browser.');break;
case 'netLeave':closeSheet();closeOv();if(NET&&mode==='online')NET.leave();else leave();break;
case 'netAgain':closeOv();if(NET)NET.again();break;
case 'rulesOk':closeRules();break;
case 'howto':openHowTo(S?S.mode:game);break;
case 'howTab':openHowTo(b.dataset.v);break;
case 'close':closeSheet();break;
case 'name':openName();break;
case 'saveName':saveName();break;
case 'solo':startSolo();break;
case 'resume':resume();break;
case 'rulesDeal':closeRules();if(mode!=='online'||isHostOn())act('start');break;
case 'menu':openMenu();break;
case 'menuRules':sheet(`<div class="grab"></div>${rulesCardHTML(S)}<div class="row"><button class="btn primary" data-a="close">Back to the game</button></div>`);break;
case 'sfx':toggleSfx();break;
case 'leave':leave();break;
case 'next':closeOv();if(mode==='online'){if(isHostOn())hostNext();}else act('next');break;
case 'again':{if(mode==='online'){closeOv();if(NET)NET.again();break;}const ps=S.players.map(p=>Object.assign({},p));closeOv();ls.del(saveKey(S.mode));const N=E.create({mode:S.mode,players:ps,seed:newSeed(),target:TARGET});N.sv=SAVE_V;S=N;mode='solo';handKey=null;draw();openRules();break;}
case 'playSel':if(sel)playCard(sel);break;
case 'trump':nameTrump(b.dataset.s);break;
}});
$('#sheet').addEventListener('click',e=>{if(e.target.id==='sheet')closeSheet();});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){if($('#sheet').classList.contains('open'))closeSheet();}if(e.key==='Enter'&&e.target&&e.target.id==='pnm')saveName();});
let rzT=0;window.addEventListener('resize',()=>{if(rzT)return;rzT=requestAnimationFrame(()=>{rzT=0;if(screen==='table'&&S){layoutHand();layoutArena();}});});
document.addEventListener('visibilitychange',()=>{if(document.hidden){AU.sleep();if(mode!=='online'){clearTimeout(botT);clearTimeout(turnT);clearTimeout(warnT);}}else if(S&&screen==='table')schedule();});

if(LOCAL)window.__dh={get S(){return S;},get mode(){return mode;},get NET(){return NET;},E:E,act:act,award:award,
 geom(){const a=$('#arena'),m=document.querySelector('main.table'),sc=$('#tsc');if(!a||!AR||!sc)return null;const ar=a.getBoundingClientRect(),mr=m.getBoundingClientRect();
  const t=(sc.style.transform.match(/-?[\d.]+/g)||[]).map(Number);const table={x:mr.left+t[0]+TBL.g[0]*t[2],y:mr.top+t[1]+TBL.g[1]*t[3]};
  const sl=S.players.map((p,k)=>{const q=slot(k);return{x:ar.left+q.x,y:ar.top+q.y};});
  return{table:table,trickCentre:{x:(sl[1].x+sl[3].x)/2,y:(sl[0].y+sl[2].y)/2},pw:AR.pw,vw:innerWidth,docW:document.documentElement.scrollWidth,
   seats:[...document.querySelectorAll('.seat')].map(e=>{const r=e.getBoundingClientRect();return[+e.dataset.k,Math.round(r.left),Math.round(r.top),Math.round(r.right),Math.round(r.bottom)];}),
   hud:$('#hud').getBoundingClientRect().bottom,hand:$('#hand').getBoundingClientRect().top,status:$('#status').getBoundingClientRect().top};},
 start(m){setMode(m||game);startSolo();closeRules();act('start');},

if(Q.has('mode'))setMode(game);
initNet();
if(NET&&/^[A-Z]{4}$/i.test(Q.get('t')||'')){renderHome();NET.boot();}   /* invite link ?t=CODE */
else if(LOCAL&&Q.get('play')==='1')startSolo();else{renderHome();if(NET)NET.boot();}
