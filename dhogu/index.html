<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="manifest" href="/manifest.webmanifest">
<title>Dhogu · Dhivehi Games</title>
<meta name="theme-color" content="#2A1B5E">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@500;600;700;800;900&family=Special+Elite&display=swap">
<style>
:root{--bg:#2A1B5E;--bg2:#3B2887;--bg3:#1B1142;--ink:#231942;--ink2:#4B3F72;--paper:#FFF9EF;--sun:#FFC93C;--sun2:#C98A0B;--coral:#D93645;--coral2:#9E1F2C;--teal:#087A6B;--teal2:#04574C;--mint:#3DDBB5;--pink:#FF7FAE;--sky:#56B6FF;--lav:#D9CFFF;--felt:#137A54;--felt2:#0B573B;--wood:#C27434;--wood2:#8C4B1C;--red:#D12F3D;--dock:#20154D;
 color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
[hidden]{display:none!important}
html{background:var(--bg3);height:100%;overflow-x:hidden;overflow-x:clip;overscroll-behavior-x:none}
body{margin:0;min-height:100%;color:#fff;font:16px/1.5 Nunito,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased;overflow-x:hidden;overflow-x:clip;
 background:radial-gradient(90% 55% at 50% 0%,#4A33A6 0%,var(--bg2) 38%,var(--bg) 72%,var(--bg3) 100%) fixed var(--bg)}
body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;background-image:radial-gradient(rgba(255,255,255,.075) 1.3px,transparent 1.8px);background-size:24px 24px}
#app{position:relative;z-index:1;min-height:100vh;min-height:100dvh}
button,input{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
:focus-visible{outline:3px solid #fff;outline-offset:3px}
.panel :focus-visible,.sheet :focus-visible{outline-color:var(--ink)}
h1,h2,h3{font-family:Fredoka,Nunito,system-ui,sans-serif}
/* ---------- buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:52px;padding:0 20px;border:0;border-radius:16px;font:600 17px/1.1 Fredoka,Nunito,sans-serif;letter-spacing:.01em;color:var(--ink);background:var(--sun);
 box-shadow:0 5px 0 var(--sun2),0 10px 18px rgba(0,0,0,.22);transition:transform .12s cubic-bezier(.34,1.56,.64,1),box-shadow .12s,filter .15s;text-decoration:none}
.btn:hover{filter:brightness(1.05)}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--sun2),0 4px 8px rgba(0,0,0,.2)}
.btn svg{width:20px;height:20px;flex:none}
.btn.coral{background:var(--coral);color:#fff;box-shadow:0 5px 0 var(--coral2),0 10px 18px rgba(0,0,0,.22)}
.btn.teal{background:var(--teal);color:#fff;box-shadow:0 5px 0 var(--teal2),0 10px 18px rgba(0,0,0,.22)}
.btn.soft{background:rgba(255,255,255,.12);color:#fff;box-shadow:inset 0 0 0 2px rgba(255,255,255,.22)}
.btn.soft:active{box-shadow:inset 0 0 0 2px rgba(255,255,255,.3)}
.panel .btn.soft,.sheet .btn.soft{background:#EEE7FF;color:var(--ink);box-shadow:0 4px 0 #C9BCF2}
.btn.w{width:100%}.btn.big{min-height:58px;font-size:19px}
.btn[disabled]{opacity:.55;cursor:default;transform:none;filter:grayscale(.3)}
.ib{flex:none;width:44px;height:44px;border-radius:14px;border:0;display:grid;place-items:center;background:rgba(255,255,255,.12);box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.18);color:#fff;text-decoration:none;transition:transform .15s cubic-bezier(.34,1.56,.64,1),background .15s}
.ib:hover{background:rgba(255,255,255,.2)}.ib:active{transform:scale(.9)}
.ib svg{width:22px;height:22px}
.ib[aria-pressed="true"]{background:var(--mint);color:var(--ink);box-shadow:none}
.ib.talk{position:relative}
/* ---------- top bar ---------- */
.top{display:flex;align-items:center;gap:8px;padding:12px 14px 0;max-width:560px;margin:0 auto;position:relative;z-index:3}
.me-pill{display:flex;align-items:center;gap:8px;min-width:0;height:44px;padding:4px 14px 4px 5px;border-radius:99px;background:rgba(255,255,255,.12);margin-right:auto}
.me-pill b{font-size:15px;font-weight:800;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ttl2{flex:1;text-align:center;font:600 18px Fredoka,sans-serif}
.boli{display:inline-flex;align-items:center;gap:6px;height:44px;padding:0 14px;border-radius:99px;background:rgba(255,255,255,.12);font-weight:800;font-size:15px}

.boli i{width:20px;height:20px}
.av{position:relative;flex:none;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:var(--c,#E5604D);box-shadow:0 0 0 2px rgba(255,255,255,.9)}
.av svg{width:21px;height:21px;fill:#fff}
/* ---------- cartoon faces ---------- */
.face{position:relative;display:block;flex:none;width:48px;height:48px;border-radius:50%;background:var(--c,#FFC93C);box-shadow:0 0 0 3px #fff,0 5px 0 2px rgba(0,0,0,.2);overflow:hidden;transition:box-shadow .2s}
.face svg{position:absolute;inset:0;width:100%;height:100%;display:block}
.face.big{width:50px;height:50px}
.face .mo,.face .sweat{display:none}.face .mn{display:inline}
.face[data-mood="shock"] .mn,.face[data-mood="smug"] .mn{display:none}
.face[data-mood="shock"] .mx,.face[data-mood="smug"] .ms,.face[data-mood="shock"] .sweat{display:inline}
.face[data-mood="shock"]{animation:wobble .55s}
.face[data-mood="smug"]{animation:hop .55s cubic-bezier(.34,1.56,.64,1)}
.face .eyes{transform-box:fill-box;transform-origin:center;animation:blink 4.7s infinite}
.opp:nth-child(2) .face .eyes,.sus:nth-child(2) .face .eyes{animation-delay:1.3s}
.opp:nth-child(3) .face .eyes,.sus:nth-child(3) .face .eyes{animation-delay:2.6s}
.opp:nth-child(4) .face .eyes,.sus:nth-child(4) .face .eyes{animation-delay:.7s}
.sus:nth-child(5) .face .eyes{animation-delay:3.4s}
@keyframes blink{0%,93%,100%{transform:scaleY(1)}95%{transform:scaleY(.12)}}
@keyframes wobble{20%{transform:rotate(-12deg)}40%{transform:rotate(10deg)}60%{transform:rotate(-6deg)}80%{transform:rotate(3deg)}}
@keyframes hop{40%{transform:translateY(-8px) scale(1.06)}}
@keyframes bob{50%{transform:translateY(-4px)}}
.fw{position:relative;display:inline-block}
.crown{position:absolute;top:-12px;right:-10px;width:24px;height:24px;z-index:2;rotate:18deg;filter:drop-shadow(0 2px 0 rgba(0,0,0,.25))}
.crown svg{width:100%;height:100%}
.vtalk{box-shadow:0 0 0 3px var(--mint),0 0 0 calc(4px + var(--vl,0)*8px) rgba(61,219,181,.45)!important}
/* ---------- lamp + flicker ---------- */
.lampw{position:relative;width:150px;margin:0 auto;pointer-events:none}
.lampw svg{display:block;width:100%;height:auto;overflow:visible}
.lampw .sway{transform-origin:80px 0;animation:sway 6s ease-in-out infinite}
@keyframes sway{50%{transform:rotate(1.6deg)}}
.lit{animation:flick 7.3s steps(1,end) infinite}
.lit2{animation:flick2 11.7s steps(1,end) infinite}
.glow{position:absolute;left:50%;top:-40px;width:min(560px,100vw);height:520px;translate:-50% 0;pointer-events:none;z-index:0;animation:flick2 11.7s steps(1,end) infinite}
.glow i{position:absolute;inset:0;background:radial-gradient(closest-side,rgba(255,214,120,.30),rgba(255,214,120,.10) 55%,transparent);animation:flick 7.3s steps(1,end) infinite}
@keyframes flick{0%{opacity:1}12%{opacity:1}12.4%{opacity:.55}12.8%{opacity:.95}13.3%{opacity:.7}13.9%{opacity:1}
 41%{opacity:1}41.3%{opacity:.3}41.6%{opacity:1}41.9%{opacity:.38}42.3%{opacity:1}
 66%{opacity:.9}67.5%{opacity:1}83%{opacity:1}83.3%{opacity:.62}83.6%{opacity:1}100%{opacity:1}}
@keyframes flick2{0%{opacity:1}37%{opacity:1}37.2%{opacity:.42}37.5%{opacity:1}37.8%{opacity:.5}38.2%{opacity:1}74%{opacity:.86}74.8%{opacity:1}100%{opacity:1}}
/* ---------- home ---------- */
.home{position:relative;max-width:560px;margin:0 auto;padding:0 16px 40px}
.hero{position:relative;text-align:center;padding:0 0 10px}
.hero .lampw{margin-bottom:-78px}
.logo{position:relative;z-index:1;margin:0;font:700 64px/1 Fredoka,sans-serif;letter-spacing:.04em;display:flex;justify-content:center;gap:2px}
.logo span{display:inline-block;color:var(--sun);text-shadow:0 5px 0 rgba(0,0,0,.28);animation:drop .7s cubic-bezier(.34,1.56,.64,1) both;animation-delay:calc(var(--i)*70ms)}
.logo span:nth-child(2){color:var(--pink);rotate:-5deg}.logo span:nth-child(3){color:var(--mint);rotate:4deg}.logo span:nth-child(4){color:var(--sky);rotate:-3deg}.logo span:nth-child(5){color:#FF8A5B;rotate:6deg}
@keyframes drop{from{opacity:0;transform:translateY(-40px) scale(.6)}}
.tag{position:relative;z-index:1;margin:6px 0 0;font:600 18px Fredoka,sans-serif;color:var(--lav)}
.lineup{position:relative;display:flex;justify-content:center;gap:8px;margin:16px auto 0;padding:14px 10px 12px;border-radius:20px;max-width:360px;
 background:repeating-linear-gradient(to bottom,transparent 0 13px,rgba(255,255,255,.13) 13px 14px),rgba(0,0,0,.14)}
.lineup::after{content:"LINE-UP";position:absolute;right:10px;top:4px;font:10px "Special Elite",monospace;letter-spacing:.2em;color:rgba(255,255,255,.55)}
.sus{animation:bob 2.4s ease-in-out infinite;animation-delay:calc(var(--i)*-.45s)}
.sus .face{width:54px;height:54px}
.panel{position:relative;margin-top:34px;border-radius:8px 24px 24px 24px;padding:18px 16px 20px;background:var(--paper);color:var(--ink);box-shadow:0 8px 0 rgba(0,0,0,.18),0 24px 40px rgba(0,0,0,.35)}
.ftab{position:absolute;left:0;top:-26px;height:28px;padding:0 16px;border-radius:12px 12px 0 0;display:flex;align-items:center;background:var(--paper);font:13px "Special Elite",monospace;letter-spacing:.12em;color:var(--ink2)}
.tabs{display:grid;grid-template-columns:1fr 1fr;gap:6px;padding:5px;border-radius:16px;background:#EEE7FF}
.tabs button{display:flex;align-items:center;justify-content:center;gap:7px;min-height:46px;border:0;border-radius:12px;background:transparent;font:600 16px Fredoka,sans-serif;color:var(--ink2);transition:background .2s,color .2s}
.tabs button svg{width:20px;height:20px}
.tabs button[aria-selected="true"]{background:var(--ink);color:#fff;box-shadow:0 3px 0 rgba(0,0,0,.25)}
.lbl{font:700 13px Nunito,sans-serif;letter-spacing:.08em;text-transform:uppercase;color:var(--ink2);margin:16px 0 7px}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{flex:1;min-width:52px;min-height:44px;border-radius:12px;border:0;background:#fff;box-shadow:inset 0 0 0 2px #E3DAFB;font-weight:800;color:var(--ink);transition:transform .15s cubic-bezier(.34,1.56,.64,1),background .15s}
.seg button:active,.modes button:active{transform:scale(.95)}
.seg button[aria-pressed="true"]{background:var(--ink);color:#fff;box-shadow:0 3px 0 rgba(0,0,0,.25)}
.modes{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.modes button{padding:10px 12px;text-align:left;border-radius:14px;border:0;background:#fff;box-shadow:inset 0 0 0 2px #E3DAFB;color:var(--ink);transition:transform .15s cubic-bezier(.34,1.56,.64,1)}
.modes button b{display:block;font:600 16px Fredoka,sans-serif}.modes button small{display:block;font-size:13px;color:var(--ink2);line-height:1.35;margin-top:2px}
.modes button[aria-pressed="true"]{background:var(--ink);color:#fff}.modes button[aria-pressed="true"] small{color:var(--lav)}
.panel .go{margin-top:20px}
.home>.btn.soft{margin-top:16px}
.hint{margin:6px 0 0;font-size:14px;color:var(--ink2);text-align:center}
.idrow{display:flex;align-items:center;gap:12px}
.lookbtn{border:0;background:none;padding:4px;border-radius:50%;min-width:56px;min-height:56px}
.lookbtn .face{width:50px;height:50px}
.inp{flex:1;min-width:0;height:48px;border:0;border-radius:14px;padding:0 14px;background:#fff;box-shadow:inset 0 0 0 2px #D8CCFA;color:var(--ink);font-weight:800;font-size:16px}
.inp:focus{outline:none;box-shadow:inset 0 0 0 3px var(--ink)}
.inp[disabled]{opacity:.8}
.inp.code{text-transform:uppercase;letter-spacing:.3em;font:600 20px Fredoka,sans-serif;text-align:center}
.joinrow{display:flex;gap:8px}.joinrow .btn{min-height:48px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.two .btn{min-height:50px;padding:0 10px;font-size:16px}
.srv{display:flex;align-items:center;gap:8px;margin:14px 0 0;font-size:14px;font-weight:700;color:var(--ink2)}
.srv i{width:10px;height:10px;border-radius:50%;background:#B4A8D6}
.srv.s-ok i{background:#16A37F;box-shadow:0 0 0 4px rgba(22,163,127,.2)}.srv.s-fail i{background:var(--coral)}
.srv.s-checking i{animation:pulse 1s infinite}@keyframes pulse{50%{opacity:.3}}
.otable{display:flex;align-items:center;gap:10px;padding:8px 8px 8px 10px;border-radius:14px;background:#fff;box-shadow:inset 0 0 0 2px #E3DAFB;margin-top:6px}
.otable .oi{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:var(--sun);color:var(--ink)}.otable .oi svg{width:22px;height:22px}
.otable .ot{flex:1;min-width:0}.otable b{display:block;font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.otable small{color:var(--ink2);font-size:13px}
.otable .btn{min-height:44px;padding:0 16px;font-size:15px}
.empty-list{margin:4px 0 0;font-size:14px;color:var(--ink2)}
/* lobby */
.bigcode{display:flex;justify-content:center;gap:8px;margin:2px 0 12px}
.bigcode span{width:54px;height:64px;border-radius:14px;display:grid;place-items:center;background:#fff;box-shadow:inset 0 0 0 2px #D8CCFA,0 4px 0 #D8CCFA;font:700 36px Fredoka,sans-serif;color:var(--ink);animation:drop .6s cubic-bezier(.34,1.56,.64,1) both}

/* ================= online play: encrypted relay =================
   Same approach as Digu: phones talk through two public MQTT brokers over secure WebSockets at once,
   so players on mobile data or different Wi-Fi networks can join. Messages to and from the host are
   end-to-end encrypted (ECDH P-256 + AES-GCM), and each player only receives their own hand. */
const NS='dhivehidhogu/v1/';
const BROKERS=['wss://broker.emqx.io:8084/mqtt','wss://broker.hivemq.com:8884/mqtt'];
let net=null,pool=null,poolT=null,srvState='checking',quickRun=0;const lobbyList={},poolSeen={};
const TE=new TextEncoder(),TD=new TextDecoder();
function b64(u8){let s='';for(let i=0;i<u8.length;i+=0x8000)s+=String.fromCharCode.apply(null,u8.subarray(i,i+0x8000));return btoa(s);}
function unb64(s){const b=atob(s),u=new Uint8Array(b.length);for(let i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return u;}
function rid(n){const a=new Uint8Array(n);crypto.getRandomValues(a);return Array.from(a,x=>x.toString(16).padStart(2,'0')).join('');}
async function newKeys(){const kp=await crypto.subtle.generateKey({name:'ECDH',namedCurve:'P-256'},false,['deriveKey']);return{kp,pub:b64(new Uint8Array(await crypto.subtle.exportKey('raw',kp.publicKey)))};}
async function sharedKey(priv,pubB64){const pk=await crypto.subtle.importKey('raw',unb64(pubB64),{name:'ECDH',namedCurve:'P-256'},false,[]);return crypto.subtle.deriveKey({name:'ECDH',public:pk},priv,{name:'AES-GCM',length:256},false,['encrypt','decrypt']);}
async function seal(key,obj){const iv=crypto.getRandomValues(new Uint8Array(12));const ct=await crypto.subtle.encrypt({name:'AES-GCM',iv},key,TE.encode(JSON.stringify(obj)));return{i:b64(iv),c:b64(new Uint8Array(ct))};}
async function unseal(key,m){const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:unb64(m.i)},key,unb64(m.c));return JSON.parse(TD.decode(pt));}
/* tiny MQTT 3.1.1 client (QoS 0) with optional Last Will (retained, used to wipe our retained topics if we vanish) */
function MQ(url,opts){
const self={connected:false,reconnecting:true};
let ws=null,buf=new Uint8Array(0),pingT=null,retryT=null,ctT=null,ended=false,pid=0,delay=1500,lastIn=0;
const subs=new Set(),clientId='dh_'+rid(7);
const str=s=>{const b=TE.encode(s),o=new Uint8Array(2+b.length);o[0]=b.length>>8;o[1]=b.length&255;o.set(b,2);return o;};
function packet(head,parts){const bodyLen=parts.reduce((t,p)=>t+p.length,0);let len=bodyLen;const lb=[];do{let d=len%128;len=Math.floor(len/128);if(len>0)d|=128;lb.push(d);}while(len>0);
const out=new Uint8Array(1+lb.length+bodyLen);out[0]=head;out.set(lb,1);let off=1+lb.length;parts.forEach(p=>{out.set(p,off);off+=p.length;});return out;}
function send(u8){if(ws&&ws.readyState===1){try{ws.send(u8);return true;}catch(e){}}return false;}
function nextId(){pid=pid%65535+1;return new Uint8Array([pid>>8,pid&255]);}
function schedule(){if(ended)return;clearTimeout(retryT);self.reconnecting=true;retryT=setTimeout(connect,delay);delay=Math.min(15000,delay*1.6);}
function drop(w){if(ws!==w)return;clearTimeout(ctT);clearInterval(pingT);ws=null;buf=new Uint8Array(0);const was=self.connected;self.connected=false;if(was&&opts.onDown)opts.onDown();schedule();}
function connect(){if(ended)return;let w;try{w=new WebSocket(url,['mqtt']);}catch(e){schedule();return;}
ws=w;w.binaryType='arraybuffer';
ctT=setTimeout(()=>{if(ws===w&&!self.connected){try{w.close();}catch(e){}drop(w);}},9000);
w.onopen=()=>{if(ws!==w)return;const wl=opts.will;const parts=[new Uint8Array([0,4,77,81,84,84,4,wl?0x26:0x02,0,30]),str(clientId)];if(wl){parts.push(str(wl.topic));parts.push(str(wl.payload||''));}send(packet(0x10,parts));};
w.onmessage=e=>{if(ws!==w)return;lastIn=Date.now();const d=new Uint8Array(e.data);const nb=new Uint8Array(buf.length+d.length);nb.set(buf);nb.set(d,buf.length);buf=nb;parse();};
w.onclose=()=>drop(w);w.onerror=()=>{try{w.close();}catch(e){}drop(w);};}
function parse(){while(buf.length>=2){let mul=1,len=0,i=1,b;do{if(i>=buf.length)return;b=buf[i++];len+=(b&127)*mul;mul*=128;}while(b&128);
if(buf.length<i+len)return;const head=buf[0],body=buf.slice(i,i+len);buf=buf.slice(i+len);handle(head>>4,head&15,body);}}
function handle(type,flags,b){
if(type===2){if(b[1]!==0){try{ws&&ws.close();}catch(e){}return;}
self.connected=true;self.reconnecting=false;delay=1500;clearTimeout(ctT);lastIn=Date.now();
if(subs.size)sub([...subs]);clearInterval(pingT);
pingT=setInterval(()=>{if(Date.now()-lastIn>50000){const w=ws;try{w&&w.close();}catch(e){}drop(w);return;}send(new Uint8Array([0xC0,0]));},20000);
opts.onUp&&opts.onUp();}
else if(type===3){const qos=(flags>>1)&3,tl=(b[0]<<8)|b[1];const topic=TD.decode(b.subarray(2,2+tl));let off=2+tl;
if(qos>0){const hi=b[off],lo=b[off+1];off+=2;send(new Uint8Array([qos===1?0x40:0x50,2,hi,lo]));}
opts.onMsg&&opts.onMsg(topic,b.subarray(off),flags&1);}}
function sub(topics){topics.forEach(t=>subs.add(t));if(!self.connected)return;const parts=[nextId()];topics.forEach(t=>{parts.push(str(t));parts.push(new Uint8Array([0]));});send(packet(0x82,parts));}
function unsub(topics){topics.forEach(t=>subs.delete(t));if(!self.connected)return;send(packet(0xA2,[nextId()].concat(topics.map(str))));}
function publish(topic,payload,retain){if(!self.connected)return false;const p=typeof payload==='string'?TE.encode(payload):payload;return send(packet(0x30|(retain?1:0),[str(topic),p]));}
function end(){ended=true;clearTimeout(retryT);clearTimeout(ctT);clearInterval(pingT);const w=ws;ws=null;if(w){try{if(self.connected)w.send(new Uint8Array([0xE0,0]));w.close();}catch(e){}}self.connected=false;}
function reconnect(){if(ended||self.connected)return;clearTimeout(retryT);delay=1500;const w=ws;ws=null;if(w){try{w.close();}catch(e){}}connect();}
Object.assign(self,{subscribe:sub,unsubscribe:unsub,publish,end,reconnect});connect();return self;}
function makeClients(will){return BROKERS.map((url,bi)=>{const o={bi,ok:false,up:null,h:null,subs:()=>[],onUp2:null,c:null};
 o.c=MQ(url,{will,onUp:()=>{o.ok=true;const t=o.subs();if(t.length)o.c.subscribe(t);if(o.up){const f=o.up;o.up=null;f();}o.onUp2&&o.onUp2();},
  onDown:()=>{o.ok=false;},onMsg:(topic,p,ret)=>{if(!o.h)return;let m=null;if(p.length){try{m=JSON.parse(TD.decode(p));}catch(e){return;}}o.h(o,topic,m,ret);}});return o;});}
function takeClients(subs,h){clearTimeout(poolT);const cl=pool||makeClients(null);pool=null;cl.forEach(o=>{o.c.unsubscribe([NS+'lobby/+']);o.subs=subs;o.h=h;o.onUp2=null;if(o.ok){const t=subs();if(t.length)o.c.subscribe(t);}});return cl;}
function anyUp(cl,ms){return new Promise(res=>{let done=false;const fin=v=>{if(done)return;done=true;clearTimeout(t);res(v);};const t=setTimeout(()=>fin(cl.some(o=>o.ok)),ms);cl.forEach(o=>{if(o.ok)fin(true);else{const f=o.up;o.up=()=>{f&&f();fin(true);};}});});}
const pub=(o,topic,obj,retain)=>!!(o&&o.c&&o.ok&&o.c.publish(topic,typeof obj==='string'?obj:JSON.stringify(obj),retain));
const netErr='Can’t reach the game server. If you’re on office or school Wi-Fi, try mobile data.';
function netOK(){if(window.WebSocket&&window.crypto&&crypto.subtle&&window.TextEncoder)return true;toast('This browser can’t play online. Try Chrome or Safari.',5000);return false;}
function srvHTML(){const t={checking:'Connecting to the game server…',ok:'Game server connected',fail:'Can’t reach the game server on this network'}[srvState];return `<p class="srv s-${srvState}" id="srv"><i></i>${t}</p>`;}

/* lobby listing watcher (home screen + quick play) */
function warmUp(){if(net||!window.WebSocket)return;
 if(!pool){pool=makeClients(null);const p0=pool;p0.forEach(o=>o.onUp2=()=>setSrv('ok'));anyUp(p0,10000).then(v=>{if(!v&&pool===p0&&srvState!=='ok')setSrv('fail');});}
 const p=pool;p.forEach(o=>{o.h=onPoolMsg;o.subs=()=>[NS+'lobby/+'];if(o.ok)o.c.subscribe([NS+'lobby/+']);});
 clearTimeout(poolT);poolT=setTimeout(()=>{if(pool!==p)return;if((screen==='home'&&tab==='online')||screen==='wait'){warmUp();return;}p.forEach(o=>o.c.end());pool=null;},5*60*1000);}
function onPoolMsg(o,topic,m){if(topic.indexOf(NS+'lobby/')===0){onLobbyMsg(topic,m);return;}const mm=/\/([A-Z]{4})\/i$/.exec(topic);if(mm&&m&&m.host)poolSeen[mm[1]]=m;}
function onLobbyMsg(topic,m){const code=topic.slice((NS+'lobby/').length);if(!/^[A-Z]{4}$/.test(code))return;
 if(!m||!m.t)delete lobbyList[code];
 else{const cur=lobbyList[code];if(!cur||+m.t>=cur.t)lobbyList[code]={code,name:cleanName(m.name)||'Player',n:Math.max(1,Math.min(6,m.n|0)),t:+m.t,c:+m.c||+m.t,status:m.status==='lobby'?'lobby':'busy',q:!!m.q,host:String(m.host||'')};}
 if(screen==='home')updOpenList();quickCheck();}
/* listings are refreshed every 15 s; anything older than 40 s is treated as a ghost */
function openTables(){const now=Date.now();return Object.values(lobbyList).filter(x=>x.status==='lobby'&&x.n<6&&Math.abs(now-x.t)<40000&&x.host!==myId).sort((a,b)=>b.n-a.n||b.t-a.t);}
function openListHTML(){const l=openTables();

 return l.map(x=>`<div class="otable"><span class="oi">${ICON.table}</span><div class="ot"><b>${esc(x.name)}’s table</b><small>${x.n} of 6 players${x.q?' · Quick Play':''}</small></div><button class="btn sm" data-a="joinOpen" data-code="${esc(x.code)}">Join</button></div>`).join('');}

setInterval(()=>{if(screen==='home'&&tab==='online'&&!document.hidden)updOpenList();},5000);
function genCode(){const a='ABCDEFGHJKLMNPQRSTUVWXYZ';let s='';for(let i=0;i<4;i++)s+=a[Math.floor(Math.random()*a.length)];return s;}
function netClose(){const n=net;net=null;if(!n)return;(n.timers||[]).forEach(t=>clearInterval(t));clearTimeout(n.failT);
 if(n.role==='host'&&n.code&&!n.superseded){(n.clients||[]).forEach(o=>{try{o.c.publish(NS+n.code+'/i','',true);}catch(e){}});(n.lc||[]).forEach(o=>{try{o.c.publish(NS+'lobby/'+n.code,'',true);}catch(e){}});}
 const all=(n.clients||[]).concat(n.lc||[]);all.forEach(o=>{o.h=null;o.onUp2=null;});
 setTimeout(()=>{all.forEach(o=>{try{o.c.end();}catch(e){}});},n.role==='host'?700:300);}

/* ---------- host ---------- */
async function hostNet(code,o){const keys=await newKeys();
 const n={role:'host',code,kp:keys.kp,pub:keys.pub,players:new Map(),timers:[],clients:[],lc:null,isPublic:!!o.pub,quick:!!o.quick,created:o.created||Date.now(),banned:new Set(),ep:o.ep|0,listed:false,fxq:[],last:{},lsent:0,lsig:''};
 /* Last Will: if this connection dies without a goodbye, the broker wipes the table's retained info */
 n.clients=makeClients({topic:NS+code+'/i',payload:''});
 n.clients.forEach(c=>{c.subs=()=>[NS+code+'/h',NS+code+'/i'].concat(n.quick?[NS+'lobby/+']:[]);c.h=onHostMsg;});net=n;
 const up=await anyUp(n.clients,10000);if(net!==n)return null;if(!up){netClose();return null;}
 n.info=()=>{if(net!==n)return;n.clients.forEach(c=>pub(c,NS+code+'/i',{v:1,host:myId,pub:n.pub,t:Date.now(),ep:n.ep},true));};
 n.clients.forEach(c=>c.onUp2=()=>{n.info();updListing(true);});n.info();
 n.timers.push(setInterval(n.info,5000),setInterval(()=>updListing(true),15000),setInterval(hostWatch,2000));

async function netCreate(opts){if(!netOK())return false;const run=quickRun;cleanupNet();
 warmUp();const up=pool?await anyUp(pool,10000):false;if(run!==quickRun)return false;
 if(!up){setSrv('fail');toast(netErr,5000);return false;}setSrv('ok');
 let code=null;for(let a=0;a<4&&!code;a++){const c=genCode();if(lobbyList[c])continue;delete poolSeen[c];const p=pool;if(!p)break;p.forEach(o=>{if(o.ok)o.c.subscribe([NS+c+'/i']);});await sleep(900);p.forEach(o=>{try{o.c.unsubscribe([NS+c+'/i']);}catch(e){}});if(!poolSeen[c])code=c;}
 if(run!==quickRun)return false;code=code||genCode();
 const p=pool;pool=null;clearTimeout(poolT);if(p)p.forEach(o=>{o.h=null;try{o.c.end();}catch(e){}});
 const n=await hostNet(code,{pub:!!opts.pub,quick:!!opts.quick});
 if(run!==quickRun){if(n&&net===n)cleanupNet();return false;}
 if(!n){toast(netErr,5000);return false;}
 role='host';G={status:'lobby',code,quick:!!opts.quick,pub:!!opts.pub,hostId:myId,ep:n.ep,created:n.created,mode:cfg.mode,rounds:cfg.rounds,level:'easy',roundNo:0,rev:1,mid:rid(4),seq:0,autoAt:0,
  players:[{id:myId,name:netName(),face:myFace(),score:0,me:true}]};

 const show=n.isPublic&&G.status==='lobby'&&G.players.length<6;
 if(show){if(!n.lc){n.lc=makeClients({topic,payload:''});/* its own Last Will clears the public listing */n.lc.forEach(o=>{o.onUp2=()=>updListing(true);});}
  const h=G.players.find(p=>p.id===myId)||{};const sig=h.name+'|'+G.players.length;if(!force&&sig===n.lsig&&Date.now()-n.lsent<14000)return;n.lsig=sig;n.lsent=Date.now();
  const msg={v:1,code:n.code,name:h.name,n:G.players.length,t:Date.now(),c:n.created,status:'lobby',q:n.quick,host:myId};n.listed=true;n.lc.forEach(o=>pub(o,topic,msg,true));}

 rank:G.rank||1,phase:G.phase||null,turn:G.turn|0,tl:G.turnEnd?Math.max(0,G.turnEnd-Date.now()):0,pile:(G.pile||[]).length,seq:G.seq|0,

async function onHostMsg(o,topic,m,ret){const n=net;if(!n||n.role!=='host')return;
 if(topic.indexOf(NS+'lobby/')===0){onLobbyMsg(topic,m);return;}
 if(topic===NS+n.code+'/i'){
  /* wiped (e.g. an old host's Last Will fired late): put our info straight back */
  if(!m||!m.host){if(n.info)n.info();return;}
  /* someone else took over this table while we were cut off: bow out without touching their topics */
  if(m.host!==myId&&!ret){const ep=m.ep|0;if(ep>n.ep||(ep===n.ep&&m.host<myId)){n.superseded=true;endOnline('Your connection dropped and the table moved on without you.');}}return;}
 if(!m||topic!==NS+n.code+'/h'||typeof m.f!=='string'||!m.i||!m.c)return;

 try{if(!pl||!pl.key||(m.p&&m.p!==pl.pub)){if(!m.p)return;const key=await sharedKey(n.kp.privateKey,m.p);pl=n.players.get(m.f)||{pid:null};pl.key=key;pl.pub=m.p;n.players.set(m.f,pl);}

function mapPlayer(topic,pl,id){const n=net;n.players.forEach((q,tp)=>{if(tp!==topic&&q.pid===id)n.players.delete(tp);});pl.pid=id;n.last[id]=Date.now();}
function onHostData(pl,topic,d){const n=net;if(!G||!d||typeof d!=='object')return;

function myRank(){const V=G;if(!V||!V.players)return -1;const N=V.players.length,hi=V.players.findIndex(p=>p.id===V.hostId),c=[];

const vcSupported=()=>!!window.RTCPeerConnection&&!!(navigator.mediaDevices&&navigator.mediaDevices.getUserMedia)&&window.isSecureContext!==false;
const vcAvail=()=>vcTable()&&vcSupported();
function vcSend(to,d){if(window.__vcOut){window.__vcOut(to,d);return;}const n=net;if(!n)return;
 if(n.role==='host')n.players.forEach((pl,tp)=>{if(pl.pid===to)sendPlayer(tp,pl,{k:'rtc',f:myId,d});});else joinSend({k:'rtc',to,d});}
function vcAC(){if(!VC.ac){const A=window.AudioContext||window.webkitAudioContext;if(A)try{VC.ac=new A();}catch(e){}}if(VC.ac&&VC.ac.state==='suspended')VC.ac.resume().catch(()=>{});return VC.ac;}
function vcMeter(stream){const a=vcAC();if(!a)return null;try{const src=a.createMediaStreamSource(stream),an=a.createAnalyser();an.fftSize=512;an.smoothingTimeConstant=.5;src.connect(an);return{an,buf:new Uint8Array(an.fftSize),src};}catch(e){return null;}}
function vcWait(pc){return new Promise(r=>{if(pc.iceGatheringState==='complete')return r();const t=setTimeout(r,2500);pc.addEventListener('icegatheringstatechange',()=>{if(pc.iceGatheringState==='complete'){clearTimeout(t);r();}});});}
function vcAttach(p){if(!p.tr)return;const tk=VC.stream&&VC.on?VC.stream.getAudioTracks()[0]:null;p.tr.sender.replaceTrack(tk).catch(()=>{});}
function vcPeer(id,offerer){let p=VC.peers.get(id);if(p)return p;
 const pc=new RTCPeerConnection({iceServers:VC_ICE});
 if(!VC.box){VC.box=document.createElement('div');VC.box.hidden=true;document.body.appendChild(VC.box);}
 const au=document.createElement('audio');au.autoplay=true;au.setAttribute('playsinline','');VC.box.appendChild(au);
 p={pc,tr:offerer?pc.addTransceiver('audio',{direction:'sendrecv'}):null,au,meter:null,t:Date.now()};VC.peers.set(id,p);vcAttach(p);
 pc.ontrack=e=>{const st=(e.streams&&e.streams[0])||new MediaStream([e.track]);au.srcObject=st;au.play().catch(()=>{});p.meter=vcMeter(st);};
 pc.onconnectionstatechange=()=>{if(pc.connectionState==='failed')vcDrop(id);};
 return p;}
function vcDrop(id){const p=VC.peers.get(id);if(!p)return;VC.peers.delete(id);try{p.pc.close();}catch(e){}try{p.au.srcObject=null;p.au.remove();}catch(e){}try{p.meter&&p.meter.src.disconnect();}catch(e){}delete VC.lv[id];}
async function vcCall(id){const p=vcPeer(id,true);try{await p.pc.setLocalDescription(await p.pc.createOffer());await vcWait(p.pc);if(VC.peers.get(id)!==p)return;vcSend(id,{t:'offer',sdp:p.pc.localDescription.sdp});}catch(e){vcDrop(id);}}
async function vcOnSignal(from,d){if(!vcAvail()||!d||!from||from===myId||!G.players.some(q=>q.id===from))return;
 try{if(d.t==='offer'){vcDrop(from);const p=vcPeer(from,false);await p.pc.setRemoteDescription({type:'offer',sdp:String(d.sdp)});
  p.tr=p.pc.getTransceivers()[0];if(p.tr){p.tr.direction='sendrecv';vcAttach(p);}
  await p.pc.setLocalDescription(await p.pc.createAnswer());await vcWait(p.pc);if(VC.peers.get(from)!==p)return;vcSend(from,{t:'answer',sdp:p.pc.localDescription.sdp});}
 else if(d.t==='answer'){const p=VC.peers.get(from);if(p&&p.pc.signalingState==='have-local-offer')await p.pc.setRemoteDescription({type:'answer',sdp:String(d.sdp)});}}catch(e){vcDrop(from);}}
function vcStopAll(){[...VC.peers.keys()].forEach(vcDrop);if(VC.stream){VC.stream.getTracks().forEach(t=>t.stop());VC.stream=null;}try{VC.me&&VC.me.src.disconnect();}catch(e){}VC.me=null;VC.on=false;VC.lv={};VC.code=null;vcUI();}
function vcMicHelp(e){const nm_=(e&&e.name)||'Error';const ios=/iP(hone|ad|od)/.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
 if(nm_==='NotReadableError'||nm_==='AbortError'){toast('Your mic is busy. End any phone or WhatsApp call, then try again.',5000);return;}
 if(nm_==='NotFoundError'||nm_==='OverconstrainedError'){toast('No microphone found on this device.',4500);return;}
 const steps=ios?'<li>In Safari, tap the <b>aA</b> or page settings button in the address bar.</li><li>Tap <b>Website Settings</b> → <b>Microphone</b> → <b>Allow</b>.</li><li>Reload the game and tap the mic again.</li>'
  :'<li>Tap the <b>lock</b> or <b>settings</b> icon next to the address.</li><li>Set <b>Microphone</b> to <b>Allow</b>.</li><li>Reload the game and tap the mic again.</li>';
 sheet(`<h2>Allow the microphone</h2><p style="margin:4px 0 10px">Your browser blocked the mic for this game. To talk:</p><ol style="padding-left:20px">${steps}</ol><p style="font-size:13px">You can still hear everyone without a mic. (${esc(nm_)})</p><button class="btn w" data-a="close">OK</button>`);}
async function vcMic(){if(vcTable()&&!vcSupported()){toast('Voice chat isn’t available in this browser. Open the game from its normal https link in Safari or Chrome.',5000);return;}if(!vcAvail())return;vcAC();VC.peers.forEach(p=>{if(p.au.paused&&p.au.srcObject)p.au.play().catch(()=>{});});
 if(!VC.stream){try{if(navigator.audioSession)navigator.audioSession.type='play-and-record';}catch(e){}
  try{VC.stream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true,autoGainControl:true}});}
  catch(e){if(e&&(e.name==='NotAllowedError'||e.name==='SecurityError')){vcMicHelp(e);return;}
   try{VC.stream=await navigator.mediaDevices.getUserMedia({audio:true});}catch(e2){vcMicHelp(e2);return;}}VC.me=vcMeter(VC.stream);}
 VC.on=!VC.on;VC.stream.getAudioTracks().forEach(t=>t.enabled=VC.on);VC.peers.forEach(vcAttach);
 buzz(6);toast(VC.on?'Mic on. Everyone at the table can hear you.':'Mic off.');vcUI();}
function vcUI(){const b=$('#micbtn');if(!b)return;const on=VC.on;b.hidden=!vcTable();b.setAttribute('aria-pressed',String(on));b.setAttribute('aria-label',on?'Turn mic off':'Turn mic on');const h=on?MIC_ON:MIC_OFF;if(b._h!==h){b.innerHTML=h;b._h=h;}}
function vcLevel(m){if(!m)return 0;m.an.getByteTimeDomainData(m.buf);let s=0;for(let i=0;i<m.buf.length;i++){const v=(m.buf[i]-128)/128;s+=v*v;}return Math.min(1,Math.sqrt(s/m.buf.length)*5);}
setInterval(()=>{if(!vcAvail()){if(VC.peers.size||VC.stream)vcStopAll();return;}
 if(VC.code&&VC.code!==G.code)vcStopAll();VC.code=G.code;
 const ids=G.players.filter(q=>q.id!==myId&&!q.bot&&!q.gone).map(q=>q.id);
 [...VC.peers.keys()].forEach(id=>{if(!ids.includes(id))vcDrop(id);});
 ids.forEach(id=>{const p=VC.peers.get(id);if(!p){if(myId<id)vcCall(id);return;}
  if(myId<id&&p.pc.connectionState!=='connected'&&Date.now()-p.t>15000){vcDrop(id);vcCall(id);}});
 vcUI();},3000);
document.addEventListener('pointerdown',()=>{if(!VC.peers.size)return;vcAC();VC.peers.forEach(p=>{if(p.au.paused&&p.au.srcObject)p.au.play().catch(()=>{});});},{passive:true,capture:true});
setInterval(()=>{if(!G||!G.players||(!VC.peers.size&&!VC.on)){if(VC._lit){document.querySelectorAll('.vtalk').forEach(e=>e.classList.remove('vtalk'));VC._lit=false;}return;}
 G.players.forEach(q=>{const raw=q.id===myId?(VC.on?vcLevel(VC.me):0):vcLevel((VC.peers.get(q.id)||{}).meter);
  const lv=VC.lv[q.id]=Math.max(raw,(VC.lv[q.id]||0)*.72);const el=document.querySelector(`[data-pid="${cq(q.id)}"] .face`);if(!el)return;
  el.style.setProperty('--vl',lv.toFixed(2));el.classList.toggle('vtalk',lv>.06);});VC._lit=true;},90);
/* ================= input ================= */
document.addEventListener('click',e=>{const b=e.target.closest('[data-a],[data-set],#hand .card');if(!b||b.disabled)return;ac();
 if(b.matches('#hand .card')){if(!G||G.phase!=='play'||!G.players[G.turn]||!G.players[G.turn].me||G.pend)return;const id=b.dataset.id;if(G.sel.has(id))G.sel.delete(id);else if(G.sel.size<4)G.sel.add(id);else{toast('You can play up to 4 cards.');return;}SFX.pick();buzz(4);update();return;}
 if(b.dataset.set){const k=b.dataset.set,v=b.dataset.v;cfg[k]=k==='opp'||k==='rounds'?+v:v;ls.set('dh-'+k,String(v));SFX.pick();const tb=$('#tabbody');if(tb)tb.innerHTML=cpuHTML();const f=document.querySelector(`[data-set="${k}"][data-v="${v}"]`);if(f)f.focus({preventScroll:true});return;}
 const a=b.dataset.a,v=b.dataset.v;
 switch(a){
 case 'tab':if(tab!==v){tab=v;ls.set('dh-tab',v);SFX.pick();renderHome();const t=document.querySelector(`[data-a="tab"][data-v="${v}"]`);if(t)t.focus({preventScroll:true});}break;
 case 'start':newMatch();break;
 case 'rules':rulesSheet();break;
 case 'close':closeSheet();break;
 case 'menu':menu();break;
 case 'home':closeSheet();clearAll();role=null;G=null;renderHome();break;
 case 'again':closeSheet();if(role==='host')hostAgain();else if(role==='solo')newMatch();break;
 case 'next':closeSheet();if(role==='solo'||role==='host')newRound();break;
 case 'play':{if(!G)break;const me=ME();const cards=me.hand.filter(c=>G.sel.has(c.id));if(cards.length<1||cards.length>4)break;
  if(role==='join'){G.pend=true;joinSend({k:'act',t:'play',ids:cards.map(c=>c.id)});G.sel=new Set();update();setTimeout(()=>{if(G&&G.pend){G.pend=false;update();}},4000);}else doPlay(me,cards);break;}
 case 'dhogu':{if(!G||!G.last||+b.dataset.seq!==G.last.seq)break;if(role==='join'){G.pendCall=true;callButton();joinSend({k:'act',t:'call',seq:G.last.seq});setTimeout(()=>{if(G&&G.pendCall){G.pendCall=false;callButton();}},3000);}else call(ME());break;}
 case 'snd':sfxOn=!sfxOn;ls.set('dd-sfx',sfxOn?'1':'0');b.outerHTML=sndBtn();{const nb=$('[data-a="snd"]');if(nb)nb.focus({preventScroll:true});}if(sfxOn)SFX.pop();break;
 case 'look':ls.set('dh-look',String((+(ls.get('dh-look')||0)+1)%6));b.innerHTML=face(myFace());SFX.pop();break;
 case 'quick':quickMatch();break;
 case 'create':{if(!netOK())break;const run=++quickRun;renderWait('Creating your table…');netCreate({pub:v==='1'}).then(ok=>{if(!ok&&run===quickRun)renderHome();});break;}
 case 'join':{const c=(($('#code')||{}).value||'').trim().toUpperCase();if(!/^[A-Z]{4}$/.test(c)){toast('Table codes are 4 letters.');break;}startJoin(c);break;}
 case 'joinOpen':if(/^[A-Z]{4}$/.test(b.dataset.code||''))startJoin(b.dataset.code);break;
 case 'cancel':quickRun++;cleanupNet();role=null;G=null;renderHome();break;
 case 'leave':leaveTable();break;
 case 'hstart':hostStart();break;
 case 'lset':if(role==='host'&&G&&G.status==='lobby'){const k=b.dataset.k;if(k==='mode'&&['classic','lives'].includes(v)){G.mode=v;cfg.mode=v;ls.set('dh-mode',v);}else if(k==='rounds'&&['3','5','10'].includes(v)){G.rounds=+v;cfg.rounds=+v;ls.set('dh-rounds',v);}SFX.pick();sync();updLobby();}break;
 case 'lpub':if(role==='host'&&net&&G&&G.status==='lobby'){net.isPublic=v==='1';G.pub=net.isPublic;updListing(true);sync();updLobby();}break;
 case 'share':shareInvite();break;
 case 'copy':copyInvite();break;
 case 'chat':chatSheet();break;
 case 'say':closeSheet();sayIdx(+v);break;
 case 'mic':vcMic();break;}});
document.addEventListener('input',e=>{const t=e.target;if(t.id==='code')t.value=t.value.toUpperCase().replace(/[^A-Z]/g,'').slice(0,4);else if(t.id==='nm')ls.set(NMK,cleanName(t.value));});
document.addEventListener('change',e=>{if(e.target.id==='nm'){const p=$('.me-pill b');if(p)p.textContent=shownName();}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){const o=$('#ov');if(o&&!o.dataset.lock)closeSheet();}if(e.key==='Enter'&&e.target.id==='code'){const b=$('[data-a="join"]');if(b)b.click();}});
['pointerdown','keydown'].forEach(ev=>document.addEventListener(ev,()=>ac(),{capture:true,passive:true,once:true}));
/* invite links: ?t=CODE */
let pending=null;try{const t=Q.get('t');if(t&&/^[A-Za-z]{4}$/.test(t)){pending=t.toUpperCase();Q.delete('t');const qs=Q.toString();history.replaceState(null,'',location.pathname+(qs?'?'+qs:'')+location.hash);}}catch(e){}
if(pending){tab='online';ls.set('dh-tab','online');renderHome();startJoin(pending);}else renderHome();
window.__dh={get G(){return G},get role(){return role},get net(){return net},get screen(){return screen},myId,cfg,SFX,lobbyList,openTables};
})();
