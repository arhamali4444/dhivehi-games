<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Binveriya · ބިންވެރިޔާ · Dhivehi Games</title>
<meta name="description" content="Binveriya (ބިންވެރިޔާ): a Maldivian island property trading game. Buy islands, build guesthouses and resorts, trade, bribe and dodge the audit. Own the islands. Bend the rules.">
<meta name="theme-color" content="#0C5C6E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,700;0,9..144,900;1,9..144,700&family=Noto+Sans+Thaana:wght@600&family=Sora:wght@400;600;700;800&display=swap">
<style>
:root{--ink:#15241F;--muted:#6B6354;--emerald:#155E43;--deep:#0B3B2B;--gold:#C9A45C;--paper:#F7F1E6;--line:#EADFCB;
 --spring:cubic-bezier(.34,1.56,.64,1);--out:cubic-bezier(.16,1,.3,1);--S:340px;--B:328px;--sat:env(safe-area-inset-top,0px);--sab:env(safe-area-inset-bottom,0px)}
@supports (animation-timing-function:linear(0,1)){:root{--spring:linear(0,.009,.035 2.1%,.141 4.4%,.723 12.9%,.938 16.7%,1.017 19.4%,1.067,1.089 25.4%,1.084 28.1%,1.029 35.3%,1.003 41.2%,.994 47.9%,1 60.1%,1)}}
*{box-sizing:border-box}
html{overflow-x:clip;height:100%;-webkit-text-size-adjust:100%;background:#06303F}
body{margin:0;min-height:100%;background:#06303F;font:14px/1.5 Sora,system-ui,sans-serif;color:#fff;-webkit-font-smoothing:antialiased;overflow-x:clip;overscroll-behavior:none;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
button:disabled{cursor:default}
:focus-visible{outline:3px solid #FFD36E;outline-offset:2px}
[hidden]{display:none!important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.thaana{font:600 13px/1.3 'Noto Sans Thaana',sans-serif;color:#FFF6DD;text-shadow:0 1px 6px rgba(0,0,0,.3)}
.bw{font:900 34px/1 Fraunces,Georgia,serif;color:#fff;letter-spacing:-.01em;text-shadow:0 3px 14px rgba(0,60,80,.45)}
.tg{font:italic 700 10px/1.2 Fraunces,Georgia,serif;color:#FFF3C8;margin-top:3px}

/* ---------- screens ---------- */
.scr{position:fixed;inset:0;overflow:hidden;overflow:clip;background:radial-gradient(130% 75% at 50% 28%,#1E97A8 0%,#0E6E84 40%,#084A60 72%,#052E3E 100%);color:#fff}
/* ocean: pre-rendered tileable caustic texture, two layers drifting slowly in different directions.
   Each layer moves exactly one tile period per loop, so the loop is seamless. Transform/opacity only. */
.sun{position:absolute;inset:0;overflow:hidden;pointer-events:none;opacity:.09}
.sun:before,.sun:after{content:"";position:absolute;left:0;top:0;width:calc(100% + 1200px);height:calc(100% + 1200px);background:url(caustics.webp) 0 0/420px 420px repeat;will-change:transform;animation:sz1 80s linear infinite}
.sun:after{background-size:600px 600px;opacity:.55;animation:sz2 64s linear infinite}
@keyframes sz1{from{transform:translate3d(0,0,0)}to{transform:translate3d(-420px,-420px,0)}}
@keyframes sz2{from{transform:translate3d(-600px,0,0)}to{transform:translate3d(0,-600px,0)}}
@keyframes caus{to{transform:translate(120px,90px) rotate(6deg)}}
.tbar{position:relative;z-index:5;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:calc(var(--sat) + 10px) 14px 6px}
.ib{flex:none;width:44px;height:44px;border-radius:14px;display:grid;place-items:center;background:rgba(255,255,255,.14);box-shadow:inset 0 0 0 1px rgba(255,255,255,.2);border:0;color:#fff;text-decoration:none;transition:transform .15s,background .2s}
.ib:active{transform:scale(.94)}
.ib svg{width:20px;height:20px}
.ib[aria-pressed="true"]{background:rgba(255,255,255,.06)}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:800;background:rgba(0,0,0,.25);padding:8px 13px;border-radius:99px;box-shadow:inset 0 0 0 1px rgba(242,212,155,.35);white-space:nowrap;min-width:0}
.chip b{color:#FFE3A8}
.chip img{width:18px;height:18px}
.chip.warn{box-shadow:inset 0 0 0 1.5px #FF8A7A;animation:pulse 1s ease-in-out infinite}
@keyframes pulse{50%{background:rgba(192,52,43,.45)}}

/* ---------- buttons ---------- */
.btn{display:flex;align-items:center;justify-content:center;gap:8px;min-height:50px;padding:0 16px;border-radius:16px;font-weight:900;font-size:16px;border:0;color:#3A2305;background:linear-gradient(180deg,#FFE08A,#E2A93A);box-shadow:0 5px 0 #9A6B14,0 0 24px rgba(242,201,76,.35);transition:transform .12s var(--out),box-shadow .12s,filter .2s;text-align:center;line-height:1.15;width:100%}
.btn:active:not(:disabled){transform:translateY(3px);box-shadow:0 2px 0 #9A6B14}
.btn:disabled{filter:grayscale(.7) opacity(.55)}
.btn svg{width:20px;height:20px;flex:none}
.btn.soft{background:rgba(255,255,255,.14);color:#fff;box-shadow:inset 0 0 0 1px rgba(255,255,255,.22)}
.btn.soft:active:not(:disabled){box-shadow:inset 0 0 0 1px rgba(255,255,255,.22)}
.btn.em{background:linear-gradient(180deg,#2A9A6E,#155E43);color:#fff;box-shadow:0 5px 0 #0B3B2B}
.btn.em:active:not(:disabled){box-shadow:0 2px 0 #0B3B2B}
.btn.red{background:linear-gradient(180deg,#E86A5E,#C0342B);color:#fff;box-shadow:0 5px 0 #7E1F18}
.btn.red:active:not(:disabled){box-shadow:0 2px 0 #7E1F18}
.btn.lite{background:#EDE3D0;color:var(--ink);box-shadow:0 4px 0 #CDBB97}
.btn.lite:active:not(:disabled){box-shadow:0 1px 0 #CDBB97}
.btn.sm{min-height:44px;font-size:14px;border-radius:14px;padding:0 12px}
.btn small{display:block;font-size:11px;font-weight:700;opacity:.8}
.btn .col{display:flex;flex-direction:column;align-items:center}

/* ---------- home ---------- */
#home{display:flex;flex-direction:column}
.hhero{position:relative;z-index:2;text-align:center;padding:4px 16px 0}
.hhero .thaana{font-size:clamp(16px,4.8vw,22px)}
.hhero .bw{font-size:clamp(40px,13.5vw,64px)}
.hhero .tg{font-size:clamp(13px,3.8vw,16px);margin-top:6px}
.tilt{position:relative;flex:1;min-height:120px;display:grid;place-items:center;perspective:900px;z-index:1}
.tilt .board{--S:var(--hb);--B:var(--hb);transform:rotateX(50deg) rotateZ(-8deg);transform-origin:50% 50%;animation:float 7s ease-in-out infinite;pointer-events:none}
@keyframes float{0%,100%{transform:rotateX(50deg) rotateZ(-8deg) translateY(0)}50%{transform:rotateX(50deg) rotateZ(-6deg) translateY(-10px)}}
.hbtns{position:relative;z-index:3;display:grid;gap:10px;padding:0 16px calc(var(--sab) + 18px);width:100%;max-width:460px;margin:0 auto}
.hbtns .row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.modes{display:flex;gap:6px;justify-content:center;margin-bottom:2px}
.modes button{min-height:44px;font-size:12px;font-weight:800;padding:0 14px;border-radius:99px;border:0;background:rgba(8,70,88,.85);box-shadow:inset 0 0 0 1px rgba(255,255,255,.2);color:#fff}
.modes button[aria-checked="true"]{background:#FFE3A8;color:#3A2305}
.soon{font-size:10px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;opacity:.8}

/* ---------- board (square layout) ---------- */
.board{position:relative;display:grid;grid-template-columns:1.55fr repeat(6,1fr) 1.55fr;grid-template-rows:1.55fr repeat(6,1fr) 1.55fr;gap:calc(var(--B)*.0034);padding:calc(var(--B)*.0034);width:var(--B);height:var(--B);border-radius:calc(var(--B)*.04);
 background:#C9B48A;box-shadow:0 0 0 3px #6B4A2A,0 0 0 5px #D9B26A,0 24px 40px -14px rgba(0,0,0,.65);color:var(--ink);user-select:none;-webkit-user-select:none}
.cell{position:relative;background:linear-gradient(180deg,#FFF8EA,#F4E7CC);display:flex;flex-direction:column;align-items:center;justify-content:center;overflow:hidden;text-align:center;min-width:0;min-height:0;gap:calc(var(--B)*0.0027)}
.cell .nm{display:block;max-width:100%;font:800 var(--fs,calc(var(--B)*0.0219))/1.04 Sora,sans-serif;letter-spacing:-.02em;word-break:keep-all;overflow-wrap:normal;hyphens:none;padding:0 1px}
.cell .pr{display:block;font:800 calc(var(--B)*0.017)/1 Sora,sans-serif;color:#6B6354;white-space:nowrap}
.cell .ic{display:block;width:calc(var(--B)*0.0399);height:calc(var(--B)*0.0399);flex:none}
.cell .ic svg{width:100%;height:100%;display:block}
.cell .bar{position:absolute;display:flex;align-items:center;justify-content:center;gap:calc(var(--B)*0.004)}
.cell.b .bar{top:0;left:0;right:0;height:calc(var(--B)*0.0412)}.cell.t .bar{bottom:0;left:0;right:0;height:calc(var(--B)*0.0412)}
.cell.l .bar{right:0;top:0;bottom:0;width:calc(var(--B)*0.0412);flex-direction:column}.cell.r .bar{left:0;top:0;bottom:0;width:calc(var(--B)*0.0412);flex-direction:column}
.cell.b{padding-top:calc(var(--B)*0.0412)}.cell.t{padding-bottom:calc(var(--B)*0.0412)}.cell.l{padding-right:calc(var(--B)*0.0412)}.cell.r{padding-left:calc(var(--B)*0.0412)}
.cell.own{box-shadow:inset 0 0 0 calc(var(--B)*0.006) var(--oc)}
.cell .od{position:absolute;width:calc(var(--B)*0.0213);height:calc(var(--B)*0.0213);border-radius:50%;background:var(--oc);box-shadow:0 0 0 calc(var(--B)*0.0027) #fff;z-index:2}
.cell.b .od{bottom:calc(var(--B)*0.0053);right:calc(var(--B)*0.0053)}.cell.t .od{top:calc(var(--B)*0.0053);right:calc(var(--B)*0.0053)}
.cell.l .od{left:calc(var(--B)*0.0053);bottom:calc(var(--B)*0.0053)}.cell.r .od{right:calc(var(--B)*0.0053);bottom:calc(var(--B)*0.0053)}
.bar .gh{width:calc(var(--B)*0.0166);height:calc(var(--B)*0.0166);background:#fff;border-radius:calc(var(--B)*0.0027) calc(var(--B)*0.0027) 1px 1px;box-shadow:0 0 0 calc(var(--B)*0.0021) rgba(0,0,0,.4);clip-path:polygon(50% 0,100% 40%,100% 100%,0 100%,0 40%)}
.bar .rs{width:calc(var(--B)*0.0319);height:calc(var(--B)*0.0199);background:linear-gradient(180deg,#FFE9A8,#E7B53C);border-radius:calc(var(--B)*0.004);box-shadow:0 0 0 calc(var(--B)*0.0024) rgba(0,0,0,.45)}
.cell.l .bar .rs,.cell.r .bar .rs{width:calc(var(--B)*0.0199);height:calc(var(--B)*0.0319)}
.cell.loan{filter:saturate(.35) brightness(.93)}
.cell.loan:after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(135deg,transparent 0 5px,rgba(107,99,84,.18) 5px 7px);pointer-events:none}
.cell.hit{animation:hit .9s var(--out)}
@keyframes hit{0%{background:#FFF;box-shadow:inset 0 0 0 3px #FFD36E}100%{}}
.corner{background:linear-gradient(160deg,#FFFCF2,#EEDFBF)}
.corner .ic{width:calc(var(--B)*0.0692);height:calc(var(--B)*0.0692)}
.corner .nm{--fs:calc(var(--B)*0.0233)}
.corner.go{background:linear-gradient(160deg,#E7F6EC,#C8E8D3)}
.corner.jail{background:repeating-linear-gradient(90deg,#F4E7CC 0 5px,#E8D8B6 5px 6px)}
.corner.gojail{background:linear-gradient(160deg,#FCE6D6,#F2CDB2)}
.corner.free{background:linear-gradient(160deg,#FFF7DD,#F3E2B5)}
.ctr{grid-row:2/8;grid-column:2/8;position:relative;overflow:hidden;background:#1596AE url(ocean.webp) center/cover no-repeat;display:flex;align-items:center;justify-content:center}
.lagoon{position:absolute;inset:0;overflow:hidden;pointer-events:none;mix-blend-mode:screen;opacity:.55}
.lagoon i{position:absolute;left:0;top:0;width:calc(100% + var(--T2,300px)*2);height:calc(100% + var(--T2,300px)*2);background:url(caustics.webp) 0 0/var(--T,220px) var(--T,220px) repeat;will-change:transform;backface-visibility:hidden}
.lagoon .c1{opacity:.34;animation:cz1 58s linear infinite}
.lagoon .c2{opacity:.22;background-size:var(--T2,300px) var(--T2,300px);animation:cz2 44s linear infinite}
@keyframes cz1{from{transform:translate3d(0,0,0)}to{transform:translate3d(calc(-1*var(--T,220px)),calc(-1*var(--T,220px)),0)}}
@keyframes cz2{from{transform:translate3d(calc(-1*var(--T2,300px)),0,0)}to{transform:translate3d(0,calc(-1*var(--T2,300px)),0)}}
.clogo{position:relative;text-align:center;margin-top:-34%}
.clogo .thaana{font-size:calc(var(--B)*.037)}
.clogo .bw{font-size:calc(var(--B)*.097)}
.clogo .tg{font-size:calc(var(--B)*.028)}
.deck{position:absolute;width:19%;height:13%;border-radius:calc(var(--B)*0.0266);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2%;background:#FFF8EA;box-shadow:0 2px 0 #D9C7A0,0 4px 0 #CDB88D,0 10px 14px -6px rgba(0,0,0,.45);transform:rotate(var(--r));border:0;padding:0;color:var(--ink)}
.deck svg{width:28%;height:auto}.deck b{font:800 calc(var(--B)*0.0206)/1 Sora,sans-serif}
.deck.dm{left:15%;top:55%;--r:-12deg}.deck.dn{right:15%;top:55%;--r:10deg}
.isl{position:absolute;width:calc(var(--B)*0.0692*var(--s));height:calc(var(--B)*0.0266*var(--s));border-radius:50%;background:radial-gradient(closest-side,#F7E7C4 55%,#3F9A5A 56% 70%,transparent 72%);opacity:.9}
.ticker{position:absolute;left:8%;right:8%;bottom:6%;text-align:center;font:700 calc(var(--B)*.024)/1.25 Sora,sans-serif;color:#fff;text-shadow:0 1px 4px rgba(0,40,60,.6);min-height:2.5em;display:flex;align-items:flex-end;justify-content:center}
.ticker span{animation:tin .5s var(--out)}
@keyframes tin{from{opacity:0;transform:translateY(6px)}}
.tokens{position:absolute;inset:0;pointer-events:none;z-index:6}
.tok{position:absolute;left:0;top:0;width:calc(var(--B)*.056);height:calc(var(--B)*.056);margin:calc(var(--B)*-.028) 0 0 calc(var(--B)*-.028);transition:left .17s var(--out),top .17s var(--out)}
.tok i{display:grid;place-items:center;width:100%;height:100%;border-radius:50%;background:#fff;box-shadow:0 0 0 calc(var(--B)*0.0067) var(--c),0 3px 5px rgba(0,0,0,.45)}
.tok svg{width:78%;height:78%}
.tok.hop i{animation:hop .17s ease-out}
@keyframes hop{50%{transform:translateY(-55%) scale(1.12)}}
.tok.on{z-index:2}.tok.on i{box-shadow:0 0 0 calc(var(--B)*0.0067) var(--c),0 0 0 calc(var(--B)*0.0146) rgba(255,211,110,.8),0 3px 5px rgba(0,0,0,.45)}
.tok.jailed i{filter:grayscale(.4)}

/* ---------- game ---------- */
#game{display:grid;grid-template-rows:auto auto minmax(0,1fr);grid-template-columns:minmax(0,1fr);grid-template-areas:"bar" "stage" "side"}
#game .tbar{grid-area:bar;padding-bottom:4px}
.stage{grid-area:stage;position:relative;display:grid;place-items:center;padding:2px 0}
.bview{position:relative;width:var(--S);height:var(--S);overflow:hidden;border-radius:18px;touch-action:none;cursor:grab}
.bcam{position:absolute;left:0;top:0;width:var(--S);height:var(--S);display:grid;place-items:center;transform-origin:0 0;will-change:transform}
.bcam.ease{transition:transform .35s var(--out)}
.zbtns{position:absolute;right:calc(var(--S)*.135 + 4px);top:calc(var(--S)*.135 + 4px);display:flex;gap:6px;z-index:8}
.zb{width:44px;height:44px;border-radius:14px;border:0;background:rgba(6,48,63,.72);color:#fff;display:grid;place-items:center;box-shadow:inset 0 0 0 1px rgba(255,255,255,.25);backdrop-filter:blur(4px)}
.zb svg{width:20px;height:20px}
/* thrown 3D dice */
.dtray{position:absolute;inset:0;overflow:hidden;pointer-events:none;z-index:7;perspective:900px;perspective-origin:50% 40%;opacity:0}
.dtray.on{opacity:1}.dtray.fade{opacity:0;transition:opacity .45s ease}
.d3{position:absolute;left:0;top:0;width:var(--d);height:var(--d);transform-style:preserve-3d;will-change:transform}
.d3s{position:absolute;inset:6%;border-radius:32%;background:radial-gradient(closest-side,rgba(2,24,32,.6),rgba(2,24,32,.25) 60%,transparent);will-change:transform,opacity}
.d3c{position:absolute;inset:0;transform-style:preserve-3d;--h:calc(var(--d)/2);will-change:transform}
.d3c .fc{position:absolute;inset:0;border-radius:21%;backface-visibility:hidden;background:radial-gradient(120% 120% at 28% 22%,#FFFFFF 0%,#F8F2E6 50%,#E4D8C0 100%);box-shadow:inset 0 0 calc(var(--d)*.1) rgba(120,90,40,.28),inset 0 0 0 1px rgba(255,255,255,.7)}
.d3c .fc b{position:absolute;width:19%;height:19%;margin:-9.5% 0 0 -9.5%;border-radius:50%;background:radial-gradient(circle at 42% 38%,#434845,#0E1311 72%);box-shadow:inset 0 calc(var(--d)*.015) calc(var(--d)*.02) rgba(0,0,0,.6),0 1px 0 rgba(255,255,255,.7)}
.d3c .fc b.r{width:23%;height:23%;margin:-11.5% 0 0 -11.5%;background:radial-gradient(circle at 42% 38%,#E0534A,#8E1D18 75%)}
.d3c .core{position:absolute;inset:3%;border-radius:12%;background:#EFE6D3}
#dice{touch-action:none;cursor:grab;transition:opacity .25s,transform .12s}
#dice.grab{cursor:grabbing}#dice.thrown{opacity:.25}
.flickhint{display:block;font-size:10.5px;font-weight:700;opacity:.8;text-align:center;margin-top:-4px}
.side{grid-area:side;min-height:0;overflow:auto;padding:6px 12px calc(var(--sab) + 12px);display:flex;flex-direction:column;gap:10px;overscroll-behavior:contain;scrollbar-width:none}
.side::-webkit-scrollbar{display:none}
.pls{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px;flex:none}
.pl{position:relative;display:flex;align-items:center;gap:7px;padding:5px 7px 5px 5px;min-height:46px;border-radius:14px;background:rgba(255,255,255,.1);box-shadow:inset 0 0 0 1px rgba(255,255,255,.14);border:0;text-align:left;min-width:0;color:#fff;transition:background .3s,box-shadow .3s}
.pl.on{background:rgba(255,211,110,.16);box-shadow:inset 0 0 0 1.5px #FFD36E}
.pl.out{opacity:.45}
.pl .pf{display:block;width:34px;height:34px;border-radius:50%;overflow:hidden;box-shadow:0 0 0 2px var(--c);flex:none;background:#fff}
.pl .pf svg{display:block;width:100%;height:100%}
.pl .tx{min-width:0;flex:1}
.pl b{display:block;font-size:12px;line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pl small{display:flex;align-items:center;gap:4px;font-size:11.5px;font-weight:800;color:#FFE3A8;white-space:nowrap}
.pl .tk{flex:none;width:24px;height:24px;border-radius:50%;background:#fff;display:grid;place-items:center;box-shadow:0 0 0 1.5px var(--c)}
.pl .tk svg{width:17px;height:17px}
.pl .st{position:absolute;top:-5px;right:-3px;display:flex;gap:2px}
.pl .st i{font:800 9px/1 Sora,sans-serif;font-style:normal;padding:3px 5px;border-radius:99px;background:#C0342B;color:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3)}
.pl .st i.card{background:#155E43}
.pl .st i.inv{background:#8A2B2B}
.pl .fly{position:absolute;right:30px;top:4px;font:900 13px/1 Sora,sans-serif;pointer-events:none;animation:fly 1.4s var(--out) forwards;text-shadow:0 1px 3px rgba(0,0,0,.5)}
.pl .fly.p{color:#8CFFB5}.pl .fly.m{color:#FF9C8F}
@keyframes fly{from{opacity:0;transform:translateY(8px)}20%{opacity:1}to{opacity:0;transform:translateY(-22px)}}
.act{display:grid;gap:10px;flex:none}
.status{display:flex;justify-content:center}
.status .chip{font-size:12.5px;max-width:100%;overflow:hidden;text-overflow:ellipsis}
.dice{display:flex;gap:12px;justify-content:center;min-height:50px}
.die{width:48px;height:48px;border-radius:12px;background:linear-gradient(160deg,#fff,#EDE3D0);box-shadow:inset 0 -3px 0 rgba(0,0,0,.08),0 8px 14px -6px rgba(0,0,0,.5);display:grid;place-items:center;will-change:transform}
.die svg{width:38px;height:38px}
.die.dbl{box-shadow:inset 0 -3px 0 rgba(0,0,0,.08),0 0 0 2px #FFD36E,0 8px 14px -6px rgba(0,0,0,.5)}
.abtns{display:grid;gap:10px}
.abtns .row{display:grid;grid-template-columns:repeat(auto-fit,minmax(0,1fr));gap:8px}
.pumping #abtns>.btn{opacity:.55;pointer-events:none;filter:saturate(.6)}
.riskmini{display:flex;align-items:center;gap:8px;font-size:11px;font-weight:800;color:#FFD9CF;padding:0 4px}
.riskmini i{flex:1;height:6px;border-radius:99px;background:rgba(255,255,255,.18);overflow:hidden}
.riskmini i:before{content:"";display:block;width:var(--r);height:100%;background:linear-gradient(90deg,#F2C94C,#E86A5E,#C0342B);transition:width .6s var(--out)}
.banner{position:fixed;left:50%;top:calc(var(--sat) + 62px);transform:translateX(-50%);z-index:40;width:min(420px,calc(100vw - 24px));display:flex;align-items:center;gap:10px;padding:8px 8px 8px 12px;border-radius:18px;background:#FFF8EA;color:var(--ink);box-shadow:0 14px 30px -10px rgba(0,0,0,.55);animation:bin .5s var(--spring)}
.banner .pf{width:36px;height:36px;border-radius:50%;overflow:hidden;flex:none}
.banner .pf svg{width:100%;height:100%;display:block}
.banner p{margin:0;flex:1;font-size:12.5px;font-weight:700;line-height:1.3;min-width:0}
.banner .btn{width:auto;min-height:44px;font-size:13px;padding:0 14px}
@keyframes bin{from{transform:translate(-50%,-30px);opacity:0}}
#toasts{position:fixed;left:50%;top:calc(var(--sat) + 64px);transform:translateX(-50%);z-index:90;display:grid;gap:6px;width:min(400px,calc(100vw - 32px));pointer-events:none}
#banner:not(:empty)~#toasts{top:calc(var(--sat) + 128px)}
.toast{padding:10px 14px;border-radius:14px;background:rgba(6,34,44,.94);color:#fff;font-size:13px;font-weight:700;box-shadow:0 10px 24px -8px rgba(0,0,0,.6);animation:tin .35s var(--out);text-align:center}

/* ---------- sheets ---------- */
.dim{position:fixed;inset:0;background:rgba(3,20,26,.55);z-index:50;animation:fade .25s ease-out}
@keyframes fade{from{opacity:0}}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:51;max-height:calc(100% - var(--sat) - 24px);overflow:auto;overscroll-behavior:contain;border-radius:28px 28px 0 0;background:var(--paper);color:var(--ink);padding:10px 16px calc(var(--sab) + 22px);animation:up .55s var(--spring) both;margin:0 auto;max-width:560px}
@keyframes up{from{transform:translateY(100%)}}
.sheet:focus{outline:none}
.grab{display:block;width:44px;height:5px;border-radius:99px;background:#D9CBB0;margin:0 auto 10px;border:0;padding:0}
.sheet h2{margin:2px 0 8px;font:900 22px/1.15 Fraunces,Georgia,serif}
.sheet h3{margin:14px 0 6px;font:800 12px/1.2 Sora,sans-serif;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.sheet p{margin:6px 0;font-size:13.5px;line-height:1.45;color:#3d3a33}
.sheet .x{position:absolute;right:10px;top:8px;width:44px;height:44px;border-radius:14px;border:0;background:transparent;color:var(--muted);display:grid;place-items:center}
.sheet .x svg{width:20px;height:20px}
.shead{position:relative;padding-right:44px;min-height:46px}
.pcard{border-radius:20px;overflow:hidden;background:#fff;box-shadow:0 10px 24px -12px rgba(0,0,0,.35),inset 0 0 0 1px var(--line)}
.pcard .hd{padding:10px 14px;color:#fff;display:flex;align-items:center;justify-content:space-between;gap:10px}
.pcard .hd b{font:900 24px/1.05 Fraunces,Georgia,serif;min-width:0}
.pcard .hd small{font-size:10px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;opacity:.92;text-align:right;flex:none;max-width:48%}
.pcard .hd.lt{color:var(--ink)}
.iart{display:block;width:100%;height:120px}
.rent{display:grid;grid-template-columns:1fr auto;gap:3px 10px;padding:10px 14px;font-size:12.5px}
.rent span{color:var(--muted)}.rent b{text-align:right;font-variant-numeric:tabular-nums}
.rent .hl{color:var(--ink);font-weight:800}
.rent .cur{color:var(--emerald);font-weight:900}
.rent .sep{grid-column:1/-1;height:1px;background:var(--line);margin:4px 0}
.acts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.acts.one{grid-template-columns:1fr}
.acts.three{grid-template-columns:1fr 1fr 1fr}
.price{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:12px;font-size:13px;color:var(--muted)}
.price b{font:900 22px/1 Fraunces,serif;color:var(--ink);white-space:nowrap}
.owner{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:16px;background:#fff;box-shadow:inset 0 0 0 1px var(--line);margin-top:10px}
.owner .pf{display:block;width:40px;height:40px;border-radius:50%;overflow:hidden;box-shadow:0 0 0 2px var(--c,#E0525A);flex:none}
.owner .pf svg{width:100%;height:100%;display:block}
.owner b{font-size:14px}.owner small{display:block;font-size:11.5px;color:var(--muted)}
.owner .amt{margin-left:auto;font:900 24px/1 Fraunces,serif;color:#C0342B;white-space:nowrap}
.bribe{margin-top:12px;padding:12px;border-radius:16px;background:linear-gradient(135deg,#FFF3D6,#FFE3A8);box-shadow:inset 0 0 0 1px #E7C97F}
.bribe b{display:flex;align-items:center;gap:6px;font-size:13.5px}
.bribe b svg{width:18px;height:18px;flex:none}
.bribe p{margin:4px 0 0;font-size:11.5px;color:#6B4A14;line-height:1.35}
.risk{display:flex;align-items:center;gap:8px;margin-top:8px;font-size:11px;font-weight:800;color:#8A2B2B}
.risk i{flex:1;height:7px;border-radius:99px;background:#F2D2C8;overflow:hidden}
.risk i:before{content:"";display:block;width:var(--r);height:100%;background:linear-gradient(90deg,#F2A93A,#E86A5E,#C0342B)}
.cardpop{position:fixed;left:50%;top:calc(var(--sat) + 120px);width:250px;margin-left:-125px;z-index:70;border-radius:20px;background:#FFF8EA;color:var(--ink);padding:16px 16px 14px;box-shadow:0 30px 50px -16px rgba(0,0,0,.7),inset 0 0 0 1px #EADFCB;text-align:center;animation:flipin .8s var(--spring) both;transform-origin:50% 60%;border:0;font:inherit}
.cardpop:before{content:"";position:absolute;inset:6px;border-radius:15px;border:1.5px dashed #E1CFA6;pointer-events:none}
@keyframes flipin{from{transform:perspective(600px) rotateY(90deg) scale(.6);opacity:0}}
.cardpop .ic{width:44px;height:44px;margin:0 auto}.cardpop .ic svg{width:44px;height:44px}
.cardpop small{display:block;font-size:10px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:#8A6414;margin-top:4px}
.cardpop.n small{color:#1B7FA6}
.cardpop p{margin:6px 0 0;font:700 15px/1.35 Fraunces,Georgia,serif}
.cardpop em{display:block;margin-top:8px;font:700 11px/1.2 Sora,sans-serif;font-style:normal;color:var(--muted)}
.list{display:grid;gap:6px}
.row2{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:14px;background:#fff;box-shadow:inset 0 0 0 1px var(--line);min-height:52px}
.row2 .sw{width:10px;align-self:stretch;border-radius:4px;flex:none}
.row2 .tx{flex:1;min-width:0}
.row2 .tx b{display:block;font-size:13.5px;line-height:1.2}
.row2 .tx small{display:block;font-size:11.5px;color:var(--muted);line-height:1.3}
.row2 .bs{display:flex;gap:6px;flex:none}
.mb{min-width:44px;height:44px;border-radius:12px;border:0;background:#EDE3D0;color:var(--ink);font-weight:800;font-size:12px;padding:0 10px;display:inline-flex;align-items:center;justify-content:center;gap:1px}
.mb.g{background:#155E43;color:#fff}.mb.r{background:#F3D9D2;color:#8A2B2B}
.mb:disabled{opacity:.35}
.mb svg{width:18px;height:18px}
.stepper{display:flex;align-items:center;gap:8px}
.stepper output{min-width:86px;text-align:center;font:900 20px/1 Fraunces,serif}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.pchip{display:inline-flex;align-items:center;gap:6px;min-height:44px;padding:0 12px 0 0;border-radius:12px;border:0;background:#fff;box-shadow:inset 0 0 0 1.5px var(--line);color:var(--ink);font-weight:700;font-size:12.5px;overflow:hidden}
.pchip i{width:8px;align-self:stretch;flex:none}
.pchip[aria-pressed="true"]{box-shadow:inset 0 0 0 2.5px #155E43;background:#E4F4EA}
.pchip:disabled{opacity:.4}
.tabs{display:flex;gap:6px;overflow-x:auto;padding:2px}
.tabs button{flex:none;display:flex;align-items:center;gap:6px;min-height:48px;padding:4px 12px 4px 4px;border-radius:99px;border:0;background:#fff;box-shadow:inset 0 0 0 1.5px var(--line);color:var(--ink);font-weight:800;font-size:13px}
.tabs button[aria-selected="true"]{box-shadow:inset 0 0 0 2.5px #155E43;background:#E4F4EA}
.tabs .pf{width:36px;height:36px;border-radius:50%;overflow:hidden;display:block}
.tabs .pf svg{width:100%;height:100%;display:block}
.tcols{display:grid;gap:12px}
.tbox{padding:10px;border-radius:16px;background:#fff;box-shadow:inset 0 0 0 1px var(--line)}
.tbox h4{margin:0 0 8px;font:800 13px/1.2 Sora,sans-serif}
.fair{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:800;color:var(--muted);margin-top:8px}
.bidbar{height:8px;border-radius:99px;background:#E8DCC4;overflow:hidden;margin:8px 0}
.bidbar i{display:block;height:100%;width:100%;background:linear-gradient(90deg,#2A9A6E,#F2C94C);transform-origin:0 0;transition:transform .25s linear}
.hbid{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:16px;background:#fff;box-shadow:inset 0 0 0 1px var(--line)}
.hbid .pf{width:40px;height:40px;border-radius:50%;overflow:hidden;flex:none}
.hbid .pf svg{width:100%;height:100%;display:block}
.hbid b{font:900 26px/1 Fraunces,serif;margin-left:auto}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{flex:1;min-height:48px;min-width:44px;border-radius:14px;border:0;background:#fff;box-shadow:inset 0 0 0 1.5px var(--line);font-weight:800;color:var(--ink);padding:0 8px}
.seg button[aria-checked="true"]{box-shadow:inset 0 0 0 2.5px #155E43;background:#E4F4EA}
.seg button svg{width:26px;height:26px;display:block;margin:0 auto}
.seg.tk{display:grid;grid-template-columns:repeat(6,minmax(0,1fr))}
@media (max-width:359px){.seg.tk{grid-template-columns:repeat(3,1fr)}}
.field{display:grid;gap:4px;margin:8px 0}
.field label{font-size:12px;font-weight:800;color:var(--muted)}
.field input{min-height:48px;border-radius:14px;border:1.5px solid var(--line);padding:0 14px;font:700 16px Sora,sans-serif;color:var(--ink);background:#fff}
.bots{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
.bots span{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;font-weight:800;color:var(--muted)}
.bots .pf{width:44px;height:44px;border-radius:50%;overflow:hidden;box-shadow:0 0 0 2px var(--c)}
.bots .pf svg{width:100%;height:100%;display:block}
.logl{max-height:50vh;overflow:auto;display:grid;gap:4px;font-size:12.5px}
.logl div{padding:6px 10px;border-radius:10px;background:#fff}
.rules{font-size:13.5px;line-height:1.5;color:#3d3a33}
.rules h3{color:var(--emerald)}
.rules ul{padding-left:18px;margin:6px 0}.rules li{margin:3px 0}
.win{text-align:center}
.win .crown{width:92px;height:92px;margin:6px auto 2px;border-radius:50%;overflow:hidden;box-shadow:0 0 0 4px #FFD36E,0 10px 30px -8px rgba(0,0,0,.4)}
.win .crown svg{width:100%;height:100%;display:block}
.rank{display:grid;gap:6px;margin-top:10px;text-align:left}
.reward{display:inline-flex;align-items:center;gap:6px;margin-top:8px;padding:8px 14px;border-radius:99px;background:#FFF3D6;box-shadow:inset 0 0 0 1px #E7C97F;font-weight:900;color:#6B4A14}
.reward img{width:20px;height:20px}
.sp-box{margin-top:12px}
.switch{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:52px;padding:6px 12px;border-radius:14px;background:#fff;box-shadow:inset 0 0 0 1px var(--line);width:100%;border:0;color:var(--ink);font-weight:700;font-size:14px;text-align:left}
.switch i{flex:none;width:44px;height:26px;border-radius:99px;background:#D9CBB0;position:relative;transition:background .2s}
.switch i:after{content:"";position:absolute;left:3px;top:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:transform .2s var(--out)}
.switch[aria-checked="true"] i{background:#155E43}.switch[aria-checked="true"] i:after{transform:translateX(18px)}
.menu{display:grid;gap:8px}

/* compact phones (short screens): one-row player strip, dice beside the buttons */
#game.compact .pls{display:flex;overflow-x:auto;scrollbar-width:none;margin:0 -12px;padding:4px 12px}
#game.compact .pls::-webkit-scrollbar{display:none}
#game.compact .pl{flex:none;width:136px}
#game.compact .act{grid-template-columns:auto minmax(0,1fr);align-items:start;gap:8px}
#game.compact .status,#game.compact .pumping #abtns>.btn{opacity:.55;pointer-events:none;filter:saturate(.6)}
.riskmini{grid-column:1/-1}
#game.compact .dice{flex-direction:column;gap:6px;min-height:0}
#game.compact .die{width:36px;height:36px;border-radius:10px}#game.compact .die svg{width:28px;height:28px}
#game.compact .abtns{gap:8px}
#game.compact .abtns .btn{min-height:46px}
#game.compact .abtns .btn.sm{min-height:44px}
/* ---------- responsive ---------- */
@media (orientation:landscape) and (min-width:560px){
 #game{grid-template-columns:auto minmax(0,1fr);grid-template-rows:auto minmax(0,1fr);grid-template-areas:"stage bar" "stage side"}
 .stage{padding:8px 4px 8px 10px}
 .side{padding-top:4px;width:100%;max-width:500px}
 .sheet{left:50%;right:auto;bottom:50%;width:min(440px,calc(100vw - 32px));transform:translate(-50%,50%);border-radius:26px;max-height:calc(100vh - 24px);animation:pop .45s var(--spring) both;padding-bottom:18px}
 @keyframes pop{from{transform:translate(-50%,50%) scale(.9);opacity:0}}
 .grab{display:none}
}
@media (min-width:900px) and (min-height:560px){
 #game .side{padding-right:20px}
 .pls{grid-template-columns:1fr 1fr}
}
@media (max-height:600px) and (orientation:portrait){
 .dice{min-height:40px}.die{width:40px;height:40px}.die svg{width:31px;height:31px}
 .pl{min-height:44px}.pl .pf{width:30px;height:30px}
 .btn{min-height:46px;font-size:15px}
 .side{gap:8px}
 .hhero .bw{font-size:40px}
}
@media (prefers-reduced-motion:reduce){
 *,*:before,*:after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
 .sun:before,.sun:after,.lagoon i{animation:none!important}
}
</style>
</head>

const ART=(()=>{

 const R=(r,a,b)=>a+(b-a)*r();
 function head(id,dark){return `<svg class="iart" viewBox="0 0 300 150" preserveAspectRatio="xMidYMid slice" aria-hidden="true"><defs><linearGradient id="${id}s" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${dark?'#7CCFD9':'#8FE3F0'}"/><stop offset=".55" stop-color="${dark?'#2A9DB0':'#2FB7C9'}"/><stop offset="1" stop-color="${dark?'#0B6A84':'#0E7C99'}"/></linearGradient><radialGradient id="${id}r" cx=".5" cy=".55" r=".5"><stop offset="0" stop-color="#BFF3F0"/><stop offset="1" stop-color="#BFF3F0" stop-opacity="0"/></radialGradient><linearGradient id="${id}g" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#9FD3E6"/></linearGradient></defs><rect width="300" height="150" fill="url(#${id}s)"/>`;}
 const waves=(r,n=4)=>{let s='<g stroke="#fff" stroke-width="1.5" fill="none" opacity=".55" stroke-linecap="round">';for(let i=0;i<n;i++){const x=R(r,10,270),y=[R(r,14,40),R(r,118,140)][i%2];s+=`<path d="M${x|0} ${y|0}q8-5 16 0t16 0"/>`;}return s+'</g>';};
 const reef=(id,cx,cy,rx,ry)=>`<ellipse cx="${cx}" cy="${cy+4}" rx="${rx*1.5}" ry="${ry*1.9}" fill="url(#${id}r)"/>`;
 const isle=(id,cx,cy,rx,ry,veg=1)=>reef(id,cx,cy,rx,ry)+`<ellipse cx="${cx}" cy="${cy}" rx="${rx}" ry="${ry}" fill="#F7E7C4"/>`+(veg?`<ellipse cx="${cx}" cy="${cy-3}" rx="${rx*.8}" ry="${ry*.62}" fill="#3F9A5A"/>`:'');
 const rect=(id,x,y,w,h,col='#E9DDC0')=>reef(id,x+w/2,y+h/2,w/2,h/2)+`<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="5" fill="${col}"/><rect x="${x}" y="${y+h-3}" width="${w}" height="3" rx="1.5" fill="#B9AE92"/>`;
 const trees=(r,cx,cy,rx,ry,n,col='#2E7D4F')=>{let s=`<g fill="${col}">`;for(let i=0;i<n;i++){const a=R(r,0,6.28),d=Math.sqrt(r());s+=`<circle cx="${(cx+Math.cos(a)*rx*d)|0}" cy="${(cy+Math.sin(a)*ry*d)|0}" r="${R(r,5,10)|0}"/>`;}return s+'</g>';};
 const palm=(x,y,h=18,f=1)=>`<path d="M${x} ${y}q${-3*f} ${-h/2} ${2*f} ${-h}" stroke="#7A5230" stroke-width="2" fill="none" stroke-linecap="round"/><g fill="#2E8B4F" transform="translate(${x+2*f} ${y-h})"><path d="M0 0q-9-5-15 2q7-2 15-2z"/><path d="M0 0q9-5 15 2q-7-2-15-2z"/><path d="M0 0q-4-8-11-9q6 4 11 9z"/><path d="M0 0q5-8 11-8q-6 3-11 8z"/><circle cx="-1" cy="1.5" r="1.6" fill="#8B5A2B"/><circle cx="1.6" cy="1.6" r="1.6" fill="#8B5A2B"/></g>`;
 const palms=(r,pts)=>pts.map(p=>palm(p[0],p[1],p[2]||R(r,14,20),r()<.5?1:-1)).join('');
 const house=(x,y,w=14,h=9,roof='#D9383A',wall='#FFFDF7')=>`<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="1" fill="${wall}"/><path d="M${x-1} ${y+1}l${w/2+1} ${-6}l${w/2+1} 6z" fill="${roof}"/><rect x="${x+w/2-1.5}" y="${y+h-5}" width="3" height="5" fill="#8B5A2B" opacity=".7"/>`;
 const houses=(r,x0,x1,y,n,roofs=['#D9383A','#1F4FA8','#2E9E5B','#F29A3A','#E86FA8','#6FC8EC'],walls=['#FFFDF7','#FFF3D6','#F4F1EA'])=>{let s='';for(let i=0;i<n;i++){const x=x0+(x1-x0)*i/Math.max(1,n-1)+R(r,-3,3),yy=y+R(r,-6,6);s+=house(x|0,yy|0,R(r,10,15)|0,R(r,7,10)|0,roofs[(r()*roofs.length)|0],walls[(r()*walls.length)|0]);}return s;};

  hulhumale:(r,id)=>{let s=rect(id,20,64,260,50,'#EFE7D2')+`<path d="M20 110h260" stroke="#F7E7C4" stroke-width="10"/>`;const cs=['#FFFFFF','#E9F3F7','#CDE6F2','#F4F1EA','#DDEFE9'];for(let i=0;i<14;i++)s+=tower(30+i*17,96,12,R(r,26,48)|0,cs[(r()*cs.length)|0]);for(let i=0;i<9;i++)s+=tower(40+i*26,106,15,R(r,16,26)|0,cs[(r()*cs.length)|0]);s+=`<path d="M20 106h260" stroke="#8E8A80" stroke-width="2"/>`+palms(r,[[40,118],[90,118],[150,118],[210,118],[262,118]])+umbrellas(r,60,250,124,5)+plane(250,24,.8,'#fff',-12)+waves(r,2);return s;},

   for(let i=0;i<22;i++){const x=30+i*11+R(r,-2,2),mid=1-Math.abs(i-11)/13;s+=tower(x|0,96,10,(R(r,24,40)+mid*26)|0,cs[(r()*cs.length)|0]);}

<script>
/* =====================================================================
   ENGINE  (rules only; no DOM).  State G is plain JSON (save / network).
   act(pid, action) -> null | error string.   tick(dt) advances game time.
   drain() -> events for the UI to animate (dice, move, cash, card ...).
   ===================================================================== */
const E=(()=>{
 let G=null,EV=[];
 const AUC_START=9000,AUC_EXT=4000,SALE_MS=30000,OFFER_GAP=6000,OFFER_TTL=90000,RISK_MIN=25,RISK_STEP=10,RISK_MAX=90,RISK_DECAY=2;
 const emit=e=>{EV.push(e);};
 const r6=()=>1+((Math.random()*6)|0);
 const P=i=>G.players[i];
 const alive=()=>G.players.map((_,i)=>i).filter(i=>!G.players[i].out);
 const r10=x=>Math.max(10,Math.round(x/10)*10);
 const shuf=n=>{const a=[...Array(n).keys()];for(let i=n-1;i>0;i--){const j=(Math.random()*(i+1))|0;[a[i],a[j]]=[a[j],a[i]];}return a;};
 const fmt=n=>'MVR '+Math.round(n).toLocaleString('en-US');
 function log(s){G.log.push({s,r:G.round});if(G.log.length>150)G.log.shift();emit({t:'log',s});}
 /* ---------- queries ---------- */
 const ownerOf=sp=>G.own[sp]?G.own[sp].o:-1;
 const countOf=(p,list)=>list.filter(i=>G.own[i]&&G.own[i].o===p).length;
 const ownsAll=(p,g)=>GMEM[g].every(i=>G.own[i]&&G.own[i].o===p);
 const groupBuilt=g=>GMEM[g].some(i=>G.own[i]&&G.own[i].h>0);
 const groupLoaned=g=>GMEM[g].some(i=>G.own[i]&&G.own[i].m);
 const hc=sp=>GROUPS[SP[sp].g].hc;
 const loanVal=sp=>SP[sp].price/2;
 const repayCost=sp=>Math.round(SP[sp].price*0.55);
 const bribeOf=amt=>amt<20?Math.max(1,Math.round(amt*0.3)):Math.round(amt*0.3/5)*5;
 const fineOf=amt=>Math.max(100,r10(amt*0.25));
 function rentOf(sp,roll,o={}){const s=SP[sp],w=G.own[sp];if(!w||w.m)return 0;
  if(s.k==='p')return w.h>0?s.rent[w.h]:s.rent[0]*(ownsAll(w.o,s.g)?2:1);
  if(s.k==='r')return TRANSPORT_RENT[countOf(w.o,RAILS)]*(o.mult||1);
  if(s.k==='u')return (countOf(w.o,UTILS)===2?10:4)*(roll||7);return 0;}
 function propsOf(p){return OWNABLE.filter(i=>G.own[i]&&G.own[i].o===p);}
 function bldCount(p){let h=0,r=0;propsOf(p).forEach(i=>{const w=G.own[i];if(w.h===5)r++;else h+=w.h;});return {h,r};}
 function netWorth(p){const pl=P(p);if(pl.out)return 0;let v=pl.cash;propsOf(p).forEach(i=>{const w=G.own[i];v+=w.m?SP[i].price/2:SP[i].price;if(w.h)v+=w.h*hc(i);});return v;}
 function tradable(sp){const s=SP[sp];return !!G.own[sp]&&(s.k!=='p'||!groupBuilt(s.g));}
 /* ---------- checks shared with the UI ---------- */
 function chkBuild(p,sp){const s=SP[sp],w=G.own[sp];if(!w||w.o!==p||s.k!=='p')return 'Not your island';if(!ownsAll(p,s.g))return 'Own the whole colour group first';
  if(groupLoaned(s.g))return 'Repay the loans in this group first';if(w.h>=5)return 'Already a luxury resort';
  const min=Math.min(...GMEM[s.g].map(i=>G.own[i].h));if(w.h>min)return 'Build evenly across the group';if(P(p).cash<hc(sp))return 'Not enough cash';return null;}
 function chkSellB(p,sp){const s=SP[sp],w=G.own[sp];if(!w||w.o!==p||s.k!=='p'||!w.h)return 'Nothing to sell';const max=Math.max(...GMEM[s.g].map(i=>G.own[i].h));if(w.h<max)return 'Sell evenly across the group';return null;}
 function chkLoan(p,sp){const s=SP[sp],w=G.own[sp];if(!w||w.o!==p)return 'Not yours';if(w.m)return 'Already has a loan';if(s.k==='p'&&groupBuilt(s.g))return 'Sell the guesthouses in this group first';if(G.sale&&G.sale.sp===sp)return 'It is up for sale';return null;}
 function chkRepay(p,sp){const w=G.own[sp];if(!w||w.o!==p||!w.m)return 'No loan';if(P(p).cash<repayCost(sp))return 'Not enough cash';return null;}
 function chkTrade(o){if(!o||o.from===o.to)return 'bad';const A=P(o.from),B=P(o.to);if(!A||!B||A.out||B.out)return 'Player is out';
  const g=o.give,w=o.get;if(!g.sp.length&&!w.sp.length&&!g.cash&&!w.cash&&!g.cards&&!w.cards)return 'Empty offer';
  for(const sp of g.sp)if(ownerOf(sp)!==o.from||!tradable(sp))return SP[sp].name+' cannot be traded';
  for(const sp of w.sp)if(ownerOf(sp)!==o.to||!tradable(sp))return SP[sp].name+' cannot be traded';
  if(G.sale&&(g.sp.includes(G.sale.sp)||w.sp.includes(G.sale.sp)))return SP[G.sale.sp].name+' is up for sale';
  if(g.cash<0||w.cash<0||g.cash>A.cash||w.cash>B.cash)return 'Not enough cash';
  if((g.cards||0)>A.cards.length||(w.cards||0)>B.cards.length)return 'Card not held';return null;}
 /* ---------- money ---------- */
 function xfer(from,to,amt){if(!amt)return;if(from>=0){P(from).cash-=amt;emit({t:'cash',p:from,d:-amt});}if(to>=0){P(to).cash+=amt;emit({t:'cash',p:to,d:amt});}}
 function charge(pid,items,then){items=items.filter(x=>x.amt>0);const tot=items.reduce((a,x)=>a+x.amt,0);
  if(P(pid).cash>=tot){items.forEach(x=>xfer(pid,x.to,x.amt));return cont(pid,then);}
  G.pend={t:'debt',p:pid,items,total:tot,then};emit({t:'debt',p:pid,amt:tot});}
 function cont(pid,then){G.pend=null;if(!then||then.k==='post')return done();
  if(then.k==='move'){moveBy(pid,then.n);return land(pid);}
  if(then.k==='jail'){goJail(pid);return done();}return done();}
 /* ---------- movement ---------- */
 function moveBy(pid,n){const p=P(pid),path=[];let pos=p.pos,passed=false;for(let k=0;k<n;k++){pos=(pos+1)%NSP;path.push(pos);if(pos===0)passed=true;}
  p.pos=pos;emit({t:'move',p:pid,path});if(passed){const sal=salary();if(sal){xfer(-1,pid,sal);log(`${p.name} passed Malé Jetty and collected ${fmt(sal)}`);}else log(`${p.name} passed Malé Jetty, but the treasury is empty`);}}
 function salary(){return G.mode==='classic'&&G.round>100?0:G.mode==='classic'&&G.round>60?100:SALARY;}
 function moveTo(pid,dest,passGo=true){const p=P(pid);const n=(dest-p.pos+NSP)%NSP;if(!passGo){const path=[];let pos=p.pos;for(let k=0;k<n;k++){pos=(pos+1)%NSP;path.push(pos);}p.pos=dest;emit({t:'move',p:pid,path});return;}moveBy(pid,n||NSP);}
 function moveBack(pid,n){const p=P(pid),path=[];let pos=p.pos;for(let k=0;k<n;k++){pos=(pos+NSP-1)%NSP;path.push(pos);}p.pos=pos;emit({t:'move',p:pid,path,back:1});}
 function goJail(pid){const p=P(pid);p.pos=JAIL;p.jail=true;p.jt=0;G.dbl=0;emit({t:'jail',p:pid});log(`${p.name} is locked up in Maafushi Prison`);}
 /* ---------- turn flow ---------- */
 function startTurn(i){G.turn=i;G.dbl=0;const p=P(i);p.risk=Math.max(RISK_MIN,p.risk-RISK_DECAY);G.pend={t:'turn',p:i};emit({t:'turn',p:i});}
 function done(){const i=G.turn,p=P(i);if(G.over)return;if(p.out){return nextTurn();}G.pend={t:'post',p:i,again:G.dbl>0&&!p.jail};}
 function nextTurn(){if(G.over)return;if(G.final)return gameOver('time');const n=G.players.length;let j=G.turn;
  for(let k=0;k<n;k++){j=(j+1)%n;if(!P(j).out)break;}if(j<=G.turn)G.round++;startTurn(j);}
 function land(pid,o={}){const p=P(pid),s=SP[p.pos];emit({t:'land',p:pid,sp:s.i});
  if(s.k==='p'||s.k==='r'||s.k==='u'){const w=G.own[s.i];
   if(!w){G.pend={t:'buy',p:pid,sp:s.i};emit({t:'offerbuy',p:pid,sp:s.i});return;}
   if(w.o===pid)return done();
   if(w.m){log(`${s.name} has a loan on it, so ${P(w.o).name} collects no rent`);return done();}
   let amt;if(s.k==='u'&&o.u10){const d=[r6(),r6()];emit({t:'dice',p:pid,d,extra:1});amt=10*(d[0]+d[1]);}
   else amt=rentOf(s.i,G.dice[0]+G.dice[1],o);
   G.pend={t:'rent',p:pid,sp:s.i,amt,to:w.o,bribe:bribeOf(amt),fine:fineOf(amt)};return;}
  if(s.k==='t'){log(`${p.name} paid ${s.name}: ${fmt(s.tax)}`);return charge(pid,[{to:-1,amt:s.tax}],{k:'post'});}
  if(s.k==='c'||s.k==='n')return draw(pid,s.k);
  if(s.k==='gojail'){log(`The Supreme Court rules against ${p.name}!`);goJail(pid);return done();}
  if(s.k==='free'&&!o.quiet)log(`${p.name} rests on the Sandbank`);
  return done();}
 function draw(pid,deck){const d=G.decks[deck];const idx=d.shift(),c=CARDS[deck][idx],p=P(pid);if(c.e!=='goo')d.push(idx);
  emit({t:'card',p:pid,deck,i:idx});log(`${p.name} drew ${deck==='c'?'City Council':'Monsoon'}: ${c.t}`);
  switch(c.e){
   case 'money':if(c.v>0){xfer(-1,pid,c.v);return done();}return charge(pid,[{to:-1,amt:-c.v}],{k:'post'});
   case 'move':moveTo(pid,c.v,true);return land(pid);
   case 'back':moveBack(pid,c.v);return land(pid);
   case 'jail':goJail(pid);return done();
   case 'goo':p.cards.push(deck);return done();
   case 'each':return charge(pid,alive().filter(j=>j!==pid).map(j=>({to:j,amt:c.v})),{k:'post'});
   case 'collect':alive().filter(j=>j!==pid).forEach(j=>xfer(j,pid,Math.min(Math.max(0,P(j).cash),c.v)));return done();
   case 'repair':{const b=bldCount(pid),amt=b.h*c.v[0]+b.r*c.v[1];if(!amt){log(`${p.name} has nothing to pay for`);return done();}return charge(pid,[{to:-1,amt}],{k:'post'});}
   case 'nearR':{let t=p.pos;do t=(t+1)%NSP;while(SP[t].k!=='r');moveTo(pid,t,true);return land(pid,{mult:2});}
   case 'nearU':{let t=p.pos;do t=(t+1)%NSP;while(SP[t].k!=='u');moveTo(pid,t,true);return land(pid,{u10:1});}
   case 'risk':p.risk=Math.min(RISK_MAX,p.risk+c.v);emit({t:'risk',p:pid});return done();
   case 'amnesty':p.risk=RISK_MIN;emit({t:'risk',p:pid});return done();}
  return done();}
 function startAuction(sp){G.pend={t:'auction',sp,high:0,by:-1,ends:G.now+AUC_START,dur:AUC_START,out:[],p:G.turn,id:++G.nid};log(`${SP[sp].name} goes to auction`);emit({t:'auction',sp});}
 function closeAuction(){const a=G.pend;if(!a||a.t!=='auction')return;
  if(a.by>=0&&P(a.by).cash>=a.high){xfer(a.by,-1,a.high);G.own[a.sp]={o:a.by,h:0,m:false};log(`${P(a.by).name} won ${SP[a.sp].name} at auction for ${fmt(a.high)}`);emit({t:'won',p:a.by,sp:a.sp,amt:a.high});}
  else{log(`No bids. ${SP[a.sp].name} stays with the bank`);emit({t:'won',p:-1,sp:a.sp});}
  G.pend=null;done();}
 function bankrupt(pid,cred){const p=P(pid);let cash=Math.max(0,p.cash);
  propsOf(pid).forEach(i=>{const w=G.own[i];if(w.h){cash+=w.h*hc(i)/2;w.h=0;}});
  if(cred>=0&&!P(cred).out){P(cred).cash+=cash;emit({t:'cash',p:cred,d:cash});propsOf(pid).forEach(i=>{G.own[i].o=cred;});P(cred).cards.push(...p.cards);}
  else{propsOf(pid).forEach(i=>{delete G.own[i];});p.cards.forEach(d=>G.decks[d].push(CARDS[d].findIndex(c=>c.e==='goo')));}
  emit({t:'cash',p:pid,d:-p.cash});p.cash=0;p.cards=[];p.out=true;p.jail=false;
  G.offers.forEach(o=>{if(o.st==='open'&&(o.from===pid||o.to===pid))o.st='void';});
  if(G.sale){if(G.sale.seller===pid)G.sale=null;else delete G.sale.bids[pid];}
  if(G.pend&&G.pend.t==='auction'&&!G.pend.out.includes(pid))G.pend.out.push(pid);
  log(`${p.name} is bankrupt${cred>=0?` and everything goes to ${P(cred).name}`:''}!`);emit({t:'bankrupt',p:pid,to:cred});
  if(alive().length<=1)return gameOver('last');
  if(G.turn===pid){G.pend=null;nextTurn();}}
 function gameOver(reason){const rank=G.players.map((p,i)=>({i,nw:netWorth(i),out:p.out,outAt:p.outAt||0})).sort((a,b)=>(a.out-b.out)||(b.nw-a.nw)||(b.outAt-a.outAt));
  G.over={reason,rank,winner:rank[0].i};G.pend={t:'over'};log(`Game over! ${P(rank[0].i).name} wins${reason==='time'?' with the highest net worth':''}.`);emit({t:'over'});}
 /* ---------- actions ---------- */
 const A={
  roll(pid){const pe=G.pend;if(!pe||pe.p!==pid)return 'Not your turn';if(!(pe.t==='turn'||(pe.t==='post'&&pe.again)))return 'You cannot roll now';
   const p=P(pid),d=[r6(),r6()],n=d[0]+d[1],dbl=d[0]===d[1];G.dice=d;G.pend=null;emit({t:'dice',p:pid,d});
   if(p.jail){if(dbl){p.jail=false;p.jt=0;G.dbl=0;log(`${p.name} rolled doubles and walks out of Maafushi`);moveBy(pid,n);return land(pid);}
    p.jt++;if(p.jt>=3){p.jail=false;p.jt=0;log(`${p.name} served three turns and pays ${fmt(JAIL_FEE)} to leave`);return charge(pid,[{to:-1,amt:JAIL_FEE}],{k:'move',n});}
    log(`${p.name} stays in Maafushi (try ${p.jt} of 3)`);return done();}
   if(dbl){G.dbl++;if(G.dbl>=3){log(`Three doubles in a row! ${p.name} is sent to Maafushi for speeding`);goJail(pid);return done();}}else G.dbl=0;
   moveBy(pid,n);land(pid);},
  jailpay(pid){const pe=G.pend,p=P(pid);if(!pe||pe.t!=='turn'||pe.p!==pid||!p.jail)return 'Not in prison';if(p.cash<JAIL_FEE)return 'Not enough cash';
   xfer(pid,-1,JAIL_FEE);p.jail=false;p.jt=0;log(`${p.name} paid ${fmt(JAIL_FEE)} bail`);emit({t:'free',p:pid});},
  jailcard(pid){const pe=G.pend,p=P(pid);if(!pe||pe.t!=='turn'||pe.p!==pid||!p.jail)return 'Not in prison';if(!p.cards.length)return 'No card';
   const d=p.cards.shift();G.decks[d].push(CARDS[d].findIndex(c=>c.e==='goo'));p.jail=false;p.jt=0;log(`${p.name} used a Get out of Maafushi card`);emit({t:'free',p:pid});},
  buy(pid){const pe=G.pend;if(!pe||pe.t!=='buy'||pe.p!==pid)return 'Nothing to buy';const s=SP[pe.sp];if(P(pid).cash<s.price)return 'Not enough cash';
   xfer(pid,-1,s.price);G.own[s.i]={o:pid,h:0,m:false};log(`${P(pid).name} bought ${s.name} for ${fmt(s.price)}`);emit({t:'buy',p:pid,sp:s.i});G.pend=null;done();},
  decline(pid){const pe=G.pend;if(!pe||pe.t!=='buy'||pe.p!==pid)return 'Nothing to decline';startAuction(pe.sp);},
  pay(pid){const pe=G.pend;if(!pe||pe.t!=='rent'||pe.p!==pid)return 'No rent due';G.pend=null;log(`${P(pid).name} paid ${fmt(pe.amt)} rent to ${P(pe.to).name} for ${SP[pe.sp].name}`);
   charge(pid,[{to:pe.to,amt:pe.amt}],{k:'post'});},
  bribe(pid){const pe=G.pend;if(!pe||pe.t!=='rent'||pe.p!==pid)return 'No rent due';const p=P(pid),chance=p.risk,caught=Math.random()*100<chance;
   p.risk=Math.min(RISK_MAX,p.risk+RISK_STEP);p.bribes++;G.pend=null;emit({t:'audit',p:pid,caught,chance,to:pe.to,amt:caught?pe.amt:pe.bribe,fine:pe.fine,sp:pe.sp});
   if(!caught){log(`${p.name} paid ${P(pe.to).name} a ${fmt(pe.bribe)} "consultancy fee" instead of ${fmt(pe.amt)} rent`);return charge(pid,[{to:pe.to,amt:pe.bribe}],{k:'post'});}
   p.caught++;log(`AUDIT! ${p.name} was caught bribing: full rent ${fmt(pe.amt)} + ${fmt(pe.fine)} fine, and off to Maafushi`);
   charge(pid,[{to:pe.to,amt:pe.amt},{to:-1,amt:pe.fine}],{k:'jail'});},
  paydebt(pid){const pe=G.pend;if(!pe||pe.t!=='debt'||pe.p!==pid)return 'No debt';if(P(pid).cash<pe.total)return 'Not enough cash yet';
   pe.items.forEach(x=>xfer(pid,x.to,x.amt));cont(pid,pe.then);},
  bankrupt(pid){const pe=G.pend;if(!pe||pe.t!=='debt'||pe.p!==pid)return 'No debt';const pl=pe.items.filter(x=>x.to>=0).sort((a,b)=>b.amt-a.amt);
   const cred=pl.length&&pl[0].amt*2>=pe.total?pl[0].to:-1;P(pid).outAt=G.seq;bankrupt(pid,cred);},
  end(pid){const pe=G.pend;if(!pe||pe.t!=='post'||pe.p!==pid)return 'Not now';if(pe.again)return 'You rolled doubles: roll again';G.pend=null;nextTurn();},
  bid(pid,a){const pe=G.pend;if(!pe||pe.t!=='auction')return 'No auction';if(P(pid).out||pe.out.includes(pid))return 'You passed';
   const amt=Math.floor(a.amt||0);if(amt<=pe.high||amt<10)return 'Bid higher';if(amt>P(pid).cash)return 'Not enough cash';
   pe.high=amt;pe.by=pid;pe.ends=Math.max(pe.ends,G.now+AUC_EXT);emit({t:'bid',p:pid,amt});checkAuction();},
  pass(pid){const pe=G.pend;if(!pe||pe.t!=='auction')return 'No auction';if(pe.out.includes(pid))return null;if(pe.by===pid)return 'You are the top bidder';pe.out.push(pid);emit({t:'pass',p:pid});checkAuction();},
  build(pid,a){const e=chkBuild(pid,a.sp);if(e)return e;xfer(pid,-1,hc(a.sp));G.own[a.sp].h++;const h=G.own[a.sp].h;
   log(`${P(pid).name} built ${h===5?'a luxury resort':'a guesthouse'} on ${SP[a.sp].name}`);emit({t:'build',p:pid,sp:a.sp,h});},
  sellb(pid,a){const e=chkSellB(pid,a.sp);if(e)return e;G.own[a.sp].h--;xfer(-1,pid,hc(a.sp)/2);log(`${P(pid).name} sold a building on ${SP[a.sp].name}`);emit({t:'build',p:pid,sp:a.sp,h:G.own[a.sp].h});},
  loan(pid,a){const e=chkLoan(pid,a.sp);if(e)return e;G.own[a.sp].m=true;xfer(-1,pid,loanVal(a.sp));log(`${P(pid).name} took a ${fmt(loanVal(a.sp))} loan on ${SP[a.sp].name}`);emit({t:'loan',p:pid,sp:a.sp});},
  repay(pid,a){const e=chkRepay(pid,a.sp);if(e)return e;xfer(pid,-1,repayCost(a.sp));G.own[a.sp].m=false;log(`${P(pid).name} repaid the loan on ${SP[a.sp].name}`);emit({t:'loan',p:pid,sp:a.sp});},
  offer(pid,a){const p=P(pid);if(p.out)return 'You are out';if(G.now-(p.lastOffer||-1e9)<OFFER_GAP)return 'Wait a moment before the next offer';
   if(G.offers.filter(o=>o.st==='open'&&o.from===pid).length>=2)return 'You already have 2 open offers';
   const o={id:++G.nid,from:pid,to:a.to,give:norm(a.give),get:norm(a.get),st:'open',at:G.now,re:a.re||0};const e=chkTrade(o);if(e)return e;
   if(P(a.to).human&&P(a.to).mute&&!p.human)return 'Offers are muted';
   if(a.re){const old=G.offers.find(x=>x.id===a.re&&x.st==='open'&&x.to===pid);if(old)old.st='countered';}
   p.lastOffer=G.now;G.offers.push(o);if(G.offers.length>40)G.offers=G.offers.filter(x=>x.st==='open').concat(G.offers.filter(x=>x.st!=='open').slice(-10));
   log(`${p.name} offered ${P(a.to).name} a ${a.re?'counter-':''}deal`);emit({t:'offer',id:o.id,to:a.to,from:pid});},
  accept(pid,a){const o=G.offers.find(x=>x.id===a.id);if(!o||o.st!=='open'||o.to!==pid)return 'Offer is gone';const e=chkTrade(o);if(e){o.st='void';return e;}
   o.st='done';const A_=P(o.from),B_=P(o.to);o.give.sp.forEach(sp=>{G.own[sp].o=o.to;});o.get.sp.forEach(sp=>{G.own[sp].o=o.from;});
   xfer(o.from,o.to,o.give.cash);xfer(o.to,o.from,o.get.cash);
   for(let k=0;k<o.give.cards;k++)B_.cards.push(A_.cards.shift());for(let k=0;k<o.get.cards;k++)A_.cards.push(B_.cards.shift());
   log(`Deal! ${A_.name} and ${B_.name} traded`);emit({t:'trade',id:o.id,from:o.from,to:o.to});
   G.offers.forEach(x=>{if(x.st==='open'&&chkTrade(x))x.st='void';});},
  reject(pid,a){const o=G.offers.find(x=>x.id===a.id);if(!o||o.st!=='open'||o.to!==pid)return 'Offer is gone';o.st='declined';emit({t:'reject',id:o.id,from:o.from,to:o.to});},
  cancel(pid,a){const o=G.offers.find(x=>x.id===a.id);if(!o||o.st!=='open'||o.from!==pid)return 'Offer is gone';o.st='void';emit({t:'reject',id:o.id,from:o.from,to:o.to,cancel:1});},
  list(pid,a){if(G.sale)return 'Another island is already up for sale';const sp=a.sp;if(ownerOf(sp)!==pid||!tradable(sp))return 'You cannot sell this island now';
   const min=Math.max(10,Math.floor(a.min||10));G.sale={id:++G.nid,seller:pid,sp,min,bids:{},ends:G.now+SALE_MS,dur:SALE_MS,st:'bid'};
   log(`${P(pid).name} put ${SP[sp].name} up for sale from ${fmt(min)}`);emit({t:'sale',p:pid,sp});},
  sbid(pid,a){const s=G.sale;if(!s||s.st!=='bid')return 'Bidding is closed';if(pid===s.seller||P(pid).out)return 'Not allowed';
   const amt=Math.floor(a.amt||0);if(amt<s.min)return 'Bid at least '+fmt(s.min);if(amt>P(pid).cash)return 'Not enough cash';if(amt<=(s.bids[pid]||0))return 'Bid higher';
   s.bids[pid]=amt;emit({t:'sbid',p:pid,amt});},
  spick(pid,a){const s=G.sale;if(!s||s.seller!==pid)return 'No sale';const amt=s.bids[a.b];if(!amt)return 'No such bid';
   if(P(a.b).out||P(a.b).cash<amt){delete s.bids[a.b];return 'That buyer cannot pay any more';}if(ownerOf(s.sp)!==pid||!tradable(s.sp)){G.sale=null;return 'Island cannot be sold now';}
   xfer(a.b,pid,amt);G.own[s.sp].o=a.b;log(`${P(pid).name} sold ${SP[s.sp].name} to ${P(a.b).name} for ${fmt(amt)}`);emit({t:'sold',p:pid,b:a.b,sp:s.sp,amt});G.sale=null;
   G.offers.forEach(x=>{if(x.st==='open'&&chkTrade(x))x.st='void';});},
  scancel(pid){const s=G.sale;if(!s||s.seller!==pid)return 'No sale';log(`${P(pid).name} took ${SP[s.sp].name} off the market`);emit({t:'sold',p:pid,b:-1,sp:s.sp});G.sale=null;},
  mute(pid,a){P(pid).mute=!!a.on;if(a.on)G.offers.forEach(o=>{if(o.st==='open'&&o.to===pid&&!P(o.from).human)o.st='declined';});}};
 function norm(x){x=x||{};return {sp:(x.sp||[]).map(Number),cash:Math.max(0,Math.floor(x.cash||0)),cards:Math.max(0,Math.floor(x.cards||0))};}
 function checkAuction(){const a=G.pend;if(!a||a.t!=='auction')return;const rem=alive().filter(i=>!a.out.includes(i));
  if(!rem.length||(rem.length===1&&rem[0]===a.by))closeAuction();}
 /* ---------- public ---------- */
 return {
  create(o){G={v:1,id:Date.now().toString(36)+Math.random().toString(36).slice(2,6),mode:o.mode,limit:o.mode==='quick'?(o.minutes||30)*60000:0,elapsed:0,now:0,nid:0,seq:0,
    players:o.players.map(p=>Object.assign({cash:START_CASH,pos:0,jail:false,jt:0,cards:[],out:false,risk:RISK_MIN,bribes:0,caught:0,mute:false,lastOffer:-1e9},p)),
    own:{},turn:0,round:1,dice:[0,0],dbl:0,pend:null,decks:{c:shuf(16),n:shuf(16)},offers:[],sale:null,log:[],final:false,over:null};
   EV=[];log('Welcome to Binveriya! Own the islands. Bend the rules.');startTurn(o.first!=null?o.first:(Math.random()*G.players.length)|0);return G;},
  load(g){G=g;EV=[];return G;},
  get G(){return G;},
  act(pid,a){if(!G)return 'No game';if(G.over)return 'Game over';const f=A[a.t];if(!f)return 'Unknown action';let e;
   try{e=f(pid,a);}catch(err){console.error(err);e='Something went wrong';}if(!e)G.seq++;return e||null;},
  tick(dt){if(!G||G.over)return false;G.now+=dt;let ch=false;
   if(G.limit&&!G.final){G.elapsed+=dt;if(G.elapsed>=G.limit){G.final=true;log("Time's up! This is the last turn.");emit({t:'final'});ch=true;}}
   const a=G.pend;if(a&&a.t==='auction'&&G.now>=a.ends){closeAuction();ch=true;}
   if(G.sale&&G.sale.st==='bid'&&G.now>=G.sale.ends){G.sale.st='pick';emit({t:'salepick',p:G.sale.seller});ch=true;}
   G.offers.forEach(o=>{if(o.st==='open'&&G.now-o.at>OFFER_TTL){o.st='void';ch=true;emit({t:'reject',id:o.id,from:o.from,to:o.to,expired:1});}});
   return ch;},
  drain(){const e=EV;EV=[];return e;},
  rentOf,netWorth,propsOf,ownsAll,tradable,groupBuilt,countOf,ownerOf,bldCount,hc,loanVal,repayCost,bribeOf,fineOf,fmt,alive,
  chkBuild,chkSellB,chkLoan,chkRepay,chkTrade,
  C:{AUC_START,AUC_EXT,SALE_MS,OFFER_GAP,RISK_MIN,RISK_STEP,RISK_MAX}};
})();

<script>
/* =====================================================================
   AI  (computer players). Only reads E.G and calls E.act — same as a remote client would.
   ===================================================================== */
const AI=(()=>{
 const G=()=>E.G;
 const mem={}; // per bot memory: next think times, declined trade keys
 const M=i=>mem[i]||(mem[i]={t:0,no:{},auc:{},sale:{}});
 const P=i=>G().players[i];
 function reserve(i){const g=G(),r=g.round;const threat=g.players.some((p,j)=>j!==i&&!p.out&&Object.keys(GROUPS).some(k=>E.ownsAll(j,k)&&E.groupBuilt(k)));return (r<5?60:r<12?140:220)+(threat?120:0);}
 /* value of an island to player i if i gets it */
 function valueFor(i,sp){const s=SP[sp],g=G();let v=s.price;
  if(s.k==='p'){const m=GMEM[s.g],others=m.filter(x=>x!==sp),mine=others.filter(x=>E.ownerOf(x)===i).length;
   if(mine===others.length)v*=2.3;else if(mine>0)v*=1.35;
   const opp=others.map(E.ownerOf).filter(o=>o>=0&&o!==i);if(opp.length===others.length&&opp.every(o=>o===opp[0]))v*=1.45;}
  else if(s.k==='r')v*=1+0.22*E.countOf(i,RAILS.filter(x=>x!==sp));
  else if(s.k==='u')v*=E.countOf(i,UTILS.filter(x=>x!==sp))?1.25:0.9;
  const w=g.own[sp];if(w&&w.m)v-=s.price*0.55;return v;}
 /* what i loses by giving sp to j */
 function lossFor(i,sp,j,extraTo){const s=SP[sp];let v=SP[sp].price;const w=G().own[sp];if(w&&w.m)v-=s.price*0.55;
  if(s.k==='p'){if(E.ownsAll(i,s.g))v+=s.price*2.2;else if(GMEM[s.g].some(x=>x!==sp&&E.ownerOf(x)===i))v*=1.25;
   const others=GMEM[s.g].filter(x=>x!==sp);if(others.every(x=>E.ownerOf(x)===j||(extraTo&&extraTo.includes(x))))v+=s.price*1.8;} // completes their set
  if(s.k==='r')v*=1+0.2*E.countOf(i,RAILS);
  return v;}
 /* evaluate an offer from i's perspective as the receiver (i === o.to) */
 function evalOffer(i,o){const j=o.from;let gain=o.give.cash+o.give.cards*50,loss=o.get.cash+o.get.cards*50;
  o.give.sp.forEach(sp=>gain+=valueFor(i,sp));o.get.sp.forEach(sp=>loss+=lossFor(i,sp,j,o.give.sp.length?null:null));
  // extra: do they complete a set with what they ask?
  const cashAfter=P(i).cash-o.get.cash+o.give.cash;if(cashAfter<Math.min(60,P(i).cash))loss+=200;
  return {gain,loss,ok:gain>=loss*(G().round>60?0.92:1.05)};}
 function think(i,min,max){const m=M(i);const g=G();if(g.now<m.t)return false;const f=UI_SPEED();m.t=g.now+(min+Math.random()*(max-min))*f;return true;}
 function raise(i,need){const g=G();let guard=60;
  while(P(i).cash<need&&guard-->0){
   const built=E.propsOf(i).filter(sp=>g.own[sp].h>0&&!E.chkSellB(i,sp)).sort((a,b)=>g.own[b].h-g.own[a].h||SP[a].price-SP[b].price);
   if(built.length){E.act(i,{t:'sellb',sp:built[0]});continue;}
   const loanable=E.propsOf(i).filter(sp=>!E.chkLoan(i,sp)).sort((a,b)=>{const ca=SP[a].g&&E.ownsAll(i,SP[a].g)?1:0,cb=SP[b].g&&E.ownsAll(i,SP[b].g)?1:0;return ca-cb||SP[a].price-SP[b].price;});
   if(loanable.length){E.act(i,{t:'loan',sp:loanable[0]});continue;}break;}
  return P(i).cash>=need;}
 function manage(i){const g=G(),res=reserve(i);
  // repay loans when comfortable
  E.propsOf(i).filter(sp=>g.own[sp].m).sort((a,b)=>SP[b].price-SP[a].price).forEach(sp=>{if(P(i).cash-E.repayCost(sp)>res+150)E.act(i,{t:'repay',sp});});
  // build evenly on complete groups, most valuable first, up to resort when rich
  let guard=40;while(guard-->0){const opts=E.propsOf(i).filter(sp=>SP[sp].k==='p'&&!E.chkBuild(i,sp)&&P(i).cash-E.hc(sp)>=res).sort((a,b)=>g.own[a].h-g.own[b].h||SP[b].price-SP[a].price);
   if(!opts.length)break;const sp=opts[0];if(g.own[sp].h>=3&&P(i).cash-E.hc(sp)<res+300)break;E.act(i,{t:'build',sp});}}
 function proposeTrade(i){const g=G();if(Math.random()>(g.round>60?0.7:0.3))return;const m=M(i);
  for(const k of Object.keys(GROUPS)){const mem_=GMEM[k],mine=mem_.filter(x=>E.ownerOf(x)===i);if(!mine.length||mine.length===mem_.length)continue;
   const miss=mem_.filter(x=>E.ownerOf(x)!==i);const owners=[...new Set(miss.map(E.ownerOf))];if(owners.length!==1||owners[0]<0)continue;
   const j=owners[0],pj=P(j);if(pj.out||(pj.human&&pj.mute))continue;if(!miss.every(E.tradable))continue;
   const key=j+':'+miss.join(',');if(m.no[key]&&g.round-m.no[key]<4)continue;
   const want=miss.reduce((a,x)=>a+SP[x].price,0);
   // swap: both sides complete a colour group (breaks stalemates)
   for(const k2 of Object.keys(GROUPS)){if(k2===k)continue;const m2=GMEM[k2],theirs=m2.filter(x=>E.ownerOf(x)===j),need=m2.filter(x=>E.ownerOf(x)!==j);
    if(!theirs.length||!need.length||!need.every(x=>E.ownerOf(x)===i&&E.tradable(x)&&!g.own[x].m))continue;
    const val2=need.reduce((a,x)=>a+SP[x].price,0),gprice=GMEM[k].reduce((a,x)=>a+SP[x].price,0),g2=m2.reduce((a,x)=>a+SP[x].price,0);
    const cash=Math.max(0,Math.round((gprice-g2)*0.6/10)*10);if(P(i).cash-cash<reserve(i)*0.5)continue;
    const e=E.act(i,{t:'offer',to:j,give:{sp:need,cash},get:{sp:miss,cash:0}});if(!e){m.no[key]=g.round;return true;}}
   let cash=Math.round(want*(1.5+Math.random()*0.4)/10)*10;const give=[];
   // sweeten with an island they would like (that does not complete one of our own sets)
   const spare=E.propsOf(i).filter(sp=>E.tradable(sp)&&!g.own[sp].m&&(SP[sp].k!=='p'||GMEM[SP[sp].g].every(x=>x===sp||E.ownerOf(x)!==i))&&valueFor(j,sp)>SP[sp].price*1.3);
   if(spare.length&&P(i).cash-cash<reserve(i)){give.push(spare[0]);cash=Math.max(0,cash-Math.round(valueFor(j,spare[0])/10)*10);}
   if(P(i).cash-cash<reserve(i)*0.6)continue;
   const e=E.act(i,{t:'offer',to:j,give:{sp:give,cash},get:{sp:miss,cash:0}});if(!e){m.no[key]=g.round;return true;}}
  return false;}
 function maybeSell(i){const g=G();if(g.sale||P(i).cash>120||Math.random()>0.15)return;
  const lone=E.propsOf(i).filter(sp=>E.tradable(sp)&&!g.own[sp].m&&SP[sp].k==='p'&&GMEM[SP[sp].g].filter(x=>E.ownerOf(x)===i).length===1);
  if(lone.length)E.act(i,{t:'list',sp:lone[0],min:Math.round(SP[lone[0]].price*1.05/10)*10});}
 /* one decision for the pending action that belongs to bot i */
 function step(i){const g=G(),pe=g.pend;if(!pe||pe.p!==i||g.over)return;const p=P(i);
  switch(pe.t){
   case 'turn':if(p.jail){const unowned=OWNABLE.filter(x=>!g.own[x]).length;
     if(p.cards.length&&(unowned>5||g.round<15))E.act(i,{t:'jailcard'});else if(p.cash>=50+reserve(i)&&unowned>8)E.act(i,{t:'jailpay'});}
    manage(i);E.act(i,{t:'roll'});break;
   case 'buy':{const s=SP[pe.sp],v=valueFor(i,pe.sp);
    if(p.cash>=s.price&&(p.cash-s.price>=reserve(i)||(v>=s.price*1.4&&p.cash-s.price>=20)))E.act(i,{t:'buy'});else E.act(i,{t:'decline'});break;}
   case 'rent':{const desperate=p.cash<pe.amt,big=pe.amt>=60,low=p.risk<=45;
    const go=(desperate&&p.risk<=65&&Math.random()<0.7)||(big&&low&&Math.random()<0.3);E.act(i,{t:go?'bribe':'pay'});break;}
   case 'debt':if(raise(i,pe.total))E.act(i,{t:'paydebt'});else E.act(i,{t:'bankrupt'});break;
   case 'post':manage(i);if(!pe.again){proposeTrade(i);maybeSell(i);}E.act(i,{t:pe.again?'roll':'end'});break;}}
 /* background decisions: auctions, offers, sales (called every clock tick) */
 function tick(isBot){const g=G();if(!g||g.over)return;const pe=g.pend;
  if(pe&&pe.t==='auction'){const bots=E.alive().filter(i=>isBot(i)&&!pe.out.includes(i)&&pe.by!==i);
   bots.forEach(i=>{const m=M(i);if(!think(i,500,1600))return;const key=pe.id;if(m.auc[key]==null)m.auc[key]=0.82+Math.random()*0.3;
    const max=Math.min(P(i).cash-reserve(i)*0.5,valueFor(i,pe.sp)*m.auc[key]);const inc=pe.high<100?10:pe.high<300?20:50,bid=Math.max(10,pe.high+inc);
    if(bid<=max)E.act(i,{t:'bid',amt:bid});else E.act(i,{t:'pass'});});}
  g.offers.filter(o=>o.st==='open'&&isBot(o.to)).forEach(o=>{if(g.now-o.at<1400*UI_SPEED())return;const i=o.to,r=evalOffer(i,o);
   if(r.ok){E.act(i,{t:'accept',id:o.id});return;}
   const gap=r.loss*1.1-r.gain,from=P(o.from);
   if(gap>0&&gap<r.loss*0.6&&!o.re&&from.cash>=o.give.cash+gap&&Math.random()<0.8){const ask=Math.round(gap/10)*10+10;
    const e=E.act(i,{t:'offer',to:o.from,re:o.id,give:{sp:o.get.sp,cash:o.get.cash,cards:o.get.cards},get:{sp:o.give.sp,cash:o.give.cash+ask,cards:o.give.cards}});if(e)E.act(i,{t:'reject',id:o.id});}
   else E.act(i,{t:'reject',id:o.id});});
  const s=g.sale;if(s){if(s.st==='bid')E.alive().filter(i=>isBot(i)&&i!==s.seller).forEach(i=>{const m=M(i);if(m.sale[s.id])return;if(g.now<(s.ends-s.dur)+2000*UI_SPEED()+i*700)return;m.sale[s.id]=1;
     const v=valueFor(i,s.sp)*(0.8+Math.random()*0.2),cap=P(i).cash-reserve(i);const top=Math.max(0,...Object.values(s.bids));const b=Math.min(v,cap);
     if(b>=s.min&&b>top)E.act(i,{t:'sbid',amt:Math.round(Math.max(s.min,Math.min(b,top+40+Math.random()*60))/10)*10});});
   if(s.st==='pick'&&isBot(s.seller)){const bids=Object.entries(s.bids).map(([b,a])=>[+b,a]).filter(([b,a])=>P(b).cash>=a).sort((x,y)=>y[1]-x[1]);
    if(bids.length)E.act(s.seller,{t:'spick',b:bids[0][0]});else E.act(s.seller,{t:'scancel'});}}}
 return {step,tick,evalOffer,valueFor,raise,reset(){for(const k in mem)delete mem[k];}};
})();
</script>

<script>
/* =====================================================================
   LAYOUTS — swappable board designs. A layout only maps the 40 space
   indexes to the screen and draws the board; rules, tokens, cards and
   the rest of the UI never depend on it.
   Contract:  build(host, opts) -> view {el, cells[40], tokens(el), B()}
              pos(i, {jailed}) -> {x,y} in % of the board element
              label fitting uses view.cells[i].querySelector('.nm')
   ===================================================================== */
const LAYOUTS={};
LAYOUTS.square={
 id:'square',name:'Classic square',
 grid(i){if(i===0)return[8,8];if(i<7)return[8,8-i];if(i===7)return[8,1];if(i<14)return[8-(i-7),1];if(i===14)return[1,1];if(i<21)return[1,1+(i-14)];if(i===21)return[1,8];return[1+(i-21),8];},
 side(i){return i%7===0?'c':i<7?'b':i<14?'l':i<21?'t':'r';},
 pos(i,o={}){const[r,c]=this.grid(i),w=k=>(k===1||k===8)?1.55:1;let x=0,y=0;for(let k=1;k<c;k++)x+=w(k);x+=w(c)/2;for(let k=1;k<r;k++)y+=w(k);y+=w(r)/2;
  let px=x/9.1*100,py=y/9.1*100;if(i===JAIL){if(o.jailed){px+=2.5;py-=2.5;}else{px-=3;py+=3;}}return {x:px,y:py};},
 cellHTML(s,i){const sd=this.side(i),[r,c]=this.grid(i),lab=esc(s.lab).replace(/\n/g,'<br>'),pos=`grid-row:${r};grid-column:${c}`;
  if(sd==='c'){const ic=ICON[s.k]||'';return `<div class="cell corner ${s.k}" style="${pos}" data-sp="${i}"><span class="ic">${ic}</span><span class="nm">${lab}</span></div>`;}
  let inner='';
  if(s.k==='p')inner=`<i class="bar" style="background:${GROUPS[s.g].c}"></i><span class="nm">${lab}</span><span class="pr">MVR ${s.price}</span>`;
  else if(s.k==='r'||s.k==='u')inner=`<span class="ic">${ICON[s.icon]}</span><span class="nm">${lab}</span><span class="pr">MVR ${s.price}</span>`;
  else if(s.k==='c')inner=`<span class="ic">${ICON.majlis}</span><span class="nm">${lab}</span>`;
  else if(s.k==='n')inner=`<span class="ic">${ICON.monsoon}</span><span class="nm">${lab}</span>`;
  else if(s.k==='t')inner=`<span class="ic">${s.tax===150?ICON.tax:ICON.leaf}</span><span class="nm">${lab}</span>`;
  return `<div class="cell ${sd} k${s.k}" style="${pos}" data-sp="${i}">${inner}</div>`;},
 build(host,opts={}){const el=document.createElement('div');el.className='board';el.dataset.layout='square';
  const isl=[[22,62,1],[30,70,.7],[68,60,.8],[74,70,1.1],[47,80,.9],[58,84,.6],[38,86,.7]].map(([x,y,s])=>`<i class="isl" style="left:${x}%;top:${y}%;--s:${s}"></i>`).join('');
  el.innerHTML=SP.map((s,i)=>this.cellHTML(s,i)).join('')+
   `<div class="ctr"><div class="lagoon" aria-hidden="true"><i class="c1"></i><i class="c2"></i></div>${isl}<div class="clogo"><div class="thaana" dir="rtl" lang="dv">ބިންވެރިޔާ</div><div class="bw">Binveriya</div><div class="tg">Own the islands. Bend the rules.</div></div>`+
   `<button type="button" class="deck dm" data-deck="c" tabindex="-1" aria-label="City Council deck">${ICON.majlis}<b>City Council</b></button><button type="button" class="deck dn" data-deck="n" tabindex="-1" aria-label="Monsoon deck">${ICON.monsoon}<b>Monsoon</b></button>`+
   `<div class="ticker" aria-hidden="true"></div></div><div class="tokens"></div>`;
  host.appendChild(el);
  const cells=[];el.querySelectorAll('.cell').forEach(c=>{cells[+c.dataset.sp]=c;});
  return {el,cells,layout:this,tokens:el.querySelector('.tokens'),ticker:el.querySelector('.ticker'),B:()=>el.clientWidth};}
};
/* square layout: live decorations (owner, buildings, loan) */
LAYOUTS.square.deco=function(view,i,w,col,ini){const c=view.cells[i];c.classList.toggle('own',!!w);c.classList.toggle('loan',!!(w&&w.m));
 if(w)c.style.setProperty('--oc',col);else c.style.removeProperty('--oc');
 let od=c.querySelector('.od');if(w&&!od){od=document.createElement('i');od.className='od';c.appendChild(od);}else if(!w&&od)od.remove();
 const bar=c.querySelector('.bar');if(bar)bar.innerHTML=w&&w.h?(w.h===5?'<i class="rs"></i>':'<i class="gh"></i>'.repeat(w.h)):'';};

let LAYOUT=LAYOUTS.square;

/* fit every label on its space without ever breaking a word (tap-to-zoom handles the rest) */
const FIT=(()=>{const cx=document.createElement('canvas').getContext('2d');const cache={};
 function w(word,px){const k=word+'|'+px;if(cache[k]==null){cx.font=`700 ${px}px Sora, system-ui, sans-serif`;cache[k]=cx.measureText(word).width*1.01;}return cache[k];}
 return function(view){const B=view.B();if(!B)return;view.el.style.setProperty('--T',Math.round(B*.34)+'px');view.el.style.setProperty('--T2',Math.round(B*.34*1.37)+'px');const base=B*0.0215;
  view.cells.forEach(c=>{const nm=c.querySelector('.nm');if(!nm)return;const corner=c.classList.contains('corner');const b0=corner?B*0.023:base;
   nm.style.removeProperty('--fs');const cw=c.clientWidth,cs=getComputedStyle(c),avail=cw-parseFloat(cs.paddingLeft)-parseFloat(cs.paddingRight)-4;
   const words=nm.textContent.replace(/\s+/g,' ').trim().split(' ');const widest=Math.max(...words.map(x=>w(x,100)))/100;
   let fs=Math.min(b0,avail/Math.max(1,widest));nm.style.setProperty('--fs',fs.toFixed(2)+'px');
   for(let k=0;k<8&&(c.scrollHeight>c.clientHeight+.5||nm.scrollWidth>avail+2.5);k++){fs*=0.9;nm.style.setProperty('--fs',fs.toFixed(2)+'px');}});};})();

<script>
/* =====================================================================
   UI
   ===================================================================== */
const $=(s,r=document)=>r.querySelector(s),$$=(s,r=document)=>Array.from(r.querySelectorAll(s));
const Q=new URLSearchParams(location.search);
const FAST=Q.has('fast'),AUTO=Q.has('auto');
const RM=matchMedia('(prefers-reduced-motion: reduce)');
const ls={get(k){try{return localStorage.getItem(k);}catch(e){return null;}},set(k,v){try{localStorage.setItem(k,v);}catch(e){}},del(k){try{localStorage.removeItem(k);}catch(e){}}};
const esc=s=>String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const fmt=n=>'MVR '+Math.round(n).toLocaleString('en-US');
const sleep=ms=>(FAST||ms<=0)?Promise.resolve():new Promise(r=>setTimeout(r,ms));
const macro=f=>{const c=new MessageChannel();c.port1.onmessage=()=>{c.port1.close();f();};c.port2.postMessage(0);};
let G=null,ME=0,SCREEN='home',WATCH=false;
let speedPref=ls.get('bv-speed')==='fast';
function UI_SPEED(){return FAST?0.02:WATCH?0.35:speedPref?0.5:1;}
const isBot=i=>!!G&&(!G.players[i].human||AUTO);
const nameOf=i=>i===ME?'You':G.players[i].name;
const meP=()=>G.players[ME];

/* ---------------------------------------------------------------- sound (soft WebAudio) */
const SND=(()=>{let ctx=null,master=null,nbuf=null,on=ls.get('bv-sound')!=='0';
 function ac(){if(!on)return null;try{if(!ctx){const C=window.AudioContext||window.webkitAudioContext;if(!C)return null;ctx=new C();master=ctx.createGain();master.gain.value=.55;master.connect(ctx.destination);}if(ctx.state==='suspended')ctx.resume();}catch(e){return null;}return ctx;}
 function tone(f,dt,dur,o={}){const c=ac();if(!c)return;const t=c.currentTime+dt,os=c.createOscillator(),g=c.createGain();os.type=o.type||'sine';os.frequency.setValueAtTime(f,t);if(o.to)os.frequency.exponentialRampToValueAtTime(o.to,t+dur);
  g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(o.vol||.1,t+.012);g.gain.exponentialRampToValueAtTime(.0001,t+dur);os.connect(g);g.connect(master);os.start(t);os.stop(t+dur+.03);}
 function noise(dt,dur,o={}){const c=ac();if(!c)return;if(!nbuf){nbuf=c.createBuffer(1,c.sampleRate*.5|0,c.sampleRate);const d=nbuf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;}
  const t=c.currentTime+dt,s=c.createBufferSource();s.buffer=nbuf;const fl=c.createBiquadFilter();fl.type=o.type||'bandpass';fl.frequency.setValueAtTime(o.f||2000,t);if(o.to)fl.frequency.exponentialRampToValueAtTime(o.to,t+dur);fl.Q.value=o.q||1;
  const g=c.createGain();g.gain.setValueAtTime(o.vol||.2,t);g.gain.exponentialRampToValueAtTime(.0001,t+dur);s.connect(fl);fl.connect(g);g.connect(master);s.start(t);s.stop(t+dur+.03);}
 return {get on(){return on;},set(v){on=!!v;ls.set('bv-sound',on?'1':'0');if(on)ac();},unlock(){ac();},
  rattle(){for(let i=0;i<6;i++)noise(i*.045+Math.random()*.02,.035,{f:2200+Math.random()*1800,q:5,vol:.16});},
  hit(t,s,k){const v=Math.max(.05,s);if(k==='t'){noise(t,.05,{f:1400+Math.random()*900,q:1.6,vol:.34*v});tone(150+Math.random()*30,t,.07,{type:'sine',vol:.14*v});}
   else if(k==='w'){noise(t,.04,{f:900+Math.random()*400,q:2.2,vol:.3*v});tone(220,t,.05,{type:'triangle',vol:.08*v});}else noise(t,.03,{f:3200+Math.random()*1200,q:3,vol:.3*v});},
  settle(t){noise(t,.03,{f:2600,q:4,vol:.08});tone(420,t+.01,.06,{type:'triangle',vol:.03});},
  dice(){for(let i=0;i<8;i++)noise(i*.065+Math.random()*.03,.045,{f:1600+Math.random()*2200,q:4,vol:.22});noise(.6,.07,{f:800,q:2,vol:.2});},
  hop(){tone(540+Math.random()*90,0,.07,{type:'triangle',vol:.035});},
  coin(){tone(1320,0,.12,{vol:.06});tone(1760,.07,.28,{vol:.06});},
  pay(){tone(620,0,.1,{type:'triangle',vol:.05});tone(415,.08,.2,{type:'triangle',vol:.05});},
  buy(){[523,659,784,1046].forEach((f,i)=>tone(f,i*.07,.24,{type:'triangle',vol:.06}));},
  card(){noise(0,.2,{f:500,to:4200,q:.7,vol:.16});tone(880,.13,.16,{vol:.035});},
  jail(){tone(220,0,.35,{type:'triangle',vol:.08,to:160});tone(165,.25,.55,{type:'triangle',vol:.08,to:110});},
  alarm(){[0,.24,.48].forEach(d=>{tone(880,d,.15,{type:'square',vol:.03});tone(660,d+.12,.1,{type:'square',vol:.03});});},
  gavel(){noise(0,.09,{f:380,q:1.2,vol:.35});tone(180,0,.12,{type:'triangle',vol:.1});},
  tick(){tone(1250,0,.04,{type:'triangle',vol:.035});},
  turn(){tone(784,0,.2,{vol:.05});tone(1175,.1,.32,{vol:.05});},
  build(){noise(0,.05,{f:1500,q:4,vol:.18});noise(.09,.05,{f:1250,q:4,vol:.18});tone(988,.16,.22,{type:'triangle',vol:.05});},
  win(){[523,659,784,1046,1318].forEach((f,i)=>tone(f,i*.11,.45,{type:'triangle',vol:.07}));},
  err(){tone(210,0,.14,{type:'triangle',vol:.05});}};})();

/* ---------------------------------------------------------------- toasts, banner */
function toast(s,ms=2600){const t=document.createElement('div');t.className='toast';t.textContent=s;$('#toasts').appendChild(t);while($('#toasts').children.length>3)$('#toasts').firstChild.remove();setTimeout(()=>t.remove(),FAST?400:ms);}
let BAN=null;
function banner(key,i,text,btn,fn){BAN={key,fn};$('#banner').innerHTML=`<div class="banner" role="status"><span class="pf">${avHTML(i,36)}</span><p>${text}</p><button class="btn sm" type="button" data-ban="1">${esc(btn)}</button><button class="mb" type="button" data-banx="1" aria-label="Dismiss" style="background:transparent">${ICON.close}</button></div>`;}
function clearBanner(key){if(!key||(BAN&&BAN.key===key)){BAN=null;$('#banner').innerHTML='';}}

/* 3D dice THROWN onto the table: physics is pre-simulated (walls, bounces, die-die hits, friction),
