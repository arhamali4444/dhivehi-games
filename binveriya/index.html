/* 3D dice THROWN onto the table: physics is pre-simulated (walls, bounces, die-die hits, friction),
   then played back with transforms only. Rotation progress follows the distance travelled, so the dice
   tumble fast, slow down with the roll and settle flat on the engine's result. */
let FLICK=null,DTIMERS=[];
const FACE_R={1:[0,0],6:[0,180],2:[0,-90],5:[0,90],3:[-90,0],4:[90,0]};
const pipsHTML=n=>PIPS[n].map(([x,y])=>`<b style="left:${x}%;top:${y}%"${n===1?' class="r"':''}></b>`).join('');
function cubeHTML(){const f=(n,t)=>`<div class="fc" style="transform:${t} translateZ(var(--h))">${pipsHTML(n)}</div>`;
 return `<div class="d3s"></div><div class="d3c">${f(1,'')}${f(6,'rotateY(180deg)')}${f(2,'rotateY(90deg)')}${f(5,'rotateY(-90deg)')}${f(3,'rotateX(90deg)')}${f(4,'rotateX(-90deg)')}<i class="core"></i><i class="core" style="transform:rotateY(90deg)"></i><i class="core" style="transform:rotateX(90deg)"></i></div>`;}
function simThrow(W,H,D,vec){const R=D/2,sc=Math.max(.75,Math.min(1.5,Math.min(W,H)/360));
 let ang,spd;const vs=vec?Math.hypot(vec.vx,vec.vy):0;
 if(vs>260){ang=Math.atan2(vec.vy,vec.vx);spd=Math.min(1500,Math.max(820,vs*.9));}else{ang=-Math.PI/2+(Math.random()-.5)*.7;spd=940+Math.random()*260;}
 if(Math.sin(ang)>-.35)ang=-Math.PI/2+(Math.cos(ang)>=0?.95:-.95);
 const dies=[0,1].map(k=>{const a=ang+(k?.14:-.14)+(Math.random()-.5)*.12,s=spd*sc*(.9+Math.random()*.2);
  return {x:W*(.5+(k?.09:-.09))-Math.cos(ang)*H*.25+(Math.random()-.5)*W*.08,y:H+R+k*D*.5,z:D*(1.2+Math.random()*.5),vx:Math.cos(a)*s,vy:Math.sin(a)*s,vz:D*(4.5+Math.random()*1.5),frames:[],hits:[],inn:false};});
 const g=-D*55,dt=1/120;let t=0;
 for(let n=0;n<120*2.8;n++){t+=dt;
  for(const d of dies){d.vz+=g*dt;d.z+=d.vz*dt;
   if(d.z<=0){d.z=0;if(d.vz<-D*2.5){d.hits.push([t,Math.min(1,-d.vz/(D*9)),'t']);d.vz=-d.vz*.36;d.vx*=.84;d.vy*=.84;}else d.vz=0;}
   const on=d.z===0&&d.vz===0,sp=Math.hypot(d.vx,d.vy);if(sp>0){const ns=Math.max(0,sp-(on?D*21:D*1.5)*dt);d.vx*=ns/sp;d.vy*=ns/sp;}
   d.x+=d.vx*dt;d.y+=d.vy*dt;if(!d.inn&&(d.y<H-R||t>.3))d.inn=true;const s2=Math.hypot(d.vx,d.vy),hv=Math.min(1,s2/(D*26));
   if(d.x<R){d.x=R;d.vx=Math.abs(d.vx)*.5;d.hits.push([t,hv,'w']);}else if(d.x>W-R){d.x=W-R;d.vx=-Math.abs(d.vx)*.5;d.hits.push([t,hv,'w']);}
   if(d.y<R){d.y=R;d.vy=Math.abs(d.vy)*.5;d.hits.push([t,hv,'w']);}else if(d.inn&&d.y>H-R){d.y=H-R;d.vy=-Math.abs(d.vy)*.5;d.hits.push([t,hv,'w']);}}
  const A=dies[0],Bd=dies[1],dx=Bd.x-A.x,dy=Bd.y-A.y,dist=Math.hypot(dx,dy);
  if(dist>0&&dist<D*1.05&&Math.abs(A.z-Bd.z)<D*.8){const nx=dx/dist,ny=dy/dist,ov=(D*1.05-dist)/2;A.x-=nx*ov;A.y-=ny*ov;Bd.x+=nx*ov;Bd.y+=ny*ov;
   const va=A.vx*nx+A.vy*ny,vb=Bd.vx*nx+Bd.vy*ny;if(va>vb){const dv=(va-vb)*.9;A.vx-=dv*nx;A.vy-=dv*ny;Bd.vx+=dv*nx;Bd.vy+=dv*ny;A.hits.push([t,Math.min(1,dv/(D*20)),'d']);}}
  for(const d of dies)d.frames.push([d.x,d.y,d.z]);
  if(t>.6&&dies.every(d=>d.z===0&&d.vz===0&&Math.hypot(d.vx,d.vy)<D*.25))break;}
 for(const d of dies){let L=0;d.Ls=[0];for(let j=1;j<d.frames.length;j++){const p=d.frames[j-1],q=d.frames[j];L+=Math.hypot(q[0]-p[0],q[1]-p[1],(q[2]-p[2])*1.6);d.Ls.push(L);}d.L=L||1;}
 return {dies,T:t};}
function animDice(d){const els=$$('#dice .die');els.forEach(e=>e.classList.remove('dbl'));
 if(FAST){setDice(d);return Promise.resolve();}
 const tray=$('#dtray');DTIMERS.forEach(clearTimeout);DTIMERS=[];tray.classList.remove('on','fade');tray.innerHTML='';
 const W=tray.clientWidth,Hh=tray.clientHeight;
 if(RM.matches||document.hidden||!W){SND.dice();setDice(d);return sleep(RM.matches?350:150);}
 $('#dice').classList.add('thrown');
 const D=Math.round(Math.max(34,Math.min(66,Math.min(W,Hh)*.13)));tray.style.setProperty('--d',D+'px');
 tray.innerHTML=`<div class="d3">${cubeHTML()}</div><div class="d3">${cubeHTML()}</div>`;tray.classList.add('on');
 const sim=simThrow(W,Hh,D,FLICK);FLICK=null;
 const rot=d.map(n=>{const[rx,ry]=FACE_R[n],sg=()=>Math.random()<.5?-1:1;return {rx,ry,ex:(2+((Math.random()*2)|0))*360*sg(),ey:(1+((Math.random()*2)|0))*360*sg(),yaw:(Math.random()-.5)*44,ez:(Math.random()-.5)*600};});
 SND.rattle();let last=-1;sim.dies.flatMap(x=>x.hits).sort((a,b)=>a[0]-b[0]).forEach(h=>{if(h[0]-last>.035){SND.hit(h[0],h[1],h[2]);last=h[0];}});SND.settle(sim.T);
 const nodes=$$('.d3',tray);
 function draw(t){const idx=Math.min(Math.round(t*120),1e9);sim.dies.forEach((dd,k)=>{const j=Math.max(0,Math.min(dd.frames.length-1,idx-1)),f=dd.frames[j],p=dd.Ls[j]/dd.L,q=1-p,r=rot[k],el=nodes[k];
   el.style.transform=`translate3d(${(f[0]-D/2).toFixed(1)}px,${(f[1]-D/2).toFixed(1)}px,0)`;
   el.children[1].style.transform=`translateZ(${(f[2]+D/2).toFixed(1)}px) rotateZ(${(r.yaw+r.ez*q).toFixed(1)}deg) rotateX(${(r.rx+r.ex*q).toFixed(1)}deg) rotateY(${(r.ry+r.ey*q).toFixed(1)}deg)`;
   const z=f[2]/D;el.children[0].style.transform=`translate3d(${(z*D*.45).toFixed(1)}px,${(z*D*.6).toFixed(1)}px,0) scale(${(1+z*.3).toFixed(3)})`;el.children[0].style.opacity=Math.max(.15,.62-z*.18).toFixed(2);});}
 return new Promise(res=>{const t0=performance.now();let done=false;
  function fr(now){if(done)return;const t=(now-t0)/1000;draw(Math.min(t,sim.T));if(t<sim.T)requestAnimationFrame(fr);else fin();}
  function fin(){if(done)return;done=true;draw(sim.T);setDice(d);$('#dice').classList.remove('thrown');DTIMERS.push(setTimeout(res,200),setTimeout(()=>tray.classList.add('fade'),1100),setTimeout(()=>{tray.classList.remove('on','fade');tray.innerHTML='';},1600));}
  requestAnimationFrame(fr);DTIMERS.push(setTimeout(fin,sim.T*1000+300));});}
function canRoll(){const pe=G&&G.pend;return !!pe&&pe.p===ME&&!AUTO&&!meP().out&&(pe.t==='turn'||(pe.t==='post'&&pe.again))&&!PUMPING;}
(function flick(){const el=$('#dice');let pts=null;
 el.addEventListener('pointerdown',e=>{if(!canRoll())return;SND.unlock();try{el.setPointerCapture(e.pointerId);}catch(x){}pts=[[e.clientX,e.clientY,performance.now()]];el.classList.add('grab');});
 el.addEventListener('pointermove',e=>{if(!pts)return;pts.push([e.clientX,e.clientY,performance.now()]);if(pts.length>6)pts.shift();const a=pts[0];el.style.transform=`translate(${((e.clientX-a[0])*.25).toFixed(1)}px,${((e.clientY-a[1])*.25).toFixed(1)}px)`;});
 const up=e=>{if(!pts)return;const a=pts[0],dt=Math.max(16,performance.now()-a[2]);FLICK={vx:(e.clientX-a[0])/dt*1000,vy:(e.clientY-a[1])/dt*1000};pts=null;el.style.transform='';el.classList.remove('grab');if(canRoll())H.roll();};
 el.addEventListener('pointerup',up);el.addEventListener('pointercancel',()=>{pts=null;el.style.transform='';el.classList.remove('grab');});})();

/* ---------------------------------------------------------------- board view, tokens, camera */
let BV=null;const VIEW={pos:[],cash:[]};
function buildBoard(){const cam=$('#bcam');cam.innerHTML='';BV=LAYOUT.build(cam);TAGK={};
 BV.tokens.innerHTML=G.players.map((p,i)=>`<span class="tok" data-p="${i}" style="--c:${p.col}"><i>${TOKENS[p.tok].s}</i></span>`).join('');
 BV.toks=$$('.tok',BV.tokens);sizeBoard();decorate();placeTokens();CAM.s=FOLLOW?FOLLOW_S:1;CAM.x=0;CAM.y=0;if(FOLLOW)follow(G.pend&&G.pend.p!=null?G.pend.p:G.turn);else applyCam();}
function tokXY(i){const p=G.players[i],pos=VIEW.pos[i],jailed=pos===JAIL&&p.jail;const b=LAYOUT.pos(pos,{jailed});

 h+=w.m?`<button class="btn lite sm" data-a="repay" data-sp="${sp}" ${E.chkRepay(ME,sp)?'disabled':''}>Repay loan ${fmt(E.repayCost(sp))}</button>`:`<button class="btn lite sm" data-a="loan" data-sp="${sp}" ${E.chkLoan(ME,sp)?'disabled':''}>Take a loan +${fmt(E.loanVal(sp))}</button>`;
 h+=`<button class="btn lite sm" data-a="listsale" data-sp="${sp}" ${!E.tradable(sp)||G.sale?'disabled':''}>Put up for sale</button></div>`;
 /* half-price permit bribe (council permit office), own turn only, guesthouses only */
 if(s.k==='p'&&E.ownsAll(ME,s.g)&&w.h<4){const eb=E.chkBribeBuild(ME,sp);
  h+=`<div class="acts one" style="margin-top:8px"><button class="btn bribeb sm" data-a="buildbribe" data-sp="${sp}" ${eb?'disabled':''} title="${esc(eb||'')}">${ICON.bribe}Half-price permit: bribe ${fmt(E.permitBribe(sp))}</button></div><p class="bline dark">${eb&&eb!=='Not enough cash'?esc(eb):riskLine(meP().sus)}</p>`;}
 const hint=s.k==='p'&&w.h===0&&!E.ownsAll(ME,s.g)?`<p style="font-size:12px;color:var(--muted)">Own every ${GROUPS[s.g].n.toLowerCase()} island to build guesthouses.</p>`:'';return hint+h;}
function openInfo(sp){if(!G)return;const s=SP[sp],w=G.own[sp];let h=shead(esc(s.name),'')+spaceCard(sp);
 if(w){const amt=w.o!==ME&&!w.m?E.rentOf(sp,7):null;h+=ownerRow(sp,null);h+=mgmtButtons(sp);
  if(w.o!==ME&&!meP().out&&!G.players[w.o].out&&!G.over)h+=`<div class="acts one"><button class="btn sm" data-a="tradefor" data-sp="${sp}">${ICON.handshake}Propose a trade for it</button></div>`;}
 else if(s.price)h+=`<div class="price">Still owned by the bank<span><b>${fmt(s.price)}</b></span></div>`;
 openSheet('info:'+sp,h.replace(shead(esc(s.name),''),'<div class="grab" aria-hidden="true"></div><h2 id="sheetTitle" class="sr">'+esc(s.name)+'</h2>')+'<div class="acts one"><button class="btn lite sm" data-a="close">Close</button></div>');}
function openDeckInfo(d){openSheet('deck',shead(d==='c'?'City Council':'Monsoon')+`<p>${d==='c'?'Grants, fees and inspections. Draw one by choosing it at the Sandbank.':'Weather, luck and fishing. Draw one by choosing it at the Sandbank.'} There are 16 cards in each deck, including a <b>Get out of Maafushi</b> card you can keep, use or trade.</p>`);}

/* decisions */
function pendKey(pe){return pe?[pe.t,pe.p,pe.sp,pe.id,G.round,G.turn].join(':'):'';}
function needsMe(){if(!G||G.over||AUTO||meP().out)return null;const pe=G.pend;
 if(pe&&pe.p===ME&&(pe.t==='buy'||pe.t==='rent'||pe.t==='debt'||pe.t==='sandbank'||pe.t==='court'))return pe;
 if(pe&&pe.t==='auction'&&!pe.out.includes(ME))return pe;
 if(G.sale&&G.sale.seller===ME&&G.sale.st==='pick')return {t:'salepick',id:G.sale.id};return null;}
function syncDecision(){if(PUMPING)return;const pe=needsMe();if(!pe)return;const k=pendKey(pe);if(MIN[k])return;if(SH.key===k)return;if(SH.key&&!SH.decision)return;openDecision(pe);}
function openDecision(pe){const k=pendKey(pe);delete MIN[k];
 if(pe.t==='buy')return openBuy(pe,k);if(pe.t==='rent')return openRent(pe,k);if(pe.t==='sandbank')return openSandbank(pe,k);if(pe.t==='court')return openCourt(pe,k);if(pe.t==='debt')return openDebt(pe,k);if(pe.t==='auction')return openAuction(pe,k);if(pe.t==='salepick')return openSaleSeller();}
function openBuy(pe,k){const s=SP[pe.sp],p=meP(),can=p.cash>=s.price;
 openSheet(k,`<div class="grab" aria-hidden="true"></div><h2 id="sheetTitle" class="sr">Buy ${esc(s.name)}?</h2>${spaceCard(pe.sp)}<div class="price">You rolled ${G.dice[0]} + ${G.dice[1]} and landed here<span><b>${fmt(s.price)}</b></span></div>
 ${can?'':`<p style="color:#8A2B2B;font-weight:700">You have ${fmt(p.cash)}. Take a loan or sell buildings in My islands, or send it to auction.</p>`}
 <div class="acts"><button class="btn em" data-a="buy" ${can?'data-focus':'disabled'}>Buy island</button><button class="btn lite" data-a="decline">Auction</button></div>
 ${can?'':'<div class="acts one"><button class="btn soft sm" style="color:var(--ink);background:#EDE3D0" data-a="manage">My islands</button></div>'}`,{decision:1});}
/* legacy saves only: rent is now paid automatically */
function openRent(pe,k){const s=SP[pe.sp];
 openSheet(k,`<div class="grab" aria-hidden="true"></div><h2 id="sheetTitle" class="sr">Rent due</h2><div class="pcard">${cardHead(pe.sp)}${ART.draw(s.art,pe.sp)}</div>${ownerRow(pe.sp,pe.amt)}
 <div class="acts one"><button class="btn red" data-a="pay" data-focus>Pay ${fmt(pe.amt)}</button></div>`,{decision:1});}
/* the bribe box used by tax and court sheets: amount, one-line risk and the suspicion meter */
function bribeBox(title,sub){const s=meP().sus;return `<div class="bribe"><b>${ICON.bribe}${title}</b><p>${sub}</p><p><b style="display:inline;font-size:inherit">${riskLine(s)}.</b></p>
 <div class="risk" role="meter" aria-valuenow="${s}" aria-valuemin="0" aria-valuemax="100" aria-label="Your suspicion">Suspicion<i style="--r:${s}%"></i>${s}%</div></div>`;}
/* Sandbank choice: three big buttons */
function openSandbank(pe,k){const s=meP().sus;
 openSheet(k,`<div class="grab" aria-hidden="true"></div><div class="shead"><h2 id="sheetTitle">You reached the Sandbank</h2></div><p style="margin-top:-2px">Pick one. Each card deck is a gamble. Relaxing is always safe.</p>
 <div class="choices">
  <button class="choice mn" data-a="sbpick" data-c="n" data-focus><span class="ci">${ICON.monsoon}</span><span class="ct"><b>Draw a Monsoon card</b><small>The weather decides: a big catch, a free trip, or a storm bill.</small></span></button>
  <button class="choice cc" data-a="sbpick" data-c="c"><span class="ci">${ICON.majlis}</span><span class="ct"><b>Draw a City Council card</b><small>Grants, fees, an amnesty, or a raid.</small></span></button>
  <button class="choice rx" data-a="sbpick" data-c="relax"><span class="ci">${ICON.relax}</span><span class="ct"><b>Relax</b><small>Safe. Nothing happens and your turn ends.</small></span></button>
 </div>${s>0?`<p style="font-size:12px;color:#8A2B2B;font-weight:700;margin-top:10px">Your suspicion is ${s}%. Both decks hold an Anti-Corruption Raid.</p>`:''}`,{decision:1});}
function openCourt(pe,k){const p=meP();
 openSheet(k,`<div class="grab" aria-hidden="true"></div><h2 id="sheetTitle" class="sr">Supreme Court Verdict</h2>${spaceCard(GOJAIL)}
 ${bribeBox(`Or pay the judge ${fmt(pe.bribe)}`,'The case is dismissed and you stay free. Your suspicion goes up '+E.C.SUS_STEP+'%.')}
 <div class="acts"><button class="btn red" data-a="court" data-focus>Go to Maafushi</button><button class="btn bribeb" data-a="bribejudge" ${p.cash<pe.bribe?'disabled':''}>Bribe ${fmt(pe.bribe)}</button></div>`,{decision:1});}
function openDebt(pe,k){const p=meP(),can=p.cash>=pe.total;const to=pe.items.map(x=>x.to<0?'the bank':x.to===ME?'you':G.players[x.to].name);
 openSheet(k,shead(`You owe ${fmt(pe.total)}`,`To ${esc([...new Set(to)].join(', '))}. You have ${fmt(p.cash)}. Sell buildings or take loans on your islands to raise the money.`)+
  manageList()+`<div class="acts"><button class="btn em" data-a="paydebt" ${can?'data-focus':'disabled'}>Pay ${fmt(pe.total)}</button><button class="btn red" data-a="bankruptask">Declare bankruptcy</button></div>`,{decision:1});}
function auctionHTML(pe){const s=SP[pe.sp],p=meP(),by=pe.by>=0?G.players[pe.by]:null,left=Math.max(0,pe.ends-G.now),out=pe.out.includes(ME);
 const inc=[10,50,100].map(d=>pe.high+d);const top=pe.by===ME;
 return `<div class="grab" aria-hidden="true"></div><div class="shead"><h2 id="sheetTitle">Auction</h2>${X}</div><div class="pcard">${cardHead(pe.sp)}</div>
 <div class="hbid" style="margin-top:10px">${by?`<span class="pf">${avHTML(pe.by,40)}</span><span><small style="display:block;color:var(--muted);font-size:11.5px">Highest bid</small><strong>${pe.by===ME?'You':esc(by.name)}</strong></span>`:'<span style="color:var(--muted);font-weight:700">No bids yet · bank price '+fmt(s.price)+'</span>'}<b data-live="high">${fmt(pe.high)}</b></div>
 <div class="bidbar" aria-hidden="true"><i data-live="bar" style="transform:scaleX(${Math.min(1,left/pe.dur)})"></i></div>
 <p data-live="left" style="text-align:center;font-weight:800;font-size:12px;color:var(--muted);margin:0">${Math.ceil(left/1000)} s left · each bid adds time</p>
 ${out?`<p style="text-align:center;font-weight:700">You passed. Watching the bidding…</p>`:top?`<p style="text-align:center;font-weight:800;color:var(--emerald)">You are the top bidder!</p>`:
 `<div class="acts three">${inc.map(v=>`<button class="btn em sm" data-a="bid" data-v="${v}" ${v>p.cash?'disabled':''}>${fmt(v)}</button>`).join('')}</div><div class="acts one"><button class="btn lite sm" data-a="pass">Pass</button></div>`}
 <p style="font-size:11.5px;color:var(--muted);text-align:center">You have ${fmt(p.cash)}</p>`;}
function openAuction(pe,k){openSheet(k,auctionHTML(pe),{decision:1,auc:pe.id,sig:[pe.high,pe.by,pe.out.length].join()});}
function updLive(){if(!G)return;const pe=G.pend;
 if(SH.auc&&pe&&pe.t==='auction'&&pe.id===SH.auc){const sig=[pe.high,pe.by,pe.out.length,meP().cash].join();if(sig!==SH.sig){openAuction(pe,SH.key);return;}
  const left=Math.max(0,pe.ends-G.now);const bar=$('[data-live="bar"]');if(bar)bar.style.transform=`scaleX(${Math.min(1,left/pe.dur)})`;const l=$('[data-live="left"]');if(l)l.textContent=`${Math.ceil(left/1000)} s left · each bid adds time`;}
 else if(SH.auc&&(!pe||pe.t!=='auction'||pe.id!==SH.auc))closeSheet(false);
 if(SH.sale){const s=G.sale;if(!s||s.id!==SH.sale)closeSheet(false);else{const sig=JSON.stringify(s.bids)+s.st+meP().cash;if(sig!==SH.sig)(SH.seller?openSaleSeller:openSaleBid)();else{const l=$('[data-live="sleft"]');if(l)l.textContent=s.st==='bid'?`${Math.ceil(Math.max(0,s.ends-G.now)/1000)} s of bidding left`:'Bidding closed';}}}
 if(SH.debt!=null){const pe2=G.pend;if(!pe2||pe2.t!=='debt')closeSheet(false);}
 if(SH.decision&&!SH.auc){const n=needsMe();if(!n||pendKey(n)!==SH.key)closeSheet(false);}}

/* manage */
function manageList(){const mine=E.propsOf(ME);if(!mine.length)return '<p>You do not own any islands yet.</p>';
 return '<div class="list">'+mine.map(sp=>{const s=SP[sp],w=G.own[sp],col=s.k==='p'?GROUPS[s.g].c:s.k==='r'?'#15241F':'#5D6B64';
  const st=w.m?'Loan: no rent':s.k==='p'?(w.h===5?'Luxury resort':w.h?`${w.h} guesthouse${w.h>1?'s':''}`:E.ownsAll(ME,s.g)?'Whole group: ready to build':'No buildings'):s.k==='r'?'Transport':'Utility';
  const b=[];if(s.k==='p'&&E.ownsAll(ME,s.g)){b.push(`<button class="mb g" data-a="build" data-sp="${sp}" ${E.chkBuild(ME,sp)?'disabled':''} aria-label="Build on ${esc(s.name)} for ${fmt(E.hc(sp))}">+${ICON.build.replace('<svg','<svg width="14" height="14"')}</button>`);
   b.push(`<button class="mb" data-a="sellb" data-sp="${sp}" ${E.chkSellB(ME,sp)?'disabled':''} aria-label="Sell a building on ${esc(s.name)}">−${ICON.build.replace('<svg','<svg width="14" height="14"')}</button>`);}
  b.push(w.m?`<button class="mb" data-a="repay" data-sp="${sp}" ${E.chkRepay(ME,sp)?'disabled':''} aria-label="Repay loan on ${esc(s.name)}">Repay</button>`:`<button class="mb r" data-a="loan" data-sp="${sp}" ${E.chkLoan(ME,sp)?'disabled':''} aria-label="Take a loan on ${esc(s.name)}">Loan</button>`);
  return `<div class="row2"><i class="sw" style="background:${col}"></i><button class="tx" data-a="info" data-sp="${sp}" style="border:0;background:none;text-align:left;padding:0;color:inherit;min-height:44px"><b>${esc(s.name)}</b><small>${st} · ${w.m?'repay '+fmt(E.repayCost(sp)):'loan '+fmt(E.loanVal(sp))}</small></button><span class="bs">${b.join('')}</span></div>`;}).join('')+'</div>';}
function openManage(){const p=meP();openSheet('manage',shead('My islands',`Cash ${fmt(p.cash)} · Net worth ${fmt(E.netWorth(ME))}${p.cards.length?` · ${p.cards.length} Get out of Maafushi card${p.cards.length>1?'s':''}`:''}`)+
 `<p style="font-size:12px;color:var(--muted)">Build evenly within a complete colour group: guesthouses 1 to 4, then a luxury resort. Loans pay half the price; repaying costs 10% more.</p>`+manageList()+
 (E.propsOf(ME).some(E.tradable)&&!G.sale?`<div class="acts one"><button class="btn lite sm" data-a="salepickisl">Put an island up for sale</button></div>`:''));}

/* trade builder */
let TR=null;
function tradeStart(to,o={}){const others=E.alive().filter(i=>i!==ME);if(!others.length)return;if(to==null||!others.includes(to))to=others[0];
 TR={to,give:{sp:new Set(o.give||[]),cash:o.giveCash||0,cards:o.giveCards||0},get:{sp:new Set(o.get||[]),cash:o.getCash||0,cards:o.getCards||0},re:o.re||0};openTrade();}
function trOffer(){return {id:0,from:ME,to:TR.to,give:{sp:[...TR.give.sp],cash:TR.give.cash,cards:TR.give.cards},get:{sp:[...TR.get.sp],cash:TR.get.cash,cards:TR.get.cards}};}
function chipsFor(pid,set,side){const list=E.propsOf(pid);if(!list.length)return '<p style="font-size:12px;color:var(--muted);margin:0">No islands</p>';
 return '<div class="chips">'+list.map(sp=>{const s=SP[sp],ok=E.tradable(sp)&&!(G.sale&&G.sale.sp===sp),col=s.k==='p'?GROUPS[s.g].c:'#15241F';
  return `<button class="pchip" data-a="trchip" data-side="${side}" data-sp="${sp}" aria-pressed="${set.has(sp)}" ${ok?'':'disabled title="Has buildings in its group"'}><i style="background:${col}"></i>${esc(s.lab.replace(/\n/g,' '))}${G.own[sp].m?' (loan)':''}</button>`;}).join('')+'</div>';}
function cashStep(side,val,max){return `<div class="stepper" style="margin-top:8px"><button class="mb" data-a="trcash" data-side="${side}" data-d="-50" aria-label="Minus 50">−50</button><button class="mb" data-a="trcash" data-side="${side}" data-d="-10" aria-label="Minus 10">−10</button><output>${fmt(val)}</output><button class="mb" data-a="trcash" data-side="${side}" data-d="10" aria-label="Plus 10">+10</button><button class="mb" data-a="trcash" data-side="${side}" data-d="50" aria-label="Plus 50">+50</button></div><p style="font-size:11px;color:var(--muted);margin:2px 0 0">max ${fmt(max)}</p>`;}
function openTrade(){const to=TR.to,them=G.players[to],me=meP();const others=E.alive().filter(i=>i!==ME);
 const o=trOffer(),err=E.chkTrade(o);let fair='';
 if(!err){const r=AI.evalOffer(to,o);const q=r.gain/Math.max(1,r.loss);fair=q>=1.05?`<span style="color:#155E43">${esc(them.name)} will probably like this</span>`:q>=0.7?`<span style="color:#8A6414">${esc(them.name)} may ask for more</span>`:`<span style="color:#8A2B2B">${esc(them.name)} is unlikely to accept</span>`;}
 const mine=G.offers.filter(x=>x.st==='open'&&x.from===ME);
 openSheet('trade',shead(TR.re?'Counter-offer':'Trade','Offer islands, cash and Get out of Maafushi cards. Trade any time.')+
  (mine.length?`<h3>Your open offers</h3><div class="list">${mine.map(x=>`<div class="row2"><span class="tx"><b>To ${esc(G.players[x.to].name)}</b><small>${esc(offerSummary(x))}</small></span><span class="bs"><button class="mb r" data-a="cancelof" data-id="${x.id}">Cancel</button></span></div>`).join('')}</div>`:'')+
  `<h3>Trade with</h3><div class="tabs" role="tablist">${others.map(i=>`<button role="tab" aria-selected="${i===to}" data-a="trto" data-p="${i}"><span class="pf">${avHTML(i,36)}</span>${esc(G.players[i].name)}</button>`).join('')}</div>
  <div class="tcols" style="margin-top:10px"><div class="tbox"><h4>You give</h4>${chipsFor(ME,TR.give.sp,'give')}${cashStep('give',TR.give.cash,me.cash)}${me.cards.length?`<button class="switch" style="margin-top:8px" role="switch" aria-checked="${TR.give.cards>0}" data-a="trcard" data-side="give">Get out of Maafushi card<i></i></button>`:''}</div>
  <div class="tbox"><h4>You ask ${esc(them.name)} for</h4>${chipsFor(to,TR.get.sp,'get')}${cashStep('get',TR.get.cash,them.cash)}${them.cards.length?`<button class="switch" style="margin-top:8px" role="switch" aria-checked="${TR.get.cards>0}" data-a="trcard" data-side="get">Their Get out of Maafushi card<i></i></button>`:''}</div></div>
  <div class="fair">${err&&err!=='Empty offer'?`<span style="color:#8A2B2B">${esc(err)}</span>`:fair||'Pick what to swap'}</div>
  <div class="acts one"><button class="btn em" data-a="sendtrade" ${err?'disabled':''}>${ICON.handshake}Send offer</button></div>`);}
function offerSummary(o){const part=(x)=>[...x.sp.map(sp=>SP[sp].name),x.cash?fmt(x.cash):'',x.cards?'Get out of Maafushi card':''].filter(Boolean).join(', ')||'nothing';
 return `Gives ${part(o.give)} · wants ${part(o.get)}`;}
function openOffer(id){const o=G.offers.find(x=>x.id===id);if(!o||o.st!=='open'){toast('That offer is no longer open');return;}const from=G.players[o.from],err=E.chkTrade(o);
 const lst=(x)=>(x.sp.map(sp=>`<div class="row2"><i class="sw" style="background:${SP[sp].g?GROUPS[SP[sp].g].c:'#15241F'}"></i><button class="tx" data-a="info" data-sp="${sp}" style="border:0;background:none;text-align:left;padding:0;color:inherit"><b>${esc(SP[sp].name)}</b><small>${esc(spaceSub(SP[sp]))}${G.own[sp]&&G.own[sp].m?' · has a loan':''}</small></button></div>`).join('')+(x.cash?`<div class="row2"><i class="sw" style="background:#C9A45C"></i><span class="tx"><b>${fmt(x.cash)}</b><small>Cash</small></span></div>`:'')+(x.cards?`<div class="row2"><i class="sw" style="background:#1B7FA6"></i><span class="tx"><b>Get out of Maafushi card</b><small>Card</small></span></div>`:''))||'<p style="margin:0;color:var(--muted)">Nothing</p>';
 openSheet('offer:'+id,shead(`${esc(from.name)} ${o.re?'counters':'offers a deal'}`,'')+`<div class="owner" style="--c:${from.col};margin-top:0"><span class="pf">${avHTML(o.from,40,'smug')}</span><span><b>${esc(from.name)}</b><small>Cash ${fmt(from.cash)}</small></span></div>
  <h3>You get</h3><div class="list">${lst(o.give)}</div><h3>You give</h3><div class="list">${lst(o.get)}</div>${err?`<p style="color:#8A2B2B;font-weight:700">${esc(err)}</p>`:''}
  <div class="acts three"><button class="btn em sm" data-a="acceptof" data-id="${id}" ${err?'disabled':''}>Accept</button><button class="btn lite sm" data-a="rejectof" data-id="${id}">Decline</button><button class="btn sm" data-a="counterof" data-id="${id}">Counter</button></div>`);}

/* sale (put an island up for sale; others bid ~30 s; seller picks) */
let SALEMIN=0;
function openSaleList(sp){SALEMIN=SALEMIN&&SH.key==='salelist:'+sp?SALEMIN:SP[sp].price;
 openSheet('salelist:'+sp,shead('Put up for sale',`Everyone can bid on ${esc(SP[sp].name)} for 30 seconds. Then you pick the offer you like, or keep it.`)+spaceCard(sp)+
 `<h3>Minimum bid</h3><div class="stepper"><button class="mb" data-a="smin" data-d="-50">−50</button><button class="mb" data-a="smin" data-d="-10">−10</button><output>${fmt(SALEMIN)}</output><button class="mb" data-a="smin" data-d="10">+10</button><button class="mb" data-a="smin" data-d="50">+50</button></div>
 <div class="acts one"><button class="btn em" data-a="dolist" data-sp="${sp}">Start the sale</button></div>`);}
function bidsList(s,pick){const b=Object.entries(s.bids).map(([i,a])=>[+i,a]).sort((x,y)=>y[1]-x[1]);if(!b.length)return '<p style="color:var(--muted)">No bids yet.</p>';
 return '<div class="list">'+b.map(([i,a])=>`<div class="row2"><span class="pf" style="width:36px;height:36px;border-radius:50%;overflow:hidden;flex:none">${avHTML(i,36)}</span><span class="tx"><b>${fmt(a)}</b><small>${i===ME?'You':esc(G.players[i].name)}</small></span>${pick?`<span class="bs"><button class="mb g" data-a="spick" data-b="${i}">Sell</button></span>`:''}</div>`).join('')+'</div>';}
function openSaleSeller(){const s=G.sale;if(!s)return;openSheet(s.st==='pick'?pendKey({t:'salepick',id:s.id}):'sale',shead(`Selling ${esc(SP[s.sp].name)}`,`Minimum ${fmt(s.min)}.`)+
 `<p data-live="sleft" style="font-weight:800">${s.st==='bid'?`${Math.ceil(Math.max(0,s.ends-G.now)/1000)} s of bidding left`:'Bidding closed. Pick a buyer or keep the island.'}</p>`+bidsList(s,true)+
 `<div class="acts one"><button class="btn lite sm" data-a="scancel">${s.st==='bid'?'Cancel the sale':'Keep the island'}</button></div>`,{sale:s.id,seller:1,decision:s.st==='pick'?1:0,sig:JSON.stringify(s.bids)+s.st+meP().cash});}

const RULES=`<div class="rules"><p><b>Binveriya</b> (ބިންވެރިޔާ, "landowner") is a Maldivian island property game for 2 to 5 players.</p>
<h3>The board</h3><ul><li>28 spaces, 6 on each side: a pair of islands, a transport and a group of three islands. Colour groups have 2 or 3 islands.</li><li>The four transports are <b>Malé Ferry Terminal</b>, <b>Velana Airport</b>, <b>Seaplane Dock</b> and <b>Hulhumalé Bus Stop</b>.</li></ul>
<h3>Your turn</h3><ul><li>Roll two dice and hop around the board. Every time you pass or land on <b>Malé Jetty</b> (Start) you collect MVR 200.</li><li>Land <b>right on</b> Malé Jetty with your dice roll and you also draw a <b>City Council</b> card.</li><li>Land on an island or transport nobody owns: <b>buy it</b> or send it to <b>auction</b>, where everyone bids.</li><li>Land on the <b>Sandbank</b> and choose: draw a Monsoon card, draw a City Council card, or relax (always safe).</li><li>Doubles: roll again. Three doubles in a row: straight to Maafushi.</li></ul>
<h3>Rent</h3><ul><li>Land on someone else's island and pay the rent shown on its tag. Owning the whole colour group (all 2 or all 3 islands) doubles the base rent; guesthouses and resorts raise it much more. Tap any space for its full rent table.</li><li>Transports: rent is MVR 25 if the owner has one, 50 for two, 100 for three and 200 for all four.</li></ul>
<h3>Bribes and suspicion</h3><ul><li>You never bribe players, only <b>officials</b>: the prison guard (${fmt(E.C.GUARD_BRIBE)} to walk out now), the judge at the Supreme Court (${fmt(E.C.JUDGE_BRIBE)} to stay free), or the council permit office (a guesthouse at half price, on your turn).</li>
<li>Every bribe adds ${E.C.SUS_STEP}% <b>suspicion</b> (the red bar under each avatar, up to 100%). It drops ${E.C.SUS_DECAY}% at the start of each turn you didn't bribe.</li>
<li>You get <b>busted</b> three ways: on the spot (each bribe rolls a catch chance equal to your suspicion before it rises, so the first one is safe), by an <b>Anti-Corruption Raid</b> card (one in each deck: everyone with suspicion is checked, clean players are always safe), or when another player <b>reports</b> you (they pay ${fmt(E.C.REPORT_FEE)} on their turn for an audit roll at your suspicion).</li>
<li>Busted: pay back double everything you dodged, go to Maafushi Prison, and the government seizes your most built-up island and auctions it to the others. Your suspicion resets to 0.</li></ul>
<h3>Building</h3><ul><li>Own every island of a colour (2 or 3) to build <b>guesthouses</b> (1 to 4), then a <b>luxury resort</b> with overwater villas. Build evenly.</li><li>Short of cash? <b>Take a loan</b> on an island for half its price (no rent while the loan runs; repay +10%).</li></ul>
<h3>Trading and sales</h3><ul><li><b>Trade any time</b>, even on other players' turns: islands, cash and Get out of Maafushi cards. Accept, decline or counter.</li><li><b>Put an island up for sale</b>: everyone bids for 30 seconds, you choose.</li></ul>
<h3>Cards and Maafushi Prison</h3><ul><li>You draw cards at the Sandbank: pick Monsoon or City Council (or relax). Draw the top card, read it and tap OK. A card that moves you onto the Sandbank does not draw another card.</li><li>A <b>Get out of Maafushi</b> card can be kept (use it or trade it later) or put back.</li><li>In prison: pay MVR 50, use a Get out of Maafushi card, bribe the guard, or roll doubles. After three tries, pay and move.</li></ul>
<h3>Winning</h3><ul><li><b>Quick game</b>: 30 minutes, then the richest net worth (cash + islands + buildings) wins.</li><li><b>Classic</b>: pick a <b>win target</b> before you start: MVR 3,000, 5,000, 7,000 or 10,000. The first landowner whose net worth (cash + islands + buildings; an island with a loan counts half) reaches the target at the end of a turn wins at once. The gold bar under each player shows how close they are.</li><li><b>Last one standing</b> (a Classic option): play until one landowner is left. So a game can't run forever, it ends after round ${E.C.ROUND_CAP} (you're warned at round ${E.C.ROUND_WARN}) and then the highest net worth wins.</li><li>Can't pay? You're bankrupt and your islands go to whoever you owe.</li></ul>
<p style="font-size:12px;color:var(--muted)">All cards and events are fictional and just for fun.</p></div>`;

/* Classic win target (net worth); 0 = Last one standing */
const GOALS=[3000,5000,7000,10000,0],GOAL_DEFAULT=7000;/* ~40 rounds with 4 players: about 30-40 minutes with a human */
let TARGET=(()=>{const v=ls.get('bv-goal');return v!=null&&GOALS.includes(+v)?+v:GOAL_DEFAULT;})();
function botRoster(n){const pre=BOTS.slice(0,5).sort(()=>Math.random()-.5),rest=BOTS.slice(5).sort(()=>Math.random()-.5);return pre.slice(0,3).concat(rest).slice(0,n);}
let ROSTER=botRoster(4);
function openSetup(){const nm=myName();if(!TOKENS[SETUP.tok])SETUP.tok='dhoni';
 const html=`<div class="grab" aria-hidden="true"></div><div class="shead"><h2 id="sheetTitle">New game</h2>${X}</div>
 <div class="field"><label for="nmIn">Your name</label><input id="nmIn" maxlength="14" autocomplete="nickname" value="${esc(nm)}" placeholder="You"></div>
 <h3>Players</h3><div class="seg" role="radiogroup" aria-label="Number of players">${[2,3,4,5].map(n=>`<button role="radio" aria-checked="${SETUP.n===n}" data-s="n" data-v="${n}">${n}</button>`).join('')}</div>
 <div class="bots">${ROSTER.slice(0,SETUP.n-1).map((b,k)=>{const cfg=b[1]&&window.DGAvatar?DGAvatar.presets[b[1]]:window.DGAvatar?DGAvatar.random(b[0]+'bv'):null;return `<span style="--c:${PCOL[k+1]}"><span class="pf">${cfg?DGAvatar.render(cfg,{size:44}):''}</span>${esc(b[0])}</span>`;}).join('')}<span style="justify-content:center"><button class="mb" data-s="shuffle" aria-label="Shuffle opponents" style="margin-top:0">Shuffle</button></span></div>
 <h3>Your token</h3><div class="seg tk" role="radiogroup" aria-label="Your token">${TOKEN_KEYS.map(k=>`<button role="radio" aria-checked="${SETUP.tok===k}" data-s="tok" data-v="${k}" aria-label="${TOKENS[k].n}" title="${TOKENS[k].n}">${TOKENS[k].s}</button>`).join('')}</div>
 <h3>Game length</h3><div class="seg" role="radiogroup">${[['quick','Quick · 30 min'],['classic','Classic']].map(([k,l])=>`<button role="radio" aria-checked="${MODE===k}" data-s="mode" data-v="${k}">${l}</button>`).join('')}</div>
 ${MODE==='classic'?`<h3>Win target</h3><div class="seg goalseg" role="radiogroup" aria-label="Win target">${GOALS.map(v=>`<button role="radio" aria-checked="${TARGET===v}" data-s="goal" data-v="${v}"${v?` aria-label="${fmt(v)}"`:''}>${v?v.toLocaleString('en-US'):'Last one standing'}</button>`).join('')}</div>`:''}
 <p style="font-size:12px;color:var(--muted)">${MODE==='quick'?'After 30 minutes the richest net worth wins.':TARGET?`The first to reach ${fmt(TARGET)} net worth (cash + islands + buildings) wins.`:`Play until only one landowner is left. After round ${E.C.ROUND_CAP} the richest wins.`}</p>
 <div class="acts one"><button class="btn" data-s="start" data-focus>${ICON.dice}Start game</button></div>`;
 openSheet('setup',html);}
$('#sheet').addEventListener('click',e=>{const b=e.target.closest('[data-s]');if(!b)return;const s=b.dataset.s,nmv=($('#nmIn')||{}).value;if(nmv!=null)ls.set('bv-name',nmv.trim().slice(0,14));
 if(s==='n'){SETUP.n=+b.dataset.v;openSetup();}else if(s==='tok'){SETUP.tok=b.dataset.v;ls.set('bv-tok',SETUP.tok);openSetup();}else if(s==='mode'){MODE=b.dataset.v;ls.set('bv-mode',MODE);showHome();openSetup();}
 else if(s==='goal'){TARGET=+b.dataset.v;ls.set('bv-goal',String(TARGET));openSetup();}
 else if(s==='shuffle'){ROSTER=botRoster(4);openSetup();}else if(s==='start')newGame();});
function newGame(opts={}){const n=opts.n||SETUP.n,mode=opts.mode||MODE;const toks=TOKEN_KEYS.filter(k=>k!==SETUP.tok).sort(()=>Math.random()-.5);
 const players=[{name:myName()||'You',human:true,av:myAvatar(),tok:SETUP.tok,col:PCOL[0]}];
 ROSTER.slice(0,n-1).forEach((b,k)=>players.push({name:b[0],human:false,av:window.DGAvatar?(b[1]?DGAvatar.presets[b[1]]:DGAvatar.random(b[0]+'bv')):null,tok:toks[k],col:PCOL[k+1]}));
 closeSheet();AI.reset();OVERSHOWN=null;REWARD=null;const g=E.create({mode,players,minutes:opts.minutes,target:opts.target!=null?opts.target:TARGET});startWith(g,0);}
function startWith(g,me){G=g;ME=me;WATCH=false;ACTKEY='';aiSeq=-1;DRAW.busy=false;closeDraw(true);for(const k in MIN)delete MIN[k];SCREEN='game';$('#home').hidden=true;$('#game').hidden=false;
 G.players.forEach((p,i)=>{VIEW.pos[i]=p.pos;VIEW.cash[i]=p.cash;});buildPlayers();buildBoard();setDice(G.dice[0]?G.dice:[3,4]);
 const last=G.log[G.log.length-1];if(last)ticker(last.s);E.drain();render();lastT=performance.now();
 if(document.fonts&&document.fonts.ready)document.fonts.ready.then(()=>{if(BV)FIT(BV);});pump(true);if(ONLINE&&NET)NET.updDock();}

/* ---------------------------------------------------------------- online (shared/net.js)
   The host runs the engine, the computer players and the clock, and sends everyone the state plus the
   numbered event log (guests replay the dice, moves and cards they have not seen yet). Every human
   decision has 20 seconds; then the computer moves for them. Two timeouts in a row, leaving or losing
   connection: the computer plays one more full round for that seat, then it leaves the table
   (buildings removed, loans cleared, islands auctioned, cash to the bank, prison card back).
   The first two successors get a full backup, so a new host carries on exactly where the game was. */
const DECIDE_MS=20000,GRACE=800,DECIDE=['turn','post','buy','rent','debt','draw','card','sandbank','court'];
let DL=null,GDL=null,SALEDL=null,LASTLID=0,SYNCSIG='',SYNCAT=0,GUESTKEY='';
const MYID=window.DGNet?DGNet.pid('dd-pid'):'me';
const myId=()=>MYID;
function netName(){return (window.DGNet&&DGNet.testName())||myName()||(ls.get('lg-name')||'').trim().slice(0,14);}
function lookOf(l){const o={av:null,tok:''};if(!l||typeof l!=='object')return o;try{if(window.DGAvatar&&l.av)o.av=DGAvatar.normalize(l.av);}catch(e){}if(typeof l.tok==='string'&&TOKENS[l.tok])o.tok=l.tok;return o;}
function touch(i){if(DL&&DL.p===i)DL=null;}
function hostTimers(){const pe=G.pend,now=Date.now();
 if(pe&&pe.p!=null&&DECIDE.includes(pe.t)&&G.players[pe.p]&&G.players[pe.p].human&&!G.players[pe.p].out){
  const k=[pe.t,pe.p,pe.sp,pe.id,pe.again?1:0,G.tn,G.round].join(':');
  if(!DL||DL.k!==k){DL={k,at:now+DECIDE_MS,p:pe.p};NET.sync();}
  else if(!PUMPING&&now>=DL.at+(G.players[pe.p].id===MYID?0:GRACE)){DL=null;decideFor(pe);}}
 else if(DL){DL=null;NET.sync();}
 /* a seller who never picks a buyer keeps the island */
 const s=G.sale;if(s&&s.st==='pick'&&G.players[s.seller]&&G.players[s.seller].human){if(!SALEDL||SALEDL.id!==s.id)SALEDL={id:s.id,at:now+DECIDE_MS};else if(now>=SALEDL.at+GRACE){SALEDL=null;E.act(s.seller,{t:'scancel'});pump(true);}}
 const sig=E.lid+':'+G.seq;if(sig!==SYNCSIG||now-SYNCAT>2500){SYNCSIG=sig;SYNCAT=now;NET.sync();}}
/* time is up: the computer decides for that player (buy or raise money sensibly, otherwise the safe default) */
function decideFor(pe){const i=pe.p,pl=G.players[i],s0=G.seq;if(!pl)return;
 if(pe.t==='buy'||pe.t==='debt')AI.step(i);
 if(G.pend===pe&&G.seq===s0){const fb=FALLBACK(pe);if(fb)E.act(i,fb);}
 if(i===ME)toast('Time is up: the computer moved for you');
 pump(true);NET.sync();
 if(NET.strike(pl.id))seatLeaves(i,'afk');}
function seatLeaves(i,why){if(!G||G.over||!G.players[i]||G.players[i].out)return;E.markLeaving(i);pump(true);NET.sync();
 if(i===ME&&netHost())setTimeout(()=>{if(netHost())NET.retire();},2500);}
function netAction(pid,a){if(!G||G.over&&a&&a.t!=='mute'||!a||typeof a!=='object'||typeof a.t!=='string')return;const i=G.players.findIndex(p=>p.id===pid);if(i<0)return;
 const pl=G.players[i];if(pl.leaving||pl.out&&a.t!=='mute')return;
 const e=E.act(i,a);if(e)NET.tell(pid,{err:String(e)});else touch(i);pump(true);NET.sync();}
function netView(){if(!G)return null;const g=JSON.parse(JSON.stringify(G));g.decks={c:g.decks.c.map(()=>-1),n:g.decks.n.map(()=>-1)};g.log=g.log.slice(-40);
 return{g,ev:E.evlog().slice(-60),lid:E.lid,dl:DL?{at:DL.at,p:DL.p}:null};}
function netBackup(){return G?{g:JSON.parse(JSON.stringify(G)),lid:E.lid}:null;}
function netStart(seats,opts){ONLINE=true;const used=new Set();
 const players=seats.map((s,k)=>{const l=s.id===MYID?{av:myAvatar(),tok:SETUP.tok}:lookOf(s.look);const tok=TOKENS[l.tok]&&!used.has(l.tok)?l.tok:TOKEN_KEYS.find(t=>!used.has(t));used.add(tok);
  return{id:s.id,name:s.name,human:true,av:l.av,tok,col:PCOL[k%PCOL.length]};});
 const mode=opts.mode==='classic'?'classic':'quick';closeSheet(false);AI.reset();OVERSHOWN=null;REWARD=null;DL=null;
 const g=E.create({mode,players,minutes:30,target:mode==='classic'?Math.max(0,+opts.target||0):0});
 startWith(g,Math.max(0,players.findIndex(p=>p.id===MYID)));NET.sync();}
function netState(v){if(!v||!v.g||!Array.isArray(v.g.players))return;ONLINE=true;const g=v.g,me=g.players.findIndex(p=>p.id===MYID);GDL=v.dl?{at:v.dl.at,p:v.dl.p}:null;
 if(!G||SCREEN!=='game'||G.id!==g.id){closeSheet(false);E.load(g);AI.reset();OVERSHOWN=null;REWARD=null;LASTLID=v.lid|0;startWith(g,me);return;}
 E.swap(g);G=g;if(ME!==me){ME=me;buildPlayers();}
 const evs=(v.ev||[]).filter(x=>x[0]>LASTLID);if(evs.length&&evs[0][0]===LASTLID+1)E.feed(evs.map(x=>x[1]));   /* a gap: skip the animations */
 LASTLID=Math.max(LASTLID,v.lid|0);ACTKEY='';pump(true);}
function netMigrate(o){ONLINE=true;const b=o.backup&&o.backup.g?o.backup:null,v=o.view,src=b?b.g:v&&v.g;if(!src){NET.again();return;}
 const g=E.load(JSON.parse(JSON.stringify(src)));if(!b)E.fixDecks();E.seedLid(Math.max(b?b.lid|0:0,v?v.lid|0:0,LASTLID)+1);
 G=g;ME=g.players.findIndex(p=>p.id===MYID);DL=null;AI.reset();if(SCREEN!=='game')startWith(g,ME);else{ACTKEY='';buildPlayers();render();}
 pump(true);NET.sync();}
function netDrop(pid,why){if(!netHost()||!G)return;const i=G.players.findIndex(p=>p.id===pid);if(i>=0)seatLeaves(i,why);}
/* test pilot (localhost ?auto): a guest answers its own decisions with the simple defaults */
function guestAuto(pe){if(!AUTO||ME<0||!pe||pe.p!==ME||!DECIDE.includes(pe.t))return;const k=[pe.t,pe.id,pe.sp,G.tn,G.seq,pe.again?1:0].join(':');if(GUESTKEY===k)return;GUESTKEY=k;
 const a=pe.t==='buy'?(meP().cash>=SP[pe.sp].price+60?{t:'buy'}:{t:'decline'}):pe.t==='debt'?{t:'bankrupt'}:FALLBACK(pe);
 setTimeout(()=>{if(G&&G.pend&&G.pend.t===pe.t&&G.pend.p===ME)NET.send(a);},350);}
/* the seconds left for whoever is deciding, next to the status */
function decisionClock(){const c=$('#statusChip');if(!c||!G)return;const d=netHost()?DL:GDL;let t='';
 if(d&&G.pend&&G.pend.p===d.p&&!G.over){const left=Math.ceil((d.at-(netHost()?Date.now():NET.hostNow()))/1000);if(left>=0&&left<=DECIDE_MS/1000)t=' · '+left+'s';c.classList.toggle('hot',left<=5&&d.p===ME);}
 else c.classList.remove('hot');if(c.dataset.t!==t)c.dataset.t=t;}
function netLobby(){ONLINE=true;DL=null;closeSheet(false);closeDraw(true);clearBanner();G=null;showHome();}
function netEnd(){ONLINE=false;DL=null;GDL=null;closeSheet(false);closeDraw(true);clearBanner();G=null;ME=0;showHome();}
function initNet(){if(!window.DGNet)return;NET=DGNet.create({game:'binveriya',title:'Binveriya',min:2,max:5,id:MYID,
 me:()=>({name:netName(),look:{av:myAvatar(),tok:SETUP.tok}}),setName:v=>{ls.set('bv-name',v);},
 avatar:seat=>{const l=lookOf(seat.look);try{if(window.DGAvatar&&l.av)return DGAvatar.render(l.av,{size:38});}catch(e){}return '';},
 options:[{k:'mode',label:'Game length',def:'quick',choices:[['quick','Quick · 30 min'],['classic','Classic']]},
  {k:'target',label:'Win target',def:7000,choices:[[3000,'3,000'],[5000,'5,000'],[7000,'7,000'],[10000,'10,000'],[0,'Last one standing']],when:o=>o.mode==='classic',
   hint:o=>+o.target?`The first to reach MVR ${(+o.target).toLocaleString('en-US')} net worth at the end of a turn wins.`:'Play until one landowner is left (the richest wins after round 120).'}],
 rulesNote:'2 to 5 players. 20 seconds per decision, then the computer moves for you. Miss 2 in a row, or leave, and the computer plays one more round for you; then your buildings are removed, loans cleared and your islands are auctioned.',
 listInfo:m=>{if(m.status!=='lobby'&&G)return 'Round '+G.round+(G.limit?' · quick game':G.target?' · goal '+G.target.toLocaleString('en-US'):' · last one standing');return (m.opts&&m.opts.mode)==='classic'?'Classic':'Quick game · 30 min';},
 dropText:(nm,why)=>nm+(why==='afk'?' is away':why==='left'?' left':' lost connection')+'. The computer plays one more round for them.',
 afkText:'You missed 2 decisions in a row, so the computer took your seat for one more round. You can’t rejoin this game.',
 hostAfkText:'You missed 2 decisions in a row, so the computer is playing your seat for one more round.',
 onStart:netStart,view:()=>netView(),backup:netBackup,onAction:netAction,onDrop:netDrop,onState:netState,onLobby:netLobby,onMigrate:netMigrate,onEnd:netEnd,
 onTell:d=>{if(d&&d.err){toast(String(d.err));SND.err();}},
 toast:(t,ms)=>toast(t,ms||2600),
 dockHost:()=>SCREEN==='game'?$('#dgnSlot'):null,
 avatarEl:pid=>{if(!G||SCREEN!=='game')return null;const i=G.players.findIndex(p=>p.id===pid);const el=$$('#pls .pl')[i];return el?el.querySelector('.pf'):null;}});}
$('#onlineBtn').addEventListener('click',()=>{SND.unlock();if(NET)NET.open();else toast('Online play needs a newer browser');});

/* ---------------------------------------------------------------- boot + test hooks */
showHome();if(document.fonts&&document.fonts.ready)document.fonts.ready.then(homeFit);
initNet();if(NET)NET.boot();   /* invite links: ?t=CODE */
if(LOCAL&&Q.has('autostart')){SETUP.n=+(Q.get('n')||4);newGame({n:SETUP.n,mode:Q.get('mode')||MODE,minutes:Q.has('min')?+Q.get('min'):undefined,target:Q.has('goal')?+Q.get('goal'):undefined});}
window.BINVERIYA={E,AI,get G(){return G;},get ME(){return ME;},get ONLINE(){return ONLINE;},get NET(){return NET;},act:a=>doAct(a),pump,newGame,LAYOUTS,
 /* all-computer test games; target = Classic win target (0 = Last one standing) */
 sim(games=20,n=4,mode='classic',maxTurns=4000,target=0){const out=[];const save=[G,ME];for(let g=0;g<games;g++){AI.reset();const players=[...Array(n)].map((_,k)=>({name:'Bot'+k,human:false,av:null,tok:TOKEN_KEYS[k],col:PCOL[k]}));
   const gg=E.create({mode,players,minutes:mode==='quick'?30:0,target});let steps=0;const cnt={bribeOk:0,caughtBribe:0,busted:0,raid:0,report:0,seize:0,card:0,kept:0,rent:0,auction:0};
   while(!gg.over&&steps++<maxTurns*6){const pe=gg.pend;E.tick(400);AI.tick(()=>true);if(gg.over)break;const p2=gg.pend;
    if(p2&&p2.t!=='auction'&&p2.p!=null){const s0=gg.seq;AI.step(p2.p);if(gg.pend===p2&&gg.seq===s0){const fb=FALLBACK(p2);if(fb)E.act(p2.p,fb);}}
    E.drain().forEach(e=>{if(e.t==='audit')cnt[e.caught?'caughtBribe':'bribeOk']++;else if(e.t in cnt)cnt[e.t]++;if(e.t==='carddone'&&e.keep)cnt.kept++;});}
   out.push({over:!!gg.over,reason:gg.over&&gg.over.reason,rounds:gg.round,winner:gg.over&&gg.over.winner,alive:E.alive().length,bribes:gg.players.reduce((a,p)=>a+p.bribes,0),caught:gg.players.reduce((a,p)=>a+p.caught,0),trades:gg.offers.filter(o=>o.st==='done').length,offers:gg.offers.length,log:gg.log.length,ev:cnt,stuck:!gg.over?JSON.stringify(gg.pend):undefined});}
  if(save[0])E.load(save[0]);return out;}};
</script>
