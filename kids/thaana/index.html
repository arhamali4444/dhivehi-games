<!doctype html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#E8F6F4">
<title>Taatal's Fun · Dhivehi Games</title>
<link rel="preload" as="font" type="font/woff2" href="../../quiz/fonts/dhivehi-muraka.woff2" crossorigin>
<style>
@font-face{font-family:'Dhivehi Muraka';src:url(../../quiz/fonts/dhivehi-muraka.woff2) format('woff2');font-display:swap}
:root{--ink:#163A3A;--muted:#4E6B69;--sea:#14958F;--coral:#E04A66;--sun:#FFC24B;--bg:#E8F6F4;--card:#fff;
 --dv:'Dhivehi Muraka',sans-serif;--ui:-apple-system,'Segoe UI',Roboto,sans-serif}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:600 18px/1.35 var(--ui);overflow:hidden;
 overscroll-behavior:none;-webkit-user-select:none;user-select:none;touch-action:manipulation}
body{background:radial-gradient(80% 45% at 10% 0%,rgba(255,206,160,.7),transparent 70%),radial-gradient(70% 40% at 100% 25%,rgba(150,225,235,.65),transparent 70%),var(--bg)}
[dir=rtl]{font-family:var(--dv);font-weight:400}
.screen{position:fixed;inset:0;padding:max(12px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) max(12px,env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left));display:none;flex-direction:column}
.screen.on{display:flex}
.bar{display:flex;justify-content:space-between;align-items:center;gap:10px;min-height:64px}
.btn{min-height:64px;min-width:64px;border:0;border-radius:20px;background:var(--card);color:var(--ink);font:800 20px var(--ui);padding:0 20px;box-shadow:0 6px 0 #CFE6E3;display:inline-grid;place-items:center;text-decoration:none}
a.btn{font-size:34px}
.btn.go{background:linear-gradient(180deg,#2FC2B9,#14958F);color:#fff;box-shadow:0 6px 0 #0E7570}
.pill{background:rgba(255,255,255,.9);border-radius:99px;padding:10px 16px;font-weight:800}
/* map */
#map .sea{position:relative;flex:1;border-radius:28px;background:linear-gradient(180deg,#7FD8E0,#2FAFBC 60%,#1F96A8);overflow:hidden}
#map .isl{position:absolute;left:var(--x);top:var(--y);width:clamp(96px,24vmin,120px);aspect-ratio:3/2;border:0;border-radius:50%;background:radial-gradient(60% 55% at 50% 40%,#FFF1CF,#F3D79E 70%,#E8C27E);box-shadow:0 0 0 8px rgba(190,245,240,.55),0 10px 16px -6px rgba(0,60,70,.5);transform:translate(-50%,-50%)}
#map .isl b{position:absolute;left:50%;top:-34%;transform:translateX(-50%);width:58%;aspect-ratio:1;border-radius:50%;background:#fff;display:grid;place-items:center;font:400 clamp(54px,14vmin,72px)/1 var(--dv);color:var(--ink);box-shadow:0 6px 12px -6px rgba(0,0,0,.4)}
#map .isl b span{transform:translateY(-.14em)}   /* Muraka letters sit low in their line */
#map .isl b span.st{font:400 .6em/1 var(--ui);transform:none}
#map .isl[data-locked] b{background:#DDEBEA;color:#9DB3B1}
#map #isles{position:absolute;inset:0}
/* Miss Taatal on the map: stands by the island to play next (game.js moves her; she never takes a tap) */
#map .mapt{position:absolute;left:0;top:0;width:clamp(84px,21vmin,130px);height:clamp(84px,21vmin,130px);pointer-events:none;will-change:transform;z-index:2}
#map .mapt .tt{width:100%;height:100%}
#map .isl em{position:absolute;left:50%;bottom:-30%;transform:translateX(-50%);font-style:normal;color:var(--sun);font-size:18px;white-space:nowrap;text-shadow:0 1px 2px rgba(0,0,0,.4)}
/* play */
#play .stage{flex:1;display:grid;grid-template-rows:auto 1fr auto;gap:12px;min-height:0}
.prog{display:flex;gap:6px}.prog i{flex:1;height:10px;border-radius:9px;background:#D2E9E6}.prog i.d{background:var(--sun)}
.card{background:var(--card);border-radius:28px;display:grid;place-items:center;position:relative;min-height:0;overflow:hidden;box-shadow:0 14px 30px -18px rgba(0,60,60,.5)}
/* a letter: game.js sets its size and spot from the glyph's ink box (Muraka glyphs look ~1/3 of their font-size) */
.glyph{position:absolute;left:0;top:0;font:400 100px/1.22 var(--dv);white-space:nowrap;pointer-events:none}
.big{color:var(--sea)}
.ghost{color:#DDEEEC;-webkit-text-stroke:3px #93CBC6}
.ghost.hint{animation:hint 1.1s ease-in-out 3}   /* "You got this!" on a trace: the letter to follow darkens a few times */
@keyframes hint{50%{color:#A8DCD6;-webkit-text-stroke-color:#14958F}}
.say{width:clamp(130px,44vmin,240px);height:clamp(130px,44vmin,240px);border-radius:50%;padding:0;font-size:clamp(56px,19vmin,104px);background:#FFF4D6;box-shadow:0 8px 0 #F2D58C}
.name{font:800 24px var(--ui);text-align:center}
.opts{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.opts.four{grid-template-columns:repeat(2,1fr)}
.opt{position:relative;height:clamp(72px,13vmin,110px);border:0;border-radius:22px;background:var(--card);font:400 clamp(54px,10vmin,80px)/1 var(--dv);color:var(--ink);box-shadow:0 7px 0 #D5E9E7}
.opt.ok{background:#E3F8EE;box-shadow:0 7px 0 #9FDDBE;outline:4px solid #3CC88A}
.opt.glow{outline:4px dashed var(--sun);background:#FFF9E8}
.opt.wobble{animation:wob .45s}
@keyframes wob{25%{transform:rotate(-5deg)}75%{transform:rotate(5deg)}}
.host{position:relative;height:clamp(130px,24vmin,200px);pointer-events:none;text-align:left}   /* text-align: Taatal's head layer is placed from the left */
.host .tt{position:absolute;left:0;bottom:0;width:clamp(130px,24vmin,200px);height:100%}
.bub{position:absolute;left:clamp(130px,24vmin,200px);right:0;bottom:30%;background:#fff;border-radius:20px;padding:12px 16px;font:800 20px/1.3 var(--ui);box-shadow:0 10px 22px -12px rgba(0,60,60,.45);min-height:56px}
.bub:empty{display:none}
/* Taatal's magic (sparkles, stars, confetti, balloons) flies over her and the bubble but never over the letters or buttons */
#play .card,#answers,#done .stars,#done .name,#done .btn{position:relative;z-index:5}
#done .bub{z-index:5}
#play .host{z-index:6}   /* her cheer hop goes over the tiles, not behind them */
canvas.trace{position:absolute;inset:0;width:100%;height:100%;touch-action:none}
/* done */
#done{align-items:center;justify-content:center;text-align:center;gap:14px}
#done .stars{font-size:64px;color:var(--sun);letter-spacing:8px}
#done .host{width:min(420px,90vw)}
@media (orientation:landscape) and (max-height:500px){
 #map .isl{left:var(--wx);top:var(--wy)}
 /* landscape phone: letter card on the left; answers top-right, Taatal under them (never over the card) */
 #play .stage{grid-template-columns:1fr 1.2fr;grid-template-rows:auto 1fr;column-gap:16px}
 #play .opts{gap:10px}
 #play .card{grid-row:2;grid-column:1}
 #answers{grid-column:2;grid-row:1/3;align-self:start}
 #play .host{position:fixed;left:calc(45% + 8px);right:max(16px,env(safe-area-inset-right));bottom:max(6px,env(safe-area-inset-bottom));height:clamp(96px,30vh,120px)}
 #play .host .tt{width:clamp(96px,30vh,120px)}
 #play .bub{left:clamp(96px,30vh,120px);bottom:18%;font-size:18px;padding:10px 14px}
}
@media (min-width:700px) and (min-height:700px){
 #play .stage,#play .host{max-width:760px;margin:0 auto;width:100%}
 /* iPad: the done screen grows with the screen instead of sitting tiny in the middle */
 #done{gap:22px}
 #done .stars{font-size:112px}
 #done .name{font-size:40px}
 #done .host{width:min(600px,90vw);height:240px}
 #done .host .tt{width:240px}
 #done .bub{left:240px;font-size:28px;padding:16px 22px}
 #done .btn{font-size:28px;min-height:84px;padding:0 40px;border-radius:26px}
}
@media (prefers-reduced-motion:reduce){.opt.wobble{animation:none}}
</style>
</head><body>
<section id="map" class="screen on" aria-label="Island map">
  <div class="bar"><a class="btn" href="../../" aria-label="Back to Dhivehi Games">‹</a><span class="pill" id="starTotal">⭐ 0</span><button class="btn" id="mute" aria-label="Sound on or off">🔊</button></div>
  <div class="sea" id="sea"><div id="isles"></div><div class="mapt" id="mapt"><div class="tt" id="tt0"></div></div></div>
</section>
<section id="play" class="screen" aria-label="Island">
  <div class="stage">
    <div><div class="bar"><button class="btn" id="quit" aria-label="Back to the map">✕</button><span class="pill" id="playStars"></span></div><div class="prog" id="prog"></div></div>
    <div class="card" id="card"></div>
    <div id="answers"></div>
  </div>
  <div class="host"><div class="tt" id="tt"></div><div class="bub" id="bub" aria-live="polite"></div></div>
</section>
<section id="done" class="screen" aria-label="Island done">
  <div class="stars" id="doneStars"></div><div class="name">Yippee!</div>
  <div class="host"><div class="tt" id="tt2"></div><div class="bub" id="bub2"></div></div>
  <button class="btn go" id="next">Next island ›</button>
</section>
<script type="module" src="game.js"></script>
</body></html>
