async function create(btn){const name=nameVal(()=>{renderFriends();const b=document.querySelector('[data-a="create"]');if(b)create(b);});if(!name)return;if(!db){netCreate(btn,name,{pub:friendPub});return;}btn.disabled=true;mode='online';
try{let code,r;for(let i=0;i<5;i++){code=genCode();r=db.doc('tables/'+code);const s=await r.get();if(!s.exists||s.data().status==='over')break;}
const d={v:1,rev:1,by:myId,status:'lobby',code:code,hostId:myId,players:[{id:myId,name:name,piece:'manta',score:0}]};
await r.set(d);ref=r;ls.set('lg-room',code);S=null;listen();apply(d);
}catch(e){toast(errMsg(e));btn.disabled=false;}}

if(!/^[A-Z]{4}$/.test(code)){toast('Table codes are 4 letters.');return;}
if(document.activeElement&&document.activeElement.blur)document.activeElement.blur();
if(!db){netJoin(btn,name,code);return;}mode='online';btn.disabled=true;
try{const r=db.doc('tables/'+code);let s=await r.get();
if(!s.exists){toast('No table found with code '+code+'.');btn.disabled=false;return;}
let d=clone(s.data());
if(!d.players.some(q=>q.id===myId)&&d.status==='lobby'){
for(let i=0;i<6;i++){const l=await r.acquire({holder:myId,ttlMs:4000});if(l.acquired)break;await sleep(400+Math.random()*400);}
s=await r.get();d=clone(s.data());
if(d.status==='lobby'&&!d.players.some(q=>q.id===myId)){
if(d.players.length>=6){toast('That table is full.');btn.disabled=false;return;}
d.players.push({id:myId,name:name,piece:PK.find(id=>!d.players.some(q=>q.piece===id))||PK[0],score:0});d.rev=(d.rev||0)+1;d.by=myId;await r.set(d);}
}else if(!d.players.some(q=>q.id===myId))toast('That game already started. You can watch.');
ref=r;ls.set('lg-room',code);S=null;listen();apply(d);
}catch(e){toast(errMsg(e));btn.disabled=false;}}

case 'chatSend':sendChat(($('#chatin')||{}).value);break;
case 'chatQuick':sendChat(b.dataset.m);break;
case 'chatToggle':ls.set('dd-chat',chatOff()?'1':'0');if(chatOff())closeChat();if(S){renderTable();openMenu();}break;
case 'emote':sendEmote(b.dataset.e);break;
case 'opp':openPlayer(+b.dataset.k);break;
case 'blockp':{const id=b.dataset.id;const k=S?S.players.findIndex(q=>q.id===id):-1;const p=k>=0?S.players[k]:null;if(isBlocked(id)){BLK.splice(BLK.findIndex(x=>x.id===id),1);mutedP.delete(id);toast('Player unblocked.');}else{BLK.push({id:id,name:p?p.name:'Player',t:Date.now()});mutedP.add(id);toast('Blocked. You won’t see their chat or reactions.');}saveBlk();if(k>=0)openPlayer(k);else if(screen==='profile')openBlocked();break;}
case 'reportp':openReport(b.dataset.id);break;
case 'sendReport':sendReport(b.dataset.id);break;
case 'blocked':openBlocked();break;
case 'unblock':{const id=b.dataset.id;const j=BLK.findIndex(x=>x.id===id);if(j>=0){BLK.splice(j,1);mutedP.delete(id);saveBlk();}openBlocked();break;}
case 'support':openSupport();break;
case 'sendSupport':sendSupport();break;
case 'privacy':window.open(PRIVACY_URL,'_blank','noopener');break;
case 'delAcct':openDeleteAccount();break;
case 'delAcctGo':deleteAccount();break;
case 'mutep':{const id=b.dataset.id;if(mutedP.has(id))mutedP.delete(id);else mutedP.add(id);const k=S?S.players.findIndex(q=>q.id===id):-1;if(k>=0)openPlayer(k);break;}
case 'emute':ls.set('dd-emute',emotesMuted()?'0':'1');if(S)openMenu();break;
case 'music':{AU.unlock();const v=Music.set(!Music.on);ls.set('dd-music',v?'1':'0');if($('#sheet').classList.contains('open')&&S)openMenu();break;}
case 'sfx':{const v=ls.get('dd-sfx')==='0';ls.set('dd-sfx',v?'1':'0');if(v){AU.unlock();SFX.tick();}if(S)openMenu();break;}
case 'create':create(b);break;
case 'bots':soloBots=+b.dataset.n;document.querySelectorAll('[data-a="bots"]').forEach(x=>{const on=+x.dataset.n===soloBots;x.classList.toggle('primary',on);x.classList.toggle('soft',!on);x.setAttribute('aria-pressed',on);});break;
case 'rounds':{const n=+b.dataset.n;if(!ROUND_OPTS.includes(n))break;if(screen==='computer'){soloRounds=n;ls.set('dd-rounds',String(n));renderComputer();}else if(S&&S.status==='lobby'&&S.hostId===myId){const d=clone(S);d.rounds=n;d.rev=(S.rev||0)+1;d.by=myId;commit(d);}break;}
case 'mic':vcMic();break;
case 'solo':startSolo();break;
case 'resumeSolo':try{const d=JSON.parse(ls.get('lg-solo'));mode='solo';ref=null;S=null;apply(d);scheduleBot();}catch(err){ls.del('lg-solo');renderHome();}break;
case 'join':join(b);break;
case 'pick':openPicker();break;
case 'setPiece':setPiece(b.dataset.p);break;
case 'start':b.disabled=true;startGame();break;
case 'leave':leave();break;
case 'menu':openMenu();break;
case 'close':closeSheet();break;
case 'arrange':order=arranged(myHand());selected=null;layoutHand();renderActs();buzz(6);break;
case 'gin':buzz([15,40,25]);act('gin');break;
case 'discardSel':if(selected)act('discard',selected);break;
case 'skip':closeSheet();act('skip');break;
case 'next':case 'again':closeOv();act(a);break;
case 'drawDiscard':if(canDiscard()&&selected&&myHand().includes(selected)){act('discard',selected);break;}act(a);break;
case 'drawStock':act(a);break;
}});
applyCosmetics();renderHome();
initFirebase();
setTimeout(runPending,300);
/* warm up online play in the background so Create/Join feel instant */
const idle=window.requestIdleCallback||(fn=>setTimeout(fn,1200));
idle(()=>warmUp(),{timeout:2500});
(async()=>{try{if(window.claude&&typeof window.claude.use==='function')db=await window.claude.use('db');}catch(e){db=null;}if(db&&screen==='home'){const a=document.activeElement&&document.activeElement.id;if(!a)renderHome();}})();
})();
</script>
