case 'setPub':{friendPub=b.dataset.v==='1';document.querySelectorAll('[data-a="setPub"]').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));const h=$('#seghint');if(h)h.textContent=friendPub?'Anyone can see and join from Open tables.':'Only people with your invite link or code can join.';break;}
case 'joinOpen':case 'joinLive':join(b,b.dataset.code);break;
case 'watchLive':{const nm=nameVal(()=>renderFriends());if(nm)netJoin(b,nm,b.dataset.code,{spec:true});break;}
case 'share':shareInvite();break;
case 'copyCode':if(S&&S.code)copyText(S.code,'Code copied');break;
case 'lobbyPub':setLobbyPub(b.dataset.v==='1');break;
case 'kick':kickPlayer(b.dataset.id);break;
case 'emotes':toggleEmotes();break;
case 'chat':{const cb=$('#chatbar');if(cb&&!cb.hidden)closeChat();else openChat();break;}
case 'chatSend':sendChat(($('#chatin')||{}).value);break;
case 'chatQuick':sendChat(b.dataset.m);break;
case 'chatToggle':ls.set('dd-chat',chatOff()?'1':'0');if(chatOff())closeChat();if(S){renderTable();openMenu();}break;
case 'emote':sendEmote(b.dataset.e);break;
case 'opp':openPlayer(+b.dataset.k);break;
case 'blockp':{const id=b.dataset.id;const k=S?S.players.findIndex(q=>q.id===id):-1;const p=k>=0?S.players[k]:null;if(isBlocked(id)){BLK.splice(BLK.findIndex(x=>x.id===id),1);mutedP.delete(id);toast('Player unblocked.');}else{BLK.push({id:id,name:p?p.name:'Player',t:Date.now()});mutedP.add(id);toast('Blocked. You won’t see their chat or reactions, or hear their voice.');}saveBlk();if(k>=0)openPlayer(k);else if(screen==='profile')openBlocked();break;}
case 'reportp':openReport(b.dataset.id);break;
case 'sendReport':sendReport(b.dataset.id);break;
case 'blocked':openBlocked();break;
case 'unblock':{const id=b.dataset.id;const j=BLK.findIndex(x=>x.id===id);if(j>=0){BLK.splice(j,1);mutedP.delete(id);saveBlk();}openBlocked();break;}
case 'support':openSupport();break;
case 'sendSupport':sendSupport();break;
case 'privacy':window.open(PRIVACY_URL,'_blank','noopener');break;
case 'delAcct':openDeleteAccount();break;
case 'delAcctGo':deleteAccount();break;
case 'mutep':{const id=b.dataset.id;if(mutedP.has(id))mutedP.delete(id);else mutedP.add(id);const k=S?S.players.findIndex(q=>q.id===id):-1;if(k>=0)openPlayer(k);break;}
case 'emute':ls.set('dd-emute',emotesMuted()?'0':'1');if(S)openMenu();break;
case 'music':{AU.unlock();const want=ls.get('dd-music')==='0';ls.set('dd-music',want?'1':'0');const v=screen==='table'?Music.set(want):want;document.querySelectorAll('[data-a="music"]').forEach(x=>x.setAttribute('aria-pressed',String(v)));if($('#sheet').classList.contains('open')&&S)openMenu();break;}
case 'sfx':{const v=ls.get('dd-sfx')==='0';ls.set('dd-sfx',v?'1':'0');if(v){AU.unlock();SFX.tick();}if(S)openMenu();break;}
case 'create':create(b);break;
case 'bots':soloBots=+b.dataset.n;document.querySelectorAll('[data-a="bots"]').forEach(x=>x.setAttribute('aria-pressed',String(+x.dataset.n===soloBots)));{const bh=$('#blitzhint');if(bh)bh.innerHTML=blitzHint();}break;
case 'rounds':{const n=+b.dataset.n;if(!ROUND_OPTS.includes(n))break;if(screen==='computer'){soloRounds=n;ls.set('dd-rounds',String(n));renderComputer();}else if(S&&S.status==='lobby'&&S.hostId===myId){const d=clone(S);d.rounds=n;d.rev=(S.rev||0)+1;d.by=myId;commit(d);}break;}
case 'mic':vcMic();break;
case 'getBoli':openBoli();break;
case 'buyBoli':buyBoli(+b.dataset.i);break;
case 'adBoli':adBoli();break;
case 'profColor':{profColor=b.dataset.c;document.querySelectorAll('.copt').forEach(x=>x.classList.toggle('sel',x.dataset.c===profColor));document.querySelectorAll('.popt .pz').forEach(x=>x.style.setProperty('--c',profColor));break;}
case 'solo':openRules(soloBots+1,soloRounds,'Got it, deal!','rulesDeal');break;
case 'resumeSolo':try{const d=JSON.parse(ls.get('lg-solo'));mode='solo';ref=null;S=null;apply(d);scheduleBot();}catch(err){ls.del('lg-solo');renderHome();}break;
case 'join':join(b);break;
case 'pick':openPicker();break;
case 'setPiece':setPiece(b.dataset.p);break;
case 'start':b.disabled=true;startGame();break;
case 'leave':leave();break;
case 'menu':openMenu();break;
case 'top10':openTop10();break;
case 'close':closeSheet();break;
case 'tableSet':if(TABLES[b.dataset.id]){INV.eq.table=b.dataset.id;saveInv();applyTable();buzz(6);if(S)openMenu();}break;
case 'profMode':profMode=b.dataset.v;drawProfileSheet((($('#pnm')||{}).value)||'');break;
case 'charEditSheet':{const nm=(($('#pnm')||{}).value)||myName();openCharBuilder(()=>{profMode=avMode();drawProfileSheet(nm);});break;}
case 'charEdit':openCharBuilder(()=>renderProfile());break;
case 'charEditStore':openCharBuilder(()=>{if(screen==='store')renderStore();});break;
case 'lookMode':setAvMode(b.dataset.v);cacheAvatar();renderProfile();break;
case 'avitem':openAvItem(b.dataset.id);break;
case 'avbuy':buyAv(b.dataset.id);break;
case 'avwear':wearAvItem(b.dataset.id);break;
case 'rulesDeal':closeRules();startSolo();break;
case 'rulesClose':closeRules();break;
case 'rulesOpen':if(S)openRules(S.players.length,roundsOf(S),'Got it','ready');break;
case 'ready':sendReady();break;
case 'arrange':order=arranged(myHand());selected=null;layoutHand();renderActs();buzz(6);break;
case 'gin':buzz([15,40,25]);act('gin');break;
case 'discardSel':if(selected)act('discard',selected);break;
case 'skip':closeSheet();act('skip');break;
case 'next':case 'again':closeOv();act(a);break;
case 'drawDiscard':if(canDiscard()&&selected&&myHand().includes(selected)){act('discard',selected);break;}act(a);break;
case 'drawStock':if(S&&S.blitz&&canDiscard()&&selected&&myHand().includes(selected)){act('discard',selected);break;}act(a);break;
}});
applyCosmetics();
/* opened from the Dhivehi Games home page: go straight to the requested screen, no Digu intro in between */
if(pendingOpen){const o=pendingOpen;pendingOpen=null;if(o==='resume'){try{const d=JSON.parse(ls.get('lg-solo'));if(!d)throw 0;mode='solo';ref=null;S=null;apply(d);scheduleBot();}catch(err){renderHome();}}else if(o==='profile')renderProfile();else if(o==='account'){renderProfile();openAccount(authIsGuest()?'register':undefined);}else if(o==='boli')renderBoliPage();else renderStore();}
else renderHome();
initFirebase();

/* ---------- screen entrance: each new screen's content rises in; the AK fan deals itself in on the home page ---------- */
(function(){let shown='';
 {const m0=app.querySelector(':scope>main');if(m0&&!m0.classList.contains('table')){shown=screen;if(!reduce){m0.classList.add('enter');m0._et=setTimeout(()=>m0.classList.remove('enter'),1400);}}}
 const musicGate=()=>{const want=ls.get('dd-music')!=='0'&&screen==='table';if(want!==Music.on){if(want)AU.unlock();Music.set(want);}};
 new MutationObserver(()=>{musicGate();const m=app.querySelector(':scope>main');if(!m)return;
  if(m.classList.contains('table')){shown='table';return;}
  if(screen===shown)return;shown=screen;window.scrollTo(0,0);if(reduce)return;
  m.classList.add('enter');clearTimeout(m._et);m._et=setTimeout(()=>m.classList.remove('enter'),1400);}).observe(app,{childList:true});
})();

/* ---------- pressed feel for every button and card (menus + in-game buttons) ---------- */
(function(){
 const SEL='button,a,.mode,.sbanner,.acrow,.feat,.soon,.pill,.bpack,.bad,[data-a]';
 const SKIP='.card,.hand,.pile,#fx,.embw,input,textarea,select';
 let cur=null;
 const release=()=>{if(cur){cur.classList.remove('pz-down');cur=null;}};
 document.addEventListener('pointerdown',e=>{const el=e.target.closest&&e.target.closest(SEL);if(!el||el.closest(SKIP)||el.disabled)return;
  const tb=el.closest('main.table');if(tb&&!el.closest('.btn,.icon-btn,.emobtn,.chatbtn,.micbtn'))return;
  release();cur=el;el.classList.add('pz-down');},{passive:true});
 ['pointerup','pointercancel','dragstart','scroll'].forEach(n=>document.addEventListener(n,release,{passive:true,capture:true}));
 window.addEventListener('blur',release);
})();
cacheAvatar();
setTimeout(runPending,300);
/* links from the Dhivehi Games home page: open the profile, store or Get more Boli directly */
/* warm up online play in the background so Create/Join feel instant */
const idle=window.requestIdleCallback||(fn=>setTimeout(fn,1200));
idle(()=>warmUp(),{timeout:2500});
(async()=>{try{if(window.claude&&typeof window.claude.use==='function')db=await window.claude.use('db');}catch(e){db=null;}if(db&&screen==='home'){const a=document.activeElement&&document.activeElement.id;if(!a)renderHome();}})();
})();
</script>
