const EMOTES={};EMOTE_PACKS.forEach(p=>p.items.forEach(it=>{EMOTES[it.id]=it;}));
/* blocked players are kept on this device, one list per account (guests share the device list). They are not saved to the
   profile doc: players/{uid} is publicly readable and its rules only allow the leaderboard fields. */
const blkKey=()=>FB.user&&!FB.user.isAnonymous?'dd-blocked:'+FB.user.uid:'dd-blocked';
const blkRead=k=>{try{const a=JSON.parse(ls.get(k)||'[]');return Array.isArray(a)?a.filter(x=>x&&x.id):[];}catch(e){return [];}};
const EMOTE_CD=4000;let lastEmote=0;const BLK=blkRead('dd-blocked');
const saveBlk=()=>ls.set(blkKey(),JSON.stringify(BLK.slice(-200)));
const isBlocked=id=>BLK.some(x=>x.id===id);
const mutedP=new Set(BLK.map(x=>x.id)),emoteT={};
/* after login / logout: switch to that account's list (an account's first list starts from this device's guest list) */
function reloadBlk(){const k=blkKey(),a=ls.get(k)==null&&k!=='dd-blocked'?blkRead('dd-blocked'):blkRead(k);BLK.length=0;a.forEach(x=>BLK.push(x));mutedP.clear();BLK.forEach(x=>mutedP.add(x.id));}
const emotesMuted=()=>ls.get('dd-emute')==='1';
function toggleEmotes(){const t=$('#emotray');if(!t)return;closeChat();if(Date.now()-lastEmote<EMOTE_CD){toast('Wait a moment before the next reaction.');return;}t.hidden=!t.hidden;}
function closeEmotes(){const t=$('#emotray');if(t)t.hidden=true;}
function sendEmote(id){if(!EMOTES[id]||!S||meIdx()<0)return;const now=Date.now();if(now-lastEmote<EMOTE_CD)return;lastEmote=now;closeEmotes();showEmote(myId,id);buzz(6);
const eb=$('#emobtn');if(eb){eb.classList.add('cd');setTimeout(()=>{const x=$('#emobtn');x&&x.classList.remove('cd');},EMOTE_CD);}
if(mode==='p2p'){if(isHost)relayEmote(myId,id,true);else joinSend({k:'emote',e:id});}}
function relayEmote(pid,id,self){const n=net;if(!n||n.role!=='host'||!EMOTES[id]||!S)return;
if(!self){const now=Date.now();if(now-(emoteT[pid]||0)<3000)return;emoteT[pid]=now;showEmote(pid,id);}
n.players.forEach((pl,tp)=>{if(pl.pid&&pl.pid!==pid&&(pl.spec||S.players.some(q=>q.id===pl.pid)))sendPlayer(tp,pl,{k:'emote',p:pid,e:id});});}
function bubbleAt(pid,text,cls,ms){if(screen!=='table'||!S||document.hidden)return;const k=S.players.findIndex(q=>q.id===pid);if(k<0)return;const mine=k===meIdx();
const r=rectOf(mine?document.querySelector('#meav'):document.querySelector(`[data-av="${k}"]`));if(!r)return;
document.querySelectorAll('.emo').forEach(x=>{if(x.dataset.p===pid)x.remove();});
const b=document.createElement('div');b.className='emo'+(mine?' up':'')+(cls?' '+cls:'');b.dataset.p=pid;b.textContent=text;
b.style.left=Math.max(90,Math.min(window.innerWidth-90,r.x+r.w/2))+'px';b.style.top=(mine?r.y-6:r.y+r.h+6)+'px';$('#fx').appendChild(b);setTimeout(()=>b.remove(),ms);}

/* ---------- chat (online matches only) ---------- */
const QUICK_CHAT=['Good luck!','Nice one','Your turn','So close!','Well played','One more game?','Too easy','You got lucky','67','OMG','😠','😢'];
/* the phrases you send most move to the front */
const qcUse=(()=>{try{const o=JSON.parse(ls.get('dd-qc')||'{}');return o&&typeof o==='object'?o:{};}catch(e){return {};}})();
function quickChat(){return QUICK_CHAT.map((q,i)=>({q:q,i:i,n:+qcUse[q]||0})).sort((a,b)=>b.n-a.n||a.i-b.i).map(x=>x.q);}
function countQuick(m){if(QUICK_CHAT.indexOf(m)<0)return;qcUse[m]=(+qcUse[m]||0)+1;try{ls.set('dd-qc',JSON.stringify(qcUse));}catch(e){}}
function chipsHTML(){return quickChat().map(q=>`<button class="chip${/^[\u2600-\u27bf\ud83c-\udbff]/.test(q)?' emo':''}" data-a="chatQuick" data-m="${esc(q)}"${q==='😠'?' aria-label="Angry"':q==='😢'?' aria-label="Sad"':''}>${esc(q)}</button>`).join('');}
const BYE_MSG='It was fun playing with you guys, good luck!';
const CHAT_CD=2500;let lastChat=0,chatCode=null;const chatLog=[],chatT={};
const chatOff=()=>ls.get('dd-chat')==='0';
function cleanText(v){let s=String(v||'').replace(/[\u0000-\u001f\u007f<>]/g,'').replace(/\s+/g,' ').trim().slice(0,60);
s=s.split(' ').map(w=>{const low=w.toLowerCase();if(/https?:|www\.|\.(com|net|org|mv|io|me|ly)\b|@\w/.test(low))return '•••';
const flat=low.replace(/0/g,'o').replace(/1/g,'i').replace(/3/g,'e').replace(/4|@/g,'a').replace(/5|\$/g,'s').replace(/[^a-z]/g,'');
return flat&&BAD.some(b=>flat.includes(b))?'•••':w;}).join(' ');
if(/\d[\d\s-]{5,}\d/.test(s))s=s.replace(/\d[\d\s-]{5,}\d/g,'•••');return s;}
function openChat(){const b=$('#chatbar');if(!b)return;closeEmotes();const cq=$('#chatquick');if(cq)cq.innerHTML=chipsHTML();b.hidden=false;renderChatLog();const d=document.querySelector('#chatbtn .dot');if(d)d.hidden=true;}
function closeChat(){const b=$('#chatbar');if(b)b.hidden=true;const i=$('#chatin');if(i&&document.activeElement===i)i.blur();}
function renderChatLog(){const e=$('#chatlog');if(!e||!S)return;e.innerHTML='';chatLog.slice(-4).forEach(c=>{const p=document.createElement('p');const n=document.createElement('b');n.textContent=(c.pid===myId?'You':c.name)+': ';p.appendChild(n);p.appendChild(document.createTextNode(c.m));e.appendChild(p);});}
function sendChat(raw){if(!S||mode!=='p2p'||meIdx()<0||chatOff())return;const m=cleanText(raw);if(!m)return;
const now=Date.now();if(now-lastChat<CHAT_CD){toast('Slow down a little.');return;}lastChat=now;
const i=$('#chatin');if(i)i.value='';closeChat();
countQuick(m);receiveChat(myId,m);if(isHost)relayChat(myId,m,true);else joinSend({k:'chat',m:m});}

if(!self){const now=Date.now();if(now-(chatT[pid]||0)<2000)return;chatT[pid]=now;receiveChat(pid,m);}

/* ---------- online play: encrypted relay ----------
   Phones talk through public MQTT relays over secure WebSockets, so players on mobile data
   or different Wi-Fi networks can join. A tiny built-in MQTT client is used (no library
   download). Each player's cards are end-to-end encrypted (ECDH + AES-GCM). */
const NS=(()=>{try{const q=new URLSearchParams(location.search).get('ns');if(q&&/^[a-z0-9]{3,16}$/i.test(q)&&(!DG_IN_APP&&/^(localhost|127\.\d+\.\d+\.\d+|\[::1\])$/.test(location.hostname)))return 'dhivehidigu/test-'+q+'/';}catch(e){}return 'dhivehidigu/v2/';})();
/* 3rd broker on the normal HTTPS port 443 (login public/public) for networks that block 8084/8884; same list as shared/net.js */
const BROKERS=['wss://broker.emqx.io:8084/mqtt','wss://broker.hivemq.com:8884/mqtt',{url:'wss://public.cloud.shiftr.io:443',user:'public',pass:'public'}];
let isHost=false,net=null,joinInfo=null,pool=null,poolT=null,srvState='checking';const lobbyList={};
const TE=new TextEncoder(),TD=new TextDecoder();
function b64(u8){let s='';for(let i=0;i<u8.length;i+=0x8000)s+=String.fromCharCode.apply(null,u8.subarray(i,i+0x8000));return btoa(s);}
function unb64(s){const b=atob(s),u=new Uint8Array(b.length);for(let i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return u;}
const rid=n=>{const a=new Uint8Array(n);crypto.getRandomValues(a);return Array.from(a,x=>x.toString(16).padStart(2,'0')).join('');};
async function newKeys(){const kp=await crypto.subtle.generateKey({name:'ECDH',namedCurve:'P-256'},false,['deriveKey']);return{kp:kp,pub:b64(new Uint8Array(await crypto.subtle.exportKey('raw',kp.publicKey)))};}
async function sharedKey(priv,pubB64){const pk=await crypto.subtle.importKey('raw',unb64(pubB64),{name:'ECDH',namedCurve:'P-256'},false,[]);return crypto.subtle.deriveKey({name:'ECDH',public:pk},priv,{name:'AES-GCM',length:256},false,['encrypt','decrypt']);}
async function seal(key,obj){const iv=crypto.getRandomValues(new Uint8Array(12));const ct=await crypto.subtle.encrypt({name:'AES-GCM',iv:iv},key,TE.encode(JSON.stringify(obj)));return{i:b64(iv),c:b64(new Uint8Array(ct))};}
async function unseal(key,m){const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:unb64(m.i)},key,unb64(m.c));return JSON.parse(TD.decode(pt));}

/* tiny MQTT 3.1.1 client (QoS 0) */
function MQ(url,opts){
const self={connected:false,reconnecting:true};
let ws=null,buf=new Uint8Array(0),pingT=null,retryT=null,ctT=null,ended=false,pid=0,delay=1500,lastIn=0;
const subs=new Set(),clientId='dd_'+rid(7);
const str=s=>{const b=TE.encode(s),o=new Uint8Array(2+b.length);o[0]=b.length>>8;o[1]=b.length&255;o.set(b,2);return o;};
function packet(head,parts){const bodyLen=parts.reduce((t,p)=>t+p.length,0);let len=bodyLen;const lb=[];do{let d=len%128;len=Math.floor(len/128);if(len>0)d|=128;lb.push(d);}while(len>0);
const out=new Uint8Array(1+lb.length+bodyLen);out[0]=head;out.set(lb,1);let off=1+lb.length;parts.forEach(p=>{out.set(p,off);off+=p.length;});return out;}
function send(u8){if(ws&&ws.readyState===1){try{ws.send(u8);return true;}catch(e){}}return false;}
function nextId(){pid=pid%65535+1;return new Uint8Array([pid>>8,pid&255]);}

   the player taps it (always, so strangers at a Quick Match table never hear you by surprise). Anyone can

   window.DG_TURN_URL can point elsewhere. A failure or a 2 s timeout falls back to the STUN-only list above (today's behaviour);
   a good answer is cached until shortly before it expires. */

 if(screen==='table')return document.querySelector(`.seat[data-pid="${CSS.escape(id)}"] .av`);if(screen==='lobby'){const r=document.querySelectorAll('.lrow')[k];const m=r&&r.querySelector('.mini');if(m&&!m.classList.contains('vhost'))m.classList.add('vhost');return m;}return null;}
/* the ring element inside a talker's picture (made on the fly where the markup has none, e.g. the lobby list) */
function vcRing(el){let r=el._vr;if(r&&r.parentNode===el)return r;r=el.querySelector(':scope>.vring');if(!r){r=document.createElement('span');r.className='vring';r.setAttribute('aria-hidden','true');el.prepend(r);}el._vr=r;return r;}
function vcLoop(){if(!vcAvail()){if(VC.peers.size||VC.stream)vcStopAll();return;}
 if(VC.code&&VC.code!==S.code)vcStopAll();VC.code=S.code;
 const ids=S.players.filter(q=>q.id!==myId&&!q.bot).map(q=>q.id);
 [...VC.peers.keys()].forEach(id=>{if(!ids.includes(id))vcDrop(id);});
 vcRedials(ids);vcShare();vcUI();}

/* the speaking ring: ~17 level readings a second, rises at once and falls off by .72 a reading (gone ~0.3 s after they stop).
   window.__vcFake(id) (tests only) stands in for the real analyser. */
setInterval(()=>{const fk=typeof window.__vcFake==='function'?window.__vcFake:null;
 if(!S||!VC.peers.size&&!VC.on&&!fk){if(VC._lit){document.querySelectorAll('.vtalk').forEach(e=>e.classList.remove('vtalk'));VC.lv={};VC._lit=false;}return;}
 S.players.forEach((q,k)=>{if(q.bot)return;const lvOf=m=>fk?Math.max(0,Math.min(1,+fk(q.id)||0)):vcLevel(m);
  const raw=mutedP.has(q.id)?0:q.id===myId?(VC.on?lvOf(VC.me):0):(fk?lvOf(null):vcPeerLevel(VC.peers.get(q.id)));
  const lv=VC.lv[q.id]=Math.max(raw,(VC.lv[q.id]||0)*.72);const el=vcAvatarEl(k,q.id);if(!el)return;
  const t=lv>.06;if(t||el.classList.contains('vtalk')){vcRing(el);el.style.setProperty('--vl',lv.toFixed(2));el.style.setProperty('--mo',Math.min(1,raw).toFixed(2));}
  if(el.classList.contains('vtalk')!==t)el.classList.toggle('vtalk',t);});VC._lit=true;},57);

/* quick match (owner-approved flow, Sept 2026): search about 12 s with the seats filling up; if the table isn't full,
   offer "Start with computer players" (starts by itself after 5 s) or "Keep waiting". Computer seats are permanent
   computer players with a small Computer tag; a real player who arrives later takes one at the next hand break
   (straight away before the first move), keeping that computer's points. */
let quickRun=0;
const QM_SEATS=4,QM_SEARCH=12000,QM_AUTO=5000;
let qmT0=0,qmSheetAt=0,qmIv=0,qmStarting=false;
const QM_PLUS='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>';
const qmLobby=()=>mode==='p2p'&&!!S&&!!S.quick&&S.status==='lobby';
const qmHost=()=>qmLobby()&&isHost&&S.hostId===myId;
function qmReset(){qmT0=Date.now();qmSheetAt=0;qmStarting=false;}
/* computer players for the empty seats: the same five characters as vs Computer, never repeating a name or piece already at the table */
function cpuPlayer(taken){const names=new Set(taken.map(p=>p.name)),pcs=new Set(taken.map(p=>p.piece));
 const b=BOTS.find(x=>!names.has(x[0]))||BOTS[taken.length%BOTS.length];let pc=b[1];if(pcs.has(pc))pc=PK.find(x=>!pcs.has(x))||pc;
 return{id:'c'+rid(4),name:b[0],piece:pc,score:0,bot:true,cpu:1,cos:{f:'f-classic',b:'b-reef',ch:DGA()?(DGA().presets[BOTCH[b[0]]]||DGA().random(b[0])):null}};}
function qmPaint(){if(screen!=='quick')return;if(!qmT0)qmT0=Date.now();
 const ps=qmLobby()?S.players:[meP()],n=Math.min(ps.length,QM_SEATS);
 const e=$('#qseats');if(e){let h='';for(let i=0;i<QM_SEATS;i++){const p=ps[i];h+=p?`<div class="st">${avatarHTML(p,i,'',52)}<span class="sn">${p.id===myId?'You':esc(p.name)}</span></div>`:`<div class="st"><span class="emp">${QM_PLUS}</span><span class="sn o">Open seat</span></div>`;}if(e._h!==h){e._h=h;e.innerHTML=h;}}
 const f=$('#qfill');if(f)f.textContent=n+' of '+QM_SEATS+' seats filled';
 if(qmLobby()){const H=S.players.find(q=>q.id===S.hostId);
  setQuickText(ps.length>=QM_SEATS?'Table full, dealing':qmHost()?(Date.now()-qmT0>=QM_SEARCH?'Still looking for players':'Finding players'):'Waiting for '+(H?H.name:'the host')+' to start');}}
/* one quiet clock for the ring, the offer and its 5 s countdown (keeps running in a background tab) */
function qmTick(){if(qmIv)return;qmIv=setInterval(()=>{if(screen!=='quick'){clearInterval(qmIv);qmIv=0;qmSheetAt=0;return;}
 if(!qmT0)qmT0=Date.now();const el=Date.now()-qmT0,f=Math.min(1,el/QM_SEARCH);
 const a=$('#qarc');if(a)a.setAttribute('stroke-dashoffset',(414.7*f).toFixed(1));const s=$('#qsecs');if(s){const t=Math.max(0,Math.ceil((QM_SEARCH-el)/1000))+' s';if(s.textContent!==t)s.textContent=t;}
 if(!qmHost())return;
 if(S.players.length>=QM_SEATS){if(qmSheetAt)closeSheet();qmSheetAt=0;qmStart(false);return;}
 if(qmSheetAt){const b=$('#sheet').classList.contains('open')?$('#qcdt'):null;if(!b){qmWait();return;}const g=Date.now()-qmSheetAt;b.textContent='Starting by itself in '+Math.max(1,Math.ceil((QM_AUTO-g)/1000))+' s';
  const bar=$('#qcdbar');if(bar)bar.style.transform=`scaleX(${Math.max(0,1-g/QM_AUTO).toFixed(3)})`;if(g>=QM_AUTO)qmStart(true);return;}
 if(f>=1)qmNobody();},200);}
function qmNobody(){if(!qmHost()||qmSheetAt)return;const need=QM_SEATS-S.players.length,some=S.players.length>1,bots=[];
 for(let i=0;i<need;i++)bots.push(cpuPlayer(S.players.concat(bots)));qmPaint();
 sheet(`<div class="grab"></div><h2>${some?'Still '+need+' seat'+(need>1?'s':'')+' free':'Nobody’s around yet'}</h2><p class="muted" style="margin:6px 0 14px">${some?'Fill them with computer players and start. Anyone who turns up later takes a computer’s seat.':'Start now with computer players. If real players turn up, they take a computer’s seat.'}</p>
<div class="qbots"><span class="hp">${bots.map((b,i)=>avatarHTML(b,i+1,'',32)).join('')}</span><small>${need===1?'1 computer player fills the empty seat.':need+' computer players fill the empty seats.'} Each has a small “Computer” tag.</small></div>
<button class="btn primary wide qcd" data-a="qmBots"><span>Start with computer players</span><span class="cdt" id="qcdt">Starting by itself in ${Math.round(QM_AUTO/1000)} s</span><span class="bar" id="qcdbar"></span></button>
<button class="btn soft wide" data-a="qmWait" style="margin-top:10px">Keep waiting</button>`);qmSheetAt=Date.now();}
function qmWait(){qmSheetAt=0;closeSheet();qmT0=Date.now();qmPaint();}
/* the host deals: computers fill any empty seat (withBots), everyone starts at 0 */
function qmStart(withBots){if(!qmHost()||qmStarting)return;if(!withBots&&S.players.length<QM_SEATS)return;qmStarting=true;const had=qmSheetAt||withBots;qmSheetAt=0;if(had)closeSheet();
 const N=clone(S);if(withBots)while(N.players.length<QM_SEATS)N.players.push(cpuPlayer(N.players));
 if(N.players.length<2){qmStarting=false;return;}
 N.players.forEach(p=>{p.score=0;});deal(N);N.rev=(S.rev||0)+1;N.by=myId;commit(N);updListing();}
async function quickMatch(){if(db){toast('Quick Match works in the published game.');return;}if(!needName(()=>quickMatch()))return;
const run=++quickRun;cleanupP2P();qmReset();renderQuickWait('Connecting…');warmUp();
const up=pool?await anyUp(pool,10000):false;if(run!==quickRun)return;
if(!up){setSrv('fail');toast(netErrMsg,5000);renderHome();return;}
setSrv('ok');setQuickText('Looking for an open table…');
await sleep(Object.keys(lobbyList).length?300:1600);if(run!==quickRun)return;
tryQuick(run,new Set());}
function tryQuick(run,tried){if(run!==quickRun)return;if(screen!=='quick')renderQuickWait('Looking for an open table…');
/* Quick Match skips tables where someone you blocked is sitting */
const blockedAt=x=>[x.host].concat(x.ids||[]).some(isBlocked);
const l=openTables().filter(x=>!tried.has(x.code)&&!blockedAt(x)&&!(x.q&&x.n>=QM_SEATS)).sort((a,b)=>(b.q-a.q)||(b.n-a.n)||(a.c-b.c));const btn=$('#qbtn');if(!btn)return;
const lv=liveTables().filter(x=>x.f>0&&!tried.has(x.code)&&!blockedAt(x)).sort((a,b)=>(b.cf-a.cf)||(b.f-a.f));
/* order: a Quick Match table still filling up, then a game with a free computer seat, then any open table, then a game with room for the next match */
const lq=l.filter(x=>x.q),lc=lv.filter(x=>x.cf>0);
const x=lq[0]||lc[0]||l[0]||lv[0];if(x){tried.add(x.code);setQuickText(x.status==='lobby'?'Joining '+x.name+'’s table…':x.cf>0?'Joining '+x.name+'’s game. You take a computer’s seat…':'Joining '+x.name+'’s game. You’re in for the next game…');
netJoin(btn,myName(),x.code,{timeout:6000,onFail:()=>{if(run!==quickRun)return;warmUp();tryQuick(run,tried);}});}
else{setQuickText('No open tables. Creating one…');netCreate(btn,myName(),{pub:true,quick:true,onFail:()=>{if(run===quickRun)renderHome();}});}}

/* ---------- online (Claude-hosted db) ---------- */
function listen(){if(unsub)try{unsub();}catch(e){}
unsub=ref.onSnapshot(snap=>{if(!snap||!snap.exists)return;const d=clone(snap.data());
if(S&&S.code===d.code){if((d.rev||0)<(S.rev||0))return;if(d.rev===S.rev&&d.by===S.by)return;}
apply(d);},()=>toast('Lost connection to the table. Leave and join again.'));}
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
function genCode(){const a='ABCDEFGHJKLMNPQRSTUVWXYZ';let s='';for(let i=0;i<4;i++)s+=a[Math.floor(Math.random()*a.length)];return s;}
function nameVal(then){const n=myName();if(!n){openProfile(then,'Choose a name so other players know who you are.');return null;}return n;}
async function create(btn){const name=nameVal(()=>{renderFriends();const b=document.querySelector('[data-a="create"]');if(b)create(b);});if(!name)return;if(!db){netCreate(btn,name,{pub:friendPub});return;}btn.disabled=true;mode='online';
try{let code,r;for(let i=0;i<5;i++){code=genCode();r=db.doc('tables/'+code);const s=await r.get();if(!s.exists||s.data().status==='over')break;}
const d={v:1,rev:1,by:myId,status:'lobby',code:code,hostId:myId,players:[{id:myId,name:name,piece:'manta',score:0}]};
await r.set(d);ref=r;ls.set('lg-room',code);S=null;listen();apply(d);
}catch(e){toast(errMsg(e));btn.disabled=false;}}
async function join(btn,codeArg){const name=nameVal(()=>{renderFriends();const i=$('#code');if(i&&codeArg)i.value=codeArg;const b=document.querySelector('[data-a="join"]');if(b)join(b,codeArg);});if(!name)return;const code=String(codeArg||(($('#code')||{}).value||'')).trim().toUpperCase();
if(!/^[A-Z]{4}$/.test(code)){toast('Table codes are 4 letters.');return;}
if(document.activeElement&&document.activeElement.blur)document.activeElement.blur();
if(!db){netJoin(btn,name,code);return;}mode='online';btn.disabled=true;
try{const r=db.doc('tables/'+code);let s=await r.get();
if(!s.exists){toast('No table found with code '+code+'.');btn.disabled=false;return;}
let d=clone(s.data());
if(!d.players.some(q=>q.id===myId)&&d.status==='lobby'){
for(let i=0;i<6;i++){const l=await r.acquire({holder:myId,ttlMs:4000});if(l.acquired)break;await sleep(400+Math.random()*400);}
s=await r.get();d=clone(s.data());
if(d.status==='lobby'&&!d.players.some(q=>q.id===myId)){
if(d.players.length>=6){toast('That table is full.');btn.disabled=false;return;}
d.players.push({id:myId,name:name,piece:PK.find(id=>!d.players.some(q=>q.piece===id))||PK[0],score:0});d.rev=(d.rev||0)+1;d.by=myId;await r.set(d);}
}else if(!d.players.some(q=>q.id===myId))toast('That game already started. You can watch.');
ref=r;ls.set('lg-room',code);S=null;listen();apply(d);
}catch(e){toast(errMsg(e));btn.disabled=false;}}
async function setPiece(pid){closeSheet();if(mode==='p2p'&&S&&S.status==='lobby'){if(isHost){if(S.players.some(q=>q.id!==myId&&q.piece===pid)){toast('Someone already has that one.');return;}const N=clone(S);N.players[meIdx()].piece=pid;N.rev++;N.by=myId;commit(N);}else joinSend({k:'piece',p:pid});return;}
if(!ref||!S||S.status!=='lobby')return;
try{const s=await ref.get();const d=clone(s.data());if(d.status!=='lobby')return;
if(d.players.some(q=>q.id!==myId&&q.piece===pid)){toast('Someone just took that one.');return;}
const me=d.players.find(q=>q.id===myId);if(!me)return;me.piece=pid;d.rev=(d.rev||0)+1;d.by=myId;apply(d);await ref.set(d);
}catch(e){toast(errMsg(e));}}
async function startGame(){if(!S||S.hostId!==myId||S.players.length<2)return;
if(mode==='p2p'){const d=clone(S);d.players.forEach(p=>p.score=0);deal(d);d.rev=(S.rev||0)+1;d.by=myId;commit(d);return;}
try{const s=await ref.get();const d=clone(s.data());if(d.status!=='lobby')return;d.players.forEach(p=>p.score=0);deal(d);d.rev=(d.rev||0)+1;d.by=myId;commit(d);}catch(e){toast(errMsg(e));}}
async function leave(){closeSheet();closeOv();closeRules();clearTimeout(botT);botT=null;if(mode==='solo'){mode=null;S=null;renderHome();return;}
if(mode==='p2p'){const n=net;quickRun++;
/* host leaving: hand the table to the next player; if nobody else is here, the table closes */
if(n&&n.role==='host'){const nx=nextHostId(myId);n.players.forEach((pl,tp)=>sendPlayer(tp,pl,nx?{k:'bye',next:nx}:{k:'bye'}));}else if(n&&S)joinSend({k:'leave'});
mode=null;S=null;isHost=false;joinInfo=null;keepAwake(false);netClose();renderHome();return;}
if(S&&S.status==='lobby'&&ref&&S.hostId!==myId){try{const s=await ref.get();const d=clone(s.data());if(d.status==='lobby'){d.players=d.players.filter(q=>q.id!==myId);d.rev++;d.by=myId;await ref.set(d);}}catch(e){}}
if(unsub)try{unsub();}catch(e){}unsub=null;ref=null;S=null;renderHome();}

case 'sfx':{const v=!sfxOn();ls.set('dd-sfx',v?'1':'0');if(v){AU.unlock();SFX.tick();}if(S)openMenu();break;}
case 'create':create(b);break;
case 'bots':soloBots=+b.dataset.n;document.querySelectorAll('[data-a="bots"]').forEach(x=>x.setAttribute('aria-pressed',String(+x.dataset.n===soloBots)));{const bh=$('#blitzhint');if(bh)bh.innerHTML=blitzHint();}break;
case 'rounds':{const n=+b.dataset.n;if(!ROUND_OPTS.includes(n))break;if(screen==='computer'){soloRounds=n;ls.set('dd-rounds',String(n));renderComputer();}else if(S&&S.status==='lobby'&&S.hostId===myId){const d=clone(S);d.rounds=n;d.rev=(S.rev||0)+1;d.by=myId;commit(d);}break;}
case 'mic':vcMic();break;
case 'getBoli':openBoli();break;
case 'buyBoli':buyBoli(+b.dataset.i);break;
case 'adBoli':adBoli();break;
case 'profColor':{profColor=b.dataset.c;document.querySelectorAll('.copt').forEach(x=>x.classList.toggle('sel',x.dataset.c===profColor));document.querySelectorAll('.popt .pz').forEach(x=>x.style.setProperty('--c',profColor));break;}
case 'solo':openRules(soloBots+1,soloRounds,'Got it, deal!','rulesDeal');break;
case 'join':join(b);break;
case 'pick':openPicker();break;
case 'setPiece':setPiece(b.dataset.p);break;
case 'start':b.disabled=true;startGame();break;
case 'leave':leave();break;
case 'menu':openMenu();break;
case 'top10':openTop10();break;
case 'close':closeSheet();break;
case 'tableSet':if(TABLES[b.dataset.id]){INV.eq.table=b.dataset.id;saveInv();applyTable();buzz(6);if(S)openMenu();}break;
case 'profMode':profMode=b.dataset.v;drawProfileSheet((($('#pnm')||{}).value)||'');break;
case 'charEditSheet':{const nm=(($('#pnm')||{}).value)||myName();openCharBuilder(()=>{profMode=avMode();drawProfileSheet(nm);});break;}
case 'charEdit':openCharBuilder(()=>renderProfile());break;
case 'charEditStore':openCharBuilder(()=>{if(screen==='store')renderStore();});break;
case 'lookMode':setAvMode(b.dataset.v);cacheAvatar();renderProfile();break;
case 'avitem':openAvItem(b.dataset.id);break;
case 'avbuy':buyAv(b.dataset.id);break;
case 'avwear':wearAvItem(b.dataset.id);break;
case 'rulesDeal':closeRules();startSolo();break;
case 'rulesClose':closeRules();break;
case 'rulesOpen':if(S)openRules(S.players.length,roundsOf(S),'Got it','ready');break;
case 'ready':sendReady();break;
case 'arrange':order=arranged(myHand());selected=null;layoutHand();renderActs();buzz(6);break;
case 'gin':buzz([15,40,25]);act('gin');break;
case 'discardSel':if(selected)act('discard',selected);break;
case 'skip':closeSheet();act('skip');break;
case 'next':case 'again':closeOv();act(a);break;
case 'drawDiscard':if(canDiscard()&&selected&&myHand().includes(selected)){act('discard',selected);break;}act(a);break;
case 'drawStock':if(S&&S.blitz&&canDiscard()&&selected&&myHand().includes(selected)){act('discard',selected);break;}act(a);break;
}});
applyCosmetics();
/* opened from the Dhivehi Games home page: go straight to the requested screen, no Digu intro in between */
if(pendingOpen){const o=pendingOpen;pendingOpen=null;if(o==='resume')renderHome();/* no saved games any more (Oct 2026): an old resume link opens the Digu home */else if(o==='profile')renderProfile();else if(o==='account'){renderProfile();openAccount(authIsGuest()?'register':undefined);}else if(o==='boli')renderBoliPage();else renderStore();}
else renderHome();
initFirebase();

/* ---------- screen entrance: each new screen's content rises in; the AK fan deals itself in on the home page ---------- */
(function(){let shown='';
 {const m0=app.querySelector(':scope>main');if(m0&&!m0.classList.contains('table')){shown=screen;if(!reduce){m0.classList.add('enter');m0._et=setTimeout(()=>m0.classList.remove('enter'),1400);}}}
 const musicGate=()=>{const want=ls.get('dd-music')!=='0'&&screen==='table';if(want!==Music.on){if(want)AU.unlock();Music.set(want);}};
 new MutationObserver(()=>{musicGate();const m=app.querySelector(':scope>main');if(!m)return;
  if(m.classList.contains('table')){shown='table';return;}
  if(screen===shown)return;shown=screen;window.scrollTo(0,0);if(reduce)return;
  m.classList.add('enter');clearTimeout(m._et);m._et=setTimeout(()=>m.classList.remove('enter'),1400);}).observe(app,{childList:true});
})();
/* ---------- the homepage's background music (shared/bgm.js): Store, Boli and Profile / Sign in opened from the homepage
   carry it on from where the homepage was; any other screen (a game, the lobby) ends it for this visit. Going back home
   hands the position back. Digu's own table music and sounds are separate and unchanged. ---------- */
(function(){if(!window.DGBgm)return;const MENU=['profile','store','boli'];
 DGBgm.init({menu:true});
 if(!fromHub||!MENU.includes(screen)){DGBgm.stop();return;}
 const mo=new MutationObserver(()=>{if(!MENU.includes(screen)){DGBgm.stop();mo.disconnect();}});mo.observe(app,{childList:true});
})();

/* ---------- pressed feel for every button and card (menus + in-game buttons) ---------- */
(function(){
 const SEL='button,a,.mode,.sbanner,.acrow,.feat,.soon,.pill,.bpack,.bad,[data-a]';
 const SKIP='.card,.hand,.pile,#fx,.embw,input,textarea,select';
 let cur=null;
 const release=()=>{if(cur){cur.classList.remove('pz-down');cur=null;}};
 document.addEventListener('pointerdown',e=>{const el=e.target.closest&&e.target.closest(SEL);if(!el||el.closest(SKIP)||el.disabled)return;
  const tb=el.closest('main.table');if(tb&&!el.closest('.btn,.icon-btn,.emobtn,.chatbtn,.micbtn'))return;
  release();cur=el;el.classList.add('pz-down');},{passive:true});
 ['pointerup','pointercancel','dragstart','scroll'].forEach(n=>document.addEventListener(n,release,{passive:true,capture:true}));
 window.addEventListener('blur',release);
})();
cacheAvatar();
setTimeout(runPending,300);
/* links from the Dhivehi Games home page: open the profile, store or Get more Boli directly */
/* warm up online play in the background so Create/Join feel instant */
const idle=window.requestIdleCallback||(fn=>setTimeout(fn,1200));
idle(()=>warmUp(),{timeout:2500});
/* automated tests on this computer only (localhost): read the table and drive moves */
if((!DG_IN_APP&&/^(localhost|127\.0\.0\.1|\[::1\])$/.test(location.hostname)))window.__dg={get S(){return S;},get mode(){return mode;},get screen(){return screen;},get isHost(){return isHost;},get net(){return net;},get VC(){return VC;},get myId(){return myId;},act:act,commit:commit,clone:clone,win:win,deal:deal,pickDiscard:pickDiscard,cover:cover,meIdx:meIdx,mutedP:mutedP,lobbyList:lobbyList,vcT:{ice:vcIce,opus:vcOpus,lvl:vcPeerLevel,redial:vcRedial,TURN:TURN,chip:()=>!!VC.chip&&VC.chip.style.display!=='none'}};
(async()=>{try{if(window.claude&&typeof window.claude.use==='function')db=await window.claude.use('db');}catch(e){db=null;}if(db&&screen==='home'){const a=document.activeElement&&document.activeElement.id;if(!a)renderHome();}})();
})();
</script>
