function vcNoSupport(){const why=!window.isSecureContext?'this page isn’t opened over a secure (https) link':!window.RTCPeerConnection?'this browser can’t make voice calls':'this browser doesn’t allow microphone access';
sheet(`<div class="grab"></div><h2>Voice chat isn’t available here</h2><p class="muted" style="margin:4px 0 10px">Voice needs a browser that supports it, and ${why}.</p><ol class="micsteps"><li>Update your browser (Safari, Chrome or Samsung Internet) to the latest version.</li><li>Open the game from its normal link, not inside WhatsApp, Instagram or Facebook.</li><li>On iPhone, iOS 15 or newer is needed.</li></ol><div class="row"><button class="btn primary" data-a="close">OK</button></div>`);}
async function vcMic(){if(vcTable()&&!vcSupported()){vcNoSupport();return;}if(!vcAvail())return;vcAC();VC.peers.forEach(p=>{if(p.au.paused&&p.au.srcObject)p.au.play().catch(()=>{});});
 /* iPhone: the game's 'ambient' audio mode forbids recording (InvalidStateError), so switch to play-and-record first */
 if(!VC.stream){window.__vcRec=true;try{if(navigator.audioSession)navigator.audioSession.type='play-and-record';}catch(e){}
 try{VC.stream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true,autoGainControl:true}});}
  catch(e){if(e&&e.name==='NotAllowedError'||e&&e.name==='SecurityError'){vcMicHelp(e);return;}
   try{VC.stream=await navigator.mediaDevices.getUserMedia({audio:true});}catch(e2){vcMicHelp(e2);return;}}VC.me=vcMeter(VC.stream);}
 VC.on=!VC.on;VC.stream.getAudioTracks().forEach(t=>t.enabled=VC.on);VC.peers.forEach(vcAttach);
 buzz(6);toast(VC.on?'Mic on. Everyone at the table can hear you.':'Mic off.');vcUI();}
function vcUI(){const on=VC.on,av=vcAvail();const b=document.getElementById('micbtn');
 if(b){b.hidden=!vcTable()||meIdx()<0;b.setAttribute('aria-pressed',String(on));b.setAttribute('aria-label',on?'Turn mic off':'Turn mic on');const h=on?MIC_ON:MIC_OFF;if(b._h!==h){b.innerHTML=h;b._h=h;}}
 const l=document.getElementById('micl');if(l){l.setAttribute('aria-pressed',String(on));const t=(on?MIC_ON:MIC_OFF)+`<span>${on?'Mic on':'Turn on mic'}</span>`;if(l._h!==t){l.innerHTML=t;l._h=t;}}}
function vcLevel(m){if(!m)return 0;m.an.getByteTimeDomainData(m.buf);let s=0;for(let i=0;i<m.buf.length;i++){const v=(m.buf[i]-128)/128;s+=v*v;}return Math.min(1,Math.sqrt(s/m.buf.length)*5);}
function vcAvatarEl(k,id){if(id===myId&&screen==='table')return document.querySelector('#meinfo .mini');
 if(screen==='table')return document.querySelector(`[data-av="${k}"]`);if(screen==='lobby'){const r=document.querySelectorAll('.lrow')[k];return r&&r.querySelector('.mini');}return null;}
setInterval(()=>{if(!vcAvail()){if(VC.peers.size||VC.stream)vcStopAll();return;}
 if(VC.code&&VC.code!==S.code)vcStopAll();VC.code=S.code;
 const ids=S.players.filter(q=>q.id!==myId&&!q.bot).map(q=>q.id);
 [...VC.peers.keys()].forEach(id=>{if(!ids.includes(id))vcDrop(id);});
 ids.forEach(id=>{const p=VC.peers.get(id);
  if(!p){if(myId<id)vcCall(id);return;}
  const cs=p.pc.connectionState;if(myId<id&&cs!=='connected'&&Date.now()-p.t>15000){vcDrop(id);vcCall(id);}
  p.au.muted=mutedP.has(id);});
 vcUI();},3000);
document.addEventListener('pointerdown',()=>{if(!VC.peers.size)return;vcAC();VC.peers.forEach(p=>{if(p.au.paused&&p.au.srcObject)p.au.play().catch(()=>{});});},{passive:true,capture:true});
setInterval(()=>{if(!S||!VC.peers.size&&!VC.on){if(VC._lit){document.querySelectorAll('.vtalk').forEach(e=>e.classList.remove('vtalk'));VC._lit=false;}return;}
 S.players.forEach((q,k)=>{const raw=q.id===myId?(VC.on?vcLevel(VC.me):0):(mutedP.has(q.id)?0:vcLevel((VC.peers.get(q.id)||{}).meter));
  const lv=VC.lv[q.id]=Math.max(raw,(VC.lv[q.id]||0)*.72);const el=vcAvatarEl(k,q.id);if(!el)return;
  el.style.setProperty('--vl',lv.toFixed(2));el.classList.toggle('vtalk',lv>.06);});VC._lit=true;},90);

/* quick match */
let quickRun=0;
async function quickMatch(){if(db){toast('Quick Match works in the published game.');return;}if(!needName(()=>quickMatch()))return;
const run=++quickRun;cleanupP2P();renderQuickWait('Connecting…');warmUp();
const up=pool?await anyUp(pool,10000):false;if(run!==quickRun)return;
if(!up){setSrv('fail');toast(netErrMsg,5000);renderHome();return;}
setSrv('ok');setQuickText('Looking for an open table…');
await sleep(Object.keys(lobbyList).length?300:1600);if(run!==quickRun)return;
tryQuick(run,new Set());}
function tryQuick(run,tried){if(run!==quickRun)return;if(screen!=='quick')renderQuickWait('Looking for an open table…');
const l=openTables().filter(x=>!tried.has(x.code)).sort((a,b)=>(b.q-a.q)||(b.n-a.n)||(a.c-b.c));const btn=$('#qbtn');if(!btn)return;
if(l.length){const x=l[0];tried.add(x.code);setQuickText('Joining '+x.name+'’s table…');
netJoin(btn,myName(),x.code,{timeout:10000,onFail:()=>{if(run!==quickRun)return;warmUp();tryQuick(run,tried);}});}
else{setQuickText('No open tables. Creating one…');netCreate(btn,myName(),{pub:true,quick:true,onFail:()=>{if(run===quickRun)renderHome();}});}}

/* ---------- online (Claude-hosted db) ---------- */
function listen(){if(unsub)try{unsub();}catch(e){}
unsub=ref.onSnapshot(snap=>{if(!snap||!snap.exists)return;const d=clone(snap.data());
if(S&&S.code===d.code){if((d.rev||0)<(S.rev||0))return;if(d.rev===S.rev&&d.by===S.by)return;}
apply(d);},()=>toast('Lost connection to the table. Leave and join again.'));}
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
function genCode(){const a='ABCDEFGHJKLMNPQRSTUVWXYZ';let s='';for(let i=0;i<4;i++)s+=a[Math.floor(Math.random()*a.length)];return s;}
function nameVal(then){const n=myName();if(!n){openProfile(then,'Choose a name so other players know who you are.');return null;}return n;}
async function create(btn){const name=nameVal(()=>{renderFriends();const b=document.querySelector('[data-a="create"]');if(b)create(b);});if(!name)return;if(!db){netCreate(btn,name,{pub:friendPub});return;}btn.disabled=true;mode='online';
try{let code,r;for(let i=0;i<5;i++){code=genCode();r=db.doc('tables/'+code);const s=await r.get();if(!s.exists||s.data().status==='over')break;}
const d={v:1,rev:1,by:myId,status:'lobby',code:code,hostId:myId,players:[{id:myId,name:name,piece:'manta',score:0}]};
await r.set(d);ref=r;ls.set('lg-room',code);S=null;listen();apply(d);
}catch(e){toast(errMsg(e));btn.disabled=false;}}
async function join(btn,codeArg){const name=nameVal(()=>{renderFriends();const i=$('#code');if(i&&codeArg)i.value=codeArg;const b=document.querySelector('[data-a="join"]');if(b)join(b,codeArg);});if(!name)return;const code=String(codeArg||(($('#code')||{}).value||'')).trim().toUpperCase();
if(!/^[A-Z]{4}$/.test(code)){toast('Table codes are 4 letters.');return;}
if(document.activeElement&&document.activeElement.blur)document.activeElement.blur();
if(!db){netJoin(btn,name,code);return;}mode='online';btn.disabled=true;
try{const r=db.doc('tables/'+code);let s=await r.get();
if(!s.exists){toast('No table found with code '+code+'.');btn.disabled=false;return;}
let d=clone(s.data());
if(!d.players.some(q=>q.id===myId)&&d.status==='lobby'){
for(let i=0;i<6;i++){const l=await r.acquire({holder:myId,ttlMs:4000});if(l.acquired)break;await sleep(400+Math.random()*400);}
s=await r.get();d=clone(s.data());
if(d.status==='lobby'&&!d.players.some(q=>q.id===myId)){
if(d.players.length>=6){toast('That table is full.');btn.disabled=false;return;}
d.players.push({id:myId,name:name,piece:PK.find(id=>!d.players.some(q=>q.piece===id))||PK[0],score:0});d.rev=(d.rev||0)+1;d.by=myId;await r.set(d);}
}else if(!d.players.some(q=>q.id===myId))toast('That game already started. You can watch.');
ref=r;ls.set('lg-room',code);S=null;listen();apply(d);
}catch(e){toast(errMsg(e));btn.disabled=false;}}
async function setPiece(pid){closeSheet();if(mode==='p2p'&&S&&S.status==='lobby'){if(isHost){if(S.players.some(q=>q.id!==myId&&q.piece===pid)){toast('Someone already has that one.');return;}const N=clone(S);N.players[meIdx()].piece=pid;N.rev++;N.by=myId;commit(N);}else joinSend({k:'piece',p:pid});return;}
if(!ref||!S||S.status!=='lobby')return;
try{const s=await ref.get();const d=clone(s.data());if(d.status!=='lobby')return;
if(d.players.some(q=>q.id!==myId&&q.piece===pid)){toast('Someone just took that one.');return;}
const me=d.players.find(q=>q.id===myId);if(!me)return;me.piece=pid;d.rev=(d.rev||0)+1;d.by=myId;apply(d);await ref.set(d);
}catch(e){toast(errMsg(e));}}
async function startGame(){if(!S||S.hostId!==myId||S.players.length<2)return;
if(mode==='p2p'){const d=clone(S);d.players.forEach(p=>p.score=0);deal(d);d.rev=(S.rev||0)+1;d.by=myId;commit(d);return;}
try{const s=await ref.get();const d=clone(s.data());if(d.status!=='lobby')return;d.players.forEach(p=>p.score=0);deal(d);d.rev=(d.rev||0)+1;d.by=myId;commit(d);}catch(e){toast(errMsg(e));}}
async function leave(){closeSheet();closeOv();clearTimeout(botT);botT=null;if(mode==='solo'){clearTimeout(soloSaveT);if(S&&S.status==='over')ls.del('lg-solo');else if(S)ls.set('lg-solo',JSON.stringify(S));mode=null;S=null;renderHome();return;}
if(mode==='p2p'){const n=net;quickRun++;if(n&&n.role==='host')n.players.forEach((pl,tp)=>sendPlayer(tp,pl,{k:'bye'}));else if(n&&S&&S.status==='lobby')joinSend({k:'leave'});
mode=null;S=null;isHost=false;joinInfo=null;keepAwake(false);netClose();renderHome();return;}
if(S&&S.status==='lobby'&&ref&&S.hostId!==myId){try{const s=await ref.get();const d=clone(s.data());if(d.status==='lobby'){d.players=d.players.filter(q=>q.id!==myId);d.rev++;d.by=myId;await ref.set(d);}}catch(e){}}
if(unsub)try{unsub();}catch(e){}unsub=null;ref=null;S=null;renderHome();}

document.addEventListener('click',e=>{const tr=$('#emotray');if(tr&&!tr.hidden&&!e.target.closest('#emotray,#emobtn'))tr.hidden=true;
const cbar=$('#chatbar');if(cbar&&!cbar.hidden&&!e.target.closest('#chatbar,#chatbtn'))closeChat();
const b=e.target.closest('[data-a]');if(!b||b.disabled)return;const a=b.dataset.a;

case 'account':openAccount();break;
case 'acctNew':openAccount('register');break;
case 'acctLogin':openAccount('login');break;

case 'authRegister':authDo('register');break;
case 'authLogout':authLogout();break;
case 'editProfile':openProfile(()=>renderProfile());break;
case 'goStore':renderStore();break;
case 'stab':renderStore(b.dataset.c);break;

case 'buy':buyItem(b.dataset.id);break;
case 'equip':equipItem(b.dataset.id);break;
case 'fxPreview':playEffect(b.dataset.id,$('#bigprev'));break;
case 'smoothToggle':ls.set('dd-smooth',isSmooth()?'0':'1');applyCosmetics();if(screen==='profile')renderProfile();else if(S&&screen==='table'){const f=document.querySelector('.scenefx');if(f&&isSmooth())f.remove();openMenu();}break;

case 'quick':quickMatch();break;

case 'goComputer':renderComputer();break;
case 'goHome':if(fromHub&&(screen==='profile'||screen==='store'||screen==='boli')){location.href='../';break;}renderHome();break;
case 'howto':openHowTo();break;
case 'setPub':{friendPub=b.dataset.v==='1';document.querySelectorAll('[data-a="setPub"]').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));const h=$('#seghint');if(h)h.textContent=friendPub?'Anyone can see and join from Open tables.':'Only people with your invite link or code can join.';break;}
case 'joinOpen':join(b,b.dataset.code);break;
case 'share':shareInvite();break;
case 'copyCode':if(S&&S.code)copyText(S.code,'Code copied');break;
case 'lobbyPub':setLobbyPub(b.dataset.v==='1');break;
case 'kick':kickPlayer(b.dataset.id);break;
case 'emotes':toggleEmotes();break;
case 'chat':{const cb=$('#chatbar');if(cb&&!cb.hidden)closeChat();else openChat();break;}
case 'chatSend':sendChat(($('#chatin')||{}).value);break;
case 'chatQuick':sendChat(b.dataset.m);break;
case 'chatToggle':ls.set('dd-chat',chatOff()?'1':'0');if(chatOff())closeChat();if(S){renderTable();openMenu();}break;
case 'emote':sendEmote(b.dataset.e);break;
case 'opp':openPlayer(+b.dataset.k);break;
case 'blockp':{const id=b.dataset.id;const k=S?S.players.findIndex(q=>q.id===id):-1;const p=k>=0?S.players[k]:null;if(isBlocked(id)){BLK.splice(BLK.findIndex(x=>x.id===id),1);mutedP.delete(id);toast('Player unblocked.');}else{BLK.push({id:id,name:p?p.name:'Player',t:Date.now()});mutedP.add(id);toast('Blocked. You won’t see their chat or reactions.');}saveBlk();if(k>=0)openPlayer(k);else if(screen==='profile')openBlocked();break;}
case 'reportp':openReport(b.dataset.id);break;
case 'sendReport':sendReport(b.dataset.id);break;
case 'blocked':openBlocked();break;
case 'unblock':{const id=b.dataset.id;const j=BLK.findIndex(x=>x.id===id);if(j>=0){BLK.splice(j,1);mutedP.delete(id);saveBlk();}openBlocked();break;}
case 'support':openSupport();break;
case 'sendSupport':sendSupport();break;
case 'privacy':window.open(PRIVACY_URL,'_blank','noopener');break;
case 'delAcct':openDeleteAccount();break;
case 'delAcctGo':deleteAccount();break;
case 'mutep':{const id=b.dataset.id;if(mutedP.has(id))mutedP.delete(id);else mutedP.add(id);const k=S?S.players.findIndex(q=>q.id===id):-1;if(k>=0)openPlayer(k);break;}
case 'emute':ls.set('dd-emute',emotesMuted()?'0':'1');if(S)openMenu();break;
case 'music':{AU.unlock();const want=ls.get('dd-music')==='0';ls.set('dd-music',want?'1':'0');const v=screen==='table'?Music.set(want):want;document.querySelectorAll('[data-a="music"]').forEach(x=>x.setAttribute('aria-pressed',String(v)));if($('#sheet').classList.contains('open')&&S)openMenu();break;}
case 'sfx':{const v=ls.get('dd-sfx')==='0';ls.set('dd-sfx',v?'1':'0');if(v){AU.unlock();SFX.tick();}if(S)openMenu();break;}
case 'create':create(b);break;
case 'bots':soloBots=+b.dataset.n;document.querySelectorAll('[data-a="bots"]').forEach(x=>{const on=+x.dataset.n===soloBots;x.classList.toggle('primary',on);x.classList.toggle('soft',!on);x.setAttribute('aria-pressed',on);});break;
case 'rounds':{const n=+b.dataset.n;if(!ROUND_OPTS.includes(n))break;if(screen==='computer'){soloRounds=n;ls.set('dd-rounds',String(n));renderComputer();}else if(S&&S.status==='lobby'&&S.hostId===myId){const d=clone(S);d.rounds=n;d.rev=(S.rev||0)+1;d.by=myId;commit(d);}break;}
case 'mic':vcMic();break;
case 'getBoli':openBoli();break;
case 'buyBoli':buyBoli(+b.dataset.i);break;
case 'adBoli':adBoli();break;
case 'profColor':{profColor=b.dataset.c;document.querySelectorAll('.copt').forEach(x=>x.classList.toggle('sel',x.dataset.c===profColor));document.querySelectorAll('.popt .pz').forEach(x=>x.style.setProperty('--c',profColor));break;}
case 'solo':startSolo();break;
case 'resumeSolo':try{const d=JSON.parse(ls.get('lg-solo'));mode='solo';ref=null;S=null;apply(d);scheduleBot();}catch(err){ls.del('lg-solo');renderHome();}break;
case 'join':join(b);break;
case 'pick':openPicker();break;
case 'setPiece':setPiece(b.dataset.p);break;

case 'leave':leave();break;
case 'menu':openMenu();break;

}});

/* ---------- screen entrance: each new screen's content rises in; the AK fan deals itself in on the home page ---------- */
(function(){let shown='';
 {const m0=app.querySelector(':scope>main');if(m0&&!m0.classList.contains('table')){shown=screen;if(!reduce){m0.classList.add('enter');m0._et=setTimeout(()=>m0.classList.remove('enter'),1400);}}}
 const musicGate=()=>{const want=ls.get('dd-music')!=='0'&&screen==='table';if(want!==Music.on){if(want)AU.unlock();Music.set(want);}};
 new MutationObserver(()=>{musicGate();const m=app.querySelector(':scope>main');if(!m)return;
  if(m.classList.contains('table')){shown='table';return;}
  if(screen===shown)return;shown=screen;if(reduce)return;
  m.classList.add('enter');clearTimeout(m._et);m._et=setTimeout(()=>m.classList.remove('enter'),1400);}).observe(app,{childList:true});
})();

/* ---------- pressed feel for every button and card (menus + in-game buttons) ---------- */
(function(){
 const SEL='button,a,.mode,.sbanner,.acrow,.feat,.soon,.pill,.bpack,.bad,[data-a]';
 const SKIP='.card,.hand,.pile,#fx,.embw,input,textarea,select';
 let cur=null;
 const release=()=>{if(cur){cur.classList.remove('pz-down');cur=null;}};
 document.addEventListener('pointerdown',e=>{const el=e.target.closest&&e.target.closest(SEL);if(!el||el.closest(SKIP)||el.disabled)return;
  const tb=el.closest('main.table');if(tb&&!el.closest('.btn,.icon-btn,.emobtn,.chatbtn,.micbtn'))return;
  release();cur=el;el.classList.add('pz-down');},{passive:true});
 ['pointerup','pointercancel','dragstart','scroll'].forEach(n=>document.addEventListener(n,release,{passive:true,capture:true}));
 window.addEventListener('blur',release);
})();
