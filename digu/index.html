<style>
/* ================= Digu · Island Luxe ================= */
:root{--ink:#15241F;--muted:#6B6354;--panel:#FFFDF8;--cream:#F7F1E6;--line:rgba(21,36,31,.12);--edge:#E6D9C0;--accent:#155E43;--accent-ink:#fff;--deep:#0B3B2B;
 --gold:#C9A45C;--gold2:#E7C97F;--gold3:#F2D49B;--sun:#FFD36E;--red:#C4262E;--cardInk:#15241F;
 --spring:linear(0,.009,.035 2.1%,.141 4.4%,.723 12.9%,.938 16.7%,1.017 19.4%,1.067,1.089 25.4%,1.084 28.1%,1.029 35.3%,1.003 41.2%,.994 47.9%,1 60.1%,1);
 --out:cubic-bezier(.16,1,.3,1);--shadow:0 1px 0 rgba(0,0,0,.03),0 10px 26px -12px rgba(8,40,40,.45);
 --lagoon:radial-gradient(110% 60% at 50% 18%,#1AA0A0 0%,#0C6A76 40%,#073F52 75%,#04283A 100%);
 --cw:clamp(62px,18.5vw,96px);--pw:clamp(58px,17vw,84px);--sw:clamp(36px,10vw,50px)}
@supports not (transition-timing-function:linear(0,1)){:root{--spring:cubic-bezier(.34,1.4,.5,1)}}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
html{background:#04283A;-webkit-text-size-adjust:100%;touch-action:manipulation;overflow-x:hidden;overflow-x:clip}
body{font-family:'Sora',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:14px;line-height:1.45;color:var(--ink);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;overscroll-behavior:none;background:transparent;overflow-x:hidden;overflow-x:clip}
/* one fixed, GPU-composited backdrop (lagoon by default, cream on the store and profile) */
body:before{content:"";position:fixed;inset:0;z-index:-2;pointer-events:none;transform:translateZ(0);background:var(--lagoon)}
html[data-bg="cream"]{background:var(--cream)}
html[data-bg="cream"] body:before{background:radial-gradient(120% 60% at 50% 0%,#FFFFFF 0%,#F7F1E6 55%,#EFE5D3 100%)}
/* slowly drifting sunlight on the water */
.caus{position:fixed;inset:-30%;z-index:-1;pointer-events:none;opacity:.14;will-change:transform;
 background:radial-gradient(closest-side,rgba(255,255,255,.95),transparent 70%) 0 0/120px 90px,radial-gradient(closest-side,rgba(150,235,220,.55),transparent 70%) 40px 30px/160px 120px;animation:caus 22s linear infinite}
.caus.c2{opacity:.08;animation-duration:31s;animation-direction:reverse;background-size:90px 70px,200px 150px}
html[data-bg="cream"] .caus{display:none}
@keyframes caus{to{transform:translate(120px,90px)}}
button{font:inherit;touch-action:manipulation}
[hidden]{display:none!important}
.muted{color:var(--muted)}
h1,h2{margin:0;letter-spacing:-.02em}
h2{font-size:19px;font-weight:700}
.tag{font-size:10px;font-weight:700;padding:2px 8px;border-radius:99px;background:var(--line);flex:none}
.row{display:flex;gap:8px;align-items:center}
/* buttons */
.btn{font-weight:700;border:0;border-radius:15px;padding:13px 18px;min-height:48px;cursor:pointer;background:var(--panel);color:var(--ink);box-shadow:inset 0 0 0 1px var(--edge)}
.btn:disabled{opacity:.5;cursor:default}
.btn.primary{background:linear-gradient(180deg,#1C7353,#155E43);color:#fff;box-shadow:0 3px 0 #0B3B2B,0 10px 20px -10px rgba(11,59,43,.7)}
.btn.gold{background:linear-gradient(180deg,#FFE08A,#E2A93A);color:#3A2305;box-shadow:0 3px 0 #9A6B14,0 10px 20px -10px rgba(226,169,58,.8)}
.btn.soft{background:#F3ECDF;box-shadow:inset 0 0 0 1px var(--edge)}
.btn.ghost{background:transparent;box-shadow:inset 0 0 0 1px var(--edge)}
.btn.wide{width:100%}
.btn.sm{padding:9px 14px;min-height:44px;font-size:13px;border-radius:13px}
.btn.danger{color:var(--accent)}
.btn.danger-solid{background:var(--accent);color:#fff;box-shadow:none}
button:focus-visible,input:focus-visible,a:focus-visible,textarea:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.linkbtn{display:block;margin:12px auto 0;background:none;border:0;font:inherit;font-size:13px;font-weight:600;color:var(--muted);text-decoration:underline;cursor:pointer;padding:10px;min-height:44px}
.linkbtn.danger{color:var(--accent)}
.in{font:inherit;font-size:16px;width:100%;min-height:48px;padding:12px 14px;border-radius:14px;border:1px solid var(--edge);background:#fff;color:var(--ink)}
.in:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(21,94,67,.15)}
label.f{display:block;font-size:12px;font-weight:600;color:var(--muted);margin-bottom:6px}
.icon-btn{width:44px;height:44px;border-radius:14px;border:0;background:rgba(255,255,255,.14);box-shadow:inset 0 0 0 1px rgba(255,255,255,.22);color:#fff;display:grid;place-items:center;cursor:pointer;flex:none;padding:0;text-decoration:none;position:relative}
.icon-btn svg{width:20px;height:20px}
html[data-bg="cream"] .icon-btn{background:#fff;color:var(--ink);box-shadow:inset 0 0 0 1px var(--edge)}
.icon-btn .mute{display:none}.icon-btn[aria-pressed="false"] .mute{display:block}.icon-btn[aria-pressed="false"] .note{opacity:.6}
/* pages */
.page{max-width:540px;margin:0 auto;padding:calc(12px + env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) calc(32px + env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left));color:#fff}
html[data-bg="cream"] .page{color:var(--ink)}
.panel{background:var(--panel);color:var(--ink);border-radius:24px;padding:18px;margin:14px 0;box-shadow:inset 0 0 0 1px rgba(230,217,192,.9),var(--shadow)}
.panel h2{font:800 17px/1.2 Sora,sans-serif;letter-spacing:-.01em}
.subtop{display:flex;align-items:center;gap:12px;margin:4px 0 8px;min-height:48px}
.subtop h1{font:900 26px/1 Fraunces,Georgia,serif;letter-spacing:-.01em;margin-right:auto;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sec{display:flex;align-items:center;gap:10px;margin:22px 4px 10px;font-size:11px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;opacity:.8}
.sec:after{content:"";flex:1;height:1px;background:linear-gradient(90deg,currentColor,transparent);opacity:.35}
.seg{display:flex;background:#EDE3D0;border-radius:16px;padding:5px;gap:5px}
.seg button{flex:1;border:0;background:transparent;color:var(--muted);font-weight:800;font-size:13px;padding:10px;border-radius:12px;min-height:44px;cursor:pointer}
.seg button[aria-pressed="true"]{background:#fff;color:var(--accent);box-shadow:0 2px 6px rgba(0,0,0,.12)}
.seghint{font-size:12px;color:var(--muted);margin:8px 2px 12px}
.or{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:12px;margin:14px 0}
.or:before,.or:after{content:"";flex:1;height:1px;background:var(--line)}
.joinrow .in{text-transform:uppercase;letter-spacing:.3em;font-weight:800;text-align:center;font-size:20px}
.joinrow .btn{min-width:92px}
.code{font:900 54px/1.05 Fraunces,Georgia,serif;letter-spacing:.14em;color:var(--deep);margin-left:.14em}
.lrow{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.lrow:last-of-type{border-bottom:0}
.lname{flex:1;font-weight:700;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ltitle{display:block;font-size:11px;color:var(--muted);font-weight:500}
.rdy{font-size:11px;font-weight:800;padding:4px 9px;border-radius:99px;background:#F3ECDF;color:var(--muted);flex:none;display:inline-flex;align-items:center;gap:4px}
.rdy.ok{background:#E3F2EA;color:#146B45}
.otable{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.otable:last-child{border-bottom:0}
.otable .ot{flex:1;min-width:0}
.otable b{display:block;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.otable small{color:var(--muted);font-size:12px}
/* leaderboard: menu podium and the top-10 list */
.lbbox{display:block;width:100%;text-align:left;margin:12px 0 4px;padding:10px 12px 8px;border:1px solid var(--line);border-radius:16px;background:linear-gradient(180deg,#FFF9EC,#FFFDF8);color:var(--ink);cursor:pointer}
.lbbox .lbh{display:block;font:800 11px/1 Sora,sans-serif;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:8px}
.lbmsg{margin:4px 0 6px;font-size:13px}
.lbpod{display:grid;grid-template-columns:1fr 1.15fr 1fr;gap:6px;align-items:end}
.lbp{position:relative;display:flex;flex-direction:column;align-items:center;text-align:center;min-width:0;padding:6px 2px 4px;border-radius:12px}
.lbp:nth-child(1){order:2}.lbp:nth-child(2){order:1}.lbp:nth-child(3){order:3}
.lbp.p1{background:rgba(242,201,76,.18)}
.lbp.lbme{box-shadow:inset 0 0 0 2px var(--accent)}
.lbp .lbr{position:absolute;top:2px;left:4px;font:800 11px/1 Sora,sans-serif;color:#8A6414}
.lbp .lbf,.lbrow .lbf{display:grid;place-items:center;width:36px;height:36px;border-radius:50%;overflow:hidden;flex:none}
.lbp b{font-size:12.5px;line-height:1.2;margin-top:4px;overflow-wrap:anywhere;word-break:break-word}
.lbp small,.lbrow small{color:var(--muted);font-size:11.5px}
.lbmore{display:flex;align-items:center;justify-content:center;gap:2px;margin-top:6px;font-size:12px;font-weight:700;color:var(--accent)}
.lbmore svg{width:14px;height:14px}
.lblist{display:flex;flex-direction:column;gap:2px}
.lbrow{display:flex;align-items:center;gap:10px;padding:8px 8px;border-radius:12px}
.lbrow.lbme{background:rgba(21,94,67,.1);box-shadow:inset 0 0 0 1.5px rgba(21,94,67,.45)}
.lbrow.mine{margin-top:8px}
.lbrow .lbn{width:22px;text-align:center;font:800 13px/1 Sora,sans-serif;color:var(--muted);flex:none}
.lbrow .lbt{flex:1;min-width:0;display:flex;flex-direction:column}
.lbrow .lbt b{font-size:14px;line-height:1.25;overflow-wrap:anywhere;word-break:break-word}
.lbrow .lbs{display:flex;flex-direction:column;align-items:flex-end;flex:none;text-align:right}
.lbrow .lbs b{font-size:13px}
.empty-list{color:var(--muted);font-size:13px;margin:4px 0}
.qwait{text-align:center}
.spin{width:34px;height:34px;border-radius:50%;border:3px solid var(--line);border-top-color:var(--accent);margin:4px auto 12px;animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.pick{display:flex;gap:8px;flex-wrap:wrap}
.pick .btn{flex:1;min-width:48px}
.pick .btn[aria-pressed="true"]{background:linear-gradient(180deg,#1C7353,#155E43);color:#fff;box-shadow:0 3px 0 #0B3B2B}
.hint{font-size:12.5px;color:var(--muted);margin:10px 2px 0;line-height:1.45}
.hint b{color:var(--ink)}
/* server status */
.srv{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--muted);margin:10px 4px 0}
.srv i{width:8px;height:8px;border-radius:50%;background:#E8B232;flex:none}
.srv.s-ok i{background:#2FA66A}.srv.s-fail i{background:#D0443A}.srv.s-fail{color:#C8453A}
.modes .srv,.page>.srv{color:rgba(255,255,255,.85)}
/* ---------- avatars ---------- */
.mini{width:34px;height:34px;flex:none;display:block;position:relative}
.pz{display:grid;place-items:center;width:100%;height:100%;border-radius:50%;background:var(--c);box-shadow:0 0 0 2px #fff,0 3px 8px rgba(0,0,0,.2);color:#fff;overflow:hidden}
.pz svg{width:70%;height:70%;display:block}
.pz.chr{background:#CFE7F2}
.pz.chr svg{width:100%;height:100%}
.frm{position:relative;isolation:isolate}
.frm>.pz{position:relative;z-index:1}
.pmid{width:52px!important;height:52px!important}.pbig{width:88px!important;height:88px!important;margin:0 auto 10px}
.crown{position:absolute;left:50%;top:-12px;width:24px;height:16px;translate:-50% 0;z-index:4;filter:drop-shadow(0 1px 2px rgba(0,0,0,.35));animation:crownin .6s var(--spring) both}
.crown svg{width:100%;height:100%;display:block}
@keyframes crownin{from{opacity:0;scale:.4}}
.hostb{position:absolute;left:50%;bottom:-6px;transform:translateX(-50%);z-index:4;font:800 8px/1 Sora,sans-serif;letter-spacing:.08em;padding:3px 6px;border-radius:99px;background:#F4F7F8;color:#1E3036;box-shadow:0 0 0 1.5px rgba(10,25,30,.55);text-transform:uppercase;white-space:nowrap}
.hostpill{display:inline-block;vertical-align:2px;margin-left:6px;font:800 8.5px/1 Sora,sans-serif;letter-spacing:.08em;text-transform:uppercase;padding:3px 6px;border-radius:99px;background:#E3EAEC;color:#1E3036;box-shadow:inset 0 0 0 1px rgba(30,48,54,.25)}
.lefttag{display:inline-block;margin-left:6px;font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:#8A2B2B;opacity:.9}
.vtalk{border-radius:50%!important;box-shadow:0 0 0 calc(2px + var(--vl,0)*6px) rgba(47,166,106,.6),0 0 calc(6px + var(--vl,0)*18px) rgba(47,166,106,.5)!important;transition:box-shadow .09s linear}
/* ---------- playing cards ---------- */
.card{--w:var(--cw);position:absolute;left:0;top:0;width:var(--w);height:calc(var(--w)*1.4);border-radius:calc(var(--w)*.1);user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
.face,.back{position:absolute;inset:0;border-radius:inherit;overflow:hidden}
.face{--sc:#141414;background:linear-gradient(168deg,#FFFEFA 0%,#FAF5EA 60%,#F3ECDD 100%);color:var(--sc);
 box-shadow:inset 0 0 0 1px rgba(40,30,10,.09),inset 0 1px 0 #fff,0 1px 1px rgba(4,40,60,.12),0 8px 18px -6px rgba(4,40,60,.4)}
.face.H,.face.D{--sc:#C4262E}
.ix{position:absolute;left:calc(var(--w)*.04);top:calc(var(--w)*.05);width:calc(var(--w)*.34);display:flex;flex-direction:column;align-items:center;z-index:1}
.ix b{font-family:'DM Serif Display',Georgia,'Times New Roman',serif;font-weight:400;font-size:calc(var(--w)*.42);line-height:.92;letter-spacing:-.07em;margin-left:-.07em}
.ix svg{width:calc(var(--w)*.2);height:calc(var(--w)*.2);margin-top:calc(var(--w)*.02)}
.face .big{position:absolute;left:50%;top:56%;width:calc(var(--w)*.5);height:calc(var(--w)*.5);transform:translate(-40%,-50%)}
.face .ace{position:absolute;left:50%;top:55%;width:calc(var(--w)*.62);height:calc(var(--w)*.62);transform:translate(-44%,-50%);filter:drop-shadow(0 2px 3px rgba(0,0,0,.14))}
.face .court{position:absolute;left:30%;right:5%;top:17%;bottom:5%}
.face .court svg,.face .ace svg{width:100%;height:100%;display:block}
/* default back: lagoon green, cream + gold frame, lattice and a gold medallion */
.back{background:#0B3B2B;box-shadow:0 1px 1px rgba(4,40,60,.14),0 8px 18px -6px rgba(0,0,0,.5)}
.back.bdef{background:radial-gradient(120% 90% at 50% 20%,#155E43,#0B3B2B 70%);box-shadow:inset 0 0 0 calc(var(--w)*.035) #F7EFDF,inset 0 0 0 calc(var(--w)*.06) #C9A45C,0 1px 1px rgba(0,0,0,.2),0 8px 18px -6px rgba(0,0,0,.5)}
.back.bdef:before{content:"";position:absolute;inset:calc(var(--w)*.11);border-radius:calc(var(--w)*.05);background:repeating-linear-gradient(45deg,rgba(231,201,127,.22) 0 1px,transparent 1px 7px),repeating-linear-gradient(-45deg,rgba(231,201,127,.22) 0 1px,transparent 1px 7px);box-shadow:inset 0 0 0 1px rgba(231,201,127,.55)}
.back.bdef:after{content:"";position:absolute;left:50%;top:50%;width:calc(var(--w)*.42);height:calc(var(--w)*.42);margin:calc(var(--w)*-.21);border-radius:50%;background:radial-gradient(circle,#0B3B2B 55%,transparent 57%),conic-gradient(from 45deg,#E7C97F,#B8863F,#E7C97F,#B8863F,#E7C97F);box-shadow:0 0 0 2px rgba(11,59,43,.9)}
.back.imgback>i{position:absolute;inset:0;background-size:cover;background-position:center;border-radius:inherit}
.back.imgback:after{content:"";position:absolute;inset:0;border-radius:inherit;box-shadow:inset 0 0 0 calc(var(--w)*.03) rgba(255,255,255,.55)}
/* ================= Digu home ================= */
.hometop{display:flex;align-items:center;gap:8px;min-height:48px}
.profbtn{display:flex;align-items:center;gap:9px;height:48px;padding:0 14px 0 5px;border:0;border-radius:99px;background:rgba(255,255,255,.14);box-shadow:inset 0 0 0 1px rgba(255,255,255,.22);color:#fff;cursor:pointer;margin-right:auto;min-width:0;flex:0 1 auto}
.profbtn .mini{width:38px;height:38px}
.profbtn .pwrap{display:flex;flex-direction:column;min-width:0;line-height:1.15;text-align:left}
.profbtn .pn{font-weight:700;font-size:13.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.profbtn .ps{font-size:10.5px;font-weight:700;color:#FFE3A8;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.shellpill{display:inline-flex;align-items:center;gap:6px;height:44px;padding:0 14px 0 10px;border:0;border-radius:99px;background:rgba(255,255,255,.14);box-shadow:inset 0 0 0 1px rgba(255,255,255,.22);color:#fff;font:inherit;font-weight:800;font-size:14px;cursor:pointer;flex:none}
html[data-bg="cream"] .shellpill{background:#fff;color:var(--ink);box-shadow:inset 0 0 0 1px var(--edge),0 2px 0 var(--edge)}
img.boli{display:inline-block;width:18px;height:18px;object-fit:contain;vertical-align:-3px;filter:drop-shadow(0 1px 1.5px rgba(0,0,0,.28))}
.shellpill img.boli{width:24px;height:24px;vertical-align:middle}
.dhero{position:relative;height:clamp(190px,56vw,240px);margin-top:4px;pointer-events:none}
.dhero .card{--w:clamp(78px,24vw,100px);left:50%;top:28px;margin-left:calc(var(--w)/-2);transform-origin:50% 130%;animation:heroIn 1s var(--spring) both,breathe 6s ease-in-out 1.2s infinite}
.dhero .card:nth-child(1){--r:-18deg;left:44%;animation-delay:.05s,1.2s}
.dhero .card:nth-child(2){--r:18deg;left:56%;animation-delay:.15s,1.5s}
.dhero .card:nth-child(3){--r:0deg;top:12px;animation-delay:.25s,1.8s}
@keyframes breathe{0%,100%{transform:rotate(var(--r)) translateY(0)}50%{transform:rotate(calc(var(--r) * 1.12)) translateY(-6px)}}
@keyframes heroIn{from{transform:rotate(0) translateY(60px) scale(.8);opacity:0}to{transform:rotate(var(--r)) translateY(0);opacity:1}}
.dtitle{position:relative;text-align:center;margin-top:clamp(-46px,-10vw,-30px)}
.dtitle h1{font:900 clamp(52px,17vw,68px)/.9 Fraunces,Georgia,serif;letter-spacing:.02em;margin:0;text-shadow:0 6px 24px rgba(0,0,0,.35)}
.dtitle p{margin:8px 0 0;font:italic 700 15px/1 Fraunces,Georgia,serif;color:#FFE3A8}
.modes{position:relative;display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:22px 0 0}
.mode{position:relative;border:0;text-align:left;font:inherit;color:#fff;cursor:pointer;border-radius:22px;padding:14px;min-height:118px;display:flex;flex-direction:column;justify-content:flex-end;gap:2px;background:rgba(255,255,255,.1);box-shadow:inset 0 0 0 1px rgba(255,255,255,.2);overflow:hidden}
.mode .mi{position:absolute;top:12px;left:12px;width:40px;height:40px;border-radius:13px;display:grid;place-items:center;background:rgba(255,255,255,.16)}
.mode .mi svg{width:21px;height:21px}
.mode b{font-size:15.5px;font-weight:800}.mode small{font-size:11.5px;opacity:.82;line-height:1.3}
.mode .tag{position:absolute;top:12px;right:12px;font-size:9.5px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;background:#FF6B4A;color:#fff;padding:4px 8px;border-radius:99px}
.mode.quick{grid-column:1/-1;min-height:96px;flex-direction:row;align-items:center;gap:14px;background:linear-gradient(120deg,#FFD56B,#F29E3D);color:#3A2305;box-shadow:0 6px 0 #B5701F,0 18px 30px -12px rgba(242,158,61,.65);margin-bottom:6px}
.mode.quick:after{content:"";position:absolute;top:-60%;left:-40%;width:35%;height:220%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.38),transparent);transform:rotate(14deg);animation:sheen 5s ease-in-out infinite}
@keyframes sheen{0%,62%{translate:0 0}100%{translate:520% 0}}
.mode.quick .mi{position:static;background:rgba(255,255,255,.42);width:52px;height:52px;border-radius:16px;flex:none}
.mode.quick .mi svg{width:28px;height:28px}
.mode.quick .mt{display:flex;flex-direction:column;min-width:0;flex:1}
.mode.quick b{font-size:19px}.mode.quick small{opacity:.85}
.mode.quick .lv{flex:none;font-size:11px;font-weight:800;background:rgba(255,255,255,.5);padding:5px 10px;border-radius:99px;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.mode.quick .lv i{position:relative;width:7px;height:7px;border-radius:50%;background:#1C9A55}
.mode.quick .lv i:after{content:"";position:absolute;inset:0;border-radius:50%;background:rgba(28,154,85,.55);animation:ping 1.8s ease-out infinite}
@keyframes ping{from{transform:scale(1);opacity:.9}to{transform:scale(2.8);opacity:0}}
.resume{position:relative;display:flex;align-items:center;gap:10px;width:100%;margin:12px 0 0;padding:10px 10px 10px 14px;border:0;border-radius:18px;background:rgba(0,0,0,.22);box-shadow:inset 0 0 0 1px rgba(255,227,168,.32);font:inherit;font-size:12.5px;color:#fff;text-align:left;cursor:pointer;min-height:54px}
.resume b{color:#FFE3A8}.resume .go{margin-left:auto;flex:none;font-weight:800;color:#3A2305;background:#FFE3A8;padding:8px 14px;border-radius:99px;font-size:12px}
.podium{position:relative;margin:18px 0 0;padding:14px 14px 0;border-radius:24px;background:rgba(255,255,255,.08);box-shadow:inset 0 0 0 1px rgba(255,255,255,.15);overflow:hidden}
.podium h3{margin:0 0 12px;font-size:11px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;opacity:.82}
.pods{display:flex;align-items:flex-end;justify-content:center;gap:10px;min-height:150px}
.pod{text-align:center;width:31%;max-width:96px;min-width:0}
.pod .pf{display:block;width:52px;height:52px;margin:0 auto;border-radius:50%;overflow:hidden;box-shadow:0 0 0 2.5px #fff}
.pod .pf svg{width:100%;height:100%;display:block}
.pod.p1 .pf{width:64px;height:64px;box-shadow:0 0 0 3px #F2C94C,0 0 18px rgba(242,201,76,.6)}
.pod b{display:block;font-size:12px;margin-top:6px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.pod small{font-size:10.5px;opacity:.78}
.pod .step{margin-top:6px;height:var(--h);border-radius:12px 12px 4px 4px;background:linear-gradient(180deg,rgba(255,255,255,.24),rgba(255,255,255,.06));display:grid;place-items:center;font:900 20px/1 Fraunces,Georgia,serif;transform-origin:50% 100%;animation:stepup .9s var(--spring) both .3s}
.pod.p1 .step{background:linear-gradient(180deg,rgba(242,201,76,.5),rgba(242,201,76,.1))}
@keyframes stepup{from{transform:scaleY(0)}}
.podium .muted{color:rgba(255,255,255,.75);font-size:12.5px;padding:0 0 14px;text-align:center;margin:0}
.homebelow{margin-top:18px}
.acrow{display:flex;align-items:center;gap:12px;width:100%;min-height:60px;margin:0 0 12px;padding:9px 12px 9px 10px;border:0;border-radius:18px;background:var(--panel);box-shadow:inset 0 0 0 1px var(--edge);color:var(--ink);font:inherit;text-align:left;cursor:pointer}
.acrow .ai{flex:none;width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:var(--accent);color:#fff}
.acrow .ai svg{width:20px;height:20px}
.acrow .at{flex:1;min-width:0;line-height:1.25}.acrow b{display:block;font-size:15px}.acrow small{display:block;font-size:12.5px;color:var(--muted)}
.acrow .go{color:var(--muted);display:grid}.acrow .go svg{width:18px;height:18px}
.sbanner{position:relative;display:flex;align-items:center;gap:12px;width:100%;border:0;text-align:left;font:inherit;color:#fff;cursor:pointer;border-radius:22px;padding:12px 14px 12px 12px;margin:0 0 12px;background:radial-gradient(90% 120% at 80% 30%,#2A1A55,#0E0A22 75%);box-shadow:0 14px 30px -16px rgba(0,0,0,.7),inset 0 0 0 1px rgba(255,255,255,.1);overflow:hidden}
.sbanner .sprev{width:78px;height:78px;flex:none;display:grid;place-items:center;position:relative}
.sbanner .sbt{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.sbanner small{font-size:10px;font-weight:800;letter-spacing:.14em;color:#F2C94C}
.sbanner b{font:900 20px/1.05 Fraunces,Georgia,serif;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sbanner .sprice{display:inline-flex;align-items:center;gap:5px;font-weight:800;font-size:13px;margin-top:4px}
.sbanner .go{opacity:.7;display:grid}.sbanner .go svg{width:20px;height:20px}
.howbtn{display:flex;align-items:center;justify-content:center;gap:8px;color:#fff;background:rgba(255,255,255,.08);box-shadow:inset 0 0 0 1px rgba(255,255,255,.3)}
.howbtn svg{width:18px;height:18px}
.powered{display:flex;align-items:center;justify-content:center;gap:10px;margin-top:14px;font-size:11px;font-weight:600;letter-spacing:.04em;color:rgba(255,255,255,.8)}
.powered .pw{height:38px;min-width:100px;max-width:180px;padding:5px 12px;border-radius:10px;background:rgba(255,255,255,.96);color:#0D2E43;display:grid;place-items:center;overflow:hidden;font-weight:800;text-decoration:none}
.powered .pw img{max-width:100%;max-height:100%;object-fit:contain;display:block}
.powered .pw.ph{background:rgba(255,255,255,.08);border:1px dashed rgba(255,227,168,.6);color:#FFE3A8;font-weight:600;font-size:12px}
.powered.inpanel{color:var(--muted);margin-top:14px}
.powered.inpanel .pw{box-shadow:inset 0 0 0 1px var(--line)}
.powered.inpanel .pw.ph{background:#FBF7EF;color:#8A7453;border-color:#D8C7A6}
.dgkick{display:inline-block;margin-top:10px;font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);text-decoration:none;padding:4px 10px;border-radius:99px;background:rgba(255,253,249,.8);box-shadow:inset 0 0 0 1px #E3D5BD}
.snote{color:rgba(255,255,255,.8);font-size:12px;text-align:center;margin:16px 8px 0}
html[data-bg="cream"] .snote{color:#8A7B66}
/* ================= rules card ================= */
.rcard{text-align:left}
.rcard .rtop{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.rcard .rbadge{flex:none;width:52px;height:52px;border-radius:16px;display:grid;place-items:center;background:linear-gradient(160deg,#1C7353,#0B3B2B);color:#F2D49B;box-shadow:inset 0 0 0 1.5px rgba(242,212,155,.6)}
.rcard .rbadge svg{width:28px;height:28px}
.rcard.blitz .rbadge{background:linear-gradient(160deg,#FF8A4A,#E23B3B);color:#fff}
.rcard h2{font:900 26px/1 Fraunces,Georgia,serif;margin:0}
.rcard .rsub{font-size:12.5px;color:var(--muted);margin-top:3px}
.rlist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.rlist li{display:flex;gap:10px;align-items:flex-start;font-size:13.5px;line-height:1.4;padding:10px 12px;border-radius:14px;background:#F6F0E4}
.rlist li i{flex:none;font-style:normal;width:24px;height:24px;border-radius:8px;display:grid;place-items:center;background:#fff;box-shadow:inset 0 0 0 1px var(--edge);font-size:13px}
.rlist li.hl{background:linear-gradient(90deg,#FFF1D6,#FFE3C4);box-shadow:inset 0 0 0 1.5px #F0A24A}
.rlist li.hl i{background:#FF8A4A;color:#fff;box-shadow:none}
.rlist b{font-weight:800}
.rmini{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.rmini span{font-size:11.5px;font-weight:700;padding:5px 10px;border-radius:99px;background:#F3ECDF;color:var(--ink)}
.rmini span.hl{background:#FFE3C4;color:#8A3B0A}
/* ================= table: Island Luxe ================= */
main.table{position:fixed;inset:0;display:flex;flex-direction:column;overflow:hidden;color:#fff;background:radial-gradient(120% 75% at 50% 42%,#0E5F6E 0%,#083C4C 55%,#042331 100%);
 padding:env(safe-area-inset-top) env(safe-area-inset-right) 0 env(safe-area-inset-left)}
main.table>*{width:100%;max-width:640px;margin-left:auto;margin-right:auto}
.topbar{position:relative;z-index:6;display:flex;align-items:center;gap:8px;padding:8px 10px 0}
.goal{flex:1;min-width:0;display:flex;justify-content:center}

.goal .bz{color:#FF9A6B}
.tools{display:flex;gap:6px;flex:none}
.chatbtn .dot{position:absolute;top:8px;right:8px;width:9px;height:9px;border-radius:50%;background:#F2C94C;box-shadow:0 0 0 2px rgba(6,52,72,.55)}
.emobtn{font-size:20px}
.emobtn.cd{opacity:.4}
.micbtn[aria-pressed="true"]{background:#2FA66A!important;color:#fff!important}

.arena{position:relative;flex:1;min-height:0}
.seats{position:absolute;inset:0;z-index:3;pointer-events:none}
.seat{--av:clamp(40px,12.4vw,50px);position:absolute;left:0;top:0;width:76px;margin-left:-38px;display:flex;flex-direction:column;align-items:center;gap:3px;pointer-events:auto;cursor:pointer;transition:transform .6s var(--spring),opacity .3s;-webkit-tap-highlight-color:transparent;border-radius:14px}
.seats.n5 .seat,.seats.n4 .seat{width:68px;margin-left:-34px;--av:clamp(38px,11.4vw,48px)}
.seat .av{position:relative;width:var(--av);height:var(--av);isolation:isolate;border-radius:50%}
.seat .av .mini,.meav .mini{width:100%;height:100%}
.seat .nm{font-size:11px;font-weight:700;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-shadow:0 1px 2px rgba(0,0,0,.6);margin-top:3px}
.seat .cnt{font-size:10px;font-weight:700;background:rgba(0,0,0,.32);padding:2px 8px;border-radius:99px;white-space:nowrap;font-variant-numeric:tabular-nums}
.seat.gone{opacity:.5}
.aitag{font-size:8.5px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;padding:2px 6px;border-radius:99px;background:rgba(255,255,255,.92);color:#0B3B2B;white-space:nowrap}
.aitag.left{color:#8A2B2B}
/* the little fan of card backs each opponent holds */
/* opponent's fan in their own card back: bigger when there is room, smaller on crowded tables */
.hfan{--fw:19px;position:absolute;right:calc(var(--fw)*-.85);bottom:-2px;width:calc(var(--fw)*1.6);height:calc(var(--fw)*1.55);z-index:0;pointer-events:none}
.seats.n4 .hfan,.seats.n5 .hfan,.seats.n6 .hfan{--fw:17.5px}
@media (max-width:360px){.seats.n4 .hfan,.seats.n5 .hfan,.seats.n6 .hfan{--fw:16px}}
.hfan i{position:absolute;left:calc(var(--fw)*.3);top:0;width:var(--fw);height:calc(var(--fw)*1.4);border-radius:3px;overflow:hidden;transform-origin:50% 120%;background:#0B3B2B center/cover;box-shadow:0 0 0 1px rgba(255,253,249,.8),0 2px 4px rgba(0,0,0,.35)}
.hfan i.bdef{background:radial-gradient(120% 90% at 50% 20%,#155E43,#0B3B2B 70%);box-shadow:inset 0 0 0 1.5px #C9A45C,0 0 0 1px rgba(255,253,249,.8),0 2px 4px rgba(0,0,0,.35)}
.hfan i:nth-child(1){transform:rotate(-16deg)}.hfan i:nth-child(2){transform:rotate(0)}.hfan i:nth-child(3){transform:rotate(16deg)}
.hfan.bump{animation:bump .5s var(--spring)}
@keyframes bump{40%{transform:scale(1.25)}}
/* turn: a glowing ring around the avatar that drains clockwise (transform-only) */
.av.on:before{content:"";position:absolute;inset:-7px;border-radius:50%;box-shadow:0 0 14px 3px var(--tg,rgba(255,211,110,.75));animation:tglow 1.6s ease-in-out infinite;pointer-events:none;z-index:-1}
@keyframes tglow{0%,100%{opacity:.45}50%{opacity:1}}
.tmr{--tc:#FFD36E;position:absolute;inset:-6px;border-radius:50%;z-index:3;pointer-events:none;background:rgba(255,255,255,.16);
 -webkit-mask:radial-gradient(farthest-side,transparent calc(100% - 4.5px),#000 calc(100% - 4px));mask:radial-gradient(farthest-side,transparent calc(100% - 4.5px),#000 calc(100% - 4px))}
.tmr i{position:absolute;top:0;bottom:0;width:50%;overflow:hidden}
.tmr i.l{left:0}.tmr i.r{right:0}
.tmr b{position:absolute;top:0;bottom:0;width:200%;will-change:transform;animation:var(--an) var(--d,15s) linear var(--dl,0s) both}
.tmr .l b{left:0;background:linear-gradient(90deg,var(--tc) 50%,transparent 50%);--an:tmL}
.tmr .r b{left:-100%;background:linear-gradient(90deg,transparent 50%,var(--tc) 50%);--an:tmR}
@keyframes tmL{0%{transform:rotate(0)}50%,100%{transform:rotate(-180deg)}}
@keyframes tmR{0%,50%{transform:rotate(0)}100%{transform:rotate(-180deg)}}
.tmr.warn{--tc:#FF9A3D}.tmr.hot{--tc:#FF4D4D}
.av.on.warn{--tg:rgba(255,154,61,.8)}.av.on.hot{--tg:rgba(255,77,77,.85)}
/* centre of the felt */
.status{position:absolute;left:50%;top:var(--sy,40%);transform:translate(-50%,-50%);z-index:4;max-width:min(88%,330px);text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
 font-size:12.5px;font-weight:700;padding:8px 16px;border-radius:99px;background:rgba(3,25,33,.6);box-shadow:inset 0 0 0 1px rgba(242,212,155,.35);transition:background .3s,box-shadow .3s}
.status b{color:#F2D49B;font-weight:800}
.status.mine{background:rgba(3,25,33,.72);box-shadow:inset 0 0 0 1.5px rgba(255,211,110,.85),0 0 18px rgba(255,211,110,.35)}
#status[data-t]::after{content:" · " attr(data-t);font-variant-numeric:tabular-nums;opacity:.8}
#status[data-hot]::after{color:#FF8A6B;opacity:1;font-weight:800}
.piles{position:absolute;left:50%;top:var(--py,62%);transform:translate(-50%,-50%);z-index:4;display:flex;gap:clamp(20px,7vw,34px)}
.pile{all:unset;position:relative;display:block;width:var(--pw);height:calc(var(--pw)*1.4);cursor:pointer;border-radius:calc(var(--pw)*.1);-webkit-tap-highlight-color:transparent;touch-action:manipulation}
.pile .card{--w:var(--pw)}
.pile:focus-visible{outline:2px solid var(--gold2);outline-offset:6px}
.pile.can:after,.pile.drop:after{content:"";position:absolute;inset:-6px;border-radius:calc(var(--pw)*.15);box-shadow:0 0 0 2.5px rgba(255,211,110,.95),0 0 22px rgba(255,211,110,.7);animation:pglow 1.6s ease-in-out infinite;pointer-events:none;z-index:6}
.pile.drop:after{animation:none;transform:scale(1.05);background:rgba(255,227,145,.16)}
@keyframes pglow{0%,100%{opacity:.4}50%{opacity:1}}
.pile:active .card:last-of-type{transform:translateY(2px)}
.empty{position:absolute;inset:0;border-radius:inherit;border:2px dashed rgba(255,255,255,.35)}
.pcount{position:absolute;right:-9px;top:-9px;z-index:7;min-width:24px;height:24px;padding:0 6px;border-radius:99px;background:#0B2A36;color:#FFE3A8;font:800 11px/24px Sora,sans-serif;text-align:center;box-shadow:0 0 0 2px rgba(255,227,168,.5)}
.pile.shuffling .card{animation:shufA .39s ease-in-out 2}
.pile.shuffling .card:nth-child(2n){animation-name:shufB}
@keyframes shufA{50%{translate:-38% -6px;rotate:-7deg}}
@keyframes shufB{50%{translate:38% -6px;rotate:7deg}}
/* you */
.me{position:relative;z-index:5;padding:0 0 calc(8px + env(safe-area-inset-bottom));background:linear-gradient(180deg,transparent,rgba(2,18,26,.55) 38%)}
.mebar{display:flex;align-items:center;gap:10px;padding:4px 12px 0;min-height:64px}
.meinfo{display:flex;align-items:center;gap:10px;min-width:0;flex:1}

.meinfo>div{min-width:0}
.acts{display:flex;gap:8px;flex:none;align-items:center}

.yt{font:900 12.5px/1 Sora,sans-serif;letter-spacing:.12em;text-transform:uppercase;color:#3A2305;background:linear-gradient(180deg,#FFE08A,#E2A93A);padding:10px 16px;border-radius:99px;box-shadow:0 4px 0 #9A6B14,0 0 20px rgba(242,201,76,.6);animation:ytp 2.2s ease-in-out infinite,ytin .6s var(--spring) both;white-space:nowrap}
@keyframes ytp{0%,100%{transform:scale(1)}50%{transform:scale(1.07)}}
@keyframes ytin{from{opacity:0;translate:0 10px}}
.ginb{position:relative;height:48px;padding:0 24px;border:0;border-radius:15px;font:900 17px/1 Sora,sans-serif;letter-spacing:.08em;color:#3A2A05;background:linear-gradient(180deg,#FFE08A,#E2A93A);cursor:pointer;box-shadow:0 4px 0 #9A6B14;animation:ytp 2.2s ease-in-out infinite,ytin .6s var(--spring) both}
.ginb:after{content:"";position:absolute;inset:0;border-radius:inherit;box-shadow:0 0 28px 4px rgba(242,201,76,.85);animation:tglow 1.6s ease-in-out infinite;pointer-events:none}
.hand{position:relative;height:calc(var(--cw)*1.4 + 44px);margin:0 4px;touch-action:none;contain:layout}

.hand .card.inm .face{box-shadow:inset 0 0 0 2px #E0B458,0 0 0 1.5px rgba(224,180,88,.55),0 0 16px rgba(224,180,88,.4),0 8px 16px -6px rgba(0,0,0,.55)}
.mtk{position:absolute;left:0;top:0;width:20px;height:20px;border-radius:50%;background:#F2C94C;color:#3A2A05;font:900 11px/20px Sora,sans-serif;font-style:normal;text-align:center;box-shadow:0 0 0 1.5px #fff,0 2px 6px rgba(0,0,0,.35);z-index:150;pointer-events:none;opacity:0;transition:transform .55s var(--spring),opacity .3s}
.hand .card.gin .face{box-shadow:inset 0 0 0 2.5px #FFD36E,0 0 0 2px rgba(255,211,110,.7),0 0 22px rgba(255,211,110,.75),0 8px 16px -6px rgba(0,0,0,.55)}
.hand .watch{position:absolute;inset:0;display:grid;place-items:center;color:#fff;opacity:.9}
.fx{position:fixed;inset:0;pointer-events:none;z-index:60}
.fly{position:fixed;left:0;top:0;will-change:transform;perspective:700px}

/* chat and reactions */
.chatbar,.emotray{position:absolute;left:8px;right:8px;bottom:calc(100% + 4px);z-index:31;background:var(--panel);color:var(--ink);border-radius:22px;box-shadow:0 18px 40px -12px rgba(0,0,0,.6);padding:8px;animation:trayin .35s var(--spring)}

function compactNum(n){
  n=Number(n)||0; const a=Math.abs(n);
  const fmt=(v,s)=>{let x=v>=100?Math.round(v):Math.round(v*10)/10;return String(x).replace(/\.0$/,'')+s;};

}

      if(box.dataset.podium){const t=players.slice(0,3);if(!t.length){box.innerHTML='<p class="muted">No wins recorded yet. Be the first!</p>';return;}

        const pod=(x,i)=>x?`<div class="pod${i===0?' p1':''}"><span class="pf">${face(x)}</span><b>${esc(x.name||'Digu Player')}</b><small>${x.wins|0} wins</small><div class="step" style="--h:${[62,44,32][i]}px">${i+1}</div></div>`:'';

      const compact=box.dataset.compact==='1', rows=compact?players.slice(0,3):players;
      if(!rows.length){box.innerHTML='<p class="muted">No wins recorded yet.</p>';return;}

async function authDo(kind){
 if(!FB.ready||!FB.auth){toast('Account service is still connecting.');return;}
 const raw=(($('#authUser')||{}).value||'').trim(), pass=($('#authPass')||{}).value||'';
 /* the login field takes a username, or (if it contains "@") a full email used as-is, for accounts made by the older email-login build */
 const isEmail=raw.indexOf('@')>=0;
 if(isEmail&&kind==='register'){toast('Pick a username for a new account, not an email.');return;}
 if(isEmail&&!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(raw)){toast('Enter a valid email address.');return;}
 let user=isEmail?'':normalUsername(raw);
 if(!isEmail&&(!user||user==='player')){toast('Enter a valid username.');return;}
 if(pass.length<6){toast('Password must be at least 6 characters.');return;}
 if(kind==='register'&&user===ADMIN_NAME){toast('That username is reserved.');return;}
 const email=isEmail?raw.toLowerCase():usernameEmail(user);
 try{
   let cred;
   if(kind==='register'){
     cred=await FB.createUserWithEmailAndPassword(FB.auth,email,pass);
   }else{
     try{cred=await FB.signInWithEmailAndPassword(FB.auth,email,pass);}
     catch(firstErr){
       // Compatibility for other accounts created by the older email-login build on this device.
       const legacy=rememberedLoginEmail();
       if(!isEmail && legacy && user===(authUsername()||myName()||'').toLowerCase()){
         cred=await FB.signInWithEmailAndPassword(FB.auth,legacy,pass);
       }else throw firstErr;
     }
   }
   FB.user=cred.user; reloadBlk();
   if(isEmail)user=FB.user.uid===ADMIN_UID?ADMIN_NAME:(normalUsername(raw.split('@')[0])||'player');
   ls.set('dd-auth-username',user);
   ls.set('lg-name',user);
   await fbLoadAndMerge();
   applyAdminTestAccount();
   closeSheet(); toast(kind==='register'?'Account created ✓':'Logged in ✓'); renderHome();
 }catch(e){
   const c=(e&&e.code)||'';
   const msg=c==='auth/email-already-in-use'?'That username is already taken.'
     :/invalid-credential|user-not-found|wrong-password|invalid-email/.test(c)?'Username or password is incorrect.'
     :c==='auth/too-many-requests'?'Too many attempts. Try again in a few minutes.'
     :c==='auth/operation-not-allowed'?'Password sign-in is turned off in Firebase.'
     :c==='auth/network-request-failed'?'No connection. Check your internet.'
     :'Could not sign in'+(c?' ('+c+')':'')+'.';
   toast(msg,5000);
 }
}

/* ---------- hand ---------- */
function groups(hand){const k=hand.slice().sort().join('|');if(partCache.k!==k){const g={};partial(hand).forEach((m,i)=>m.forEach(c=>g[c]=i));partCache={k:k,g:g};}return partCache.g;}
function ginSet(){if(!canDiscard())return new Set();const h=myHand();const k=h.slice().sort().join('|')+S.took;
if(ginCache.k!==k){const s=new Set();h.forEach(c=>{if(c===S.took)return;if(cover(h.filter(x=>x!==c)))s.add(c);});ginCache={k:k,s:s};}return ginCache.s;}
function arranged(hand){const ms=partial(hand);const used=new Set();const out=[];
ms.forEach(m=>{const ps=m.map(P);const isSet=ps.every(p=>p.r===ps[0].r);sortP(ps);if(!isSet)ps.sort((a,b)=>a.r-b.r);ps.forEach(p=>{out.push(p.c);used.add(p.c);});});
const dead=hand.filter(c=>!used.has(c)).map(P).sort((a,b)=>a.r-b.r||(a.s<b.s?-1:1)).map(p=>p.c);return out.concat(dead);}
const SPRING=(()=>{try{if(CSS.supports('animation-timing-function','linear(0,1)'))return 'linear(0,.009,.035 2.1%,.141 4.4%,.723 12.9%,.938 16.7%,1.017 19.4%,1.067,1.089 25.4%,1.084 28.1%,1.029 35.3%,1.003 41.2%,.994 47.9%,1 60.1%,1)';}catch(e){}return 'cubic-bezier(.34,1.4,.5,1)';})();
let prevMelds=new Set(),meldKey='',ticks=[];

const hk=S.handNo+':'+myId;let dealt=false;
if(handKey!==hk){handKey=hk;order=arranged(hand);for(const id in cardEls)cardEls[id].remove();cardEls={};dealt=S.move&&S.move.t==='deal';}
order=order.filter(id=>hand.includes(id));if(hand.some(id=>!order.includes(id)))order=arranged(hand);
if(selected&&!hand.includes(selected))selected=null;
for(const id in cardEls)if(!hand.includes(id)){cardEls[id].remove();delete cardEls[id];}
let w=box.querySelector('.watch');if(meIdx()<0){const tx=(S.wait||[]).some(q=>q.id===myId)?'Waiting for this match to finish':'You’re watching this table';if(!w){box.insertAdjacentHTML('beforeend','<div class="watch"></div>');w=box.querySelector('.watch');}if(w.textContent!==tx)w.textContent=tx;return;}else if(w)w.remove();
const g=groups(hand);
{const tmp={};for(const id in g)(tmp[g[id]]=tmp[g[id]]||[]).push(id);const sigs=new Set(Object.values(tmp).map(a=>a.sort().join(',')));
if(meldKey===hk&&!dealt){for(const x of sigs)if(!prevMelds.has(x)){setTimeout(()=>SFX.meld(),S.move&&(S.move.t==='stock'||S.move.t==='take')?460:0);break;}}
if(dealt)setTimeout(()=>SFX.deal(),SHUF_MS);prevMelds=sigs;meldKey=hk;}
const fresh=[];
order.forEach(id=>{let el=cardEls[id];
if(!el){el=document.createElement('div');el.className='card nt';el.dataset.id=id;el.innerHTML=faceHTML(id);el.setAttribute('role','button');el.setAttribute('aria-label',cname(id));box.appendChild(el);cardEls[id]=el;fresh.push(el);}});
layoutHand();

/* dealing: each card springs out of the face-down pile into its place in your hand */
function dealIn(els){const sr=rectOf($('#stockTop'))||rectOf($('#stock'));if(!sr||!els[0]||!els[0].animate)return;
els.forEach((el,i)=>{const r=el.getBoundingClientRect();const s=Math.max(.4,Math.min(1.2,sr.w/(r.width||1)));
const dx=sr.x+sr.w/2-(r.left+r.width/2),dy=sr.y+sr.h/2-(r.top+r.height/2);
el.animate([{translate:`${dx}px ${dy}px`,scale:String(s),opacity:0},{opacity:1,offset:.12},{translate:'0 0',scale:'1',opacity:1}],{duration:720,delay:SHUF_MS+i*70,easing:SPRING,fill:'backwards'});});}
function layoutHand(dragId,dragIdx){const box=$('#hand');if(!box||!S)return;const W=box.clientWidth;const first=cardEls[order[0]];if(!first)return;
const cw=first.offsetWidth;let ids=order.slice();if(dragId!=null){ids=ids.filter(x=>x!==dragId);ids.splice(dragIdx,0,dragId);}
const g=groups(myHand());const n=ids.length,gs=ginSet();
const same=(a,b)=>g[a]!==undefined&&g[a]===g[b];
const gap=ids.map((id,i)=>i>0&&!same(id,ids[i-1])&&(g[id]!==undefined||g[ids[i-1]]!==undefined));
const gc=gap.filter(Boolean).length;let gg=cw*.2;let step=Math.min(cw*.6,(W-cw-gc*gg)/Math.max(1,n-1));
if(step<cw*.4){gg=10;step=Math.min(cw*.6,(W-cw-gc*gg)/Math.max(1,n-1));}
const total=cw+(n-1)*step+gc*gg;const x0=Math.max(0,(W-total)/2);let x=x0;
/* runs of 3+ melded cards get a gold edge and a tick on their last card */
const inm=new Set(),runs=[];{let run=[];const flush=()=>{if(run.length>=3){run.forEach(c=>inm.add(c));runs.push(run);}run=[];};
ids.forEach((id,i)=>{if(g[id]===undefined||id===dragId){flush();return;}if(run.length&&!(same(id,ids[i-1])&&ids[i-1]!==dragId))flush();run.push(id);});flush();}
const pos={};ids.forEach((id,i)=>{if(i>0){x+=step;if(gap[i])x+=gg;}const el=cardEls[id];if(!el)return;
const d=Math.max(-1,Math.min(1,(x+cw/2-W/2)/(W/2))),rot=d*6,y=20+d*d*12+(id===selected?-26:0);el.style.zIndex=i+2;el._rot=rot;pos[id]={x:x,y:y};
el.classList.toggle('inm',inm.has(id));el.classList.toggle('gin',gs.has(id));
if(id!==dragId)el.style.transform=`translate(${x.toFixed(1)}px,${y.toFixed(1)}px) rotate(${rot.toFixed(2)}deg)`;});
/* one gold tick floats above each meld */
const tk=runs.filter(r=>r.every(id=>pos[id])).map(r=>({x:(pos[r[0]].x+pos[r[r.length-1]].x+cw)/2,y:Math.min(...r.map(id=>pos[id].y))}));
while(ticks.length<tk.length){const e=document.createElement('i');e.className='mtk';e.setAttribute('aria-hidden','true');e.textContent='✓';box.appendChild(e);ticks.push(e);}
ticks.forEach((e,k)=>{const r=tk[k];e.style.opacity=r?'1':'0';if(r)e.style.transform=`translate(${(r.x-10).toFixed(1)}px,${(r.y-13).toFixed(1)}px)`;});
L={x0:x0,step:step,cw:cw,n:n};}
function hit(el,x,y){if(!el)return false;const r=el.getBoundingClientRect();return x>=r.left-28&&x<=r.right+28&&y>=r.top-28&&y<=r.bottom+28;}
function bindHand(){const box=$('#hand');
box.addEventListener('pointerdown',e=>{const el=e.target.closest('.card');if(!el||!cardEls[el.dataset.id]||meIdx()<0)return;
drag={id:el.dataset.id,el:el,sx:e.clientX,sy:e.clientY,moved:false,pid:e.pointerId,idx:order.indexOf(el.dataset.id)};try{el.setPointerCapture(e.pointerId);}catch(err){}});
let pendMove=null,rafId=0;
function moveFrame(){rafId=0;const e=pendMove;if(!drag||!e)return;
const px=e.x-drag.box.left,py=e.y-drag.box.top;const idx=Math.max(0,Math.min(order.length-1,Math.round((px-L.x0-L.cw/2)/L.step)));
if(idx!==drag.idx){drag.idx=idx;layoutHand(drag.id,idx);}

const tgt=S.blitz&&S.from==='down'?drag.stockEl:drag.discEl;const over=canDiscard()&&hit(tgt,e.x,e.y);if(over!==drag.over){drag.over=over;tgt&&tgt.classList.toggle('drop',over);if(over)buzz(6);}}

if(!drag.moved){if(Math.hypot(dx,dy)<9)return;drag.moved=true;drag.el.classList.add('dragging');drag.box=box.getBoundingClientRect();drag.discEl=$('#disc');drag.stockEl=$('#stock');if(selected){selected=null;renderActs();}buzz(5);}
pendMove={x:e.clientX,y:e.clientY};if(!rafId)rafId=requestAnimationFrame(moveFrame);});
const end=(e,cancel)=>{if(!drag||e.pointerId!==drag.pid)return;if(rafId){cancelAnimationFrame(rafId);rafId=0;if(pendMove&&drag.moved)moveFrame();}pendMove=null;const d=drag;drag=null;document.querySelectorAll('.pile.drop').forEach(x=>x.classList.remove('drop'));

order=order.filter(x=>x!==d.id);order.splice(d.idx,0,d.id);layoutHand();}

/* ---------- motion: every card move is a spring on transform/opacity only ---------- */
function rectOf(el){if(!el)return null;const r=el.getBoundingClientRect();if(!r.width)return null;return{x:r.left,y:r.top,w:r.width,h:r.height};}
function snapRects(){const o={stock:null,disc:null,cards:{},av:{}};if(screen!=='table')return o;
o.stock=rectOf($('#stockTop'))||rectOf($('#stock'));o.disc=rectOf($('#discTop'))||rectOf($('#disc'));

/* o.flip: face-down card that turns face up (o.face) while it flies */
function fly(from,to,inner,o){o=o||{};if(reduce||!from||!to||document.hidden){o.done&&o.done();return;}
const W=o.base||80,H=W*1.4;const el=document.createElement('div');el.className='fly';el.style.width=W+'px';el.style.height=H+'px';
el.innerHTML=o.flip?`<div class="flw"><div class="card" style="--w:${W}px">${inner}</div><div class="card ff" style="--w:${W}px">${o.flip}</div></div>`:`<div class="card" style="--w:${W}px">${inner}</div>`;$('#fx').appendChild(el);
if(!el.animate){el.remove();o.done&&o.done();return;}
const sF=o.fromAv?.42:from.w/W,sT=o.toAv?.42:Math.min(1.6,(o.toW||to.w)/W);
const fx=from.x+from.w/2-W/2,fy=from.y+from.h/2-H/2,tx=to.x+to.w/2-W/2,ty=to.y+to.h/2-H/2;
const dur=o.toAv||o.fromAv?620:700;
const an=el.animate([{transform:`translate(${fx}px,${fy}px) scale(${sF}) rotate(0deg)`,opacity:o.fromAv?0:1},{opacity:1,offset:.18},{transform:`translate(${tx}px,${ty}px) scale(${sT}) rotate(${o.rot||0}deg)`,opacity:o.toAv?0:1}],{duration:dur,easing:SPRING,fill:'both'});

const fin=()=>{el.remove();o.done&&o.done();};an.onfinish=fin;an.oncancel=fin;}
function animate(prev,N,b){
if(screen!=='table'||!prev||!N.move||!prev.move||prev.status==='lobby')return;
if(N.handNo!==prev.handNo||N.move.seq===prev.move.seq)return;
const m=N.move,me=meIdx(),mine=m.p===me&&me>=0;const base=b.stock?b.stock.w:(b.disc?b.disc.w:80);
if(m.t==='stock'||m.t==='take'){
const from=m.t==='stock'?b.stock:b.disc;const inner=m.t==='stock'?backHTML({still:true,size:90}):faceHTML(m.c);
SFX.draw(mine);
if(mine){const el=cardEls[m.c];if(!el)return;el.style.opacity='0';buzz(8);

fly(from,to,N.ginDown===m.c?backHTML({still:true,size:90}):faceHTML(m.c),{base:base,fromAv:!mine,toW:top?top.offsetWidth:0,rot:top?parseFloat((top.style.transform.match(/-?[\d.]+/)||[0])[0])||0:0,done:()=>{const t2=$('#discTop');if(t2)t2.style.opacity='';}});}

function playEffect(id,box){const it=BYID[id];const a=it&&it.asset;if(!a||!a.fx||isSmooth()||reduce||document.hidden)return;
let L=box;if(!L){L=document.getElementById('fxl');if(!L){L=document.createElement('div');L.id='fxl';L.className='fxl';document.body.appendChild(L);}}
const R=L.getBoundingClientRect();const W=R.width,H=R.height,cx=W/2,cy=box?H/2:H*.4;
for(let i=0;i<a.n;i++){const d=document.createElement('i');d.className='pt '+(a.shape||'');const col=a.c[i%a.c.length];const sz=a.size[0]+Math.random()*(a.size[1]-a.size[0]);
d.style.width=d.style.height=sz+'px';if(a.shape==='ring')d.style.borderColor=col;else if(a.fx==='glow')d.style.background=`radial-gradient(circle,${col}cc,transparent 70%)`;else d.style.background=col;
let x0=cx,y0=cy,x1=cx,y1=cy,s0=.4,s1=1,dur=900+Math.random()*500,delay=i*16;
if(a.fx==='burst'){const ang=Math.random()*6.283,dist=(box?40:70)+Math.random()*(box?60:120);x1=cx+Math.cos(ang)*dist;y1=cy+Math.sin(ang)*dist;}
else if(a.fx==='rise'){x0=cx+(Math.random()-.5)*W*.5;y0=cy+(box?50:80);x1=x0+(Math.random()-.5)*30;y1=y0-(box?110:180)-Math.random()*60;s0=.6;dur=1300+Math.random()*500;}
else if(a.fx==='fall'){x0=cx+(Math.random()-.5)*W*.6;y0=cy-(box?70:120);x1=x0+(Math.random()-.5)*20;y1=y0+(box?120:160)+Math.random()*50;s0=1;}
else if(a.fx==='ring'){s0=.2;s1=box?3.2:5;dur=1200;delay=i*230;}
else if(a.fx==='glow'){s0=.4;s1=1.7;dur=1100;}
const off=sz/2;const k0=`translate(${x0-off}px,${y0-off}px) scale(${s0})`,k1=`translate(${x1-off}px,${y1-off}px) scale(${s1})`;
d.style.transform=k0;L.appendChild(d);
if(!d.animate){d.remove();continue;}
const an=d.animate([{transform:k0,opacity:.95},{transform:k1,opacity:0}],{duration:dur,delay:delay,easing:'cubic-bezier(.2,.7,.3,1)',fill:'both'});an.onfinish=an.oncancel=()=>d.remove();}}

/* rewards: shells and XP for playing */
const AWC={};
function awardHand(){if(!S||!S.result)return null;const me=meIdx();if(me<0)return null;
const key=(S.gid||S.code||'g')+':'+S.handNo;if(AWC[key])return AWC[key];if(INV.aw.includes(key))return null;
INV.aw.push(key);if(INV.aw.length>80)INV.aw.shift();
const r=S.result,st=INV.stats,online=mode==='p2p'||mode==='online';let sh=5,xp=10;
st.hands++;if(r.w===me){sh+=15;xp+=15;st.gins++;if(r.big){sh+=10;xp+=25;st.big++;}}
const row=r.rows&&r.rows[me];if(row&&(st.best==null||row.total>st.best))st.best=row.total;
if(S.status==='over'){st.games++;if(online)st.online++;xp+=20;if(r.champ===me){st.wins++;sh+=online?40:25;xp+=40;}}
if(online)sh=Math.round(sh*1.5);
const today=new Date().toISOString().slice(0,10);if(INV.day!==today){INV.day=today;INV.dayEarned=0;}
const want=sh;sh=Math.max(0,Math.min(sh,DAILY_CAP-INV.dayEarned));INV.dayEarned+=sh;INV.shells+=sh;
const before=levelIdx(INV.xp);INV.xp+=xp;const after=levelIdx(INV.xp);let lvl=null;
for(let i=before+1;i<=after;i++){INV.hist.unshift({id:LEVELS[i][0],t:Date.now(),how:'level'});lvl=LEVELS[i][1];INV.eq.title=LEVELS[i][0];}
if(INV.hist.length>60)INV.hist.length=60;saveInv();
return AWC[key]={sh:sh,xp:xp,capped:sh<want,lvl:lvl};}

/* blocked players are kept on this device, one list per account (guests share the device list). They are not saved to the
   profile doc: players/{uid} is publicly readable and its rules only allow the leaderboard fields. */
const blkKey=()=>FB.user&&!FB.user.isAnonymous?'dd-blocked:'+FB.user.uid:'dd-blocked';
const blkRead=k=>{try{const a=JSON.parse(ls.get(k)||'[]');return Array.isArray(a)?a.filter(x=>x&&x.id):[];}catch(e){return [];}};
const EMOTE_CD=4000;let lastEmote=0;const BLK=blkRead('dd-blocked');
const saveBlk=()=>ls.set(blkKey(),JSON.stringify(BLK.slice(-200)));
const isBlocked=id=>BLK.some(x=>x.id===id);
const mutedP=new Set(BLK.map(x=>x.id)),emoteT={};
/* after login / logout: switch to that account's list (an account's first list starts from this device's guest list) */
function reloadBlk(){const k=blkKey(),a=ls.get(k)==null&&k!=='dd-blocked'?blkRead('dd-blocked'):blkRead(k);BLK.length=0;a.forEach(x=>BLK.push(x));mutedP.clear();BLK.forEach(x=>mutedP.add(x.id));}
const emotesMuted=()=>ls.get('dd-emute')==='1';
function toggleEmotes(){const t=$('#emotray');if(!t)return;closeChat();if(Date.now()-lastEmote<EMOTE_CD){toast('Wait a moment before the next reaction.');return;}t.hidden=!t.hidden;}
function closeEmotes(){const t=$('#emotray');if(t)t.hidden=true;}
function sendEmote(id){if(!EMOTES[id]||!S||meIdx()<0)return;const now=Date.now();if(now-lastEmote<EMOTE_CD)return;lastEmote=now;closeEmotes();showEmote(myId,id);buzz(6);

if(mode==='p2p'){if(isHost)relayEmote(myId,id,true);else joinSend({k:'emote',e:id});}}
function relayEmote(pid,id,self){const n=net;if(!n||n.role!=='host'||!EMOTES[id]||!S)return;
if(!self){const now=Date.now();if(now-(emoteT[pid]||0)<3000)return;emoteT[pid]=now;showEmote(pid,id);}
n.players.forEach((pl,tp)=>{if(pl.pid&&pl.pid!==pid&&(pl.spec||S.players.some(q=>q.id===pl.pid)))sendPlayer(tp,pl,{k:'emote',p:pid,e:id});});}
function bubbleAt(pid,text,cls,ms){if(screen!=='table'||!S||document.hidden)return;const k=S.players.findIndex(q=>q.id===pid);if(k<0)return;const mine=k===meIdx();
const r=rectOf(mine?document.querySelector('#meav'):document.querySelector(`[data-av="${k}"]`));if(!r)return;
document.querySelectorAll('.emo').forEach(x=>{if(x.dataset.p===pid)x.remove();});
const b=document.createElement('div');b.className='emo'+(mine?' up':'')+(cls?' '+cls:'');b.dataset.p=pid;b.textContent=text;
b.style.left=Math.max(90,Math.min(window.innerWidth-90,r.x+r.w/2))+'px';b.style.top=(mine?r.y-6:r.y+r.h+6)+'px';$('#fx').appendChild(b);setTimeout(()=>b.remove(),ms);}
function showEmote(pid,id){if(pid!==myId&&(emotesMuted()||mutedP.has(pid)))return;const it=EMOTES[id];if(!it)return;bubbleAt(pid,it.t,it.txt?'txt':'',2200);}

/* ---------- chat (online matches only) ---------- */
const QUICK_CHAT=['Good luck!','Nice one','Your turn','So close!','Well played','One more game?','Too easy','You got lucky','67','OMG','😠','😢'];
/* the phrases you send most move to the front */
const qcUse=(()=>{try{const o=JSON.parse(ls.get('dd-qc')||'{}');return o&&typeof o==='object'?o:{};}catch(e){return {};}})();
function quickChat(){return QUICK_CHAT.map((q,i)=>({q:q,i:i,n:+qcUse[q]||0})).sort((a,b)=>b.n-a.n||a.i-b.i).map(x=>x.q);}
function countQuick(m){if(QUICK_CHAT.indexOf(m)<0)return;qcUse[m]=(+qcUse[m]||0)+1;try{ls.set('dd-qc',JSON.stringify(qcUse));}catch(e){}}
function chipsHTML(){return quickChat().map(q=>`<button class="chip${/^[\u2600-\u27bf\ud83c-\udbff]/.test(q)?' emo':''}" data-a="chatQuick" data-m="${esc(q)}"${q==='😠'?' aria-label="Angry"':q==='😢'?' aria-label="Sad"':''}>${esc(q)}</button>`).join('');}
const BYE_MSG='It was fun playing with you guys, good luck!';
const CHAT_CD=2500;let lastChat=0,chatCode=null;const chatLog=[],chatT={};
const chatOff=()=>ls.get('dd-chat')==='0';
function cleanText(v){let s=String(v||'').replace(/[\u0000-\u001f\u007f<>]/g,'').replace(/\s+/g,' ').trim().slice(0,60);
s=s.split(' ').map(w=>{const low=w.toLowerCase();if(/https?:|www\.|\.(com|net|org|mv|io|me|ly)\b|@\w/.test(low))return '•••';
const flat=low.replace(/0/g,'o').replace(/1/g,'i').replace(/3/g,'e').replace(/4|@/g,'a').replace(/5|\$/g,'s').replace(/[^a-z]/g,'');
return flat&&BAD.some(b=>flat.includes(b))?'•••':w;}).join(' ');
if(/\d[\d\s-]{5,}\d/.test(s))s=s.replace(/\d[\d\s-]{5,}\d/g,'•••');return s;}
function openChat(){const b=$('#chatbar');if(!b)return;closeEmotes();const cq=$('#chatquick');if(cq)cq.innerHTML=chipsHTML();b.hidden=false;renderChatLog();const d=document.querySelector('#chatbtn .dot');if(d)d.hidden=true;}
function closeChat(){const b=$('#chatbar');if(b)b.hidden=true;const i=$('#chatin');if(i&&document.activeElement===i)i.blur();}
function renderChatLog(){const e=$('#chatlog');if(!e||!S)return;e.innerHTML='';chatLog.slice(-4).forEach(c=>{const p=document.createElement('p');const n=document.createElement('b');n.textContent=(c.pid===myId?'You':c.name)+': ';p.appendChild(n);p.appendChild(document.createTextNode(c.m));e.appendChild(p);});}
function sendChat(raw){if(!S||mode!=='p2p'||meIdx()<0||chatOff())return;const m=cleanText(raw);if(!m)return;
const now=Date.now();if(now-lastChat<CHAT_CD){toast('Slow down a little.');return;}lastChat=now;
const i=$('#chatin');if(i)i.value='';closeChat();
countQuick(m);receiveChat(myId,m);if(isHost)relayChat(myId,m,true);else joinSend({k:'chat',m:m});}
function relayChat(pid,raw,self){const n=net;if(!n||n.role!=='host'||!S)return;const m=cleanText(raw);if(!m)return;
if(!self){const now=Date.now();if(now-(chatT[pid]||0)<2000)return;chatT[pid]=now;receiveChat(pid,m);}
n.players.forEach((pl,tp)=>{if(pl.pid&&pl.pid!==pid&&(pl.spec||S.players.some(q=>q.id===pl.pid)))sendPlayer(tp,pl,{k:'chat',p:pid,m:m});});}
function receiveChat(pid,m){if(!S||chatOff())return;if(pid!==myId&&mutedP.has(pid))return;const p=S.players.find(q=>q.id===pid);if(!p)return;m=cleanText(m);if(!m)return;
chatLog.push({pid:pid,name:p.name,m:m});if(chatLog.length>30)chatLog.shift();
const bar=$('#chatbar');if(bar&&!bar.hidden)renderChatLog();else if(pid!==myId){const d=document.querySelector('#chatbtn .dot');if(d)d.hidden=false;}
bubbleAt(pid,m,'chat',3600);}

async function sendReport(id){const p=S&&S.players.find(q=>q.id===id);if(!p)return;
const sel=document.querySelector('input[name="rr"]:checked');const reason=REPORT_REASONS[sel?+sel.value:0]||'Other';
const note=cleanText((($('#rnote')||{}).value||'').slice(0,300));const alsoBlock=!!(($('#rblock')||{}).checked);

 byId:myId,byName:(myName()||'Player').slice(0,20),table:String(S.code||'').slice(0,8),mode:mode||'',
 chat:chatLog.filter(c=>c.pid===id).slice(-10).map(c=>String(c.m).slice(0,60)),t:Date.now()};

/* reports go to the Firestore "reports" collection (create-only in the rules); if that fails they wait on this device */
async function postReport(rep){try{if(FB.ready&&FB.addDoc&&FB.user&&!testNs()){await FB.addDoc(FB.collection(FB.db,'reports'),Object.assign({},rep,{uid:FB.user.uid,at:FB.serverTimestamp()}));return true;}}catch(e){console.warn('report failed',e);}return false;}
function queueReport(rep){let q=[];try{q=JSON.parse(ls.get('dd-report-queue')||'[]');if(!Array.isArray(q))q=[];}catch(e){}q.push(rep);ls.set('dd-report-queue',JSON.stringify(q.slice(-20)));}
async function flushReports(){let q=[];try{q=JSON.parse(ls.get('dd-report-queue')||'[]');}catch(e){}if(!Array.isArray(q)||!q.length)return;
const left=[];for(const r of q){if(!(await postReport(r)))left.push(r);}if(left.length)ls.set('dd-report-queue',JSON.stringify(left));else ls.del('dd-report-queue');}

/* ---------- online play: encrypted relay ----------
   Phones talk through public MQTT relays over secure WebSockets, so players on mobile data
   or different Wi-Fi networks can join. A tiny built-in MQTT client is used (no library
   download). Each player's cards are end-to-end encrypted (ECDH + AES-GCM). */
const NS=(()=>{try{const q=new URLSearchParams(location.search).get('ns');if(q&&/^[a-z0-9]{3,16}$/i.test(q)&&/^(localhost|127\.\d+\.\d+\.\d+)$/.test(location.hostname))return 'dhivehidigu/test-'+q+'/';}catch(e){}return 'dhivehidigu/v2/';})();
const BROKERS=['wss://broker.emqx.io:8084/mqtt','wss://broker.hivemq.com:8884/mqtt'];
let isHost=false,net=null,joinInfo=null,pool=null,poolT=null,srvState='checking';const lobbyList={};
const TE=new TextEncoder(),TD=new TextDecoder();
function b64(u8){let s='';for(let i=0;i<u8.length;i+=0x8000)s+=String.fromCharCode.apply(null,u8.subarray(i,i+0x8000));return btoa(s);}
function unb64(s){const b=atob(s),u=new Uint8Array(b.length);for(let i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return u;}
const rid=n=>{const a=new Uint8Array(n);crypto.getRandomValues(a);return Array.from(a,x=>x.toString(16).padStart(2,'0')).join('');};
async function newKeys(){const kp=await crypto.subtle.generateKey({name:'ECDH',namedCurve:'P-256'},false,['deriveKey']);return{kp:kp,pub:b64(new Uint8Array(await crypto.subtle.exportKey('raw',kp.publicKey)))};}
async function sharedKey(priv,pubB64){const pk=await crypto.subtle.importKey('raw',unb64(pubB64),{name:'ECDH',namedCurve:'P-256'},false,[]);return crypto.subtle.deriveKey({name:'ECDH',public:pk},priv,{name:'AES-GCM',length:256},false,['encrypt','decrypt']);}
async function seal(key,obj){const iv=crypto.getRandomValues(new Uint8Array(12));const ct=await crypto.subtle.encrypt({name:'AES-GCM',iv:iv},key,TE.encode(JSON.stringify(obj)));return{i:b64(iv),c:b64(new Uint8Array(ct))};}
async function unseal(key,m){const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:unb64(m.i)},key,unb64(m.c));return JSON.parse(TD.decode(pt));}

/* tiny MQTT 3.1.1 client (QoS 0) */
function MQ(url,opts){
const self={connected:false,reconnecting:true};
let ws=null,buf=new Uint8Array(0),pingT=null,retryT=null,ctT=null,ended=false,pid=0,delay=1500,lastIn=0;
const subs=new Set(),clientId='dd_'+rid(7);
const str=s=>{const b=TE.encode(s),o=new Uint8Array(2+b.length);o[0]=b.length>>8;o[1]=b.length&255;o.set(b,2);return o;};
function packet(head,parts){const bodyLen=parts.reduce((t,p)=>t+p.length,0);let len=bodyLen;const lb=[];do{let d=len%128;len=Math.floor(len/128);if(len>0)d|=128;lb.push(d);}while(len>0);
const out=new Uint8Array(1+lb.length+bodyLen);out[0]=head;out.set(lb,1);let off=1+lb.length;parts.forEach(p=>{out.set(p,off);off+=p.length;});return out;}
function send(u8){if(ws&&ws.readyState===1){try{ws.send(u8);return true;}catch(e){}}return false;}
function nextId(){pid=pid%65535+1;return new Uint8Array([pid>>8,pid&255]);}
function schedule(){if(ended)return;clearTimeout(retryT);self.reconnecting=true;retryT=setTimeout(connect,delay);delay=Math.min(15000,delay*1.6);}
function drop(w){if(ws!==w)return;clearTimeout(ctT);clearInterval(pingT);ws=null;buf=new Uint8Array(0);const was=self.connected;self.connected=false;if(was&&opts.onDown)opts.onDown();schedule();}
function connect(){if(ended)return;let w;try{w=new WebSocket(url,['mqtt']);}catch(e){schedule();return;}
ws=w;w.binaryType='arraybuffer';
ctT=setTimeout(()=>{if(ws===w&&!self.connected){try{w.close();}catch(e){}drop(w);}},9000);
w.onopen=()=>{if(ws!==w)return;send(packet(0x10,[new Uint8Array([0,4,77,81,84,84,4,2,0,30]),str(clientId)]));};
w.onmessage=e=>{if(ws!==w)return;lastIn=Date.now();const d=new Uint8Array(e.data);const nb=new Uint8Array(buf.length+d.length);nb.set(buf);nb.set(d,buf.length);buf=nb;parse();};
w.onclose=()=>drop(w);w.onerror=()=>{try{w.close();}catch(e){}drop(w);};}
function parse(){while(buf.length>=2){let mul=1,len=0,i=1,b;do{if(i>=buf.length)return;b=buf[i++];len+=(b&127)*mul;mul*=128;}while(b&128);
if(buf.length<i+len)return;const head=buf[0],body=buf.slice(i,i+len);buf=buf.slice(i+len);handle(head>>4,head&15,body);}}
function handle(type,flags,b){
if(type===2){if(b[1]!==0){try{ws&&ws.close();}catch(e){}return;}
self.connected=true;self.reconnecting=false;delay=1500;clearTimeout(ctT);lastIn=Date.now();
if(subs.size)sub([...subs]);clearInterval(pingT);
pingT=setInterval(()=>{if(Date.now()-lastIn>50000){const w=ws;try{w&&w.close();}catch(e){}drop(w);return;}send(new Uint8Array([0xC0,0]));},20000);
opts.onUp&&opts.onUp();}
else if(type===3){const qos=(flags>>1)&3,tl=(b[0]<<8)|b[1];const topic=TD.decode(b.subarray(2,2+tl));let off=2+tl;
if(qos>0){const hi=b[off],lo=b[off+1];off+=2;send(new Uint8Array([qos===1?0x40:0x50,2,hi,lo]));}
opts.onMsg&&opts.onMsg(topic,b.subarray(off),flags&1);}}
function sub(topics){topics.forEach(t=>subs.add(t));if(!self.connected)return;const parts=[nextId()];topics.forEach(t=>{parts.push(str(t));parts.push(new Uint8Array([0]));});send(packet(0x82,parts));}
function unsub(topics){topics.forEach(t=>subs.delete(t));if(!self.connected)return;send(packet(0xA2,[nextId()].concat(topics.map(str))));}
function publish(topic,payload,retain){if(!self.connected)return false;const p=typeof payload==='string'?TE.encode(payload):payload;return send(packet(0x30|(retain?1:0),[str(topic),p]));}
function end(){ended=true;clearTimeout(retryT);clearTimeout(ctT);clearInterval(pingT);const w=ws;ws=null;if(w){try{if(self.connected)w.send(new Uint8Array([0xE0,0]));w.close();}catch(e){}}self.connected=false;}
function reconnect(){if(ended||self.connected)return;clearTimeout(retryT);delay=1500;const w=ws;ws=null;if(w){try{w.close();}catch(e){}}connect();}
Object.assign(self,{subscribe:sub,unsubscribe:unsub,publish:publish,end:end,reconnect:reconnect});connect();return self;}

function makeClients(){return BROKERS.map((url,bi)=>{const o={bi:bi,ok:false,up:null,h:null,subs:()=>[],onUp2:null,c:null};
o.c=MQ(url,{onUp:()=>{o.ok=true;const t=o.subs();if(t.length)o.c.subscribe(t);if(o.up){const f=o.up;o.up=null;f();}o.onUp2&&o.onUp2();},
onDown:()=>{o.ok=false;},onMsg:(topic,p,rt)=>{if(!o.h)return;let m=null;if(p.length){try{m=JSON.parse(TD.decode(p));}catch(e){return;}}o.h(o,topic,m,rt);}});return o;});}
function takeClients(subs,h){clearTimeout(poolT);const cl=pool||makeClients();pool=null;cl.forEach(o=>{o.c.unsubscribe([NS+'lobby/+']);o.subs=subs;o.h=h;o.onUp2=null;if(o.ok){const t=subs();if(t.length)o.c.subscribe(t);}});return cl;}
function anyUp(cl,ms){return new Promise(res=>{let done=false;const fin=v=>{if(done)return;done=true;clearTimeout(t);res(v);};const t=setTimeout(()=>fin(cl.some(o=>o.ok)),ms);cl.forEach(o=>{if(o.ok)fin(true);else o.up=()=>fin(true);});});}
const pub=(o,topic,obj,retain)=>!!(o&&o.c&&o.ok&&o.c.publish(topic,typeof obj==='string'?obj:JSON.stringify(obj),retain));
function srvHTML(){const t={checking:'Connecting to the game server…',ok:'Game server connected',fail:'Can’t reach the game server on this network'}[srvState];return `<p class="srv s-${srvState}" id="srv"><i></i>${t}</p>`;}

if(!pool){pool=makeClients();const p0=pool;p0.forEach(o=>o.onUp2=()=>{setSrv('ok');if(screen==='friends')updOpenList();});anyUp(p0,10000).then(v=>{if(!v&&pool===p0&&srvState!=='ok'){setSrv('fail');if(screen==='friends')updOpenList();}});}
const p=pool;p.forEach(o=>{o.h=onLobbyMsg;o.subs=()=>[NS+'lobby/+'];if(o.ok)o.c.subscribe([NS+'lobby/+']);});
clearTimeout(poolT);poolT=setTimeout(()=>{if(pool!==p)return;if(screen==='friends'||screen==='quick'){warmUp();return;}p.forEach(o=>o.c.end());pool=null;},5*60*1000);}
function onLobbyMsg(o,topic,m){const pre=NS+'lobby/';if(topic.indexOf(pre)!==0)return;const code=topic.slice(pre.length);if(!/^[A-Z]{4}$/.test(code))return;
if(!m||!m.t){delete lobbyList[code];}
else{const cur=lobbyList[code];if(!cur||+m.t>=cur.t)lobbyList[code]={code:code,name:cleanName(m.name),pc:String(m.pc||''),n:Math.max(1,Math.min(6,m.n|0)),t:+m.t,c:+m.c||+m.t,status:m.status==='lobby'?'lobby':m.status==='playing'?'playing':'busy',q:!!m.q,host:String(m.host||''),h:Math.max(0,m.h|0),r:Math.max(1,m.r|0||DEF_ROUNDS),vw:Math.max(0,m.vw|0),f:Math.max(0,Math.min(5,m.f|0)),ids:Array.isArray(m.ids)?m.ids.slice(0,6).map(x=>String(x).slice(0,24)):[]};}
if(screen==='friends')updOpenList();quickCheck();}

if(d.move&&(d.move.t==='stock'||d.move.t==='bury')&&d.players[d.move.p]&&d.players[d.move.p].id!==pid)d.move.c=null;return d;}

function broadcast(){const n=net;if(!n||n.role!=='host')return;n.players.forEach((pl,topic)=>{if(pl.pid)sendState(topic,pl);});updListing();}
function updListing(){const n=net;if(!n||n.role!=='host'||!n.code||!S)return;const topic=NS+'lobby/'+n.code;

if(show){const h=S.players.find(p=>p.id===S.hostId)||S.players[0]||{};n.listed=true;const msg={v:2,code:n.code,name:h.name,pc:h.piece,n:S.status==='lobby'?S.players.length:here,t:Date.now(),c:n.created,status:S.status==='lobby'?'lobby':'playing',q:n.quick,host:myId,h:S.handNo|0,r:roundsOf(S),vw:S.viewers|0,f:Math.max(0,6-here-(S.wait||[]).length),ids:S.players.filter(p=>!p.gone).map(p=>p.id).slice(0,6)};n.clients.forEach(o=>pub(o,topic,msg,true));}
else if(n.listed){n.listed=false;n.clients.forEach(o=>{if(o.ok)o.c.publish(topic,'',true);});}}
/* spectators: kept apart from the players, capped to spare the host's data */
const MAX_VIEW=30;
const viewers=()=>{const n=net;if(!n||!S)return 0;const ids=new Set();n.players.forEach(pl=>{if(pl.spec&&pl.pid&&!S.players.some(p=>p.id===pl.pid))ids.add(pl.pid);});return ids.size;};

const alive=id=>[...n.players.values()].some(pl=>pl.pid===id),w=(S.wait||[]).filter(x=>alive(x.id)),v=viewers();

n.players.forEach((pl,tp)=>{if(pl.pid===id){sendPlayer(tp,pl,{k:'err',m:'The host removed you from this table.'});n.players.delete(tp);}});
const idx=S.players.findIndex(q=>q.id===id);if(idx>=0){const N=clone(S);N.players.splice(idx,1);N.rev++;N.by=myId;commit(N);}}
function quickCheck(){const n=net;if(!n||n.role!=='host'||!n.quick||!S||S.status!=='lobby'||S.players.length>1||n.merging)return;
const other=openTables().filter(x=>x.q&&x.code!==n.code&&![x.host].concat(x.ids||[]).some(isBlocked)&&(x.c<n.created||(x.c===n.created&&x.code<n.code)))[0];if(!other)return;
n.merging=true;mode=null;S=null;isHost=false;cleanupP2P();renderQuickWait('Joining '+other.name+'’s table…');const run=quickRun;
setTimeout(()=>{if(run!==quickRun)return;const btn=$('#qbtn');if(btn)netJoin(btn,myName(),other.code,{timeout:6000,onFail:()=>{if(run===quickRun)tryQuick(run,new Set([other.code]));}});},200);}
/* the host keeps an eye on every player: 30 s of silence means they left. Mid-hand an AI Rookie finishes for them. */
const AWAY_MS=30000;
function hostWatch(){const n=net;if(!n||n.role!=='host'||!S||document.hidden)return;const now=Date.now();if(now-(n.wokeAt||0)<15000)return;
S.players.forEach(p=>{if(p.id===myId||p.gone||p.bot)return;let last=n.created;n.players.forEach(pl=>{if(pl.pid===p.id&&pl.seen>last)last=pl.seen;});if(now-last>AWAY_MS)dropPlayer(p.id,false);});tidyWatchers();}
function dropPlayer(id,left){if(!S||!(mode==='p2p'&&isHost)||id===myId)return;const idx=S.players.findIndex(q=>q.id===id);if(idx<0||S.players[idx].gone)return;
const N=clone(S),q=N.players[idx];N.rev=(S.rev||0)+1;N.by=myId;
if(N.status==='lobby'){N.players.splice(idx,1);commit(N);return;}
q.gone=1;q.bot=true;q.ai=1;
if(N.status==='playing')N.note={k:N.rev,t:q.name+(left?' left':' disconnected')+'. An AI Rookie is finishing their hand.'};
else{q.bye=1;N.note={k:N.rev,t:q.name+' left the table.'};endIfAlone(N);}

/* between hands: if fewer than two players are still here, the match is over */
function endIfAlone(N){const live=N.players.map((p,k)=>k).filter(k=>!N.players[k].gone);if(N.status!=='handover'||live.length>=2)return;
N.status='over';if(N.result){let c=live.length?live[0]:0;live.forEach(k=>{if(N.players[k].score>N.players[c].score)c=k;});N.result.champ=c;}}
/* when a hand ends, each AI Rookie says goodbye in chat and leaves the table */
let byeKey='';

const key=S.gid+':'+S.handNo;if(byeKey===key)return;byeKey=key;
setTimeout(()=>{if(!S||!(mode==='p2p'&&isHost))return;g.forEach(p=>{if(S.players.some(q=>q.id===p.id)){receiveChat(p.id,BYE_MSG);relayChat(p.id,BYE_MSG,true);}});
setTimeout(()=>{if(!S||!(mode==='p2p'&&isHost))return;const N=clone(S);let any=false;N.players.forEach(p=>{if(p.gone&&!p.bye){p.bye=1;any=true;}});if(!any)return;endIfAlone(N);N.rev=(S.rev||0)+1;N.by=myId;commit(N);},1800);},1400);}
/* host went AFK: once its AI has said goodbye (or the others already dealt on without it), hand the table over */
let afkExitT=0;
function afkHostCheck(){if(!(mode==='p2p'&&isHost)||!S||afkExitT)return;const me=S.players.find(p=>p.id===myId);
if(!me||(me.afk&&me.bye))afkExitT=setTimeout(()=>{afkExitT=0;if(mode==='p2p'&&isHost)hostAfkExit();},600);}
/* the next player in seat order who is still here */
function nextHostId(excl){if(!S)return null;const n=S.players.length,hi=Math.max(0,S.players.findIndex(q=>q.id===excl));for(let i=1;i<n;i++){const q=S.players[(hi+i)%n];if(q.id!==excl&&!q.gone&&!q.bot)return q.id;}return null;}
async function netCreate(btn,name,opts){opts=opts||{};const failed=()=>{if(opts.onFail)opts.onFail();};const done0=netPrecheck(btn,'Connecting…');if(!done0){failed();return;}const done=()=>{done0();};let n=null;
try{cleanupP2P();const keys=await newKeys();
n={role:'host',code:null,kp:keys.kp,pub:keys.pub,players:new Map(),seen:{},timers:[],clients:[],isPublic:!!opts.pub,quick:!!opts.quick,created:Date.now(),banned:new Set(),listed:false};net=n;
n.clients=takeClients(()=>n.code?[NS+n.code+'/h',NS+n.code+'/i'].concat(n.quick?[NS+'lobby/+']:[]):[],onHostMsg);

for(let a=0;a<3&&!code;a++){const c=genCode();n.seen[c]=null;n.clients.forEach(o=>{if(o.ok)o.c.subscribe([NS+c+'/i']);});
await sleep(900);n.clients.forEach(o=>{if(o.ok)o.c.unsubscribe([NS+c+'/i']);});

if(net!==n){done();return;}

n.clients.forEach(o=>{if(o.ok){const t=n.quick?[NS+n.code+'/h',NS+n.code+'/i',NS+'lobby/+']:[NS+n.code+'/h',NS+n.code+'/i'];o.c.subscribe(t);}});
const info=()=>{if(net!==n)return;n.clients.forEach(o=>pub(o,NS+n.code+'/i',{v:2,host:myId,pub:n.pub,t:Date.now(),since:n.created},true));};
n.clients.forEach(o=>o.onUp2=()=>{info();updListing();});info();n.timers.push(setInterval(info,10000));n.timers.push(setInterval(updListing,10000));
n.timers.push(setInterval(hostWatch,4000));

async function onHostMsg(o,topic,m,rt){const n=net;if(!n||n.role!=='host')return;if(topic.indexOf(NS+'lobby/')===0){onLobbyMsg(o,topic,m);return;}if(!m)return;

/* another player took over this table while we were away (their takeover is newer than our start): step aside */
if(n.code&&c===n.code&&m.host&&m.host!==myId&&!rt&&(m.since||0)>n.created){toast('You were away too long, so another player became the host.',5000);endP2P();}return;}
if(!n.code||topic!==NS+n.code+'/h'||typeof m.f!=='string'||!m.i||!m.c)return;
let pl=n.players.get(m.f);
try{if(!pl||!pl.key||(m.p&&m.p!==pl.pub)){if(!m.p)return;const key=await sharedKey(n.kp.privateKey,m.p);pl=n.players.get(m.f)||{pid:null};pl.key=key;pl.pub=m.p;n.players.set(m.f,pl);}
const d=await unseal(pl.key,m);if(net!==n)return;pl.bi=o.bi;pl.seen=Date.now();onHostData(pl,m.f,d);}catch(e){}}
function onHostData(pl,topic,d){if(!S||!d||typeof d!=='object')return;const n=net;

if(!d.spec&&!waiting&&free>0&&S.status!=='lobby'){const used=q=>S.players.some(x=>x.piece===q)||(S.wait||[]).some(x=>x.piece===q);const want=PIECES[d.pc]&&!used(d.pc)?d.pc:(PK.find(x=>!used(x))||PK[0]);
 N.wait=(S.wait||[]).concat([{id:id,name:name,piece:want,cos:validCos(d.cos)}]);N.note={k:(S.rev||0)+1,t:name+' joins for the next game.'};}
N.viewers=viewers();N.rev=(S.rev||0)+1;N.by=myId;commit(N);return;}
if(S.players.length>=6){sendPlayer(topic,pl,{k:'err',m:'That table is full.'});return;}

const want=PIECES[d.pc]&&!S.players.some(q=>q.piece===d.pc)?d.pc:(PK.find(x=>!S.players.some(q=>q.piece===x))||PK[0]);
const N=clone(S);N.players.push({id:id,name:name,piece:want,score:0,cos:validCos(d.cos)});N.rev++;N.by=myId;commit(N);return;}
if(!pl.pid)return;const idx=S.players.findIndex(q=>q.id===pl.pid);
if(idx>=0&&S.players[idx].gone&&d.k!=='leave'){sendPlayer(topic,pl,S.players[idx].afk?{k:'afk',m:AFK_MSG}:{k:'err',m:'You were away too long. An AI Rookie finished your hand.'});n.players.delete(topic);return;}

if(d.k==='rtc'){if(idx<0)return;const to=String(d.to||'');if(to===myId)vcOnSignal(pl.pid,d.d);else n.players.forEach((q,tp)=>{if(q.pid===to)sendPlayer(tp,q,{k:'rtc',f:pl.pid,d:d.d});});return;}
if(d.k==='piece'){if(S.status!=='lobby'||idx<0||!PIECES[d.p]||S.players.some(q=>q.id!==pl.pid&&q.piece===d.p))return;const N=clone(S);N.players[idx].piece=d.p;N.rev++;N.by=myId;commit(N);return;}
if(d.k==='cos'){if(S.status!=='lobby'||idx<0)return;const N=clone(S);N.players[idx].cos=validCos(d.cos);N.rev++;N.by=myId;commit(N);return;}

/* joiner */
async function joinSend(obj){const n=net;if(!n||n.role!=='join'||!n.key)return false;
let o=n.clients[n.bi];if(!o||!o.ok)o=n.clients.find(x=>x.ok&&n.hasInfo[x.bi])||n.clients.find(x=>x.ok);if(!o)return false;
try{const m=await seal(n.key,obj);m.f=n.topic;m.p=n.pub;return pub(o,NS+n.code+'/h',m);}catch(e){return false;}}
async function netJoin(btn,name,code,opts){opts=opts||{};const done=netPrecheck(btn,'Connecting…');if(!done){if(opts.onFail)opts.onFail();return;}let n=null;
try{cleanupP2P();const keys=await newKeys();
n={role:'join',code:code,name:name,kp:keys.kp,pub:keys.pub,topic:rid(8),key:null,hostPub:null,bi:-1,hasInfo:{},last:0,ready:false,timers:[],clients:[],btn:btn,spec:!!opts.spec};net=n;
n.fail=m=>{if(net!==n||n.ready)return;cleanupP2P();done();if(opts.onFail)opts.onFail(m);else toast(m,5000);};
n.onReady=()=>{isHost=false;mode='p2p';ls.set('lg-room',code);joinInfo={code:code,name:name};keepAwake(true);S=null;};
n.clients=takeClients(()=>[NS+code+'/i',NS+code+'/p/'+n.topic],onJoinMsg);n.upAt=Date.now();n.clients.forEach(o=>o.onUp2=()=>{n.upAt=Date.now();});

anyUp(n.clients,10000).then(v=>{if(net!==n||n.ready)return;if(!v){setSrv('fail');n.fail(netErrMsg);}else{setSrv('ok');if(!n.hostPub)btn.textContent='Finding table…';setTimeout(()=>{if(net===n&&!n.ready&&!n.hostPub)n.fail('No table found with code '+code+'. It may have closed, or the code is wrong.');},6000);}});
n.timers.push(setInterval(()=>{if(net!==n||document.hidden)return;
if(!n.ready){if(n.key)joinSend({k:'hello',id:myId,name:n.name,pc:myPiece(),cos:myCos(),spec:n.spec?1:0});return;}
joinSend({k:'ping',rev:S?S.rev||0:0});const gap=Date.now()-n.last;
/* host silent while our own connection is fine: the next player in seat order takes over (the one after waits a little longer) */
if(S&&gap>HOST_GRACE&&n.clients.some(o=>o.ok)&&Date.now()-n.upAt>12000){const r=hostRank();if(r>=0&&gap>HOST_GRACE*(r+1)){takeOver();return;}}
if(gap>150000){toast('Lost the host. The table may have closed.',5000);endP2P();}
else if(gap>12000&&!n.warned){n.warned=true;toast('Waiting for the host…');}},3500));
}catch(e){toast('Couldn’t join: '+((e&&e.message)||e),6000);if(n&&net===n)cleanupP2P();done();if(opts.onFail)opts.onFail();}}
const HOST_GRACE=20000;
function hostRank(){if(!S)return -1;const n=S.players.length,hi=Math.max(0,S.players.findIndex(q=>q.id===S.hostId)),c=[];
for(let i=1;i<n;i++){const q=S.players[(hi+i)%n];if(q.id!==S.hostId&&!q.gone&&!q.bot)c.push(q.id);}return c.indexOf(myId);}
/* become the host. Only the old host knew everyone's cards, so an unfinished hand is dealt again; scores stay as they were. */
function takeOver(){const n=net;if(!n||n.role!=='join'||!S||n.taking)return;n.taking=true;
const old=S.players.find(q=>q.id===S.hostId),N=clone(S);N.rev=(S.rev||0)+1000;N.by=myId;N.hostId=myId;
const oi=old?N.players.findIndex(q=>q.id===old.id):-1;
if(oi>=0){if(N.status==='lobby')N.players.splice(oi,1);else{const q=N.players[oi];q.gone=1;q.bot=true;q.ai=1;q.bye=1;}}

if(N.status==='playing'){if(N.players.filter(q=>!q.gone).length>=2){N.handNo=Math.max(0,(N.handNo||1)-1);deal(N);redo=true;}else{N.status='over';N.phase='done';const live=N.players.map((q,k)=>k).filter(k=>!N.players[k].gone);N.result={w:live[0]||0,big:false,pts:0,bonus:0,rows:null,champ:live[0]||0,lay:null,melds:[]};}}
else endIfAlone(N);
N.note={k:N.rev,t:(old?old.name:'The host')+' left. '+myName()+' is the new host.'+(redo?' The hand was dealt again, scores stay the same.':'')};
const dummy=document.createElement('button');
netCreate(dummy,myName()||'Player',{pub:!!S.pub,quick:!!S.quick,code:n.code,state:N,onFail:()=>{toast('Couldn’t take over the table.',4000);endP2P();}});}
async function onJoinMsg(o,topic,m,rt){const n=net;if(!n||n.role!=='join'||!m)return;
if(topic===NS+n.code+'/i'){if(!m.pub||!m.host)return;
if(n.dead&&n.dead.has(m.host))return;if((m.since||0)<(n.since||0))return;n.since=Math.max(n.since||0,m.since||0);
if(!rt&&S&&m.host===S.hostId)n.last=Date.now();
