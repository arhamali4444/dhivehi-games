<style>
/* ================= Digu · Island Luxe ================= */
:root{--ink:#15241F;--muted:#6B6354;--panel:#FFFDF8;--cream:#F7F1E6;--line:rgba(21,36,31,.12);--edge:#E6D9C0;--accent:#155E43;--accent-ink:#fff;--deep:#0B3B2B;
 --gold:#C9A45C;--gold2:#E7C97F;--gold3:#F2D49B;--sun:#FFD36E;--red:#C4262E;--cardInk:#15241F;
 --spring:linear(0,.009,.035 2.1%,.141 4.4%,.723 12.9%,.938 16.7%,1.017 19.4%,1.067,1.089 25.4%,1.084 28.1%,1.029 35.3%,1.003 41.2%,.994 47.9%,1 60.1%,1);
 --out:cubic-bezier(.16,1,.3,1);--shadow:0 1px 0 rgba(0,0,0,.03),0 10px 26px -12px rgba(8,40,40,.45);
 --lagoon:radial-gradient(110% 60% at 50% 18%,#1AA0A0 0%,#0C6A76 40%,#073F52 75%,#04283A 100%);
 --cw:clamp(62px,18.5vw,96px);--pw:clamp(58px,17vw,84px);--sw:clamp(36px,10vw,50px)}
@supports not (transition-timing-function:linear(0,1)){:root{--spring:cubic-bezier(.34,1.4,.5,1)}}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
html{background:#04283A;-webkit-text-size-adjust:100%;touch-action:manipulation;overflow-x:hidden;overflow-x:clip}
body{font-family:'Sora',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:14px;line-height:1.45;color:var(--ink);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;overscroll-behavior:none;background:transparent;overflow-x:hidden;overflow-x:clip}
/* one fixed, GPU-composited backdrop (lagoon by default, cream on the store and profile) */
body:before{content:"";position:fixed;inset:0;z-index:-2;pointer-events:none;transform:translateZ(0);background:var(--lagoon)}
html[data-bg="cream"]{background:var(--cream)}
html[data-bg="cream"] body:before{background:radial-gradient(120% 60% at 50% 0%,#FFFFFF 0%,#F7F1E6 55%,#EFE5D3 100%)}
/* slowly drifting sunlight on the water */
.caus{position:fixed;inset:-30%;z-index:-1;pointer-events:none;opacity:.14;will-change:transform;
 background:radial-gradient(closest-side,rgba(255,255,255,.95),transparent 70%) 0 0/120px 90px,radial-gradient(closest-side,rgba(150,235,220,.55),transparent 70%) 40px 30px/160px 120px;animation:caus 22s linear infinite}
.caus.c2{opacity:.08;animation-duration:31s;animation-direction:reverse;background-size:90px 70px,200px 150px}
html[data-bg="cream"] .caus{display:none}
@keyframes caus{to{transform:translate(120px,90px)}}
button{font:inherit;touch-action:manipulation}
[hidden]{display:none!important}
.muted{color:var(--muted)}
h1,h2{margin:0;letter-spacing:-.02em}
h2{font-size:19px;font-weight:700}
.tag{font-size:10px;font-weight:700;padding:2px 8px;border-radius:99px;background:var(--line);flex:none}
.row{display:flex;gap:8px;align-items:center}
/* buttons */
.btn{font-weight:700;border:0;border-radius:15px;padding:13px 18px;min-height:48px;cursor:pointer;background:var(--panel);color:var(--ink);box-shadow:inset 0 0 0 1px var(--edge)}
.btn:disabled{opacity:.5;cursor:default}
.btn.primary{background:linear-gradient(180deg,#1C7353,#155E43);color:#fff;box-shadow:0 3px 0 #0B3B2B,0 10px 20px -10px rgba(11,59,43,.7)}
.btn.gold{background:linear-gradient(180deg,#FFE08A,#E2A93A);color:#3A2305;box-shadow:0 3px 0 #9A6B14,0 10px 20px -10px rgba(226,169,58,.8)}
.btn.soft{background:#F3ECDF;box-shadow:inset 0 0 0 1px var(--edge)}
.btn.ghost{background:transparent;box-shadow:inset 0 0 0 1px var(--edge)}
.btn.wide{width:100%}
.btn.sm{padding:9px 14px;min-height:44px;font-size:13px;border-radius:13px}
.btn.danger{color:var(--accent)}
.btn.danger-solid{background:var(--accent);color:#fff;box-shadow:none}
button:focus-visible,input:focus-visible,a:focus-visible,textarea:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.linkbtn{display:block;margin:12px auto 0;background:none;border:0;font:inherit;font-size:13px;font-weight:600;color:var(--muted);text-decoration:underline;cursor:pointer;padding:10px;min-height:44px}
.linkbtn.danger{color:var(--accent)}
/* Continue with Google / Apple: brand-guideline buttons (Google light theme: white, #747775 outline, Roboto Medium, 4-colour G; Apple: black, white logo) */
.sso{display:flex;flex-direction:column;gap:10px;margin:0 0 4px}
.gbtn,.abtn{display:flex;align-items:center;justify-content:center;gap:12px;width:100%;min-height:48px;padding:10px 16px;border-radius:14px;cursor:pointer;font-size:16px;line-height:1.2;text-align:center;-webkit-tap-highlight-color:transparent;transition:background-color .15s,box-shadow .15s}
.gbtn{background:#fff;color:#1F1F1F;border:1px solid #747775;font-family:Roboto,Arial,sans-serif;font-weight:500;letter-spacing:.25px}
.gbtn:hover{background:#F8FAFD;box-shadow:0 1px 3px rgba(60,64,67,.3)}
.gbtn:active{background:#EEF1F5}
.abtn{background:#000;color:#fff;border:1px solid #000;font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text','Helvetica Neue',Arial,sans-serif;font-weight:500}
.abtn:active{background:#222}
.gbtn svg{width:20px;height:20px;flex:none}.abtn svg{width:17px;height:20px;flex:none;margin-top:-3px}
.gbtn:disabled,.abtn:disabled{opacity:.6;cursor:default}
.gbtn:focus-visible,.abtn:focus-visible{outline:3px solid #1A73E8;outline-offset:2px}
.ordiv{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:12px;font-weight:600;margin:14px 0 12px}
.ordiv:before,.ordiv:after{content:'';flex:1;height:1px;background:var(--edge)}
.links{display:flex;flex-direction:column;gap:8px;margin:0 0 6px}
.lrow{display:flex;align-items:center;flex-wrap:wrap;gap:8px 12px;padding:10px 12px;border-radius:14px;background:#fff;box-shadow:inset 0 0 0 1px var(--edge);min-height:58px}
.lrow .li{width:30px;height:30px;display:grid;place-items:center;flex:none;border-radius:50%;background:#F6F1E7}
.lrow .li svg{width:18px;height:18px}
.lrow .lt{flex:1 1 130px;min-width:0;overflow-wrap:anywhere}
.lrow .lt b{display:block;font-size:14px}.lrow .lt small{display:block;color:var(--muted);font-size:12px;line-height:1.35}
.lrow .ok{color:#155E43;font-weight:700;font-size:13px;display:inline-flex;align-items:center;gap:4px;flex:none;margin-left:auto;padding-right:2px}
.lrow .btn.sm{flex:none;margin-left:auto}
.note{font-size:12.5px;line-height:1.45;color:var(--muted);background:#F6F1E7;border-radius:12px;padding:10px 12px;margin:12px 0 0}
.in{font:inherit;font-size:16px;width:100%;min-height:48px;padding:12px 14px;border-radius:14px;border:1px solid var(--edge);background:#fff;color:var(--ink)}
.in:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(21,94,67,.15)}
label.f{display:block;font-size:12px;font-weight:600;color:var(--muted);margin-bottom:6px}
.icon-btn{width:44px;height:44px;border-radius:14px;border:0;background:rgba(255,255,255,.14);box-shadow:inset 0 0 0 1px rgba(255,255,255,.22);color:#fff;display:grid;place-items:center;cursor:pointer;flex:none;padding:0;text-decoration:none;position:relative}
.icon-btn svg{width:20px;height:20px}
/* Dhivehi Games home: back arrow + the small Punch Card tile */
.icon-btn.dgh{width:auto;display:flex;align-items:center;gap:2px;padding:0 8px 0 4px}
.icon-btn.dgh svg{width:18px;height:18px}.icon-btn .dgmk{display:block;width:24px;height:24px;flex:none;filter:drop-shadow(0 2px 4px rgba(0,0,0,.25))}
html[data-bg="cream"] .icon-btn{background:#fff;color:var(--ink);box-shadow:inset 0 0 0 1px var(--edge)}
.icon-btn .mute{display:none}.icon-btn[aria-pressed="false"] .mute{display:block}.icon-btn[aria-pressed="false"] .note{opacity:.6}
/* pages */
.page{max-width:540px;margin:0 auto;padding:calc(12px + env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) calc(32px + env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left));color:#fff}
html[data-bg="cream"] .page{color:var(--ink)}
.panel{background:var(--panel);color:var(--ink);border-radius:24px;padding:18px;margin:14px 0;box-shadow:inset 0 0 0 1px rgba(230,217,192,.9),var(--shadow)}
.panel h2{font:800 17px/1.2 Sora,sans-serif;letter-spacing:-.01em}
.subtop{display:flex;align-items:center;gap:12px;margin:4px 0 8px;min-height:48px}
.subtop h1{font:900 26px/1 Fraunces,Georgia,serif;letter-spacing:-.01em;margin-right:auto;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sec{display:flex;align-items:center;gap:10px;margin:22px 4px 10px;font-size:11px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;opacity:.8}
.sec:after{content:"";flex:1;height:1px;background:linear-gradient(90deg,currentColor,transparent);opacity:.35}
.seg{display:flex;background:#EDE3D0;border-radius:16px;padding:5px;gap:5px}
.seg button{flex:1;border:0;background:transparent;color:var(--muted);font-weight:800;font-size:13px;padding:10px;border-radius:12px;min-height:44px;cursor:pointer}
.seg button[aria-pressed="true"]{background:#fff;color:var(--accent);box-shadow:0 2px 6px rgba(0,0,0,.12)}
.seghint{font-size:12px;color:var(--muted);margin:8px 2px 12px}
.or{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:12px;margin:14px 0}
.or:before,.or:after{content:"";flex:1;height:1px;background:var(--line)}
.joinrow .in{text-transform:uppercase;letter-spacing:.3em;font-weight:800;text-align:center;font-size:20px}
.joinrow .btn{min-width:92px}
.code{font:900 54px/1.05 Fraunces,Georgia,serif;letter-spacing:.14em;color:var(--deep);margin-left:.14em}
.lrow{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.lrow:last-of-type{border-bottom:0}
.lname{flex:1;font-weight:700;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ltitle{display:block;font-size:11px;color:var(--muted);font-weight:500}
.rdy{font-size:11px;font-weight:800;padding:4px 9px;border-radius:99px;background:#F3ECDF;color:var(--muted);flex:none;display:inline-flex;align-items:center;gap:4px}
.rdy.ok{background:#E3F2EA;color:#146B45}
.otable{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.otable:last-child{border-bottom:0}
.otable .ot{flex:1;min-width:0}
.otable b{display:block;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.otable small{color:var(--muted);font-size:12px}
/* leaderboard: menu podium and the top-10 list */
.lbbox{display:block;width:100%;text-align:left;margin:12px 0 4px;padding:10px 12px 8px;border:1px solid var(--line);border-radius:16px;background:linear-gradient(180deg,#FFF9EC,#FFFDF8);color:var(--ink);cursor:pointer}
.lbbox .lbh{display:block;font:800 11px/1 Sora,sans-serif;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:8px}
.lbmsg{margin:4px 0 6px;font-size:13px}
.lbpod{display:grid;grid-template-columns:1fr 1.15fr 1fr;gap:6px;align-items:end}
.lbp{position:relative;display:flex;flex-direction:column;align-items:center;text-align:center;min-width:0;padding:6px 2px 4px;border-radius:12px}
.lbp:nth-child(1){order:2}.lbp:nth-child(2){order:1}.lbp:nth-child(3){order:3}
.lbp.p1{background:rgba(242,201,76,.18)}
.lbp.lbme{box-shadow:inset 0 0 0 2px var(--accent)}
.lbp .lbr{position:absolute;top:2px;left:4px;font:800 11px/1 Sora,sans-serif;color:#8A6414}
.lbp .lbf,.lbrow .lbf{display:grid;place-items:center;width:36px;height:36px;border-radius:50%;overflow:hidden;flex:none}
.lbp b{font-size:12.5px;line-height:1.2;margin-top:4px;overflow-wrap:anywhere;word-break:break-word}
.lbp small,.lbrow small{color:var(--muted);font-size:11.5px}
.lbmore{display:flex;align-items:center;justify-content:center;gap:2px;margin-top:6px;font-size:12px;font-weight:700;color:var(--accent)}
.lbmore svg{width:14px;height:14px}
.lblist{display:flex;flex-direction:column;gap:2px}
.lbrow{display:flex;align-items:center;gap:10px;padding:8px 8px;border-radius:12px}
.lbrow.lbme{background:rgba(21,94,67,.1);box-shadow:inset 0 0 0 1.5px rgba(21,94,67,.45)}
.lbrow.mine{margin-top:8px}
.lbrow .lbn{width:22px;text-align:center;font:800 13px/1 Sora,sans-serif;color:var(--muted);flex:none}
.lbrow .lbt{flex:1;min-width:0;display:flex;flex-direction:column}
.lbrow .lbt b{font-size:14px;line-height:1.25;overflow-wrap:anywhere;word-break:break-word}
.lbrow .lbs{display:flex;flex-direction:column;align-items:flex-end;flex:none;text-align:right}
.lbrow .lbs b{font-size:13px}
.empty-list{color:var(--muted);font-size:13px;margin:4px 0}
.qwait{text-align:center}
.spin{width:34px;height:34px;border-radius:50%;border:3px solid var(--line);border-top-color:var(--accent);margin:4px auto 12px;animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.pick{display:flex;gap:8px;flex-wrap:wrap}
.pick .btn{flex:1;min-width:48px}
.pick .btn[aria-pressed="true"]{background:linear-gradient(180deg,#1C7353,#155E43);color:#fff;box-shadow:0 3px 0 #0B3B2B}
.hint{font-size:12.5px;color:var(--muted);margin:10px 2px 0;line-height:1.45}
.hint b{color:var(--ink)}
/* server status */
.srv{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--muted);margin:10px 4px 0}
.srv i{width:8px;height:8px;border-radius:50%;background:#E8B232;flex:none}
.srv.s-ok i{background:#2FA66A}.srv.s-fail i{background:#D0443A}.srv.s-fail{color:#C8453A}
.modes .srv,.page>.srv{color:rgba(255,255,255,.85)}
/* ---------- avatars ---------- */
.mini{width:34px;height:34px;flex:none;display:block;position:relative}
.pz{display:grid;place-items:center;width:100%;height:100%;border-radius:50%;background:var(--c);box-shadow:0 0 0 2px #fff,0 3px 8px rgba(0,0,0,.2);color:#fff;overflow:hidden}
.pz svg{width:70%;height:70%;display:block}
.pz.chr{background:#CFE7F2}
.pz.chr svg{width:100%;height:100%}
.frm{position:relative;isolation:isolate}
.frm>.pz{position:relative;z-index:1}
.pmid{width:52px!important;height:52px!important}.pbig{width:88px!important;height:88px!important;margin:0 auto 10px}
.crown{position:absolute;left:50%;top:-12px;width:24px;height:16px;translate:-50% 0;z-index:4;filter:drop-shadow(0 1px 2px rgba(0,0,0,.35));animation:crownin .6s var(--spring) both}
.crown svg{width:100%;height:100%;display:block}
@keyframes crownin{from{opacity:0;scale:.4}}
.hostb{position:absolute;left:50%;bottom:-6px;transform:translateX(-50%);z-index:4;font:800 8px/1 Sora,sans-serif;letter-spacing:.08em;padding:3px 6px;border-radius:99px;background:#F4F7F8;color:#1E3036;box-shadow:0 0 0 1.5px rgba(10,25,30,.55);text-transform:uppercase;white-space:nowrap}
.hostpill{display:inline-block;vertical-align:2px;margin-left:6px;font:800 8.5px/1 Sora,sans-serif;letter-spacing:.08em;text-transform:uppercase;padding:3px 6px;border-radius:99px;background:#E3EAEC;color:#1E3036;box-shadow:inset 0 0 0 1px rgba(30,48,54,.25)}
.lefttag{display:inline-block;margin-left:6px;font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:#8A2B2B;opacity:.9}
/* voice: a ring around the talker's picture that grows with their voice (transform + opacity only, driven by --vl 0..1);
   coral on the Pastel table, otherwise the table's own accent. It fades out ~0.3 s after they stop. */
.vring{position:absolute;inset:-5px;border-radius:50%;border:3px solid var(--acc,#EE4A64);z-index:-1;pointer-events:none;opacity:0;transform:scale(1);transition:opacity .3s ease-out,transform .3s ease-out}
.vring:after{content:"";position:absolute;inset:-10px;border-radius:50%;background:radial-gradient(closest-side,var(--accGlow,rgba(238,74,100,.45)),transparent);opacity:.5}
.vtalk>.vring{opacity:calc(.55 + var(--vl,0)*.45);transform:scale(calc(1 + var(--vl,0)*.22));transition:opacity .08s linear,transform .08s linear}
.vhost{position:relative}
.vtalk .dga-mouth{transform-box:fill-box;transform-origin:50% 25%;transform:scaleY(calc(1 + var(--mo,0)*.9))}
.moff{position:absolute;right:-4px;bottom:-3px;z-index:5;width:18px;height:18px;border-radius:50%;background:#fff;color:#2A1418;display:grid;place-items:center;box-shadow:0 1px 3px rgba(42,20,24,.35);pointer-events:none}
.moff[hidden]{display:none}.moff svg{width:11px;height:11px}
.ctag{position:absolute;left:50%;bottom:-7px;transform:translateX(-50%);z-index:4;background:#2A1418;color:#fff;font:800 8px/1 Sora,sans-serif;letter-spacing:.04em;text-transform:uppercase;padding:3px 5px;border-radius:99px;white-space:nowrap;box-shadow:0 0 0 1px rgba(255,255,255,.55);pointer-events:none}
.ctag[hidden]{display:none}
/* ---------- playing cards ---------- */
.card{--w:var(--cw);position:absolute;left:0;top:0;width:var(--w);height:calc(var(--w)*1.4);border-radius:calc(var(--w)*.1);user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
.face,.back{position:absolute;inset:0;border-radius:inherit;overflow:hidden}
.face{--sc:#141414;background:linear-gradient(168deg,#FFFEFA 0%,#FAF5EA 60%,#F3ECDD 100%);color:var(--sc);
 box-shadow:inset 0 0 0 1px rgba(40,30,10,.09),inset 0 1px 0 #fff,0 1px 1px rgba(4,40,60,.12),0 8px 18px -6px rgba(4,40,60,.4)}
.face.H,.face.D{--sc:#C4262E}
.ix{position:absolute;left:calc(var(--w)*.04);top:calc(var(--w)*.05);width:calc(var(--w)*.34);display:flex;flex-direction:column;align-items:center;z-index:1}
.ix b{font-family:'DM Serif Display',Georgia,'Times New Roman',serif;font-weight:400;font-size:calc(var(--w)*.42);line-height:.92;letter-spacing:-.07em;margin-left:-.07em}
.ix svg{width:calc(var(--w)*.2);height:calc(var(--w)*.2);margin-top:calc(var(--w)*.02)}
.face .big{position:absolute;left:50%;top:56%;width:calc(var(--w)*.5);height:calc(var(--w)*.5);transform:translate(-40%,-50%)}
.face .ace{position:absolute;left:50%;top:55%;width:calc(var(--w)*.62);height:calc(var(--w)*.62);transform:translate(-44%,-50%);filter:drop-shadow(0 2px 3px rgba(0,0,0,.14))}
.face .court{position:absolute;left:30%;right:5%;top:17%;bottom:5%}
.face .court svg,.face .ace svg{width:100%;height:100%;display:block}
/* default back: lagoon green, cream + gold frame, lattice and a gold medallion */
.back{background:#0B3B2B;box-shadow:0 1px 1px rgba(4,40,60,.14),0 8px 18px -6px rgba(0,0,0,.5)}
.back.bdef{background:radial-gradient(120% 90% at 50% 20%,#155E43,#0B3B2B 70%);box-shadow:inset 0 0 0 calc(var(--w)*.035) #F7EFDF,inset 0 0 0 calc(var(--w)*.06) #C9A45C,0 1px 1px rgba(0,0,0,.2),0 8px 18px -6px rgba(0,0,0,.5)}
.back.bdef:before{content:"";position:absolute;inset:calc(var(--w)*.11);border-radius:calc(var(--w)*.05);background:repeating-linear-gradient(45deg,rgba(231,201,127,.22) 0 1px,transparent 1px 7px),repeating-linear-gradient(-45deg,rgba(231,201,127,.22) 0 1px,transparent 1px 7px);box-shadow:inset 0 0 0 1px rgba(231,201,127,.55)}
.back.bdef:after{content:"";position:absolute;left:50%;top:50%;width:calc(var(--w)*.42);height:calc(var(--w)*.42);margin:calc(var(--w)*-.21);border-radius:50%;background:radial-gradient(circle,#0B3B2B 55%,transparent 57%),conic-gradient(from 45deg,#E7C97F,#B8863F,#E7C97F,#B8863F,#E7C97F);box-shadow:0 0 0 2px rgba(11,59,43,.9)}
.back.imgback>i{position:absolute;inset:0;background-size:cover;background-position:center;border-radius:inherit}
.back.imgback:after{content:"";position:absolute;inset:0;border-radius:inherit;box-shadow:inset 0 0 0 calc(var(--w)*.03) rgba(255,255,255,.55)}
/* ================= Digu home ================= */
.hometop{display:flex;align-items:center;gap:8px;min-height:48px}
.profbtn{display:flex;align-items:center;gap:9px;height:48px;padding:0 14px 0 5px;border:0;border-radius:99px;background:rgba(255,255,255,.14);box-shadow:inset 0 0 0 1px rgba(255,255,255,.22);color:#fff;cursor:pointer;margin-right:auto;min-width:0;flex:0 1 auto}
.profbtn .mini{width:38px;height:38px}
.profbtn .pwrap{display:flex;flex-direction:column;min-width:0;line-height:1.15;text-align:left}
.profbtn .pn{font-weight:700;font-size:13.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.profbtn .ps{font-size:10.5px;font-weight:700;color:#FFE3A8;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.shellpill{display:inline-flex;align-items:center;gap:6px;height:44px;padding:0 14px 0 10px;border:0;border-radius:99px;background:rgba(255,255,255,.14);box-shadow:inset 0 0 0 1px rgba(255,255,255,.22);color:#fff;font:inherit;font-weight:800;font-size:14px;cursor:pointer;flex:none}
html[data-bg="cream"] .shellpill{background:#fff;color:var(--ink);box-shadow:inset 0 0 0 1px var(--edge),0 2px 0 var(--edge)}
img.boli{display:inline-block;width:18px;height:18px;object-fit:contain;vertical-align:-3px;filter:drop-shadow(0 1px 1.5px rgba(0,0,0,.28))}
.shellpill img.boli{width:24px;height:24px;vertical-align:middle}
.dhero{position:relative;height:clamp(190px,56vw,240px);margin-top:4px;pointer-events:none}
.dhero .card{--w:clamp(78px,24vw,100px);left:50%;top:28px;margin-left:calc(var(--w)/-2);transform-origin:50% 130%;animation:heroIn 1s var(--spring) both,breathe 6s ease-in-out 1.2s infinite}
.dhero .card:nth-child(1){--r:-18deg;left:44%;animation-delay:.05s,1.2s}
.dhero .card:nth-child(2){--r:18deg;left:56%;animation-delay:.15s,1.5s}
.dhero .card:nth-child(3){--r:0deg;top:12px;animation-delay:.25s,1.8s}
@keyframes breathe{0%,100%{transform:rotate(var(--r)) translateY(0)}50%{transform:rotate(calc(var(--r) * 1.12)) translateY(-6px)}}
@keyframes heroIn{from{transform:rotate(0) translateY(60px) scale(.8);opacity:0}to{transform:rotate(var(--r)) translateY(0);opacity:1}}
.dtitle{position:relative;text-align:center;margin-top:clamp(-46px,-10vw,-30px)}
.dtitle h1{font:900 clamp(52px,17vw,68px)/.9 Fraunces,Georgia,serif;letter-spacing:.02em;margin:0;text-shadow:0 6px 24px rgba(0,0,0,.35)}
.dtitle p{margin:8px 0 0;font:italic 700 15px/1 Fraunces,Georgia,serif;color:#FFE3A8}
.modes{position:relative;display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:22px 0 0}
.mode{position:relative;border:0;text-align:left;font:inherit;color:#fff;cursor:pointer;border-radius:22px;padding:14px;min-height:118px;display:flex;flex-direction:column;justify-content:flex-end;gap:2px;background:rgba(255,255,255,.1);box-shadow:inset 0 0 0 1px rgba(255,255,255,.2);overflow:hidden}
.mode .mi{position:absolute;top:12px;left:12px;width:40px;height:40px;border-radius:13px;display:grid;place-items:center;background:rgba(255,255,255,.16)}
.mode .mi svg{width:21px;height:21px}
.mode b{font-size:15.5px;font-weight:800}.mode small{font-size:11.5px;opacity:.82;line-height:1.3}
.mode .tag{position:absolute;top:12px;right:12px;font-size:9.5px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;background:#FF6B4A;color:#fff;padding:4px 8px;border-radius:99px}
.mode.quick{grid-column:1/-1;min-height:96px;flex-direction:row;align-items:center;gap:14px;background:linear-gradient(120deg,#FFD56B,#F29E3D);color:#3A2305;box-shadow:0 6px 0 #B5701F,0 18px 30px -12px rgba(242,158,61,.65);margin-bottom:6px}
.mode.quick:after{content:"";position:absolute;top:-60%;left:-40%;width:35%;height:220%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.38),transparent);transform:rotate(14deg);animation:sheen 5s ease-in-out infinite}
@keyframes sheen{0%,62%{translate:0 0}100%{translate:520% 0}}
.mode.quick .mi{position:static;background:rgba(255,255,255,.42);width:52px;height:52px;border-radius:16px;flex:none}
.mode.quick .mi svg{width:28px;height:28px}
.mode.quick .mt{display:flex;flex-direction:column;min-width:0;flex:1}
.mode.quick b{font-size:19px}.mode.quick small{opacity:.85}
.mode.quick .lv{flex:none;font-size:11px;font-weight:800;background:rgba(255,255,255,.5);padding:5px 10px;border-radius:99px;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.mode.quick .lv i{position:relative;width:7px;height:7px;border-radius:50%;background:#1C9A55}
.mode.quick .lv i:after{content:"";position:absolute;inset:0;border-radius:50%;background:rgba(28,154,85,.55);animation:ping 1.8s ease-out infinite}
@keyframes ping{from{transform:scale(1);opacity:.9}to{transform:scale(2.8);opacity:0}}
.resume{position:relative;display:flex;align-items:center;gap:10px;width:100%;margin:12px 0 0;padding:10px 10px 10px 14px;border:0;border-radius:18px;background:rgba(0,0,0,.22);box-shadow:inset 0 0 0 1px rgba(255,227,168,.32);font:inherit;font-size:12.5px;color:#fff;text-align:left;cursor:pointer;min-height:54px}
.resume b{color:#FFE3A8}.resume .go{margin-left:auto;flex:none;font-weight:800;color:#3A2305;background:#FFE3A8;padding:8px 14px;border-radius:99px;font-size:12px}
.podium{position:relative;margin:18px 0 0;padding:14px 14px 0;border-radius:24px;background:rgba(255,255,255,.08);box-shadow:inset 0 0 0 1px rgba(255,255,255,.15);overflow:hidden}
.podium h3{margin:0 0 12px;font-size:11px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;opacity:.82}
.pods{display:flex;align-items:flex-end;justify-content:center;gap:10px;min-height:150px}
.pod{text-align:center;width:31%;max-width:96px;min-width:0}
.pod .pf{display:block;width:52px;height:52px;margin:0 auto;border-radius:50%;overflow:hidden;box-shadow:0 0 0 2.5px #fff}
.pod .pf svg{width:100%;height:100%;display:block}
.pod.p1 .pf{width:64px;height:64px;box-shadow:0 0 0 3px #F2C94C,0 0 18px rgba(242,201,76,.6)}
.pod b{display:block;font-size:12px;margin-top:6px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.pod small{font-size:10.5px;opacity:.78}
.pod .step{margin-top:6px;height:var(--h);border-radius:12px 12px 4px 4px;background:linear-gradient(180deg,rgba(255,255,255,.24),rgba(255,255,255,.06));display:grid;place-items:center;font:900 20px/1 Fraunces,Georgia,serif;transform-origin:50% 100%;animation:stepup .9s var(--spring) both .3s}
.pod.p1 .step{background:linear-gradient(180deg,rgba(242,201,76,.5),rgba(242,201,76,.1))}
@keyframes stepup{from{transform:scaleY(0)}}
.podium .muted{color:rgba(255,255,255,.75);font-size:12.5px;padding:0 0 14px;text-align:center;margin:0}
.homebelow{margin-top:18px}
.acrow{display:flex;align-items:center;gap:12px;width:100%;min-height:60px;margin:0 0 12px;padding:9px 12px 9px 10px;border:0;border-radius:18px;background:var(--panel);box-shadow:inset 0 0 0 1px var(--edge);color:var(--ink);font:inherit;text-align:left;cursor:pointer}
.acrow .ai{flex:none;width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:var(--accent);color:#fff}
.acrow .ai svg{width:20px;height:20px}
.acrow .at{flex:1;min-width:0;line-height:1.25}.acrow b{display:block;font-size:15px}.acrow small{display:block;font-size:12.5px;color:var(--muted)}
.acrow .go{color:var(--muted);display:grid}.acrow .go svg{width:18px;height:18px}
.sbanner{position:relative;display:flex;align-items:center;gap:12px;width:100%;border:0;text-align:left;font:inherit;color:#fff;cursor:pointer;border-radius:22px;padding:12px 14px 12px 12px;margin:0 0 12px;background:radial-gradient(90% 120% at 80% 30%,#2A1A55,#0E0A22 75%);box-shadow:0 14px 30px -16px rgba(0,0,0,.7),inset 0 0 0 1px rgba(255,255,255,.1);overflow:hidden}
.sbanner .sprev{width:78px;height:78px;flex:none;display:grid;place-items:center;position:relative}
.sbanner .sbt{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.sbanner small{font-size:10px;font-weight:800;letter-spacing:.14em;color:#F2C94C}
.sbanner b{font:900 20px/1.05 Fraunces,Georgia,serif;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sbanner .sprice{display:inline-flex;align-items:center;gap:5px;font-weight:800;font-size:13px;margin-top:4px}
.sbanner .go{opacity:.7;display:grid}.sbanner .go svg{width:20px;height:20px}
.howbtn{display:flex;align-items:center;justify-content:center;gap:8px;color:#fff;background:rgba(255,255,255,.08);box-shadow:inset 0 0 0 1px rgba(255,255,255,.3)}
.howbtn svg{width:18px;height:18px}
.powered{display:flex;align-items:center;justify-content:center;gap:10px;margin-top:14px;font-size:11px;font-weight:600;letter-spacing:.04em;color:rgba(255,255,255,.8)}
.powered .pw{height:38px;min-width:100px;max-width:180px;padding:5px 12px;border-radius:10px;background:rgba(255,255,255,.96);color:#0D2E43;display:grid;place-items:center;overflow:hidden;font-weight:800;text-decoration:none}
.powered .pw img{max-width:100%;max-height:100%;object-fit:contain;display:block}
.powered .pw.ph{background:rgba(255,255,255,.08);border:1px dashed rgba(255,227,168,.6);color:#FFE3A8;font-weight:600;font-size:12px}
.powered.inpanel{color:var(--muted);margin-top:14px}
.powered.inpanel .pw{box-shadow:inset 0 0 0 1px var(--line)}
.powered.inpanel .pw.ph{background:#FBF7EF;color:#8A7453;border-color:#D8C7A6}
.dgkick{display:inline-block;margin-top:10px;font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);text-decoration:none;padding:4px 10px;border-radius:99px;background:rgba(255,253,249,.8);box-shadow:inset 0 0 0 1px #E3D5BD}
.snote{color:rgba(255,255,255,.8);font-size:12px;text-align:center;margin:16px 8px 0}
html[data-bg="cream"] .snote{color:#8A7B66}
/* ================= rules card ================= */
.rcard{text-align:left}
.rcard .rtop{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.rcard .rbadge{flex:none;width:52px;height:52px;border-radius:16px;display:grid;place-items:center;background:linear-gradient(160deg,#1C7353,#0B3B2B);color:#F2D49B;box-shadow:inset 0 0 0 1.5px rgba(242,212,155,.6)}
.rcard .rbadge svg{width:28px;height:28px}
.rcard.blitz .rbadge{background:linear-gradient(160deg,#FF8A4A,#E23B3B);color:#fff}
.rcard h2{font:900 26px/1 Fraunces,Georgia,serif;margin:0}
.rcard .rsub{font-size:12.5px;color:var(--muted);margin-top:3px}
.rlist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.rlist li{display:flex;gap:10px;align-items:flex-start;font-size:13.5px;line-height:1.4;padding:10px 12px;border-radius:14px;background:#F6F0E4}
.rlist li i{flex:none;font-style:normal;width:24px;height:24px;border-radius:8px;display:grid;place-items:center;background:#fff;box-shadow:inset 0 0 0 1px var(--edge);font-size:13px}
.rlist li.hl{background:linear-gradient(90deg,#FFF1D6,#FFE3C4);box-shadow:inset 0 0 0 1.5px #F0A24A}
.rlist li.hl i{background:#FF8A4A;color:#fff;box-shadow:none}
.rlist b{font-weight:800}
.rmini{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.rmini span{font-size:11.5px;font-weight:700;padding:5px 10px;border-radius:99px;background:#F3ECDF;color:var(--ink)}
.rmini span.hl{background:#FFE3C4;color:#8A3B0A}
/* ================= table: Island Luxe ================= */
main.table{position:fixed;inset:0;display:flex;flex-direction:column;overflow:hidden;color:#fff;background:radial-gradient(120% 75% at 50% 42%,#0E5F6E 0%,#083C4C 55%,#042331 100%);
 padding:env(safe-area-inset-top) env(safe-area-inset-right) 0 env(safe-area-inset-left)}
main.table>*{width:100%;max-width:640px;margin-left:auto;margin-right:auto}
.topbar{position:relative;z-index:6;display:flex;align-items:center;gap:8px;padding:8px 10px 0}
.goal{flex:1;min-width:0;display:flex;justify-content:center}
.goal>span{display:inline-block;max-width:100%;font-size:12px;font-weight:700;background:rgba(0,0,0,.25);padding:9px 14px;border-radius:99px;box-shadow:inset 0 0 0 1px rgba(242,212,155,.35);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.goal b{color:#F2D49B}
.goal .bz{color:#FF9A6B}
.tools{display:flex;gap:6px;flex:none}
.chatbtn .dot{position:absolute;top:8px;right:8px;width:9px;height:9px;border-radius:50%;background:#F2C94C;box-shadow:0 0 0 2px rgba(6,52,72,.55)}
.emobtn{font-size:20px}
.emobtn.cd{opacity:.4}
.micbtn[aria-pressed="true"]{background:#2FA66A!important;color:#fff!important}
.micbtn svg,.vcbtn svg{width:20px;height:20px}
.arena{position:relative;flex:1;min-height:0}
.seats{position:absolute;inset:0;z-index:3;pointer-events:none}
.seat{--av:clamp(40px,12.4vw,50px);position:absolute;left:0;top:0;width:76px;margin-left:-38px;display:flex;flex-direction:column;align-items:center;gap:3px;pointer-events:auto;cursor:pointer;transition:transform .6s var(--spring),opacity .3s;-webkit-tap-highlight-color:transparent;border-radius:14px}
.seats.n5 .seat,.seats.n4 .seat{width:68px;margin-left:-34px;--av:clamp(38px,11.4vw,48px)}
.seat .av{position:relative;width:var(--av);height:var(--av);isolation:isolate;border-radius:50%}
.seat .av .mini,.meav .mini{width:100%;height:100%}
.seat .nm{font-size:11px;font-weight:700;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-shadow:0 1px 2px rgba(0,0,0,.6);margin-top:3px}
.seat .cnt{font-size:10px;font-weight:700;background:rgba(0,0,0,.32);padding:2px 8px;border-radius:99px;white-space:nowrap;font-variant-numeric:tabular-nums}
.seat.gone{opacity:.5}
.aitag{font-size:8.5px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;padding:2px 6px;border-radius:99px;background:rgba(255,255,255,.92);color:#0B3B2B;white-space:nowrap}
.aitag.left{color:#8A2B2B}
/* the little fan of card backs each opponent holds */
/* opponent's fan in their own card back: bigger when there is room, smaller on crowded tables */
.hfan{--fw:19px;position:absolute;right:calc(var(--fw)*-.85);bottom:-2px;width:calc(var(--fw)*1.6);height:calc(var(--fw)*1.55);z-index:0;pointer-events:none}
.seats.n4 .hfan,.seats.n5 .hfan,.seats.n6 .hfan{--fw:17.5px}
@media (max-width:360px){.seats.n4 .hfan,.seats.n5 .hfan,.seats.n6 .hfan{--fw:16px}}
.hfan i{position:absolute;left:calc(var(--fw)*.3);top:0;width:var(--fw);height:calc(var(--fw)*1.4);border-radius:3px;overflow:hidden;transform-origin:50% 120%;background:#0B3B2B center/cover;box-shadow:0 0 0 1px rgba(255,253,249,.8),0 2px 4px rgba(0,0,0,.35)}
.hfan i.bdef{background:radial-gradient(120% 90% at 50% 20%,#155E43,#0B3B2B 70%);box-shadow:inset 0 0 0 1.5px #C9A45C,0 0 0 1px rgba(255,253,249,.8),0 2px 4px rgba(0,0,0,.35)}
.hfan i:nth-child(1){transform:rotate(-16deg)}.hfan i:nth-child(2){transform:rotate(0)}.hfan i:nth-child(3){transform:rotate(16deg)}
.hfan.bump{animation:bump .5s var(--spring)}
@keyframes bump{40%{transform:scale(1.25)}}
/* turn: a glowing ring around the avatar that drains clockwise (transform-only) */
.av.on:before{content:"";position:absolute;inset:-7px;border-radius:50%;box-shadow:0 0 14px 3px var(--tg,rgba(255,211,110,.75));animation:tglow 1.6s ease-in-out infinite;pointer-events:none;z-index:-1}
@keyframes tglow{0%,100%{opacity:.45}50%{opacity:1}}
.tmr.warn{--tc:#FF9A3D}.tmr.hot{--tc:#FF4D4D}
.av.on.warn{--tg:rgba(255,154,61,.8)}.av.on.hot{--tg:rgba(255,77,77,.85)}
/* centre of the felt */
.status{position:absolute;left:50%;top:var(--sy,40%);transform:translate(-50%,-50%);z-index:4;max-width:min(88%,330px);text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
 font-size:12.5px;font-weight:700;padding:8px 16px;border-radius:99px;background:rgba(3,25,33,.6);box-shadow:inset 0 0 0 1px rgba(242,212,155,.35);transition:background .3s,box-shadow .3s}
.status b{color:#F2D49B;font-weight:800}
.status.mine{background:rgba(3,25,33,.72);box-shadow:inset 0 0 0 1.5px rgba(255,211,110,.85),0 0 18px rgba(255,211,110,.35)}
#status[data-t]::after{content:" · " attr(data-t);font-variant-numeric:tabular-nums;opacity:.8}
#status[data-hot]::after{color:#FF8A6B;opacity:1;font-weight:800}
.piles{position:absolute;left:50%;top:var(--py,62%);transform:translate(-50%,-50%);z-index:4;display:flex;gap:clamp(20px,7vw,34px)}
.pile{all:unset;position:relative;display:block;width:var(--pw);height:calc(var(--pw)*1.4);cursor:pointer;border-radius:calc(var(--pw)*.1);-webkit-tap-highlight-color:transparent;touch-action:manipulation}
.pile .card{--w:var(--pw)}
.pile:focus-visible{outline:2px solid var(--gold2);outline-offset:6px}
.pile.can:after,.pile.drop:after{content:"";position:absolute;inset:-6px;border-radius:calc(var(--pw)*.15);box-shadow:0 0 0 2.5px rgba(255,211,110,.95),0 0 22px rgba(255,211,110,.7);animation:pglow 1.6s ease-in-out infinite;pointer-events:none;z-index:6}
.pile.drop:after{animation:none;transform:scale(1.05);background:rgba(255,227,145,.16)}
@keyframes pglow{0%,100%{opacity:.4}50%{opacity:1}}
.pile:active .card:last-of-type{transform:translateY(2px)}
.empty{position:absolute;inset:0;border-radius:inherit;border:2px dashed rgba(255,255,255,.35)}
.pcount{position:absolute;right:-9px;top:-9px;z-index:7;min-width:24px;height:24px;padding:0 6px;border-radius:99px;background:#0B2A36;color:#FFE3A8;font:800 11px/24px Sora,sans-serif;text-align:center;box-shadow:0 0 0 2px rgba(255,227,168,.5)}
.pile.shuffling .card{animation:shufA .39s ease-in-out 2}
.pile.shuffling .card:nth-child(2n){animation-name:shufB}
@keyframes shufA{50%{translate:-38% -6px;rotate:-7deg}}
@keyframes shufB{50%{translate:38% -6px;rotate:7deg}}
/* you */
.me{position:relative;z-index:5;padding:0 0 calc(8px + env(safe-area-inset-bottom));background:linear-gradient(180deg,transparent,rgba(2,18,26,.55) 38%)}
.mebar{display:flex;align-items:center;gap:10px;padding:4px 12px 0;min-height:64px}
.meinfo{display:flex;align-items:center;gap:10px;min-width:0;flex:1}
.meav{position:relative;width:50px;height:50px;flex:none;border-radius:50%;isolation:isolate}
.meinfo b{font-size:14px;display:block;line-height:1.15;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.meinfo .s{display:block;font-size:11px;opacity:.82;white-space:nowrap}
.meinfo>div{min-width:0}
.acts{display:flex;gap:8px;flex:none;align-items:center}
.acts .btn{min-width:96px}
.yt{font:900 12.5px/1 Sora,sans-serif;letter-spacing:.12em;text-transform:uppercase;color:#3A2305;background:linear-gradient(180deg,#FFE08A,#E2A93A);padding:10px 16px;border-radius:99px;box-shadow:0 4px 0 #9A6B14,0 0 20px rgba(242,201,76,.6);animation:ytp 2.2s ease-in-out infinite,ytin .6s var(--spring) both;white-space:nowrap}
@keyframes ytp{0%,100%{transform:scale(1)}50%{transform:scale(1.07)}}
@keyframes ytin{from{opacity:0;translate:0 10px}}
.ginb{position:relative;height:48px;padding:0 24px;border:0;border-radius:15px;font:900 17px/1 Sora,sans-serif;letter-spacing:.08em;color:#3A2A05;background:linear-gradient(180deg,#FFE08A,#E2A93A);cursor:pointer;box-shadow:0 4px 0 #9A6B14;animation:ytp 2.2s ease-in-out infinite,ytin .6s var(--spring) both}
.ginb:after{content:"";position:absolute;inset:0;border-radius:inherit;box-shadow:0 0 28px 4px rgba(242,201,76,.85);animation:tglow 1.6s ease-in-out infinite;pointer-events:none}
.hand{position:relative;height:calc(var(--cw)*1.4 + 44px);margin:0 4px;touch-action:none;contain:layout}
.hand .card{transition:transform .55s var(--spring);will-change:transform;cursor:grab;touch-action:none}
.hand .card.nt{transition:none}
.hand .card.dragging{transition:none;z-index:200!important;cursor:grabbing}
.hand .card.dragging .face{box-shadow:inset 0 0 0 1px rgba(40,30,10,.07),0 20px 30px rgba(0,0,0,.45)}
.hand .card.inm .face{box-shadow:inset 0 0 0 2px #E0B458,0 0 0 1.5px rgba(224,180,88,.55),0 0 16px rgba(224,180,88,.4),0 8px 16px -6px rgba(0,0,0,.55)}
.mtk{position:absolute;left:0;top:0;width:20px;height:20px;border-radius:50%;background:#F2C94C;color:#3A2A05;font:900 11px/20px Sora,sans-serif;font-style:normal;text-align:center;box-shadow:0 0 0 1.5px #fff,0 2px 6px rgba(0,0,0,.35);z-index:150;pointer-events:none;opacity:0;transition:transform .55s var(--spring),opacity .3s}
.hand .card.gin .face{box-shadow:inset 0 0 0 2.5px #FFD36E,0 0 0 2px rgba(255,211,110,.7),0 0 22px rgba(255,211,110,.75),0 8px 16px -6px rgba(0,0,0,.55)}
.hand .watch{position:absolute;inset:0;display:grid;place-items:center;color:#fff;opacity:.9}
.fx{position:fixed;inset:0;pointer-events:none;z-index:60}
.fly{position:fixed;left:0;top:0;will-change:transform;perspective:700px}
.fly .flw{position:absolute;inset:0;transform-style:preserve-3d}
.fly .card{position:absolute;inset:0;width:100%;height:100%;backface-visibility:hidden;-webkit-backface-visibility:hidden}
.fly .card.ff{transform:rotateY(180deg)}
/* chat and reactions */
.chatbar,.emotray{position:absolute;left:8px;right:8px;bottom:calc(100% + 4px);z-index:31;background:var(--panel);color:var(--ink);border-radius:22px;box-shadow:0 18px 40px -12px rgba(0,0,0,.6);padding:8px;animation:trayin .35s var(--spring)}
.emotray{display:flex;justify-content:center;gap:6px;flex-wrap:wrap}
@keyframes trayin{from{transform:translateY(10px);opacity:0}}
.chatlog{display:flex;flex-direction:column;gap:3px;padding:4px 8px 8px;font-size:13px;line-height:1.35}
.chatlog:empty{display:none}
.chatlog p{margin:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chatlog b{font-weight:700;color:var(--accent)}
.chatquick{display:flex;gap:6px;overflow-x:auto;padding:0 2px 8px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.chatquick::-webkit-scrollbar{display:none}
.chip{flex:none;border:0;border-radius:99px;padding:0 14px;min-height:44px;font:inherit;font-size:12.5px;font-weight:700;background:#F3ECDF;color:var(--ink);cursor:pointer}
.chatquick .chip.emo{font-size:18px;padding-inline:10px}
.chatrow{display:flex;gap:6px;align-items:center}
.chatin{flex:1;min-width:0;font:inherit;font-size:16px;height:44px;padding:0 16px;border-radius:22px;border:1px solid var(--edge);background:#fff;color:var(--ink)}
.chatin:focus{outline:none;border-color:var(--accent)}
.chatsend{width:44px;height:44px;border-radius:50%;border:0;background:var(--accent);color:#fff;display:grid;place-items:center;cursor:pointer;flex:none}
.chatsend svg{width:18px;height:18px;margin-left:2px}
.emo-opt{border:0;background:#F3ECDF;border-radius:14px;width:46px;height:46px;font-size:24px;cursor:pointer;color:var(--ink);font-family:inherit}
.emo-opt.txt{font-size:15px;font-weight:800;width:54px}
.emo{position:fixed;z-index:65;pointer-events:none;transform:translate(-50%,0);background:#fff;color:#15241F;border-radius:16px;padding:3px 10px;font-size:26px;line-height:1.2;box-shadow:0 6px 18px rgba(4,40,60,.3);animation:emopop 2.1s ease both}
.emo.up{transform:translate(-50%,-100%)}
.emo.txt{font-size:16px;font-weight:800;padding:7px 12px}
.emo.chat{font-size:13px;font-weight:600;max-width:min(62vw,240px);padding:7px 12px;white-space:normal;line-height:1.3;text-align:center;border-radius:14px;animation-duration:3.6s}
@keyframes emopop{0%{opacity:0;scale:.6}12%{opacity:1;scale:1.08}20%{scale:1}80%{opacity:1}100%{opacity:0}}
/* ================= overlays, sheets, toasts ================= */
.ov{position:fixed;inset:0;z-index:40;display:none;align-items:center;justify-content:center;padding:16px;background:rgba(2,22,30,.62)}
.ov.show{display:flex;animation:fade .35s ease .45s both}
#rov.show{z-index:45;animation-delay:0s}
@keyframes fade{from{opacity:0}}
.ovc{background:var(--panel);color:var(--ink);border-radius:28px;padding:22px 18px 18px;width:100%;max-width:440px;max-height:100%;max-height:min(92dvh,100%);overflow:auto;-webkit-overflow-scrolling:touch;text-align:center;box-shadow:0 30px 60px -20px rgba(0,0,0,.6),inset 0 0 0 1px var(--edge);animation:rise .7s var(--spring) .5s both}
#rov .ovc{animation-delay:.05s}
@keyframes rise{from{transform:translateY(40px) scale(.94);opacity:0}}
.ovc>.mini{width:64px;height:64px;margin:0 auto 12px}
.ovc h2{font:900 26px/1.1 Fraunces,Georgia,serif}
.pts{display:inline-block;margin-top:6px;font-weight:800;color:var(--accent);font-size:15px}
.earn{margin-top:6px;font-weight:700;font-size:13px}
.melds{display:flex;flex-wrap:wrap;justify-content:center;gap:12px 14px;margin:18px 0 6px}
.meld{display:flex}
.meld .card{--w:var(--sw);position:relative;animation:pop .7s var(--spring) both;animation-delay:calc(.75s + var(--g)*.14s + var(--i)*.05s)}
.meld .card+.card{margin-left:calc(var(--sw)*-.52)}
@keyframes pop{from{transform:translateY(22px) rotate(-10deg) scale(.8);opacity:0}}
.reveal{margin:14px 0 2px;text-align:left}
.rvp{margin:8px 0 0}
.rvp .nm2{font-size:12px;color:var(--muted);margin:0 0 5px}
.rvrow{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:flex-start}
.rvg{display:flex}
.rvg .card{--w:calc(var(--sw)*.8);position:relative}
.rvg .card+.card{margin-left:calc(var(--w)*-.52)}
.rvg.dead{opacity:.62}
.scores{margin:16px 0;text-align:left}
.srow{display:grid;grid-template-columns:30px 1fr auto;gap:10px;align-items:center;padding:7px 0}
.srow .mini{width:30px;height:30px}
.srow .n{font-size:13px;font-weight:700;display:flex;flex-direction:column;gap:5px;min-width:0}
.srow.left{opacity:.55}
.bar{height:6px;border-radius:6px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;border-radius:6px;background:var(--c);transition:width .8s var(--out)}
.srow b{font-size:14px;min-width:34px;text-align:right}
.hands{margin:16px 0 4px;text-align:left;font-size:13px}
.hhead,.hrow{display:grid;grid-template-columns:26px minmax(0,1fr) 50px 56px 46px;gap:8px;align-items:center}
.hhead{font-size:11px;color:var(--muted);padding-bottom:5px;border-bottom:1px solid var(--line)}
.hhead span:nth-child(n+3),.hp,.hm,.hrow b{text-align:right}
.hrow{padding:7px 0;border-bottom:1px solid var(--line)}
.hrow:last-child{border-bottom:0}
.hrow .mini{width:26px;height:26px}
.hn{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hn small{display:block;font-size:10px;color:var(--accent)}
.hp{color:#1F8A5B;font-weight:700}.hm{color:#C8453A;font-weight:700}
.hrow b{font-size:15px}.hrow b.neg{color:#C8453A}
.totlbl{font-size:11px;text-align:left;margin-top:14px;color:var(--muted)}
.totlbl+.scores{margin-top:4px}
.sheet{position:fixed;inset:0;background:rgba(2,18,26,.55);display:none;align-items:flex-end;justify-content:center;z-index:70}
.sheet.open{display:flex}
.sheet-b{background:var(--panel);color:var(--ink);width:100%;max-width:540px;border-radius:26px 26px 0 0;padding:14px 18px calc(22px + env(safe-area-inset-bottom));max-height:88%;max-height:min(88%,calc(100% - 12px - env(safe-area-inset-top,0px)));overflow:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;animation:up .5s var(--spring)}
.sheet-b.tall{padding:0;height:94%;max-height:calc(100% - 8px - env(safe-area-inset-top,0px));overflow:hidden;display:flex;flex-direction:column}
.sheet-b.tall>.dgbw{flex:1;min-height:0;overflow:auto;-webkit-overflow-scrolling:touch}
.sheet-b h2{font:900 24px/1.15 Fraunces,Georgia,serif}
@keyframes up{from{transform:translateY(100%)}}
.grab{width:40px;height:4px;border-radius:4px;background:var(--line);margin:0 auto 14px}
.rules p{color:var(--muted);font-size:13px;margin:6px 0}
.sheet .row{margin-top:12px}
.sheet .row .btn{flex:1}
/* in-game menu: the action row stays at the top of the sheet, the long content scrolls under it */
.sheet-b.gmenu:not(.tall){padding:0;display:flex;flex-direction:column;overflow:hidden}
.sheet-b.gmenu>.mhead{flex:none;padding:10px 18px 12px;border-bottom:1px solid var(--line)}
.sheet-b.gmenu>.mhead .grab{margin-bottom:10px}
.sheet .row.mact{margin-top:0}
.sheet .row.mact .btn{flex:1 1 0;min-width:0;min-height:48px;padding:10px 8px;font-size:14px;line-height:1.15}
.toast{pointer-events:none} /* a passing notice never blocks a tap on the menu buttons under it */
.sheet-b.gmenu>.mbody{flex:1 1 auto;min-height:0;overflow:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;padding:14px 18px calc(22px + env(safe-area-inset-bottom))}
.toast{position:fixed;left:50%;top:calc(14px + env(safe-area-inset-top));transform:translateX(-50%);background:#fff;color:var(--ink);padding:10px 16px;border-radius:14px;font-size:13px;font-weight:600;z-index:80;max-width:90vw;box-shadow:0 12px 30px -10px rgba(0,0,0,.45);display:none}
.toast.show{display:block;animation:drop .5s var(--spring)}
@keyframes drop{from{transform:translate(-50%,-20px);opacity:0}}
.pprof{text-align:center}.pprof .mini{width:72px;height:72px;margin:0 auto 12px}.pprof p{margin:4px 0 0}
/* profile sheet: look picker */
.look{display:flex;flex-direction:column;gap:12px}
.lookprev{display:flex;align-items:center;gap:14px;padding:12px;border-radius:18px;background:#F6F0E4}
.lookprev .mini{width:64px;height:64px}
.lookprev .btn{margin-left:auto}
.pgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:4px 0}
.popt{border:0;background:#F3ECDF;border-radius:16px;padding:12px 2px 8px;display:flex;flex-direction:column;align-items:center;gap:6px;font:inherit;font-size:11px;font-weight:600;color:var(--ink);cursor:pointer;min-height:44px}
.popt .pz{width:44px;height:44px}
.popt.sel{box-shadow:inset 0 0 0 2px var(--accent);background:#fff}
.popt:disabled{opacity:.3;cursor:default}
.cgrid{display:grid;grid-template-columns:repeat(5,44px);justify-content:space-between;row-gap:10px;margin-top:6px}
.copt{width:44px;height:44px;border-radius:50%;border:0;background:var(--sw);cursor:pointer;box-shadow:inset 0 0 0 2px rgba(255,255,255,.35)}
.copt.sel{box-shadow:0 0 0 3px #FFFDF8,0 0 0 5px var(--sw)}
/* ================= store ================= */
.stabs{display:flex;gap:6px;margin:10px 0 0;padding:5px;border-radius:16px;background:#EDE3D0}
.stab{flex:1;border:0;border-radius:12px;min-height:44px;font:inherit;font-weight:800;font-size:12.5px;background:transparent;color:var(--muted);cursor:pointer;white-space:nowrap}
.stab[aria-pressed="true"]{background:#fff;color:var(--accent);box-shadow:0 2px 6px rgba(0,0,0,.12)}
.feat{position:relative;display:flex;flex-direction:column;justify-content:flex-end;width:100%;min-height:236px;margin:14px 0 0;padding:16px;border:0;border-radius:26px;overflow:hidden;text-align:left;font:inherit;color:#fff;cursor:pointer;background:radial-gradient(80% 90% at 70% 40%,#2A1A55,#0E0A22 70%);box-shadow:0 20px 40px -20px rgba(14,10,34,.8)}
.feat.b-back{background:radial-gradient(80% 90% at 72% 40%,#0F4C5C,#041E28 72%)}
.feat.b-avatar{background:radial-gradient(80% 90% at 72% 40%,#6B3B12,#1E0E04 72%)}
.feat .rarc{position:absolute;top:14px;left:14px;z-index:2;font-size:10px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;background:linear-gradient(90deg,#F2C94C,#E68A2E);color:#3A2305;padding:4px 9px;border-radius:99px}
.feat .rarc.epic{background:linear-gradient(90deg,#B08BFF,#7F5AF0);color:#fff}
.feat .rarc.rare{background:linear-gradient(90deg,#7EC3FF,#2D86C9);color:#fff}
.feat .rarc.common{background:#E8E1D2;color:#3A3325}
.feat h3{position:relative;z-index:2;margin:0;font:900 25px/1 Fraunces,Georgia,serif;max-width:58%;text-shadow:0 2px 10px rgba(0,0,0,.6)}
.feat p{position:relative;z-index:2;margin:5px 0 0;font-size:11.5px;opacity:.82;max-width:52%;line-height:1.35}
.feat .buy{position:relative;z-index:2;display:inline-flex;align-items:center;gap:6px;margin-top:12px;background:#fff;color:#1B1236;font-weight:900;padding:10px 14px;border-radius:14px;width:max-content;box-shadow:0 4px 0 rgba(0,0,0,.35)}
.feat .buy img.boli{width:20px;height:20px}
.feat .stage{position:absolute;right:4%;top:50%;width:46%;max-width:190px;aspect-ratio:1;transform:translateY(-50%);display:grid;place-items:center}
.feat .stage .card{position:relative;--w:clamp(76px,22vw,100px);rotate:8deg;animation:floaty 5s ease-in-out infinite}
.feat .stage .card+.card{position:absolute;rotate:-10deg;translate:-38% 4%;animation-delay:-2.5s;opacity:.9;z-index:-1}
@keyframes floaty{0%,100%{translate:0 0}50%{translate:0 -8px}}
.feat .stage .rgw{position:relative;width:52%;aspect-ratio:1}
.feat .stage .rgw .mini{width:100%;height:100%}
.feat .stage .avbig{width:86%;aspect-ratio:1;border-radius:50%;overflow:hidden;box-shadow:0 0 0 3px rgba(255,255,255,.85),0 20px 30px -10px rgba(0,0,0,.6);animation:floaty 5s ease-in-out infinite}
.feat .stage .avbig svg{width:100%;height:100%;display:block}
.srt{display:flex;align-items:center;justify-content:space-between;margin:22px 4px 10px;font-size:11.5px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:#6B6354}
.srt span{letter-spacing:0;text-transform:none;color:var(--accent);font-size:12px}
.items{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
@media (min-width:500px){.items{grid-template-columns:repeat(4,minmax(0,1fr))}}
.item{position:relative;border:0;font:inherit;color:var(--ink);cursor:pointer;border-radius:18px;background:#fff;padding:12px 6px 10px;text-align:center;box-shadow:inset 0 0 0 1px #EADFCB,0 3px 0 #EADFCB;display:flex;flex-direction:column;align-items:center;min-width:0}
.item .rb{position:absolute;left:0;right:0;top:0;height:4px;border-radius:18px 18px 0 0;background:var(--rc)}
.item .pv{height:92px;width:100%;display:grid;place-items:center;position:relative}
.item .pv .card{position:relative;--w:52px}
.item .pv .rgw{position:relative;width:48px;height:48px}
.item .pv .rgw .mini{width:100%;height:100%}
.item .pv .avt{width:72px;height:72px;border-radius:50%;overflow:hidden;box-shadow:0 0 0 2px #fff,0 6px 12px -6px rgba(0,0,0,.4)}
.item .pv .avt svg{width:100%;height:100%;display:block}
.item b{display:block;font-size:11.5px;margin-top:6px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .pr{display:inline-flex;align-items:center;gap:4px;margin-top:4px;font-size:11.5px;font-weight:800;color:var(--accent)}
.item .pr img.boli{width:15px;height:15px}
.item .own{margin-top:4px;font-size:10px;font-weight:800;color:#fff;background:var(--accent);padding:3px 8px;border-radius:99px;display:inline-block}
.item .own.o2{background:#E7DFCF;color:#5B5140}
.item .lock{margin-top:4px;font-size:10px;font-weight:700;color:var(--muted)}
.item.eq{box-shadow:inset 0 0 0 2px var(--accent),0 3px 0 var(--accent)}
.bigprev{position:relative;height:210px;border-radius:22px;margin:12px 0;display:grid;place-items:center;overflow:hidden;background:radial-gradient(80% 90% at 50% 40%,#11706D,#073F52 75%)}
.bigprev.b-frame{background:radial-gradient(80% 90% at 50% 40%,#2A1A55,#0E0A22 75%)}
.bigprev.b-avatar{background:radial-gradient(80% 90% at 50% 40%,#F6EAD2,#E3D2B2 80%)}
.bigprev .cards3{position:relative;width:220px;height:170px}
.bigprev .cards3 .card{--w:92px;left:50%;top:14px;margin-left:-46px;transform-origin:50% 130%}
.bigprev .rgw{position:relative;width:96px;height:96px}
.bigprev .rgw .mini{width:100%;height:100%}
.bigprev .avbig{width:150px;height:150px;border-radius:50%;overflow:hidden;box-shadow:0 0 0 3px #fff,0 16px 30px -12px rgba(0,0,0,.5)}
.bigprev .avbig svg{width:100%;height:100%;display:block}
.iteminfo{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12px;color:var(--muted);margin-top:4px}
/* ================= profile ================= */
.phead{text-align:center;padding-top:22px}
.phead .avw{position:relative;width:96px;height:96px;margin:0 auto 12px}
.phead .avw .mini{width:100%;height:100%}
.phead h2{font:900 26px/1.1 Fraunces,Georgia,serif}
.badge-t{display:inline-block;padding:5px 12px;border-radius:99px;background:linear-gradient(135deg,#155E43,#1E8A5E);color:#fff;font-weight:800;font-size:12px}
.xpbar{height:8px;border-radius:8px;background:var(--line);overflow:hidden;margin:14px 0 6px}
.xpbar i{display:block;height:100%;background:linear-gradient(90deg,#E7C97F,#C9A45C);border-radius:8px}
.lookrow{display:flex;gap:8px;margin-top:14px}
.lookrow .btn{flex:1}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.stat{background:#F6F0E4;border-radius:14px;padding:10px 6px;text-align:center}
.stat b{display:block;font:900 20px/1.1 Fraunces,Georgia,serif}.stat span{font-size:11px;color:var(--muted)}
.badges{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.bdg{text-align:center;font-size:11px;font-weight:700;padding:10px 4px;border-radius:14px;background:#F6F0E4}
.bdg i{display:block;font-style:normal;font-size:24px;margin-bottom:2px}
.bdg.off{opacity:.35}
.eqrow{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line)}
.eqrow:last-child{border-bottom:0}
.eqrow span{flex:1;min-width:0;font-weight:700}
.eqrow small{display:block;color:var(--muted);font-size:11px;font-weight:500}
.hist{font-size:12px;color:var(--muted);margin:6px 0}.hist b{color:var(--ink);font-weight:700}
.shh{display:flex;align-items:center;gap:8px}.shh img.boli{width:26px;height:26px}
.hlist{display:flex;flex-direction:column;margin-top:8px}
.hrowb{display:flex;align-items:center;justify-content:space-between;width:100%;background:none;border:0;border-top:1px solid var(--line);padding:14px 2px;font:inherit;font-size:15px;font-weight:700;color:var(--ink);cursor:pointer;text-align:left;min-height:48px}
.hrowb:first-child{border-top:0}
.hrowb svg{width:18px;height:18px;color:var(--muted)}
.blist .lrow{justify-content:space-between}
/* Boli packs, reports, voice */
.bad{display:flex;align-items:center;gap:12px;width:100%;padding:12px;border:0;border-radius:16px;background:#F3ECDF;color:var(--ink);font:inherit;text-align:left;cursor:pointer;margin-bottom:10px}
.bad .bi{flex:none;width:36px;height:36px;border-radius:12px;display:grid;place-items:center;background:var(--accent);color:#fff;font-size:13px}
.bad .bt{flex:1}.bad b{display:block;font-size:15px}.bad small{font-size:12px;color:var(--muted)}

.dboard .dtitle{position:static;margin:0}
.dboard .dtitle .eb{position:absolute;left:24px;top:28px;width:7em;margin:0;text-align:left;transform:rotate(-6deg);transform-origin:0 50%;font:700 11px/1.3 Kalam,'Segoe Print',cursive;letter-spacing:.09em;text-transform:uppercase;color:#C9D3CC;opacity:.85}
.dboard .dtitle h1{margin:12px 0 0;font:700 clamp(76px,23vw,96px)/.92 Kalam,'Segoe Print',cursive;letter-spacing:.01em;color:#F4F1E8;text-shadow:0 0 1px rgba(255,255,255,.7),0 0 8px rgba(255,255,255,.16)}
.dboard .dtitle .dv{display:block;margin:0;font:700 clamp(25px,7.6vw,30px)/1.3 'Noto Sans Thaana','MV Boli','Faruma',sans-serif;color:#F6D27E}
.dboard .hrt{position:absolute;right:24px;top:18px;font:400 26px/1 Kalam,'Segoe Print',cursive;color:#F28C9C;transform:rotate(10deg);opacity:.95}
.dboard .dscore{height:auto;display:flex;justify-content:center;gap:clamp(14px,5vw,24px);margin:8px 0 0;font:700 17px/1.1 Kalam,'Segoe Print',cursive;color:#DADFD6}
.dboard .dscore div{min-width:64px;padding-top:5px;border-top:2px dashed rgba(255,255,255,.32)}
.dboard .dscore b{display:block;margin-top:2px;font-size:26px;color:#fff;text-shadow:0 0 1px rgba(255,255,255,.6)}
.dboard .tray{position:absolute;left:12px;right:12px;bottom:12px;height:8px;background:#5E3F26;border-radius:2px}
.dboard .stick{position:absolute;right:40px;bottom:16px;width:30px;height:7px;border-radius:3px;background:#F6F3EA;box-shadow:0 0 4px rgba(255,255,255,.25)}
.page.enter .dboard{animation:pgIn .7s var(--spring) both}
/* shorter phones (shared/fit.js shrinks the tally, then hides it): a tighter board, wordmark and Thaana on one line */
html.dgf-on main.dgf-nohero .dboard{margin-top:6px;padding:12px 14px 22px}
html.dgf-on main.dgf-nohero .dboard .dtitle{display:flex;align-items:center;justify-content:center;gap:18px}
html.dgf-on main.dgf-nohero .dboard .dtitle .dv{margin-top:.5em;font-size:40px;line-height:1.2}
html.dgf-on main.dgf-nohero .dboard .dtitle .eb{display:none}
html.dgf-on main.dgf-nohero .dboard .dtitle h1{margin-top:0}
/* the smallest phones (320 x 568, step 4): a thin frame, no chalk tray, Quick Match a little closer */
html.dgf-on main.dgf-c3 .dboard{margin-top:2px;padding:7px 12px 8px;box-shadow:inset 0 0 0 6px #7A5434,inset 0 0 0 7px #4A311D,0 12px 20px -12px rgba(0,0,0,.8)}
html.dgf-on main.dgf-c3 .dboard :is(.tray,.stick){display:none}
html.dgf-on main.dgf-c3 .dboard .hrt{top:10px;right:16px;font-size:20px}
html[data-bg="room"].dgf-on main.dgf-c3 .qm{margin-top:12px}
/* gold Quick Match */
html[data-bg="room"] main.page .qm{background:linear-gradient(180deg,#F2C66D,#D69A3A);color:#2A2420;box-shadow:0 16px 30px -14px rgba(0,0,0,.6),inset 0 1px 0 rgba(255,255,255,.35)}
html[data-bg="room"] main.page .qm :is(b,small,.first){color:#2A2420}
html[data-bg="room"] main.page .qm small{opacity:.85}
html[data-bg="room"] main.page .qm .live{background:rgba(42,36,32,.12);color:#2A2420}
html[data-bg="room"] main.page .qm .live i{background:#C0283E;animation:none}
/* dark dashed cards: Friends, vs Computer, the More list (in the page on tablets, in the More sheet on phones) */
html[data-bg="room"] main.page :is(.fr,.vc,.hmlist,.hhow,.dgf-more){background:rgba(0,0,0,.35);color:#F4EBDD;box-shadow:inset 0 0 0 1px rgba(255,255,255,.04);border:1px dashed rgba(255,255,255,.18)}
html[data-bg="room"] main.page :is(.fr,.vc,.hmrow) :is(b,.rt b){color:#F4EBDD}
html[data-bg="room"] main.page :is(.fr,.vc,.hmrow) small,html[data-bg="room"] main.page .dgf-more small{color:#C2B19C;opacity:1}
html[data-bg="room"] main.page :is(.fr .oi,.vc .oi,.hmrow .ri){background:rgba(255,255,255,.08);color:#F2C66D}
html[data-bg="room"] main.page :is(.fr,.hmrow,.dgf-more)>svg{color:#F4EBDD}
html[data-bg="room"] main.page .vc .bz{background:rgba(255,255,255,.1);color:#F2C66D}
html[data-bg="room"] main.page .hmrow{color:#F4EBDD}
html[data-bg="room"] main.page .hmrow+.hmrow{border-top:1px dashed rgba(255,255,255,.12)}
html[data-bg="room"] main.page .hpod>span{box-shadow:0 0 0 2px #2A2420;background:#3A322C}
html[data-bg="room"] main.page .heb{color:#C2B19C}
html[data-bg="room"] main.page .srv{color:#C2B19C}
/* Quick Match search: a 12 s ring, the seats filling up, then the offer of computer players */
.srch{text-align:center;padding:22px 16px 18px}
.ringw{position:relative;width:148px;height:148px;margin:4px auto 0}
.ringw svg.tr{position:absolute;inset:0;width:100%;height:100%;transform:rotate(-90deg)}
.ringw .trk{fill:none;stroke:#F3DDE3;stroke-width:8}
.ringw .arc{fill:none;stroke:#EE4A64;stroke-width:8;stroke-linecap:round;transition:stroke-dashoffset .25s linear}
.ringw .me{position:absolute;left:50%;top:50%;width:104px;height:104px;margin:-52px 0 0 -52px;border-radius:50%;box-shadow:0 0 0 4px #fff,0 10px 24px -10px rgba(60,40,90,.45)}
.ringw .me .mini{width:100%;height:100%}
.ringw .secs{position:absolute;left:50%;bottom:-6px;transform:translateX(-50%);background:#fff;color:#E0405C;font:800 12px/1 Sora,sans-serif;padding:6px 10px;border-radius:99px;box-shadow:0 4px 12px -6px rgba(60,40,90,.5);white-space:nowrap}
.srch h2{margin:22px 0 4px;font:800 22px/1.15 'Bricolage Grotesque',Sora,sans-serif;letter-spacing:-.02em}
.dots:after{content:"";display:inline-block;width:1.2em;text-align:left;animation:qmDots 1.4s steps(4) infinite}
@keyframes qmDots{0%{content:""}25%{content:"."}50%{content:".."}75%{content:"..."}}
.seatsrow{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;margin:18px 0 6px}
.st{display:flex;flex-direction:column;align-items:center;gap:6px;min-width:0}
.st .mini,.st .emp{width:52px;height:52px}
.st .mini{border-radius:50%;box-shadow:0 0 0 2.5px #fff,0 6px 14px -6px rgba(60,40,90,.45);animation:qmPop .45s cubic-bezier(.2,1.4,.4,1) both}
.st .emp{border-radius:50%;border:2px dashed #E3B8C3;background:rgba(255,255,255,.45);display:grid;place-items:center;color:#D994A4}
.st .emp svg{width:18px;height:18px}
.st span.sn{font-size:11.5px;font-weight:700;max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.st span.o{color:#A48A92;font-weight:600}
@keyframes qmPop{from{transform:scale(.3);opacity:0}to{transform:none;opacity:1}}
.qfill{font-size:12.5px;color:#7A5F66;margin:4px 0 14px}
.qhint{font-size:12px;color:#8E6F77;margin:12px 4px 0;text-align:center}
.qbots{display:flex;align-items:center;gap:8px;margin:0 0 14px;padding:10px 12px;border-radius:16px;background:var(--soft)}
.qbots .hp{display:flex;flex:none}.qbots .hp .mini{width:32px;height:32px;margin-left:-8px;border-radius:50%;box-shadow:0 0 0 2px #fff}.qbots .hp .mini:first-child{margin-left:0}
.qbots small{font-size:12px;color:#7A5F66;line-height:1.3}
.qcd{position:relative;overflow:hidden}
.qcd .bar{position:absolute;left:0;bottom:0;height:4px;width:100%;background:rgba(255,255,255,.75);transform-origin:left;transform:scaleX(1);transition:transform .25s linear}
.qcd .cdt{display:block;font-size:11.5px;font-weight:600;opacity:.92;margin-top:2px}
/* ================= the table (layout from ../shared/table.js; each theme's look is drawn below) ================= */
main.table{background:var(--tbg,#070504);color:var(--tx,#fff)}
main.table>*{max-width:none;margin:0}
main.table>.topbar,main.table>.me{max-width:680px;margin-left:auto;margin-right:auto}
.tscene{position:absolute;inset:0;overflow:hidden;pointer-events:none;z-index:0;contain:strict}
.tscene img{position:absolute;left:0;top:0;display:block;pointer-events:none;user-select:none;-webkit-user-select:none}
.tscene .fxu,.tscene .fxo{position:absolute;inset:0}
/* live layers: transform / opacity only */
.tscene .lglow{position:absolute;width:190px;height:80px;margin:-40px 0 0 -95px;border-radius:50%;background:radial-gradient(closest-side,rgba(255,236,196,.55),rgba(255,214,150,.14) 60%,transparent);animation:txfl 6s ease-in-out infinite}
.tscene .fglow{position:absolute;border-radius:50%;transform:translate(-50%,-50%);background:radial-gradient(closest-side,rgba(255,230,184,.13),transparent);animation:txfl 6s ease-in-out infinite}
@keyframes txfl{0%,100%{opacity:.8}45%{opacity:1}52%{opacity:.86}}
.tscene .dust i{position:absolute;width:2px;height:2px;border-radius:50%;background:#fff3da;box-shadow:0 0 3px 1px rgba(255,230,180,.4);opacity:0;animation:txmote 14s linear infinite}
@keyframes txmote{0%{transform:translate(0,0);opacity:0}20%{opacity:.8}80%{opacity:.4}100%{transform:translate(var(--dx),-70px);opacity:0}}
.tscene .scaus{mix-blend-mode:overlay;opacity:.6;animation:txcd 24s ease-in-out infinite alternate}
@keyframes txcd{from{transform:translate(0,0)}to{transform:translate(-60px,-40px)}}
.tscene .sfoam{animation:txlap 5.5s ease-in-out infinite}
@keyframes txlap{0%,100%{transform:scale(1);opacity:.35}50%{transform:scale(1.012);opacity:.95}}
.tscene .tw1{animation:txtw 3.2s ease-in-out infinite}.tscene .tw2{animation:txtw 3.2s ease-in-out -1.6s infinite}
@keyframes txtw{0%,100%{opacity:.25}50%{opacity:1}}
.tscene .gl1{animation:txtw 2.6s ease-in-out infinite}.tscene .gl2{animation:txtw 2.6s ease-in-out -1.3s infinite}
.tscene .lshim{position:absolute;overflow:hidden;border-radius:50%;mix-blend-mode:screen;-webkit-mask:radial-gradient(closest-side,transparent calc(100% - var(--rl)),#000 calc(100% - var(--rl) + 1px),#000 calc(100% - 3px),transparent);mask:radial-gradient(closest-side,transparent calc(100% - var(--rl)),#000 calc(100% - var(--rl) + 1px),#000 calc(100% - 3px),transparent)}
.tscene .lshim i{position:absolute;left:50%;top:50%;width:150%;aspect-ratio:1;translate:-50% -50%;border-radius:50%;background:conic-gradient(from 0deg,transparent 0 30deg,rgba(255,236,190,.6) 42deg,transparent 54deg 200deg,rgba(255,236,190,.3) 212deg,transparent 224deg);animation:txrot 11s linear infinite}
@keyframes txrot{to{transform:rotate(360deg)}}
.tscene.still *{animation:none!important}.tscene.still .dust{display:none}
/* the small nameplate set into the rail */
.plate{position:absolute;left:0;top:0;z-index:2;height:15px;min-width:86px;padding:0 12px;display:grid;place-items:center;border-radius:2px;pointer-events:none;font:900 8px/1 Fraunces,Georgia,serif;letter-spacing:.32em;text-indent:.32em;color:rgba(20,14,8,.85);text-shadow:0 .5px 0 rgba(255,255,255,.5);background:linear-gradient(180deg,rgba(255,255,255,.5),rgba(255,255,255,0) 50%,rgba(0,0,0,.2)),linear-gradient(100deg,#8a6424,#E7C97F 30%,#F6DC9C 45%,#B8863F 70%,#7a5418);box-shadow:inset 0 0 0 1px rgba(60,40,10,.6),0 2px 4px rgba(0,0,0,.7)}
.th-sandbank .plate{background:linear-gradient(180deg,#efe4cc,#cdb996);box-shadow:inset 0 0 0 1px rgba(110,85,55,.5),0 2px 4px rgba(0,0,0,.35);color:#5d4526}
.th-lacquer .plate{background:linear-gradient(100deg,#8A5510,#F2C24E 30%,#FFE39A 45%,#C98A22 70%,#8A5510);box-shadow:inset 0 0 0 1px rgba(40,10,0,.6),0 2px 4px rgba(0,0,0,.7)}
.th-pastel .plate{background:#fff;box-shadow:inset 0 0 0 1px rgba(238,74,100,.45),0 2px 5px rgba(90,70,140,.3);color:#E0405C;text-shadow:none;font-family:'Bricolage Grotesque',Sora,sans-serif}
/* seats: size and place come from DGTable.arena() */
.seats .seat,.seats.n4 .seat,.seats.n5 .seat,.seats.n6 .seat{width:var(--sw,76px);margin-left:calc(var(--sw,76px)/-2);--av:var(--sav,46px)}
.seat .nm{color:var(--tx,#fff);text-shadow:var(--nmSh,0 1px 3px rgba(0,0,0,.9))}

main.table{--ring-c:var(--acc,#FFD36E)}
main.table .dgt-ring{--ring-bg:var(--ringBg,rgba(255,255,255,.16))}
/* HUD in the theme's colours */
.topbar .icon-btn,.goal>span{background:var(--hud);box-shadow:inset 0 0 0 1px var(--hudEdge);color:var(--tx,#fff)}
.goal b{color:var(--accTx)}

.hand .card.inm .face{box-shadow:inset 0 0 0 2px var(--meld),0 0 0 1px rgba(0,0,0,.2),0 0 12px var(--meldGlow),0 8px 14px -6px rgba(0,0,0,.55)}
.hand .card.sel .face{box-shadow:inset 0 0 0 2.5px var(--acc),0 0 0 2px var(--accGlow),0 0 22px var(--accGlow),0 14px 20px -8px rgba(0,0,0,.6)}

/* the hand: ONE fan across the full width (DGTable.fan), a thin shadow on each card's left edge so every corner reads */

/* ================= C1 Chalkboard+ on every menu screen, sheet and dialog (owner, 3 Oct 2026) =================
   The home's dark warm room, chalk-white text, gold primary buttons and dark dashed cards, carried to vs Computer,
   Friends, Store, Get Boli, Profile, the sheets, toasts and the result / rules cards. Kalam is only for display headings.
   The card table keeps its own theme: main.table gets the old shell tokens back for its chat and reaction trays. */
:root{--ink:#F4EBDD;--muted:#C2B19C;--panel:#2A2420;--cream:#2A2420;--line:rgba(255,255,255,.12);--edge:rgba(255,255,255,.16);--accent:#F2C66D;--deep:#F2C66D;--soft:rgba(255,255,255,.07);
 --room:#2A2420;--card:rgba(0,0,0,.35);--dash:rgba(255,255,255,.18);--wood:#7A5434;--wood2:#4A311D;--chalk:#F4F1E8;--gold-ink:#2A2420;
 --goldBtn:linear-gradient(180deg,#F2C66D,#D69A3A);--board:radial-gradient(120% 70% at 30% 0%,#3B463F,#232C28 70%) #232C28}
main.table{--ink:#2A1418;--muted:#7A5F66;--panel:#FFFFFF;--line:rgba(42,20,24,.1);--edge:#EADCE3;--accent:#E0405C;--deep:#9E1B3A;--soft:#F5EEF3}
html,html[data-bg],html body,html[data-bg] body{background:var(--room)}
html body:before,html[data-bg] body:before{background:radial-gradient(90% 50% at 50% 0%,rgba(255,232,196,.07),rgba(255,232,196,0) 70%),radial-gradient(80% 50% at 50% 100%,rgba(0,0,0,.25),rgba(0,0,0,0) 70%),var(--room)}
html main.page{color:var(--ink)}
.muted{color:var(--muted)}
/* top bars: back button, profile pill and Boli pill as on the home */
html main.page :is(.icon-btn,.profbtn,.shellpill){background:rgba(0,0,0,.35);color:var(--ink);box-shadow:inset 0 0 0 1px rgba(255,255,255,.08)}
html main.page .profbtn .ps{color:#F2C66D}
.subtop h1{font:700 30px/1.15 Kalam,'Segoe Print',cursive;letter-spacing:.01em;color:var(--chalk);text-shadow:0 0 1px rgba(255,255,255,.6),0 0 8px rgba(255,255,255,.12);padding-top:4px}
/* display headings in chalk */
.panel h2,.sheet-b h2,.ovc h2,.rcard h2,.phead h2,.srch h2,.feat h3,.dgf-sheet h2{font-family:Kalam,'Segoe Print',cursive;font-weight:700;letter-spacing:.01em;color:var(--chalk)}
.panel h2{font-size:21px;line-height:1.2}
.sheet-b h2{font-size:27px;line-height:1.15}
.panel h2.shh{font-family:Sora,sans-serif;font-weight:800;font-size:17px}
/* dark dashed cards */
.panel{background:var(--card);color:var(--ink);border:1px dashed var(--dash);box-shadow:none;border-radius:20px}
/* buttons: gold primary, quiet dark secondary */
.btn{background:var(--soft);color:var(--ink);box-shadow:inset 0 0 0 1px rgba(255,255,255,.14)}
.btn.soft{background:var(--soft);box-shadow:inset 0 0 0 1px rgba(255,255,255,.14)}
.btn.ghost{background:transparent;box-shadow:none;border:1px dashed rgba(255,255,255,.28)}
.btn.primary,.pick .btn[aria-pressed="true"],.btn.gold{background:var(--goldBtn);color:var(--gold-ink);box-shadow:0 3px 0 #8A5E1C,0 10px 20px -10px rgba(0,0,0,.7)}
.btn.danger,.linkbtn.danger{color:#FF9A8A}
.btn.danger-solid{background:#B3261E;color:#fff}
.btn:disabled{opacity:.6}
.linkbtn{color:var(--muted)}
/* chips and segmented controls: dark, gold when picked */
.seg,.stabs{background:rgba(0,0,0,.35);box-shadow:inset 0 0 0 1px rgba(255,255,255,.08)}
.seg button,.stab{color:var(--muted)}
.seg button[aria-pressed="true"],.stab[aria-pressed="true"]{background:var(--goldBtn);color:var(--gold-ink);box-shadow:0 2px 0 #8A5E1C}
.pick .btn{background:rgba(0,0,0,.3);box-shadow:inset 0 0 0 1px rgba(255,255,255,.16)}
.pick .btn[aria-pressed="true"]{box-shadow:0 3px 0 #8A5E1C}

.in{background:#1A1613;color:var(--ink);border:1px solid rgba(255,255,255,.2)}

.in:focus{border-color:#F2C66D;box-shadow:0 0 0 3px rgba(242,198,109,.32)}

.note,.btn.soft,.rlist li,.stat,.bdg,.lookprev,.popt,.rrow,.bad,.lrow .li,.rmini span,.qbots{background:var(--soft)}

 --dga-bg:#2A2420;--dga-surface:#352D28;--dga-surface-2:#40372F;--dga-ink:#F4EBDD;--dga-muted:#C2B19C;--dga-accent:#F2C66D;--dga-on-accent:#2A2420;--dga-gold:#F2C66D;--dga-line:rgba(255,255,255,.14);--dga-focus:#F2C66D;--dga-font-display:Kalam,'Segoe Print',cursive}

.srt{color:var(--muted)}

function compactNum(n){
  n=Number(n)||0; const a=Math.abs(n);
  const fmt=(v,s)=>{let x=v>=100?Math.round(v):Math.round(v*10)/10;return String(x).replace(/\.0$/,'')+s;};
  if(a>=1000000)return fmt(n/1000000,'M');
  if(a>=1000)return fmt(n/1000,'K');
  return String(Math.round(n));
}
/* Boli amounts: plain number with commas (1,234); abbreviated only from 100,000 (100K, 1.2M). Same rule on every page. */
function boliNum(n){
  n=Math.round(Number(n)||0); const a=Math.abs(n);
  const f=(v,s)=>String(v>=100?Math.round(v):Math.round(v*10)/10).replace(/\.0$/,'')+s;
  if(a>=999500)return f(n/1e6,'M');
  if(a>=100000)return f(n/1000,'K');
  return n.toLocaleString('en-US');
}

h.forEach(c=>{if(c===took)return;const rest=h.filter(x=>x!==c);if(cover(rest)){bs=1e9;best=c;return;}if(bs>=1e9)return;
const sc=handScore(rest).net+links(rest);if(sc>bs){bs=sc;best=c;}});
return best||h.find(c=>c!==took)||h[0];}
function wantsDiscard(h,top){const w=h.concat([top]);if(cover(w))return true;const base=handScore(h).net;
let best=-1e9;h.forEach(c=>{best=Math.max(best,handScore(w.filter(x=>x!==c)).net);});return best>base+4;}

async function ssoStart(k){
 if(!SSO[k]||(k==='apple'&&!APPLE_SIGNIN))return;
 if(!FB.ready||!FB.auth||!FB.U){toast('Account service is still connecting.');return;}
 const U=FB.U,u=FB.auth.currentUser,guest=!u||u.isAnonymous;
 if(u&&!guest&&hasProv(u,k)){toast(SSO[k].name+' is already linked.');return;}

async function ssoError(k,e,wasGuest){const c=(e&&e.code)||'',nm=SSO[k].name;

function groups(hand){const k=hand.slice().sort().join('|');if(partCache.k!==k){const g={};partial(hand).forEach((m,i)=>m.forEach(c=>g[c]=i));partCache={k:k,g:g};}return partCache.g;}
function ginSet(){if(!canDiscard())return new Set();const h=myHand();const k=h.slice().sort().join('|')+S.took;
if(ginCache.k!==k){const s=new Set();h.forEach(c=>{if(c===S.took)return;if(cover(h.filter(x=>x!==c)))s.add(c);});ginCache={k:k,s:s};}return ginCache.s;}
function arranged(hand){const ms=partial(hand);const used=new Set();const out=[];
ms.forEach(m=>{const ps=m.map(P);const isSet=ps.every(p=>p.r===ps[0].r);sortP(ps);if(!isSet)ps.sort((a,b)=>a.r-b.r);ps.forEach(p=>{out.push(p.c);used.add(p.c);});});
const dead=hand.filter(c=>!used.has(c)).map(P).sort((a,b)=>a.r-b.r||(a.s<b.s?-1:1)).map(p=>p.c);return out.concat(dead);}

els.forEach((el,i)=>{const r=el.getBoundingClientRect();const s=Math.max(.4,Math.min(1.2,sr.w/(r.width||1)));
const dx=sr.x+sr.w/2-(r.left+r.width/2),dy=sr.y+sr.h/2-(r.top+r.height/2);
el.animate([{translate:`${dx}px ${dy}px`,scale:String(s),opacity:0},{opacity:1,offset:.12},{translate:'0 0',scale:'1',opacity:1}],{duration:720,delay:SHUF_MS+i*70,easing:SPRING,fill:'backwards'});});}
/* your hand: ONE fan across the full width (DGTable.fan). Sets and runs get a small gap and a gold edge;

const land=!!box._land,n=ids.length,cw=DGTable.handCard({vw:innerWidth,vh:innerHeight,n:n,land:land});
if(box._cw!==cw){box._cw=cw;box.style.setProperty('--cw',cw+'px');}
const g=groups(myHand()),gs=ginSet();
const same=(a,b)=>g[a]!==undefined&&g[a]===g[b];
const gaps=ids.map((id,i)=>i>0&&!same(id,ids[i-1])&&(g[id]!==undefined||g[ids[i-1]]!==undefined));
const si=dragId==null&&selected?ids.indexOf(selected):-1;
const base={W:W,cw:cw,n:n,gaps:gaps,land:land,pad:2,sel:si,press:dragId==null?fanPress:-1};
let focus=fanFocus,amp=fanAmp;
/* no finger on the hand: keep a gentle spread around the lifted card so it reads clearly */
if(focus==null&&si>=0){const f0=DGTable.fan(base);focus=f0.x[si]+cw/2;amp=.7;}
const f=DGTable.fan(Object.assign(base,{focus:focus,amp:amp}));
const y0=land?10:18;
/* runs of 3+ melded cards get a gold edge and a tick */
const inm=new Set(),runs=[];{let run=[];const flush=()=>{if(run.length>=3){run.forEach(c=>inm.add(c));runs.push(run);}run=[];};
ids.forEach((id,i)=>{if(g[id]===undefined||id===dragId){flush();return;}if(run.length&&!(same(id,ids[i-1])&&ids[i-1]!==dragId))flush();run.push(id);});flush();}
const pos={};ids.forEach((id,i)=>{const el=cardEls[id];if(!el)return;const x=f.x[i],y=y0+f.y[i],rot=f.r[i];
el.style.zIndex=i+2;el._rot=rot;pos[id]={x:x,y:y};
el.classList.toggle('inm',inm.has(id));el.classList.toggle('gin',gs.has(id));el.classList.toggle('sel',id===selected&&dragId==null);
if(id!==dragId)el.style.transform=`translate(${x.toFixed(1)}px,${y.toFixed(1)}px) rotate(${rot.toFixed(2)}deg)`;});
/* one gold tick floats above each meld */
const tk=runs.filter(r=>r.every(id=>pos[id])).map(r=>({x:(pos[r[0]].x+pos[r[r.length-1]].x+cw)/2,y:Math.min(...r.map(id=>pos[id].y))}));
while(ticks.length<tk.length){const e=document.createElement('i');e.className='mtk';e.setAttribute('aria-hidden','true');e.textContent='✓';box.appendChild(e);ticks.push(e);}
ticks.forEach((e,k)=>{const r=tk[k];e.style.opacity=r?'1':'0';if(r)e.style.transform=`translate(${(r.x-10).toFixed(1)}px,${(r.y-13).toFixed(1)}px)`;});
L={f:f,cw:cw,n:n,slot:dragId!=null?dragIdx:-1};}

function bindHand(){const box=$('#hand');let press=null,hovT=0;
const spread=(x,idx)=>{fanFocus=x;fanPress=idx;fanAmp=null;box.classList.add('dgt-mag');layoutHand(drag&&drag.moved?drag.id:null,drag&&drag.moved?drag.idx:undefined);};

function rectOf(el){if(!el)return null;const r=el.getBoundingClientRect();if(!r.width)return null;return{x:r.left,y:r.top,w:r.width,h:r.height};}

/* o.flip: face-down card that turns face up (o.face) while it flies */
function fly(from,to,inner,o){o=o||{};if(reduce||!from||!to||document.hidden){o.done&&o.done();return;}
const W=o.base||80,H=W*1.4;const el=document.createElement('div');el.className='fly';el.style.width=W+'px';el.style.height=H+'px';
el.innerHTML=o.flip?`<div class="flw"><div class="card" style="--w:${W}px">${inner}</div><div class="card ff" style="--w:${W}px">${o.flip}</div></div>`:`<div class="card" style="--w:${W}px">${inner}</div>`;$('#fx').appendChild(el);
if(!el.animate){el.remove();o.done&&o.done();return;}
const sF=o.fromAv?.42:from.w/W,sT=o.toAv?.42:Math.min(1.6,(o.toW||to.w)/W);
const fx=from.x+from.w/2-W/2,fy=from.y+from.h/2-H/2,tx=to.x+to.w/2-W/2,ty=to.y+to.h/2-H/2;
const dur=o.toAv||o.fromAv?620:700;
const an=el.animate([{transform:`translate(${fx}px,${fy}px) scale(${sF}) rotate(0deg)`,opacity:o.fromAv?0:1},{opacity:1,offset:.18},{transform:`translate(${tx}px,${ty}px) scale(${sT}) rotate(${o.rot||0}deg)`,opacity:o.toAv?0:1}],{duration:dur,easing:SPRING,fill:'both'});

function animate(prev,N,b){
if(screen!=='table'||!prev||!N.move||!prev.move||prev.status==='lobby')return;
if(N.handNo!==prev.handNo||N.move.seq===prev.move.seq)return;
const m=N.move,me=meIdx(),mine=m.p===me&&me>=0;const base=b.stock?b.stock.w:(b.disc?b.disc.w:80);
if(m.t==='stock'||m.t==='take'){
const from=m.t==='stock'?b.stock:b.disc;const inner=m.t==='stock'?backHTML({still:true,size:90}):faceHTML(m.c);
SFX.draw(mine);
if(mine){const el=cardEls[m.c];if(!el)return;el.style.opacity='0';buzz(8);
requestAnimationFrame(()=>{const to=rectOf(el);fly(from,to,inner,{base:base,toW:el.offsetWidth,rot:el._rot||0,flip:m.t==='stock'?faceHTML(m.c):null,done:()=>{el.style.opacity='';}});});}

const top=$('#discTop');const to=rectOf(top);const from=mine?b.cards[m.c]:b.av[m.p];
if(top&&from&&!reduce&&!document.hidden)top.style.opacity='0';if(mine)buzz(10);if(N.ginDown!==m.c)setTimeout(()=>SFX.discard(mine),reduce?0:300);
fly(from,to,N.ginDown===m.c?backHTML({still:true,size:90}):faceHTML(m.c),{base:base,fromAv:!mine,toW:top?top.offsetWidth:0,rot:top?parseFloat((top.style.transform.match(/-?[\d.]+/)||[0])[0])||0:0,done:()=>{const t2=$('#discTop');if(t2)t2.style.opacity='';}});}
