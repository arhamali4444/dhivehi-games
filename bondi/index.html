if(m.t==='end'){const r=N.result;setTimeout(()=>{if(r.loser>=0)react(r.loser,'sad',2400);},700);}
if(N.status==='playing'&&N.phase==='play'&&N.turn===me&&me>=0&&!(prev.status==='playing'&&prev.phase==='play'&&prev.turn===me))setTimeout(()=>{if(S&&S.turn===meIdx()&&S.phase==='play')SFX.turn();},150);}
function roundAward(){if(!S||!S.result||meIdx()<0||mode==='online'&&(NET.test||S.players[meIdx()].gone))return null;const me=meIdx(),r=S.result;let n=5;if(r.order[0]===me)n+=10;else if(r.loser!==me)n+=4;
if(S.status==='over'){n+=5;if(r.champs.includes(me))n+=25;}return award('bondi:'+S.gid+':'+S.handNo,n);}
/* ---------- round and match results ---------- */
function closeOv(){const o=$('#ov');o.classList.remove('show');o.innerHTML='';o._k=null;}
/* totals, highest first; the bar runs from the lowest score (or 0) to the highest, so negatives still draw */
function scoresHTML(){const sc=S.players.map(p=>p.score),hi=Math.max(...sc),lo=Math.min(...sc),base=Math.min(0,lo),span=Math.max(1,hi-base);const last=S.result&&S.status!=='playing'?S.result:null;
const rows=S.players.map((p,k)=>({p:p,k:k})).sort((a,b)=>b.p.score-a.p.score);
const dl=k=>{if(!last||!last.gain)return '';const g=last.gain[k];return g>0?`<small class="best">${sg(g)}</small>`:g<0?`<small>${sg(g)}</small>`:'';};
return `<div class="scores">${rows.map(({p,k})=>`<div class="srow">${avatarHTML(p,k,30)}<div class="n"><span>${esc(p.name)}${p.id===myId&&p.name!=='You'?' (you)':''}${dl(k)}${p.score===hi&&hi>lo?'<small class="best">best</small>':''}</span><div class="bar"><i style="--c:${p.col||PC[k%PC.length]};width:${Math.max(3,Math.min(100,(p.score-base)/span*100))}%"></i></div></div><b>${fmt(p.score)}</b></div>`).join('')}${(S.left||[]).map(p=>`<div class="srow" style="opacity:.55">${avatarHTML(p,0,30)}<div class="n"><span>${esc(p.name)}<small>left the match</small></span></div><b>${fmt(p.score)}</b></div>`).join('')}</div>`;}
function renderOv(){const o=$('#ov');if(S.status!=='handover'&&S.status!=='over'){if(o._k)closeOv();return;}
const k=S.status+S.handNo+S.gid;if(o._k===k)return;o._k=k;const aw=roundAward();const r=S.result,me=meIdx(),over=S.status==='over';
const L=r.loser,lp=L>=0?S.players[L]:null;
let head,sub,av;
if(over){const ch=r.champs,won=ch.includes(me);av=avatarHTML(S.players[ch[0]],ch[0],72);head=won?(ch.length>1?'You share the win!':'You win the match!'):(ch.length>1?ch.map(i=>esc(S.players[i].name)).join(' & ')+' share the win':esc(S.players[ch[0]].name)+' wins the match');
 const hs=S.players[ch[0]].score;sub=`<div class="pts ok">Highest total: ${fmt(hs)} point${hs===1||hs===-1?'':'s'}</div>`;setTimeout(()=>won?SFX.win():SFX.lose(),600);}
else{av=lp?avatarHTML(lp,L,72):'';head=lp?(L===me?'You’re the bondibui':esc(lp.name)+' is the bondibui'):'Everyone got out together';
 const mi=r.order.indexOf(me),mine=mi>=0&&r.gain?`<div><span class="pts ok">You went out ${ord(mi+1)}: ${sg(r.gain[me])}</span></div>`:'';
 sub=(lp?`<div><span class="pts">${sg(-r.pts)} point${r.pts===1?'':'s'}</span></div>`:'<div><span class="pts ok">No bondibui this round</span></div>')+mine;setTimeout(()=>L===me?SFX.lose():SFX.safe(true),600);}
const left=lp&&r.left.length?`<div class="left" aria-label="${esc(lp.name)} was left holding ${r.left.length} cards">${r.left.map((c,i)=>`<div class="card" style="--i:${i}">${faceHTML(c)}</div>`).join('')}</div>`:'';
const gp=k2=>r.gain?`<i class="pp">${sg(r.gain[k2])}</i>`:'';
const orderH=`<div class="order" aria-label="Order out this round">${r.order.map((k2,i)=>`<span>${avatarHTML(S.players[k2],k2,24)}<i>${ord(i+1)}</i>${esc(S.players[k2].name)}${gp(k2)}</span>`).join('')}${lp?`<span class="lose">${avatarHTML(lp,L,24)}${esc(lp.name)}${gp(L)}</span>`:''}</div>`;
o.innerHTML=`<div class="ovc">${av}<h2>${head}</h2>${sub}${aw&&aw.sh>0?`<div class="earn">+${aw.sh} ${HI.shell} Boli${aw.capped?' (daily limit reached)':''}</div>`:aw&&aw.capped?'<div class="earn muted">Daily Boli limit reached</div>':''}
${over&&lp?`<div class="muted" style="font-size:12.5px;margin-top:8px">Last round: ${esc(lp.name)} was the bondibui, ${sg(-r.pts)}</div>`:''}
${left}${orderH}
<div class="muted totlbl"><span>${over?'Final totals':'Totals after round '+S.handNo+' of '+S.rounds}</span><span>higher is better</span></div>
${scoresHTML()}
${mode!=='online'?`<button class="btn primary wide" data-a="${over?'again':'next'}">${over?'Play again':'Deal round '+(S.handNo+1)}</button>
<button class="btn ghost wide" style="margin-top:8px" data-a="leave">Back to home</button>`
 :(isHostOn()?`<button class="btn primary wide" data-a="${over?'netAgain':'next'}">${over?'Play again':'Deal round '+(S.handNo+1)}</button>`
  :`<p class="muted" style="font-size:13px;margin:10px 0 0">${over?(me<0?'The next match starts soon.':'Waiting for the host to start the next match…'):'The next round starts in a moment…'}</p>`)
 +`<button class="btn ghost wide" style="margin-top:8px" data-a="netLeave">Leave table</button>`}</div>`;
o.classList.add('show');if(AUTO&&mode!=='online')setTimeout(()=>{if(S&&S.status==='handover')act('next');},FAST?150:1200);}

/* ---------- sheets, toasts, menu ---------- */
function sheet(h){$('#sheetB').innerHTML=h;$('#sheet').classList.add('open');}
function closeSheet(){$('#sheet').classList.remove('open');}
let toastT=0;function toast(t,ms){const e=$('#toast');e.textContent=t;e.classList.remove('show');void e.offsetWidth;e.classList.add('show');clearTimeout(toastT);toastT=setTimeout(()=>e.classList.remove('show'),ms||2600);}
function openMenu(){if(!S)return;sheet(`<div class="grab"></div><h2>${modeName(S.ranga)}</h2><p class="muted" style="margin:4px 0 0">${S.status==='lobby'?S.rounds+' rounds':'Round '+S.handNo+' of '+S.rounds} · highest total wins</p>
${S.handNo?scoresHTML():''}
<div class="mlist"><button class="btn soft wide" data-a="menuRules">Rules</button><button class="btn soft wide" data-a="sfx" aria-pressed="${sfxOn()}">Sound: ${sfxOn()?'On':'Off'}</button>${mode==='online'?`<button class="btn ghost wide" data-a="netLeave">Leave table</button>${meIdx()>=0&&S.status==='playing'?'<p class="muted" style="font-size:12px;margin:2px 2px 0">If you leave, an AI Rookie finishes this round for you and you can’t rejoin this match.</p>':''}`:`<button class="btn ghost wide" data-a="leave">${S.status==='playing'?'Leave (your game is saved)':'Back to home'}</button>`}</div>`);}
function toggleSfx(){ls.set('dd-sfx',sfxOn()?'0':'1');document.querySelectorAll('[data-a="sfx"]').forEach(b=>{b.setAttribute('aria-pressed',String(sfxOn()));if(b.classList.contains('btn'))b.textContent='Sound: '+(sfxOn()?'On':'Off');});if(sfxOn()){AU.unlock();SFX.turn();}}
function leave(){clearTimeout(botT);clearTimeout(turnT);clearTimeout(warnT);if(mode==='solo'&&S&&S.status!=='over'&&S.status!=='lobby')ls.set(SAVE_KEY,JSON.stringify(S));closeSheet();closeRules();closeOv();S=null;mode=null;renderHome();}

/* ---------- one click handler for everything ---------- */
/* audio may only start after a gesture: resume on the first tap / key press anywhere */
['pointerdown','touchstart','touchend','keydown'].forEach(ev=>document.addEventListener(ev,()=>AU.unlock(),{capture:true,passive:true}));
document.addEventListener('click',e=>{AU.unlock();const b=e.target.closest('[data-a]');if(!b)return;const a=b.dataset.a;
switch(a){
case 'mode':setMode(b.dataset.v==='1');if(screen==='computer')renderComputer();else renderHome();break;
case 'goComputer':renderComputer();break;
case 'goHome':renderHome();break;
case 'online':if(NET)NET.open();else toast('Online play needs a newer browser.');break;
case 'netLeave':closeSheet();closeOv();if(NET&&mode==='online')NET.leave();else leave();break;
case 'netAgain':closeOv();if(NET)NET.again();break;
case 'rulesOk':closeRules();break;
case 'howto':openHowTo();break;
case 'close':closeSheet();break;
case 'name':openName();break;
case 'saveName':saveName();break;
case 'bots':nBots=+b.dataset.n;renderComputer();break;
case 'rounds':nRounds=+b.dataset.n;renderComputer();break;
case 'solo':startSolo();break;
case 'resume':resume();break;
case 'rulesDeal':closeRules();if(mode!=='online'||isHostOn())act('start');break;
case 'menu':openMenu();break;
case 'menuRules':sheet(`<div class="grab"></div>${rulesCardHTML(S)}<div class="row"><button class="btn primary" data-a="close">Back to the game</button></div>`);break;
case 'sfx':toggleSfx();break;
case 'leave':leave();break;
case 'next':closeOv();if(mode==='online'){if(isHostOn())hostNext();}else act('next');break;
case 'again':{const r=S.rounds,rg=S.ranga,ps=S.players.map(p=>Object.assign({},p,{score:0}));closeOv();ls.del(SAVE_KEY);S=newGame(ps,rg,r);S.players.forEach(p=>{p.score=0;});mode='solo';draw();openRules();break;}
case 'playSel':if(sel.length)playCards(sel.slice());break;
case 'suitAll':{const s=b.dataset.s,all=handOf(S,meIdx()).filter(c=>P(c).s===s);const same=sel.length===all.length&&sel.every(c=>P(c).s===s);sel=same?[]:all;buzz(4);SFX.tick();renderHand();renderActs();break;}
}});
$('#sheet').addEventListener('click',e=>{if(e.target.id==='sheet')closeSheet();});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){if($('#sheet').classList.contains('open'))closeSheet();}if(e.key==='Enter'&&e.target&&e.target.id==='pnm')saveName();});
let rzT=0;window.addEventListener('resize',()=>{if(rzT)return;rzT=requestAnimationFrame(()=>{rzT=0;if(screen==='table'&&S){layoutHand();layoutArena();}});});
document.addEventListener('visibilitychange',()=>{if(document.hidden){AU.sleep();if(mode!=='online'){clearTimeout(botT);clearTimeout(turnT);clearTimeout(warnT);}}
else if(S&&screen==='table'){if(mode!=='online'&&S.status==='playing'&&S.phase==='play'&&S.players[S.turn]&&S.players[S.turn].id===myId){S.turnAt=Date.now();renderTable();}schedule();}});
window.addEventListener('pagehide',()=>{if(mode==='solo'&&S&&S.status!=='over'&&S.status!=='lobby')ls.set(SAVE_KEY,JSON.stringify(S));});

/* test hooks (used by the automated checks; harmless in normal play) */
window.__bondi={get S(){return S;},get mode(){return mode;},get NET(){return NET;},
 geom(){const a=$('#arena'),m=document.querySelector('main.table'),sc=$('#tsc');if(!a||!AR||!sc)return null;const ar=a.getBoundingClientRect(),mr=m.getBoundingClientRect();
  const t=(sc.style.transform.match(/-?[\d.]+/g)||[]).map(Number);const felt={x:mr.left+t[0]+TBL.g[0]*t[2],y:mr.top+t[1]+TBL.g[1]*t[3]};
  const slots=S.players.map((p,k)=>{const q=slotPos(k);return{x:ar.left+q.x,y:ar.top+q.y};});const xs=slots.map(q=>q.x),ys=slots.map(q=>q.y);
  const tad=document.querySelector('#tadw .tad'),tr=tad&&!$('#tadw').hidden?tad.getBoundingClientRect():null,me=slotPos(Math.max(0,meIdx()));
  const st=$('#status').getBoundingClientRect(),hand=$('#hand').getBoundingClientRect();
  return{felt:felt,group:{x:(Math.min(...xs)+Math.max(...xs))/2,y:(Math.min(...ys)+Math.max(...ys))/2},pw:AR.pw,
   myCardBottom:ar.top+me.y+AR.pw*.7,ad:tr?{top:tr.top,bottom:tr.bottom}:null,status:{top:st.top,bottom:st.bottom},hand:{top:hand.top},
   seats:[...document.querySelectorAll('.seat')].map(e=>{const r=e.getBoundingClientRect();return[Math.round(r.left),Math.round(r.top),Math.round(r.right),Math.round(r.bottom)];}),vw:innerWidth,docW:document.documentElement.scrollWidth};},act:act,step:step,whyNot:whyNot,botChoose:botChoose,newGame:newGame,deal:deal,val:val,
 load(N){mode='solo';S=N;buildTable();draw();schedule();},
 start(o){o=o||{};if(o.ranga!=null)setMode(o.ranga);if(o.bots)nBots=o.bots;if(o.rounds)nRounds=o.rounds;startSolo();closeRules();act('start');}};

/* ---------- boot ---------- */
const hadOld=oldSave();
initNet();
if(NET&&/^[A-Z]{4}$/i.test(Q.get('t')||'')){renderHome();NET.boot();}   /* invite link ?t=CODE */
else if(LOCAL&&Q.get('play')==='1'){if(Q.get('bots'))nBots=Math.max(1,Math.min(4,+Q.get('bots')||3));if(Q.get('rounds'))nRounds=ROUND_OPTS.includes(+Q.get('rounds'))?+Q.get('rounds'):nRounds;startSolo();}
else{renderHome();if(NET)NET.boot();if(hadOld)setTimeout(()=>toast('New scoring: going out early now earns points. Your unfinished game was cleared, so start a fresh one.',6000),500);}
})();
</script>
</body>
