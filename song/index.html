<style>
/* Thaana: Dhivehi Muraka (OFL 1.1) + the Arabic marks from Noto Sans Thaana (OFL 1.1); notices in fonts/OFL-*.txt */
@font-face{font-family:'Dhivehi Muraka';src:url(fonts/dhivehi-muraka.woff2) format('woff2');font-weight:100 900;font-display:swap;unicode-range:U+0020-0040,U+00A0,U+0780-07B1}
@font-face{font-family:'Noto Sans Thaana';src:url(fonts/noto-sans-thaana-marks.woff2) format('woff2');font-weight:100 900;font-display:swap;unicode-range:U+060C,U+061B,U+061F}
/* ================= Guess the Song · "Vinyl From Above": a turntable seen from overhead on warm linen, cream + pale ash + brass ================= */
:root{--card:#fbf8f2;--card2:#f0e8da;--pill:#fbf8f2;--ink:#2a2119;--mute:rgba(42,33,25,.62);--hair:rgba(42,33,25,.14);
 --acc:#9a6b22;--onacc:#fff8ec;--brown:#4a3020;--cream:#fbf3e6;--gold:#e8c983;--r:16px;
 --fd:'Instrument Serif',Georgia,serif;--fb:Manrope,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;--dv:'Dhivehi Muraka','Noto Sans Thaana',serif;
 --ok:#2d7a52;--okbg:#e6f0e2;--oktx:#22663f;--no:#b4533e;
 /* online sheets (shared/net.js) in the linen colours */
 --dgn-bg:#fbf8f2;--dgn-bg2:#f0e8da;--dgn-fg:#2a2119;--dgn-muted:rgba(42,33,25,.62);--dgn-line:rgba(42,33,25,.14);--dgn-soft:rgba(42,33,25,.05);
 --dgn-acc:#4a3020;--dgn-acc-fg:#fbf3e6;--dgn-good:#2d7a52;--dgn-bad:#b4533e;--dgn-scrim:rgba(42,30,18,.42);--dgn-font:Manrope,system-ui,sans-serif;--dgn-head:'Instrument Serif',Georgia,serif;
 --dgn-room-bg:linear-gradient(180deg,#eee6d9,#e6dccb);--dgn-dock-size:40px;--dgn-dock-bg:rgba(251,248,242,.96);--dgn-inline-bg:rgba(251,248,242,.92);--dgn-inline-shadow:inset 0 0 0 1px rgba(42,33,25,.12);
 --dgn-talk:rgba(154,107,34,.95);--dgn-watch-bottom:calc(10px + env(safe-area-inset-bottom,0px));--dgf-bg:#f7f1e7}
*,*::before,*::after{box-sizing:border-box}
html{background:#e9e0d0;-webkit-text-size-adjust:100%;touch-action:manipulation;overflow-x:hidden;overflow-x:clip;color-scheme:light}
body{margin:0;min-height:100%;color:var(--ink);font:15px/1.45 var(--fb);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;overflow-x:hidden;overflow-x:clip;font-variant-numeric:tabular-nums;
 background:radial-gradient(70% 38% at 60% 30%,rgba(255,252,244,.75),rgba(255,252,244,0) 70%) fixed,
  linear-gradient(118deg,rgba(255,255,255,0) 30%,rgba(255,253,246,.32) 42%,rgba(255,255,255,0) 58%) fixed,
  repeating-linear-gradient(0deg,rgba(110,84,50,.045) 0 1px,rgba(0,0,0,0) 1px 3px),
  repeating-linear-gradient(90deg,rgba(110,84,50,.035) 0 1px,rgba(255,255,255,.05) 1px 2px,rgba(0,0,0,0) 2px 4px),
  linear-gradient(180deg,#eee6d9,#e6dccb) fixed}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;text-align:start;-webkit-appearance:none;appearance:none;padding:0}
a{color:inherit}
[hidden]{display:none!important}
[lang=dv],.dv{font-family:var(--dv);letter-spacing:0;word-spacing:.1em;direction:rtl;unicode-bidi:isolate}
.fd{font-family:var(--fd);font-weight:400}
.ic{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.page{position:relative;max-width:480px;margin:0 auto;min-height:100vh;min-height:100dvh;padding:calc(12px + env(safe-area-inset-top,0px)) 16px calc(16px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column}
/* ---------- top bar ---------- */
.tb{display:flex;align-items:center;gap:8px;height:46px;flex:none;position:relative;z-index:4}
.pill{height:44px;border-radius:99px;background:var(--pill);box-shadow:inset 0 0 0 1px var(--hair),0 1px 2px rgba(60,40,20,.06);display:inline-flex;align-items:center;text-decoration:none;color:var(--ink);flex:none}
.hp{padding:0 10px 0 6px;gap:1px}
.hp svg.bk{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.pcm{width:17px;height:22px;color:var(--acc);display:block}
.pp{gap:8px;padding:0 14px 0 3px;min-width:0;flex:0 1 auto}
.pp .pn{display:flex;flex-direction:column;min-width:0;line-height:1.2}
.pp b{display:block;font-size:13.5px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pp small{display:block;font-size:11px;font-weight:600;color:var(--acc);white-space:nowrap}
.bp{margin-left:auto;gap:6px;padding:0 14px 0 9px;font-weight:800;font-size:14px}
.bp img{width:22px;height:22px;object-fit:contain}
/* avatars (shared/avatar.js) */
.av{--s:40px;position:relative;width:var(--s);height:var(--s);border-radius:50%;display:inline-block;flex:none}
.av .ai{display:block;width:100%;height:100%;border-radius:50%;overflow:hidden;background:var(--card2)}
.av .ai>svg{width:100%;height:100%;display:block}
.av .ai.l{display:grid;place-items:center;color:#fff8ec;font-weight:800;font-size:calc(var(--s)*.42);background:var(--c,#9a6b22)}
/* ---------- the turntable seen from above (lobby, question, reveal) ---------- */
.deck{position:absolute;border-radius:24px;
 background:linear-gradient(135deg,rgba(255,255,255,.55),rgba(255,255,255,0) 38%,rgba(120,90,50,0) 70%,rgba(120,90,50,.10)),
  repeating-linear-gradient(91deg,rgba(130,96,52,0) 0 5px,rgba(130,96,52,.06) 5px 6px,rgba(130,96,52,0) 6px 13px,rgba(255,250,240,.10) 13px 15px),
  linear-gradient(180deg,#eadfcb,#dccdb2);
 box-shadow:inset 0 0 0 1px rgba(255,255,255,.6),inset 0 -2px 0 rgba(120,90,50,.12),0 2px 2px rgba(60,40,20,.10),0 34px 50px -26px rgba(60,40,20,.55),18px 26px 46px -30px rgba(60,40,20,.35)}
.deck .inlay{position:absolute;inset:10px;border-radius:16px;box-shadow:inset 0 0 0 1px rgba(154,107,34,.28)}
.platter{position:absolute;border-radius:50%;background:conic-gradient(from 30deg,#c9c3b8,#f4f1ea,#bdb6aa,#ece7de,#c9c3b8,#f2eee6,#bdb6aa,#ece7de,#c9c3b8);box-shadow:0 1px 0 rgba(255,255,255,.7),0 10px 22px -8px rgba(40,25,10,.55)}
.disc{position:absolute;border-radius:50%;overflow:hidden;will-change:transform;
 background:radial-gradient(circle,transparent 0 51.5%,rgba(255,255,255,.07) 52% 52.6%,transparent 53% 69.5%,rgba(255,255,255,.06) 70% 70.6%,transparent 71% 84.5%,rgba(255,255,255,.06) 85% 85.5%,transparent 86%),
  repeating-radial-gradient(circle at 50% 50%,#17151a 0 1.1px,#211e23 1.4px 2.3px),#1a181c;box-shadow:inset 0 0 0 2px #0e0d10}
.disc .lab{position:absolute;inset:31%;border-radius:50%;overflow:hidden}
.disc .lab svg{width:100%;height:100%;display:block}
.streak{position:absolute;border-radius:50%;pointer-events:none;will-change:transform;
 background:conic-gradient(from 0deg,rgba(255,246,228,0) 0deg,rgba(255,246,228,.07) 12deg,rgba(255,240,215,.42) 25deg,rgba(255,255,250,.78) 35deg,rgba(255,240,215,.44) 45deg,rgba(255,246,228,.08) 60deg,rgba(255,246,228,0) 78deg,
   rgba(255,246,228,0) 180deg,rgba(220,235,255,.05) 194deg,rgba(225,238,255,.22) 210deg,rgba(240,246,255,.34) 216deg,rgba(225,238,255,.2) 224deg,rgba(220,235,255,0) 248deg,rgba(255,246,228,0) 360deg);
 -webkit-mask:radial-gradient(circle,transparent 0 31.5%,#000 33% 97%,transparent 98.5%);mask:radial-gradient(circle,transparent 0 31.5%,#000 33% 97%,transparent 98.5%);mix-blend-mode:screen}
.spindle{position:absolute;width:10px;height:10px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff,#c9c3b8 55%,#8d877c);box-shadow:0 1px 2px rgba(0,0,0,.5)}
.bear{position:absolute;width:48px;height:48px;border-radius:50%;margin:-24px 0 0 -24px;background:radial-gradient(circle at 40% 35%,#f6efe0 0,#d9c9a6 34%,#b8975a 35%,#e8d3a4 48%,#b08a48 70%,#8a6a33 100%);box-shadow:0 6px 12px -4px rgba(40,25,10,.5),inset 0 0 0 1px rgba(255,255,255,.4)}
.tarm{position:absolute;width:0;height:0;filter:drop-shadow(7px 12px 5px rgba(50,32,14,.28));will-change:transform}
.tarm .tube{position:absolute;left:-3px;top:-6px;width:6px;height:200px;border-radius:3px;background:linear-gradient(90deg,#a8a196,#f7f4ee 45%,#bdb6aa 60%,#8f887d)}
.tarm .cw{position:absolute;left:-12px;top:-58px;width:24px;height:36px;border-radius:6px;background:linear-gradient(90deg,#77716a,#d8d3ca 45%,#99928a 70%,#5f5a54)}
.tarm .cw::after{content:"";position:absolute;left:-1px;right:-1px;top:24px;height:3px;background:#b8893f}
.tarm .hs{position:absolute;left:-9px;top:190px;width:16px;height:30px;border-radius:4px 4px 6px 6px;transform:rotate(24deg);transform-origin:50% 0;background:linear-gradient(90deg,#2a2622,#4a443d 50%,#2a2622);box-shadow:inset 0 0 0 1px rgba(255,255,255,.12)}
.tarm .hs::before{content:"";position:absolute;right:-9px;top:6px;width:10px;height:4px;border-radius:2px;background:#d9c9a6}
.tarm .bp{position:absolute;left:-14px;top:-14px;width:28px;height:28px;border-radius:50%;background:radial-gradient(circle at 40% 35%,#fff9ec,#d9b46a 55%,#8a6a33);box-shadow:inset 0 0 0 1px rgba(255,255,255,.4)}
.knob{position:absolute;display:flex;align-items:center;gap:8px;font:700 11px var(--fb);color:rgba(42,33,25,.55);letter-spacing:.04em}
.knob i{width:26px;height:26px;border-radius:50%;background:radial-gradient(circle at 40% 35%,#fff9ec,#d9b46a 55%,#8a6a33);box-shadow:0 3px 6px -2px rgba(40,25,10,.45)}
.ringo{position:absolute;transform:rotate(-90deg)}
.ringo circle{fill:none;stroke-width:.9}
.ringo .bg{stroke:rgba(154,107,34,.14)}
.ringo .fg{stroke:#b8893f;stroke-dasharray:100;stroke-dashoffset:100;stroke-linecap:round}
/* ---------- lobby ---------- */
.lob{position:relative;height:250px;margin-top:4px;flex:none}
.lob h1{position:absolute;left:0;top:14px;margin:0;font:400 54px/.9 var(--fd);letter-spacing:-.01em;z-index:3}
.lob h1 i{color:var(--acc)}
.lob .ldv{position:absolute;left:0;top:124px;font-size:25px;line-height:1.35;z-index:3;white-space:nowrap}
.lob p{position:absolute;left:0;top:172px;width:168px;margin:0;font:500 13px/1.45 var(--fb);color:var(--mute);z-index:3}
.lob .deck{left:176px;top:14px;width:250px;height:236px;border-radius:22px;transform-origin:0 0}
.pick{margin-top:6px;flex:none}
.pick .ph{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px}
.pick .ph b{font-size:15px;font-weight:700}
.pick .ph small{font-size:12px;color:var(--mute)}
.chips{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.chip{height:56px;border-radius:var(--r);background:rgba(251,248,242,.85);box-shadow:inset 0 0 0 1px var(--hair);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;transition:transform .15s,background .2s}
.chip:active{transform:scale(.96)}
.chip b{font:400 23px/1 var(--fd)}
.chip small{font:600 12px var(--fb);color:var(--mute)}
.chip[aria-pressed=true]{background:var(--brown);color:var(--cream);box-shadow:none}
.chip[aria-pressed=true] small{color:var(--gold)}
.modes{display:flex;flex-direction:column;gap:8px;margin-top:12px;flex:none}
.md{display:flex;align-items:center;gap:14px;min-height:58px;width:100%;padding:9px 14px;border-radius:var(--r);background:rgba(251,248,242,.8);box-shadow:inset 0 0 0 1px var(--hair);transition:transform .15s}
.md:active{transform:scale(.985)}
.md .mi{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;flex:none;background:var(--card2);color:var(--acc)}
.md .mt{min-width:0;flex:1}
.md b{display:block;font-size:15.5px;font-weight:700;line-height:1.25}
.md small{display:block;font-size:12.5px;color:var(--mute);line-height:1.3}
.md .chev{margin-left:auto;width:18px;height:18px;stroke:var(--mute);fill:none;stroke-width:2;flex:none}
.md.qm{min-height:76px;background:linear-gradient(120deg,#4a3020,#5d3c26);color:var(--cream);box-shadow:none}
.md.qm .mi{background:linear-gradient(145deg,#f2e3c6,#d9b46a);color:var(--brown);width:46px;height:46px;border-radius:12px}
.md.qm b{font:400 28px/1 var(--fd)}
.md.qm small{color:var(--cream);opacity:.82;margin-top:2px}
.md.qm .live{margin-top:6px;font-size:11.5px;font-weight:700;display:inline-flex;align-items:center;gap:6px;background:rgba(0,0,0,.18);padding:5px 9px;border-radius:99px}
.md.qm .live i{width:7px;height:7px;border-radius:50%;background:currentColor}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.two .md{min-height:52px;padding:8px 14px;gap:10px}
.two .md b{font-size:14px}.two .md small{font-size:11.5px}
.md.done small{color:var(--ok)}
.soon{margin-top:12px;padding:18px 16px;border-radius:18px;background:linear-gradient(180deg,#fdfbf7,#f6efe3);box-shadow:inset 0 0 0 1px rgba(42,33,25,.10),0 12px 22px -16px rgba(60,40,20,.5);display:grid;gap:8px;flex:none}
.soon .k{font:italic 400 18px/1 var(--fd);color:var(--acc)}
.soon h2{margin:0;font:400 32px/1 var(--fd)}
.soon p{margin:0;font-size:13.5px;color:var(--mute);line-height:1.5}
.soon .row{display:flex;gap:8px;margin-top:4px}.soon .row .btn{flex:1}
.spbox{margin-top:auto;padding-top:14px;flex:none}
.spbox .dgs-box{margin:0}
.snote{margin:10px 0 0;text-align:center;font-size:11.5px;color:var(--mute)}
.snote a{color:var(--ink)}
@media (max-height:760px){.snote{display:none}}
html.dgf-on .dgf-c1 .spbox{padding-top:10px}html.dgf-on .dgf-c1 .modes{gap:7px}
/* ---------- match ---------- */
.page.match{height:100vh;height:100dvh;min-height:0;overflow:hidden;padding-bottom:calc(12px + env(safe-area-inset-bottom,0px))}
.gt{display:flex;align-items:center;gap:10px;height:46px;flex:none}
.gt .menu{width:44px;justify-content:center}
.round{flex:1;text-align:center;min-width:0;font:400 26px/1 var(--fd);white-space:nowrap}
.round em{font-style:normal;color:var(--mute)}
.myscore{padding:0 14px;font:700 14px var(--fb);min-width:64px;justify-content:center}
.strip{position:relative;height:40px;margin-top:10px;flex:none;z-index:6}
.strip.mini{height:50px}
.pl{position:absolute;left:0;top:0;height:40px;display:flex;align-items:center;gap:6px;padding:0 9px 0 3px;border-radius:99px;background:var(--pill);box-shadow:inset 0 0 0 1px var(--hair);transition:transform .6s cubic-bezier(.65,0,.35,1)}
.pl.me{box-shadow:inset 0 0 0 1.5px var(--acc)}
.pl.gone{opacity:.45}
.pl .n{font:700 12.5px var(--fb);white-space:nowrap;overflow:hidden}
.pl .lock{position:absolute;left:24px;top:-3px;width:15px;height:15px;border-radius:50%;background:var(--acc);color:var(--onacc);display:grid;place-items:center;opacity:0;transform:scale(.6);transition:opacity .2s,transform .25s;z-index:2}
.pl .lock.on{opacity:1;transform:scale(1)}
.strip.mini .pl{flex-direction:column;justify-content:center;gap:2px;height:50px;padding:3px 0;border-radius:12px}
.strip.mini .pl .lock{left:auto;right:2px}
.strip.mini .pl .n{font-size:10px}
.fly{position:absolute;top:47px;left:0;font:700 14px var(--fb);color:var(--card);background:var(--ink);padding:6px 10px;border-radius:99px;white-space:nowrap;box-shadow:0 6px 14px -6px rgba(0,0,0,.45);opacity:0;pointer-events:none}
.fly.me{background:var(--acc);color:var(--onacc)}
.fly.zero{background:var(--card);color:var(--mute);box-shadow:inset 0 0 0 1px var(--hair)}
.strip.mini .fly{top:56px;font-size:12px;padding:4px 7px}
.stage{display:flex;flex-direction:column;flex:1 1 auto;min-height:0}
/* the deck box: the turntable is drawn at 358 x 350 and scaled to fit (--k, set by game.js) */
.tt{position:relative;flex:1 1 auto;min-height:120px;margin-top:12px}
.tt .tbox{position:absolute;left:50%;top:0;width:358px;height:350px;transform-origin:50% 0;transform:translateX(-50%) scale(var(--k,1))}
.tt .deck{left:0;top:0;width:358px;height:350px}
.cover{position:absolute;inset:0;display:grid;place-items:center;z-index:8;pointer-events:none}
.cover .cv{pointer-events:auto;display:flex;align-items:center;gap:10px;padding:12px 18px 12px 12px;border-radius:99px;background:rgba(42,33,25,.9);color:var(--cream);font-weight:700;font-size:15px;box-shadow:0 14px 30px -12px rgba(0,0,0,.55)}
.cover .cv i{width:32px;height:32px;border-radius:50%;background:var(--gold);color:var(--brown);display:grid;place-items:center;font-style:normal}
.rdy{position:absolute;left:0;right:0;top:50%;transform:translateY(-50%);text-align:center;z-index:7;pointer-events:none;opacity:0}
.rdy b{display:block;font:400 54px/1 var(--fd);color:var(--cream);text-shadow:0 4px 18px rgba(0,0,0,.5)}
.rdy small{display:block;font:700 12px var(--fb);letter-spacing:.14em;text-transform:uppercase;color:var(--gold);margin-top:6px}
.strow{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:10px;flex:none;min-height:46px}
.stx{display:flex;flex-direction:column;gap:3px;min-width:0}
.stx b{font:400 24px/1 var(--fd);white-space:nowrap}
.stx small{font:600 12px var(--fb);color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rp{height:46px;border-radius:12px;padding:0 12px 0 10px;display:flex;align-items:center;gap:8px;box-shadow:inset 0 0 0 1px var(--hair);background:rgba(251,248,242,.85);transition:transform .12s,opacity .2s;flex:none}
.rp:active{transform:scale(.94)}
.rp b{display:block;font-size:13.5px;font-weight:700;line-height:1.1}
.rp small{display:block;font:600 11px var(--fb);color:var(--acc);white-space:nowrap}
.rp[disabled]{opacity:.45;cursor:default}
.rp.used{opacity:.45}
.trow{display:flex;align-items:center;gap:10px;margin-top:10px;flex:none}
.trow .tm{font:700 14px var(--fb);width:40px;white-space:nowrap}
.tbar{flex:1;height:2px;border-radius:2px;background:var(--hair);overflow:hidden}
.tbar i{display:block;height:100%;background:linear-gradient(90deg,#d9b46a,#9a6b22);transform-origin:0 50%}
.trow .pts{font-size:12.5px;color:var(--mute);white-space:nowrap}
.trow .pts b{font:400 22px var(--fd);color:var(--acc)}
.ca{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px;flex:none}
.an{position:relative;min-height:112px;padding:12px 14px;display:flex;flex-direction:column;border-radius:16px;background:linear-gradient(180deg,#fdfbf7,#f7f1e7);min-width:0;
 box-shadow:inset 0 0 0 1px rgba(42,33,25,.10),0 1px 0 rgba(255,255,255,.9) inset,0 10px 18px -14px rgba(60,40,20,.45);transition:transform .15s,opacity .25s,box-shadow .25s}
